<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<script>
/* 캐시 무력화: index.html은 URL(쿼리 포함)별로 캐시돼 ?v=240 같은 고정 링크가 옛 화면을 물고 있음.
   → 탭당 1회, 유일한 cb 토큰을 붙여 최신 HTML을 강제로 새로 받는다(무한루프·반복 리로드 방지). */
(function(){
  try{
    if(sessionStorage.getItem('__cb_done')) return;   // 이 탭에서 이미 갱신함 → 통과
    sessionStorage.setItem('__cb_done','1');
    var u=new URL(location.href);
    u.searchParams.set('cb', Date.now().toString(36)); // 매 접속마다 유일값 → 새 캐시 키
    location.replace(u.toString());                    // 히스토리 오염 없이 최신본으로 1회 이동
  }catch(e){}
})();
</script>
<script>try{if(localStorage.getItem('opcare_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>

<title>원격파트 대시보드 · iShopCare</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<!-- 한글 본문용 웹폰트(Pretendard) — Windows 기본 폰트(맑은 고딕)는 작은 글씨가 흐려 가독성이 떨어진다 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{
    --ink:#1d1d1f; --ink-soft:#424245; --gray:#6e6e73; --gray2:#86868b;
    --line:#d2d2d7; --line-soft:#e8e8ed; --surface:#f5f5f7; --surface2:#fafafa;
    --canvas:#ffffff; --blue:#0071e3; --blue-soft:#e8f1fd; --blue-deep:#0060c0;
    --red:#ff3b30; --red-soft:#ffecec; --green:#34c759; --green-soft:#e7f8ec;
    --orange:#ff9500; --purple:#5e5ce6;
    --sat:#0a84ff; --sun:#ff3b30;
    /* --muted 가 다크 블록에만 있어서 라이트 모드에선 var(--muted) 가 통째로 무시됐다
       (matrix 표의 '·' 자리표시, 미지정 배지 등이 안 보이던 원인) */
    --muted:#aeaeb4;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.05);
    --radius:18px;
  }
  /* 🌙 야간(다크) 모드 — 구조가 변수 기반이라 팔레트 재정의로 대부분 적용됨 */
  :root[data-theme="dark"]{
    --ink:#f2f2f7; --ink-soft:#c9c9ce; --gray:#a0a0a6; --gray2:#8a8a90;
    --line:#3a3a3f; --line-soft:#2a2a2e; --surface:#17171a; --surface2:#202024;
    --canvas:#242429; --blue:#0a84ff; --blue-soft:rgba(10,132,255,.22); --blue-deep:#5aa9ff;
    --red:#ff453a; --red-soft:rgba(255,69,58,.20); --green:#30d158; --green-soft:rgba(48,209,88,.20);
    --orange:#ff9f0a; --purple:#8b88ff;
    --surface-soft:#2c2c31; --steel:#aeaeb2; --slate:#c9c9ce; --muted:#7a7a80;
    --shadow:0 1px 3px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.55);
    color-scheme:dark;
  }
  /* 🌙 야간모드 플로팅 토글 — 항상 우하단 고정(모바일·사이드바 숨김에도 보임) */
  .theme-fab{position:fixed; right:20px; bottom:20px; z-index:900; width:52px; height:52px;
    border-radius:50%; border:1px solid var(--line); background:var(--canvas); color:var(--ink);
    font-size:23px; line-height:1; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,.18);
    display:flex; align-items:center; justify-content:center; transition:transform .15s, box-shadow .15s}
  .theme-fab:hover{transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.24)}
  :root[data-theme="dark"] .theme-fab{box-shadow:0 6px 20px rgba(0,0,0,.5)}
  @media (max-width:900px){ .theme-fab{right:14px; bottom:14px; width:46px; height:46px; font-size:20px} }
  /* 게임/낚시터 흰 버튼은 다크에서도 밝게 유지(가독성) */
  :root[data-theme="dark"] .fs-btn,:root[data-theme="dark"] .fr-cast{background:#eaeaf0;color:#123}
  /* 강조 하이라이트 카드는 다크에서 톤 다운(밝은 파스텔 유지 방지) */
  :root[data-theme="dark"] .hl-card.blue{background:linear-gradient(155deg,#1a2740,#141a26);border-color:#25406b}
  :root[data-theme="dark"] .hl-card.gold{background:linear-gradient(155deg,#332a12,#241f13);border-color:#5c4a1f}
  :root[data-theme="dark"] .hl-card.mint{background:linear-gradient(155deg,#123028,#0f231d);border-color:#1e5545}
  :root[data-theme="dark"] .hl-card.blue .hl-big{color:#5aa9ff}
  :root[data-theme="dark"] .hl-card.gold .hl-big{color:#ffb340}
  :root[data-theme="dark"] .hl-card.mint .hl-big{color:#4fe07a}
  /* 다크: 천국(직원) 랭킹은 밝은 카드(반짝임 유지) → 글자를 어둡게 해 가독성 확보 */
  :root[data-theme="dark"] .rank-item.light{background:#ffffff; border-color:#e6eeff}
  /* 흰 랭킹 항목 위 → 어둡게 */
  :root[data-theme="dark"] .light-rank .rank-name{color:#1d1d1f}
  :root[data-theme="dark"] .light-rank .rank-medal,
  :root[data-theme="dark"] .light-rank .rank-val{color:#5a5a5f}
  /* 어두운 카드 배경 위 제목·힌트 → 밝게 */
  :root[data-theme="dark"] .light-rank .card-head h3{color:#f2f2f7}
  :root[data-theme="dark"] .light-rank .hint{color:#a0a0a6}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro KR","Apple SD Gothic Neo",
      "Pretendard Variable",Pretendard,"Segoe UI",Roboto,sans-serif;
    background:var(--surface); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.45;
    display:flex; min-height:100vh;
  }

  /* ===== Sidebar ===== */
  .sidebar{
    width:248px; flex:0 0 248px; background:var(--canvas);
    border-right:1px solid var(--line-soft); padding:26px 16px;
    display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh;
  }
  .brand{padding:4px 12px 22px; }
  .brand h1{font-size:17px; font-weight:700; letter-spacing:-.02em; line-height:1.3}
  .brand p{font-size:12px; color:var(--gray2); margin-top:4px}
  .nav-label{font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--gray2);
    padding:8px 12px 4px; text-transform:uppercase}
  .navbtn{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:11px 13px; border:none; background:none; border-radius:11px;
    font-size:15px; font-weight:500; color:var(--ink-soft); cursor:pointer;
    transition:background .15s, color .15s; font-family:inherit;
  }
  .navbtn:hover{background:var(--surface)}
  .navbtn.active{background:var(--blue); color:#fff; font-weight:600}
  .nav-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--red); margin-left:7px; vertical-align:middle; animation:navDotPulse 1.5s ease-in-out infinite}
  .navbtn.active .nav-dot{box-shadow:0 0 0 2px rgba(255,255,255,.5)}
  @keyframes navDotPulse{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.45; transform:scale(1.3)}}
  .navbtn .ic{width:20px; text-align:center; font-size:16px}
  .lock-out{margin-top:auto; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 13px; border:1px solid var(--line-soft); background:none; border-radius:11px;
    font-size:13px; font-weight:600; color:var(--gray); cursor:pointer; font-family:inherit; transition:.15s}
  .lock-out:hover{background:var(--surface); color:var(--ink)}

  /* ===== Main ===== */
  .main{flex:1; min-width:0; padding:32px 40px 64px; overflow-x:hidden}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px;
    flex-wrap:wrap; margin-bottom:26px}
  .page-head h2{font-size:30px; font-weight:700; letter-spacing:-.03em}
  .page-head .sub{font-size:14px; color:var(--gray); margin-top:5px}

  /* controls */
  .controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .seg{display:inline-flex; background:var(--surface); border-radius:11px; padding:3px;
    border:1px solid var(--line-soft)}
  .seg button{border:none; background:none; padding:8px 16px; border-radius:8px;
    font-size:13px; font-weight:600; color:var(--gray); cursor:pointer; font-family:inherit;
    transition:.15s}
  .seg button.on{background:var(--canvas); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
  input[type=date]{font-family:inherit; font-size:14px; padding:9px 13px; border:1px solid var(--line);
    border-radius:11px; background:var(--canvas); color:var(--ink); cursor:pointer}
  .btn{border:none; background:var(--canvas); border:1px solid var(--line);
    padding:9px 15px; border-radius:11px; font-size:13px; font-weight:600; color:var(--ink);
    cursor:pointer; font-family:inherit; transition:.15s}
  .btn:hover{background:var(--surface)}
  .btn.primary{background:var(--blue); color:#fff; border-color:var(--blue)}
  .btn.primary:hover{background:var(--blue-deep)}

  /* sidebar divider */
  .nav-div{height:1px; background:var(--line-soft); margin:8px 12px}

  /* Overview 헤드라인/알림/근무/랭킹 */
  .headline{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px}
  /* 카드 4장(총건수·MVP·응답시간·소요시간)은 좁은 화면에서 2×2 로 접는다 */
  @media (max-width:1240px){ .headline{grid-template-columns:repeat(2,1fr)} }
  .hl-card{border-radius:20px; padding:18px 20px; border:1.5px solid transparent; position:relative; overflow:hidden; transition:transform .15s}
  .hl-card:hover{transform:translateY(-2px)}
  .hl-card.blue{background:linear-gradient(155deg,#e9f2ff,#f6faff); border-color:#d5e6ff}
  .hl-card.gold{background:linear-gradient(155deg,#fff5db,#fffdf4); border-color:#ffe6a8}
  .hl-card.mint{background:linear-gradient(155deg,#e4faef,#f4fffa); border-color:#c3efd7}
  .hl-card.plum{background:linear-gradient(155deg,#f3ecff,#faf7ff); border-color:#e0d2ff}   /* 소요시간 */
  /* 관리자 보정 — 직원별 표 우측 하단 */
  .adj-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px}
  .adj-note{font-size:12px; color:var(--gray2); font-weight:600}
  .adj-btn{font-family:inherit; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
    background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:7px 14px; transition:all .15s}
  .adj-btn:hover{background:var(--canvas); border-color:var(--blue); color:var(--blue)}
  /* 표 하단 공개 보정 목록 — 암호 없이 전원이 본다 */
  .adj-pub{margin-top:14px; border-top:1px dashed var(--line); padding-top:11px}
  .adj-pub-h{font-size:12.5px; font-weight:800; color:var(--ink-soft); margin-bottom:7px}
  .adj-pub-h span{font-weight:600; color:var(--gray2)}
  .adj-pub-row{display:flex; align-items:baseline; gap:9px; font-size:12.5px; padding:5px 0; border-bottom:1px solid var(--line-soft)}
  .adj-pub-row:last-child{border-bottom:none}
  .adj-pub-row .apd{color:var(--gray2); font-weight:600; white-space:nowrap; min-width:44px}
  .adj-pub-row .ape{font-weight:800; color:var(--ink); white-space:nowrap}
  .adj-pub-row .apc{white-space:nowrap}
  .adj-pub-row .apn{font-weight:800; white-space:nowrap}
  .adj-pub-row .apw{color:var(--ink-soft); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .adj-pub-row .apb{color:var(--gray2); font-size:11.5px; font-weight:600; white-space:nowrap}
  @media (max-width:900px){ .adj-pub-row{flex-wrap:wrap} .adj-pub-row .apw{flex-basis:100%} }
  .adj-form{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
  .adj-form label{display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:700; color:var(--gray)}
  .adj-form input,.adj-form select{font-family:inherit; font-size:13.5px; padding:8px 10px; border:1px solid var(--line);
    border-radius:9px; background:var(--canvas); color:var(--ink)}
  .adj-form .wide{grid-column:1 / -1}
  .adj-save{font-family:inherit; font-size:14px; font-weight:800; color:#fff; background:var(--blue); cursor:pointer;
    border:none; border-radius:10px; padding:11px; grid-column:1 / -1}
  .adj-save:hover{background:var(--blue-deep,#0058c7)}
  .adj-err{grid-column:1 / -1; font-size:12.5px; font-weight:700; color:var(--red); min-height:16px}
  .adj-list{margin-top:16px; border-top:1px solid var(--line-soft); padding-top:12px}
  .adj-row{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; padding:7px 0;
    border-bottom:1px solid var(--line-soft)}
  .adj-row .adj-del{font-family:inherit; font-size:11.5px; font-weight:700; color:var(--red); cursor:pointer;
    background:none; border:1px solid var(--line); border-radius:7px; padding:4px 9px}
  .adj-row b{font-weight:800}
  .hl-ic{font-size:32px; line-height:1; margin-bottom:9px}
  .hl-lab{font-size:15px; font-weight:700; color:var(--gray)}
  .hl-big{font-size:44px; font-weight:800; letter-spacing:-.03em; line-height:1.12; margin-top:3px; color:var(--ink)}
  .hl-big small{font-size:18px; font-weight:600; color:var(--gray2); margin-left:3px}
  /* MVP 처리건수 강조 + 클릭 */
  .mvp-proc{margin-top:6px; cursor:pointer; display:inline-flex; align-items:baseline; gap:4px; padding:4px 12px; border-radius:20px;
    background:rgba(199,120,0,.12); transition:.15s}
  .mvp-proc:hover{background:rgba(199,120,0,.22); transform:translateY(-1px)}
  .mvp-proc b{font-size:30px; font-weight:800; color:#c77800; letter-spacing:-.02em}
  .mvp-proc small{font-size:14px; font-weight:700; color:#a86400}
  .mvp-proc-hint{font-size:11px; font-weight:700; color:#c77800; margin-left:6px; opacity:.8}
  /* 클릭 가능한 타일 */
  .ov-tile.clickable{cursor:pointer; transition:.15s}
  .ov-tile.clickable:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.08)}
  .ov-drill-ic{font-size:11px; margin-left:5px; opacity:.4}
  /* 처리 상세 모달 */
  .detail-overlay{position:fixed; inset:0; z-index:9998; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:20px}
  .detail-box{background:var(--canvas,#fff); border-radius:18px; width:100%; max-width:640px; max-height:82vh; display:flex; flex-direction:column; padding:20px 22px; box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .detail-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
  .detail-head h3{font-size:17px; font-weight:800; color:var(--ink)}
  .detail-x{border:none; background:var(--surface2); width:30px; height:30px; border-radius:50%; font-size:15px; cursor:pointer; color:var(--gray)}
  .detail-x:hover{background:var(--line-soft)}
  .detail-scroll{overflow:auto; margin-top:12px}
  .dm-num{color:var(--gray2); font-weight:700; font-size:12px; text-align:center}
  .ss-summary{background:var(--surface2); border:1px solid var(--line-soft); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; margin-top:12px}
  .ss-total{font-size:14.5px; color:var(--charcoal,#2d2d2d)} .ss-total b{font-size:18px; color:var(--blue)}
  .ss-chips{display:flex; flex-wrap:wrap; gap:6px}
  .ss-chip{background:var(--canvas); border:1px solid var(--line-soft); border-radius:8px; padding:3px 9px; font-size:12.5px; color:var(--gray)} .ss-chip b{color:var(--ink)}
  .ss-status{font-size:12.5px; color:var(--gray)}
  .ss-note{font-size:12.5px; color:var(--slate,#454b54); max-width:280px; white-space:normal; word-break:break-word}
  .as-brk{display:flex; flex-direction:column; gap:9px}
  .as-brk-row{display:flex; align-items:center; gap:12px; cursor:pointer; padding:5px 6px; border-radius:9px; transition:background .12s}
  .as-brk-row:hover{background:var(--surface,#f5f5f7)}
  .as-brk-lab{flex:0 0 108px; font-size:13.5px; font-weight:700; color:var(--ink)}
  .as-brk-bar{flex:1; height:14px; background:var(--surface,#f5f5f7); border-radius:8px; overflow:hidden}
  .as-brk-fill{height:100%; border-radius:8px; min-width:6px; transition:width .3s}
  .as-brk-n{flex:0 0 auto; font-size:12.5px; color:var(--gray); white-space:nowrap} .as-brk-n b{font-size:15px; color:var(--ink)}
  .as-brk-note{font-size:11.5px; color:var(--gray2); margin-top:10px}
  .dm-st{font-size:11px; font-weight:800; padding:2px 8px; border-radius:20px; white-space:nowrap}
  .hl-card.clickable{cursor:pointer; transition:.15s}
  .hl-card.clickable:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,.1)}
  .hl-drill{font-size:11px; opacity:.5; margin-left:2px}
  /* 🎁 팀 목표 */
  .tg-sub-lab{font-size:13px; font-weight:700; color:#7c5cff; background:#efeaff; padding:2px 10px; border-radius:20px; margin-left:6px}
  .tg-month{font-size:15px; font-weight:800; color:var(--ink); min-width:96px; text-align:center; display:inline-block}
  .tg-hero{text-align:center; background:linear-gradient(160deg,#f3efff,#eef4ff)}
  .tg-hero-lab{font-size:13px; font-weight:700; color:var(--gray)}
  .tg-hero-big{font-size:46px; font-weight:800; color:#7c5cff; letter-spacing:-.02em; margin:4px 0 18px}
  .tg-hero-bar{position:relative; height:16px; border-radius:10px; background:#e3ddf5; margin:0 14px}
  .tg-hero-fill{height:100%; border-radius:10px; background:linear-gradient(90deg,#7c5cff,#a855f7); transition:width .5s}
  .tg-hero-mark{position:absolute; top:-7px; transform:translateX(-50%); font-size:21px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
  .tg-hero-sub{font-size:12.5px; color:var(--gray); margin-top:18px}
  .tg-tier{display:flex; gap:14px; align-items:center; border:2px solid var(--line); border-radius:16px; padding:16px; background:var(--surface2)}
  .tg-tier.reached{border-color:#16a34a; background:#f0fdf4}
  .tg-tier-ic{font-size:46px; flex:0 0 auto; line-height:1}
  .tg-tier-body{flex:1; min-width:0}
  .tg-tier-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
  .tg-tier-reward{font-size:16px; font-weight:800; color:var(--ink)}
  .tg-tier-coins{font-size:14px; font-weight:800; color:#e8a020; white-space:nowrap}
  .tg-tier-pct{font-size:22px; font-weight:800; color:#7c5cff; white-space:nowrap; letter-spacing:-.02em}
  .tg-tier-pct.done{color:#16a34a}
  .tg-tier-by{font-size:12px; color:var(--gray); margin:3px 0 9px}
  .tg-bar{height:12px; border-radius:8px; background:#e5e7eb; overflow:hidden}
  .tg-bar-fill{height:100%; border-radius:8px; background:linear-gradient(90deg,#7c5cff,#a855f7); transition:width .5s}
  .tg-tier.reached .tg-bar-fill{background:linear-gradient(90deg,#16a34a,#4ade80)}
  .tg-tier-stat{font-size:12.5px; color:var(--gray); margin-top:7px}
  .tg-done{color:#16a34a; font-size:14px}
  .hl-card.blue .hl-big{color:#1a56db}

  /* 월별 수치 표 — 달이 9개를 넘으면 좌우로 길어져 눈이 미끄러진다.
     ① '구분' 열을 고정해 가로 스크롤 중에도 행 이름이 보이게
     ② 달마다 세로 구분선, 분기 경계(3·6·9월)는 굵게
     ③ 짝수 달 옅은 음영 + 최신 달 파란 강조
     ④ 숫자는 tabular-nums 로 자릿수 정렬 */

  :root[data-theme="dark"] table.matrix.mtbl th.alt,:root[data-theme="dark"] table.matrix.mtbl td.alt{background:rgba(255,255,255,.04)}

  .dri-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin-bottom:18px}
  .dri-cell{border:1px solid var(--line-soft); border-radius:12px; padding:13px 14px; background:var(--surface-soft)}
  .dri-cell .dc-h{font-size:13.5px; font-weight:800; color:var(--ink); margin-bottom:10px}
  .dri-cell label{display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:var(--gray2); margin-top:7px}
  .dri-cell select{flex:1; font-family:inherit; font-size:13px; padding:5px 7px; border-radius:7px;
    border:1px solid var(--line); background:var(--card); color:var(--ink)}
  /* DRI 처리량 — 담당자 한 명 = 한 줄. 표로 늘어놓으면 이름과 숫자가 멀어져 안 읽힌다 */
  .dri-res{display:grid; grid-template-columns:repeat(auto-fill,minmax(370px,1fr)); gap:14px}
  .dri-card{border:1px solid var(--line); border-radius:16px; padding:16px 18px; background:var(--card)}
  .dri-card .dr-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    padding-bottom:12px; margin-bottom:13px; border-bottom:1px solid var(--line-soft)}
  .dri-card .dr-t{font-size:16.5px; font-weight:800; color:var(--ink)}
  .dri-card .dr-s{font-size:12.5px; font-weight:700; color:var(--gray2); white-space:nowrap}
  .dr-row{display:grid; grid-template-columns:40px 1fr auto; gap:10px; align-items:center; margin-bottom:11px}
  .dr-row:last-child{margin-bottom:0}
  .dr-badge{font-size:11px; font-weight:800; color:#fff; text-align:center; border-radius:6px; padding:3px 0; letter-spacing:-.02em}
  .dr-nm{font-size:15px; font-weight:800; color:var(--ink); letter-spacing:-.01em}
  .dr-nm.none{font-weight:600; color:var(--muted)}
  .dr-bar{height:7px; border-radius:4px; background:var(--surface); overflow:hidden; margin-top:6px}
  .dr-bar i{display:block; height:100%; border-radius:4px; min-width:2px}
  .dr-v{text-align:right; white-space:nowrap; min-width:64px}
  .dr-v b{font-size:20px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .dr-v small{font-size:11.5px; font-weight:700; color:var(--gray2); display:block; margin-top:1px}
  .dr-etc{border-top:1px dashed var(--line); padding-top:12px; margin-top:12px}

  .stack-row{display:flex; align-items:center; gap:12px; margin-bottom:9px}
  .stack-name{flex:0 0 64px; font-size:14px; font-weight:600; color:var(--ink-soft)}
  .stack-track{flex:1; height:16px; background:var(--surface); border-radius:8px; overflow:hidden}
  .stack-fill{height:100%; display:flex; border-radius:8px; overflow:hidden; transition:width .5s cubic-bezier(.22,1,.36,1)}
  .stack-fill span{display:block; min-width:2px}
  .stack-total{flex:0 0 40px; text-align:right; font-size:14px; font-weight:700}

  /* KPI cards */
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px}
  .kpi{background:var(--canvas); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow)}
  .kpi .lab{font-size:13px; color:var(--gray); font-weight:600}
  .kpi .val{font-size:34px; font-weight:700; letter-spacing:-.03em; margin-top:8px; line-height:1}
  .kpi .val small{font-size:15px; font-weight:600; color:var(--gray2); margin-left:3px}
  .kpi .delta{font-size:12.5px; margin-top:8px; font-weight:600}
  .kpi .delta.up{color:var(--green)} .kpi .delta.down{color:var(--red)} .kpi .delta.flat{color:var(--gray2)}
  /* 컬러 KPI (VOC·먼슬리 상단) */
  .kpi.k-blue{background:linear-gradient(160deg,#eef4ff,#fbfdff); border-left:5px solid #1a73e8}
  .kpi.k-blue .val{color:#1a56db}
  .kpi.k-amber{background:linear-gradient(160deg,#fff6e4,#fffdf6); border-left:5px solid #ff9500}
  .kpi.k-amber .val{color:#c77800}
  .kpi.k-coral{background:linear-gradient(160deg,#ffeef1,#fff8f9); border-left:5px solid #ff5a5f}
  .kpi.k-coral .val{color:#e0315a}
  .kpi.k-red{background:linear-gradient(160deg,#ffe8e8,#fff6f6); border-left:5px solid #ff3b30}
  .kpi.k-red .val{color:#d92d20}
  .kpi.k-teal{background:linear-gradient(160deg,#e3f8f5,#f5fffd); border-left:5px solid #0aa5b1}
  .kpi.k-teal .val{color:#0a8a94}

  /* card */
  .card{background:var(--canvas); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow);
    margin-bottom:24px}
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:12px}
  .card-head h3{font-size:17px; font-weight:700; letter-spacing:-.01em}
  .voc-hd-filter{display:flex; gap:7px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
  .voc-hd-filter .sel{padding:6px 9px; font-size:12.5px}
  .voc-hd-filter .btn{padding:6px 9px; font-size:12.5px}
  .card-head .hint{font-size:12.5px; color:var(--gray2)}
  .grid2{display:grid; grid-template-columns:1.15fr .85fr; gap:24px; align-items:start}
  .grid2.even{grid-template-columns:1fr 1fr; align-items:stretch}
  .grid2.even>.card{display:flex; flex-direction:column; min-height:300px}
  .grid2.even .chart-wrap{flex:1; display:flex; align-items:center}
  .grid2.even .donut-hold{flex:1; display:flex; align-items:center; justify-content:center}

  /* chart */
  .chart-wrap{width:100%; overflow-x:auto}
  svg{display:block; max-width:100%}
  .bar-row{margin-bottom:11px}
  .bar-meta{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px}
  .bar-meta .nm{font-weight:600; color:var(--ink-soft)}
  .bar-meta .ct{font-weight:700; color:var(--ink)}
  .bar-track{height:10px; background:var(--surface); border-radius:6px; overflow:hidden}
  .bar-fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--blue),#4a9bff);
    transition:width .5s cubic-bezier(.22,1,.36,1)}

  /* table */
  table{width:100%; border-collapse:collapse; font-size:14px}
  th{text-align:left; font-size:12px; font-weight:700; color:var(--gray); letter-spacing:.02em;
    padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
  th.num,td.num{text-align:right}
  td{padding:9px 12px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .emp-name{font-weight:600}
  .dm-emp{white-space:nowrap}   /* 상세 모달 담당자 이름 줄바꿈 방지 (송태양 등 3글자 이름) */
  .emp-click{cursor:pointer; transition:color .12s}
  .emp-click:hover{color:var(--blue); text-decoration:underline}
  svg text.emp-click:hover{fill:var(--blue)}
  .etc-row td{border-top:1.5px solid var(--line); background:var(--surface-soft)}
  .etc-row:hover td{background:var(--surface2)}
  .count-input{width:74px; text-align:right; font-family:inherit; font-size:14px; font-weight:600;
    padding:7px 9px; border:1px solid var(--line); border-radius:9px; background:var(--surface2);
    color:var(--ink); transition:.15s}
  .count-input:focus{outline:none; border-color:var(--blue); background:var(--canvas); box-shadow:0 0 0 3px var(--blue-soft)}
  tfoot td{font-weight:700; border-top:2px solid var(--line); padding-top:13px}
  .rank{display:inline-flex; width:22px; height:22px; align-items:center; justify-content:center;
    border-radius:7px; background:var(--surface); font-size:12px; font-weight:700; color:var(--gray)}

  /* VOC */
  .empty-note{text-align:center; color:var(--gray2); font-size:14px; padding:34px 0}
  .prog{display:flex; height:12px; background:var(--surface); border-radius:8px; overflow:hidden}
  .prog-fill{height:100%; transition:width .5s cubic-bezier(.22,1,.36,1)}
  .quote-card{border-radius:12px; padding:12px 14px; margin-bottom:10px}
  .quote-card.neg{background:var(--red-soft); border-left:3px solid var(--red)}
  .quote-card.pos{background:var(--green-soft); border-left:3px solid var(--green)}
  .quote-text{font-size:13.5px; line-height:1.55; color:var(--ink-soft); font-style:italic}
  .quote-meta{font-size:11.5px; color:var(--gray2); margin-top:6px; font-weight:600}
  .voc-reason{font-size:12.5px; line-height:1.5; margin:2px 0; color:var(--ink-soft)}
  .voc-rcat{display:inline-block; background:var(--red-soft); color:var(--red); font-weight:700; font-size:11px;
    padding:1px 7px; border-radius:6px; margin-right:5px; white-space:nowrap}
  .praise-emp{display:inline-block; background:var(--green-soft); color:#166534; font-weight:700;
    font-size:12px; padding:2px 9px; border-radius:7px}
  /* 칭찬 카드 (예쁘게) */
  .praise-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:14px}
  .praise-card{border:1px solid var(--line-soft); border-left:4px solid var(--green); border-radius:16px;
    padding:15px 17px; background:linear-gradient(180deg,#f4fdf7,#fafafa); display:flex; flex-direction:column; gap:11px;
    box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .praise-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .praise-store{font-weight:700; font-size:15px; color:var(--ink); letter-spacing:-.01em}
  .praise-topr{display:flex; align-items:center; gap:7px; flex:0 0 auto}
  .praise-score{background:#dcfce7; color:#166534; font-weight:700; font-size:12px;
    padding:3px 10px; border-radius:20px; white-space:nowrap}
  .praise-del{border:none; background:transparent; color:var(--gray2); cursor:pointer; font-size:17px;
    line-height:1; padding:0 2px; font-weight:700; border-radius:6px}
  .praise-del:hover{color:var(--red); background:var(--red-soft)}
  .praise-quote{font-size:13.5px; line-height:1.6; color:var(--ink-soft); font-style:italic;
    border-left:2px solid #bbf7d0; padding-left:10px}
  .praise-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; flex-wrap:wrap}
  .praise-mid{font-size:11px; color:var(--gray2)}
  .praise-sel{font-family:inherit; font-size:12.5px; font-weight:600; padding:7px 10px; border:1px solid var(--line);
    border-radius:9px; background:var(--canvas); color:var(--ink); cursor:pointer}
  .praise-sel:focus{outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft)}
  .praise-assign{display:grid; grid-template-columns:1fr 1fr; gap:6px; flex:1 1 100%; width:100%; margin-top:6px}
  .praise-assign .praise-sel{min-width:0; width:100%}
  .praise-toolbar{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
  .praise-teamfilter{font-family:inherit; font-size:13px; font-weight:700; padding:8px 12px; border:1px solid var(--line);
    border-radius:10px; background:var(--canvas); color:var(--ink); cursor:pointer; max-width:180px}
  .praise-teamfilter:focus{outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft)}
  .voc-rawind{font-size:11px; color:var(--gray2); margin-top:2px}
  .voc-storeid{font-size:11px; font-weight:700; color:var(--gray2); margin-left:5px; font-variant-numeric:tabular-nums; white-space:nowrap}
  .voc-donedate{font-size:11px; color:#1e40af; font-weight:800; margin-top:2px}
  .praise-emp-row{cursor:pointer; border-radius:8px; padding:3px 6px; margin:0 -6px; transition:.12s}
  .praise-emp-row:hover{background:var(--green-soft,#dcfce7)}
  .pe-drill{font-size:10px; opacity:.5}
  .quote-card.clickable{cursor:pointer; transition:.12s}
  .quote-card.clickable:hover{transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .quote-more{font-size:11px; font-weight:800; color:var(--blue,#1a73e8); margin-left:6px; white-space:nowrap}
  .vrep-more-box{display:none}
  .vrep-more-box.open{display:block}
  .vrep-toggle{width:100%; margin-top:8px; border:1px dashed var(--line); background:var(--surface2); color:var(--gray);
    border-radius:10px; padding:8px; font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer}
  .vrep-toggle:hover{background:var(--line-soft); color:var(--ink)}
  .vday-grid{display:flex; flex-wrap:wrap; gap:8px}
  .vday{min-width:54px; text-align:center; border:1px solid var(--line-soft); border-radius:10px; padding:9px 7px; background:var(--surface2)}
  .vday.has{background:#e8f0fe; border-color:#c7dbff}
  .vday-n{font-size:19px; font-weight:800; color:var(--gray2); line-height:1}
  .vday.has .vday-n{color:#1a56db}
  .vday-d{font-size:11px; color:var(--gray2); margin-top:4px}
  .voc-rawtxt{font-size:12px; color:var(--ink-soft); line-height:1.45}
  .voc-table td{vertical-align:top}
  .voc-stat{font-weight:700}
  .voc-stat.done{background:var(--green-soft); color:#166534; border-color:#bbf7d0}
  .voc-stat.hold{background:#fff4d6; color:#a8620a; border-color:#ffe1a8}
  /* 상태별 색상: 처리중=회색·처리완료=파랑·OB필요없음=초록·부재=빨강·통화거부=주황 */
  .voc-stat.st-progress{background:#eef1f4; color:#475569; border-color:#dde3ea}
  .voc-stat.st-done{background:#dbeafe; color:#1e40af; border-color:#bfdbfe}
  .voc-stat.st-ob{background:var(--green-soft); color:#166534; border-color:#bbf7d0}
  .voc-stat.st-absent{background:#ffe1de; color:#b91c1c; border-color:#fecaca}
  .voc-stat.st-reject{background:#ffedd5; color:#c2410c; border-color:#fed7aa}
  .voc-stat.st-void{background:#f3f4f6; color:#6b7280; border-color:#e5e7eb; text-decoration:line-through}
  /* VOC 드릴다운(업종/사유 → 매장 상세) */
  .voc-drill{border:1px solid var(--line-soft); border-radius:10px; margin-bottom:8px; overflow:hidden; background:var(--surface2)}
  .voc-drill summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; padding:10px 12px}
  .voc-drill summary::-webkit-details-marker{display:none}
  .voc-drill summary::before{content:'▸'; color:var(--gray2); font-size:11px; transition:.15s; flex:0 0 auto}
  .voc-drill[open] summary::before{transform:rotate(90deg)}
  .voc-drill[open]{background:var(--canvas)}
  .vd-name{flex:0 0 auto; font-size:14px; font-weight:700; color:var(--ink); min-width:92px}
  .vd-bar{flex:1; height:8px; background:var(--line-soft); border-radius:5px; overflow:hidden}
  .vd-fill{display:block; height:100%; border-radius:5px}
  .vd-cnt{flex:0 0 auto; font-size:13px; font-weight:800; color:var(--gray)}
  .vd-pct{display:inline-block; font-size:11.5px; font-weight:800; color:#1F4FFA; background:#eef2ff; border-radius:20px; padding:1px 7px; margin-left:3px}
  /* 📊 이번달 vs 전월 비교 모달 */
  .vc-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .vc-box{border:1px solid var(--line); border-radius:16px; padding:16px 18px; background:var(--surface2)}
  .vc-box.cur{border-color:#0071e3; background:#f2f7ff}
  .vc-box.prev{opacity:.92}
  .vc-title{font-size:13px; font-weight:800; color:var(--gray); margin-bottom:10px; letter-spacing:-.01em}
  .vc-box.cur .vc-title{color:#0071e3}
  .vc-big{font-size:40px; font-weight:800; letter-spacing:-.03em; line-height:1.05}
  .vc-big small{font-size:17px; color:var(--gray2)}
  .vc-sub{font-size:12.5px; color:var(--gray); margin-top:4px}
  .vc-rank{display:flex; flex-direction:column; gap:6px}
  .vc-rrow{display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 8px; border-radius:9px; background:var(--canvas,#fff); border:1px solid var(--line-soft)}
  .vc-rk{flex:0 0 20px; height:20px; border-radius:50%; background:var(--surface); color:var(--gray); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center}
  .vc-rk.top{background:var(--ink); color:var(--canvas,#fff)}
  .vc-rname{flex:1; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .vc-rcnt{flex:0 0 auto; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums}
  /* 클릭해서 비교 가능한 카드 */
  .cmp-able{cursor:pointer; transition:.14s}
  .cmp-able:hover{border-color:#0071e3; box-shadow:0 4px 16px rgba(0,113,227,.14)}
  .cmp-tag{font-size:11px; font-weight:800; color:#0071e3; background:#e7f0ff; border-radius:20px; padding:3px 9px; white-space:nowrap}
  @media (max-width:680px){ .vc-grid{grid-template-columns:1fr} }
  .mom-wrap{flex:0 0 auto; display:inline-flex; gap:4px; align-items:center; margin-left:2px}
  .mom{font-size:10.5px; font-weight:800; border-radius:6px; padding:1px 5px; white-space:nowrap}
  .mom.up{color:#c2410c; background:#ffedd5}     /* 저점 증가/상승 = 악화 */
  .mom.down{color:#1a7f37; background:#dcfce7}   /* 저점 감소/하락 = 개선 */
  .mom.same{color:#8a94a6; background:#eef1f5}
  .mom.new{color:#7e22ce; background:#f3e8ff}
  .voc-sec-comment{margin-top:12px; border-top:1px dashed var(--line); padding-top:10px}
  .vsc-head{display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:800; color:var(--gray); margin-bottom:6px}
  .btn.xs{font-size:11.5px; padding:4px 10px; border-radius:8px; background:var(--purple,#6E3FE5); color:#fff; border:none; cursor:pointer; font-family:inherit; font-weight:700}
  .btn.xs:hover{filter:brightness(1.08)}
  .voc-comment.sm{min-height:66px; font-size:13px}
  .vd-rpct{font-size:11px; font-weight:700; color:var(--gray2,#9AA0A6); margin-left:2px}
  .voc-drill-body{padding:2px 12px 12px; border-top:1px solid var(--line-soft)}
  .voc-drill-sum{display:flex; align-items:center; gap:10px; padding:11px 12px; margin-bottom:8px; cursor:pointer;
    border:1px solid var(--line-soft); border-radius:10px; background:var(--surface2); transition:.12s}
  .voc-drill-sum:hover{background:var(--canvas,#fff); border-color:var(--blue,#1F4FFA); box-shadow:0 2px 10px rgba(31,79,250,.12); transform:translateY(-1px)}
  .voc-drill-sum .vd-open{flex:0 0 auto; opacity:.45; font-size:13px}
  .voc-drill-sum:hover .vd-open{opacity:1}
  /* 순위 배지 (업종별·이유별 인입) */
  .vd-rank{flex:0 0 auto; min-width:36px; padding:5px 7px; border-radius:8px; text-align:center;
    font-size:12px; font-weight:800; letter-spacing:-.02em; background:var(--line-soft); color:var(--gray)}
  .vd-rank.r1{background:linear-gradient(135deg,#ffdf6e,#f0a500); color:#5a3d00; box-shadow:0 1px 5px rgba(240,165,0,.45)}
  .vd-rank.r2{background:linear-gradient(135deg,#e6ebf0,#b6c0cc); color:#39434f}
  .vd-rank.r3{background:linear-gradient(135deg,#f2cda4,#d99a5f); color:#5a3416}
  .voc-drill-sum.top1{border-color:#f0a500; background:linear-gradient(90deg,rgba(240,165,0,.12),var(--surface2) 55%)}
  .voc-drill-sum.top2{border-color:#b6c0cc; background:linear-gradient(90deg,rgba(150,163,178,.14),var(--surface2) 55%)}
  .voc-drill-sum.top3{border-color:#d99a5f; background:linear-gradient(90deg,rgba(217,154,95,.13),var(--surface2) 55%)}
  .voc-drill-sum.top1 .vd-name{font-size:15px}
  .vd-prev{flex:0 0 auto; font-size:11px; font-weight:600; color:var(--gray2); background:var(--line-soft); border-radius:6px; padding:3px 7px; white-space:nowrap}
  .vd-prev.new{color:#c2410c; background:#ffedd5}
  .vd-prev b{color:var(--ink)}
  /* 큰 상세 모달 — 글씨 크게 */
  .vd-modal{max-width:min(920px,94vw); width:920px}
  .vd-modal-body{font-size:16px}
  .vd-modal-body .vd-reasons{margin-bottom:6px}
  .vd-modal-body .vd-reasons-h{font-size:16px; margin-bottom:12px}
  .vd-modal-body .vd-rname{font-size:15px}
  .vd-modal-body .vd-rcnt{font-size:15px; min-width:52px}
  .vd-modal-body .vd-rrow{margin-bottom:7px}
  .vd-modal-body .voc-detail-item{padding:13px 15px}
  .vd-modal-body .vd-store{font-size:16.5px}
  .vd-modal-body .vd-content,.vd-modal-body .vd-note{font-size:15px; line-height:1.6}
  .vd-modal-body .vd-content b,.vd-modal-body .vd-note b{font-size:12px}
  /* 매장별 상세 접힘(처음엔 이유만) */
  .vd-stores{margin-top:6px; border-top:1px dashed var(--line); padding-top:10px}
  .vd-stores summary{cursor:pointer; font-size:15px; font-weight:800; color:var(--blue,#1F4FFA); list-style:none; padding:8px 10px;
    background:#eef2ff; border-radius:10px; display:inline-block}
  .vd-stores summary::-webkit-details-marker{display:none}
  .vd-stores summary::before{content:'▸ '; font-size:12px}
  .vd-stores[open] summary::before{content:'▾ '}
  .vd-stores[open] summary{margin-bottom:10px}
  .vd-top{font-size:13px; color:var(--ink); background:var(--surface2); border:1px solid var(--line-soft); border-radius:8px; padding:8px 10px; margin:10px 0 8px}
  .vd-reasons{background:var(--canvas); border:1px solid var(--line-soft); border-radius:8px; padding:10px 11px; margin:10px 0 8px}
  .vd-reasons-h{font-size:12.5px; color:var(--ink); margin-bottom:9px}
  .vd-rrow{display:flex; align-items:center; gap:8px; margin:5px 0}
  .vd-rname{flex:0 0 45%; font-size:12.5px; color:var(--ink-soft); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .vd-rbar{flex:1; height:7px; background:var(--line-soft); border-radius:5px; overflow:hidden}
  .vd-rbar>span{display:block; height:100%; background:#ff9500; border-radius:5px}
  .vd-rcnt{flex:0 0 auto; font-size:12px; font-weight:800; color:var(--gray); min-width:30px; text-align:right}
  .voc-detail-list{display:flex; flex-direction:column; gap:8px}
  .voc-detail-item{background:var(--surface2); border:1px solid var(--line-soft); border-radius:9px; padding:9px 11px}
  .vd-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:5px}
  .vd-store{font-size:14px; font-weight:800; color:var(--ink)}
  .vd-id{font-size:11.5px; color:var(--gray2)}
  .vd-score{font-size:11.5px; font-weight:700; color:var(--red); background:var(--red-soft); padding:1px 8px; border-radius:20px}
  .vd-stat{font-size:11px; font-weight:700; padding:1px 8px; border-radius:20px; background:#e9ecef; color:#495057}
  .vd-stat.done{background:var(--green-soft); color:#166534}
  .vd-stat.hold{background:#fff4d6; color:#a8620a}
  .vd-stat.st-progress{background:#eef1f4; color:#475569}
  .vd-stat.st-done{background:#dbeafe; color:#1e40af}
  .vd-stat.st-ob{background:var(--green-soft); color:#166534}
  .vd-stat.st-absent{background:#ffe1de; color:#b91c1c}
  .vd-stat.st-reject{background:#ffedd5; color:#c2410c}
  .vd-stat.st-void{background:#f3f4f6; color:#6b7280; text-decoration:line-through}
  .vd-content,.vd-note{font-size:13px; color:var(--ink-soft); line-height:1.5}
  .vd-note{margin-top:3px}
  .vd-content b,.vd-note b{font-size:10.5px; color:var(--gray); font-weight:800; margin-right:6px; letter-spacing:.02em}
  .vd-empty{color:var(--gray2)}
  /* 저점율 행 (사용기간/VAN) */
  .ratio-row{margin-bottom:13px}
  .ratio-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:5px}
  .ratio-nm{font-size:14px; font-weight:700; color:var(--ink)}
  .ratio-val b{font-size:17px; font-weight:800}
  .ratio-sub{color:var(--gray2); font-size:12px; margin-left:6px}
  .ratio-track{height:10px; background:var(--line-soft); border-radius:6px; overflow:hidden}
  .ratio-fill{height:100%; border-radius:6px; transition:width .3s}
  .day-badge{display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:20px; background:var(--surface2); color:var(--gray); white-space:nowrap}
  .day-badge.today{background:var(--blue-soft); color:var(--blue)}
  .cnt-badge{display:inline-block; min-width:22px; text-align:center; background:var(--red-soft); color:var(--red);
    font-size:13px; font-weight:800; padding:1px 8px; border-radius:20px; margin-left:4px; vertical-align:middle}
  .cnt-badge.done{background:var(--green-soft); color:#166534}
  .voc-sel,.voc-note{width:100%; font-family:inherit; font-size:12.5px; padding:6px 8px; border:1px solid var(--line);
    border-radius:8px; background:var(--surface2); color:var(--ink)}
  .voc-sel:focus,.voc-note:focus{outline:none; border-color:var(--blue); background:var(--canvas); box-shadow:0 0 0 3px var(--blue-soft)}
  /* 고객 원문 셀 클릭 → 상세 팝업 */
  .voc-rawtxt.clickable{cursor:pointer}
  .voc-rawtxt.clickable:hover{color:var(--blue)}
  .vdt-body{display:flex; flex-direction:column; gap:14px}
  .vdt-meta{font-size:12.5px; color:var(--gray); background:var(--surface2); border-radius:8px; padding:8px 11px}
  .vdt-sec .vdt-lab{font-size:13px; font-weight:800; color:var(--ink); margin-bottom:7px}
  .vdt-quote{font-size:14px; color:var(--ink-soft); line-height:1.6; background:var(--surface2); border-left:3px solid var(--red); border-radius:8px; padding:9px 12px; margin-bottom:7px; white-space:pre-wrap}
  .vdt-note{font-size:14px; color:var(--ink); line-height:1.6; background:#eef5ff; border-radius:8px; padding:10px 12px; white-space:pre-wrap}
  .vdt-empty{color:var(--gray2); font-size:13px}
  .navbtn.sub{padding:9px 13px 9px 30px; font-size:14px; color:var(--gray); font-weight:500}
  .navbtn.sub .ic{font-size:12px; color:var(--gray2)}
  .navbtn.sub.active{background:var(--blue-soft); color:var(--blue-deep); font-weight:700}
  .voc-comment{width:100%; min-height:130px; font-family:inherit; font-size:14px; line-height:1.65; padding:14px 16px;
    border:1px solid var(--line); border-radius:12px; background:var(--surface2); color:var(--ink); resize:vertical}
  .voc-comment:focus{outline:none; border-color:var(--blue); background:var(--canvas); box-shadow:0 0 0 3px var(--blue-soft)}

  /* pending lookup */
  .search-box{width:100%; font-family:inherit; font-size:14px; padding:11px 14px; border:1px solid var(--line);
    border-radius:12px; background:var(--surface2); color:var(--ink); transition:.15s}
  .search-box:focus{outline:none; border-color:var(--blue); background:var(--canvas); box-shadow:0 0 0 3px var(--blue-soft)}
  .trow-time{color:var(--gray2); font-size:13px; white-space:nowrap}
  .trow-biz{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace; font-size:13px; color:var(--slate,#454b54)}
  .status-tag{display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; margin:1px 2px 1px 0; white-space:nowrap}
  .status-tag.absent{background:var(--red-soft); color:var(--red)}
  .status-tag.unassigned{background:#fff4d6; color:#a8620a}

  /* mini trend bars in table */
  .spark{display:inline-flex; align-items:flex-end; gap:2px; height:22px}
  .spark i{width:5px; background:var(--blue-soft); border-radius:2px; display:block}
  .spark i.hi{background:var(--blue)}

  /* ===== Duty calendar ===== */
  .cal-toolbar{display:flex; align-items:center; gap:12px; margin-bottom:16px}
  .cal-toolbar .mtitle{font-size:24px; font-weight:700; letter-spacing:-.03em; min-width:160px}
  .navround{width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--canvas);
    font-size:17px; cursor:pointer; color:var(--ink); display:inline-flex; align-items:center; justify-content:center;
    transition:background .15s, transform .1s}
  .navround:hover{background:var(--surface)}
  .navround:active{transform:scale(.94)}

  /* 오늘/내일 당직 — 달력을 훑기 전에 '지금 누가 당직인지' 한 줄로 */
  .duty-hero{background:var(--canvas); border:1px solid var(--line-soft); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:14px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
  .dh-head{flex:0 0 auto; min-width:118px}
  .dh-kicker{font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--blue)}
  .dh-date{font-size:19px; font-weight:700; letter-spacing:-.03em; margin-top:2px; line-height:1.2}
  .dh-holi{font-size:11.5px; font-weight:700; color:var(--red); margin-top:3px}
  .dh-grid{flex:1 1 420px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px}
  .dh-item{display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:14px;
    background:var(--surface); min-width:0}
  .dh-ico{font-size:16px; line-height:1; flex:0 0 auto}
  .dh-txt{min-width:0}
  .dh-lab{font-size:10.5px; font-weight:700; letter-spacing:.03em; color:var(--gray)}
  .dh-name{font-size:17px; font-weight:700; letter-spacing:-.03em; color:var(--ink); line-height:1.25;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .dh-name.none{color:var(--muted); font-weight:600; font-size:15px}
  .dh-next{flex:1 1 100%; font-size:12.5px; color:var(--gray); border-top:1px solid var(--line-soft);
    padding-top:11px; margin-top:2px}
  .dh-next b{color:var(--ink-soft); font-weight:700}
  .dh-next .none{color:var(--muted); font-weight:600}

  /* minmax(0,1fr) — 셀 내용(이름)이 길어도 7칸이 화면 밖으로 밀려나지 않게 */
  .cal-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:7px}
  .dow{font-size:12.5px; font-weight:700; letter-spacing:.03em; text-align:center; padding:2px 0 8px; color:var(--gray)}
  .dow.s-sat{color:var(--sat)} .dow.s-sun{color:var(--sun)}
  .daycell{background:var(--canvas); border:1px solid var(--line-soft); border-radius:16px; min-height:120px;
    padding:8px 8px 9px; display:flex; flex-direction:column; gap:3px; transition:border-color .15s, box-shadow .15s}
  .daycell:hover{border-color:var(--line)}
  .daycell.empty{background:transparent; border:none; min-height:0}
  .daycell.today{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft)}
  .daycell.holi{background:var(--red-soft)}
  .dnum{font-size:14px; font-weight:700; display:flex; align-items:center; gap:5px; margin-bottom:1px}
  .dnum.s-sat{color:var(--sat)} .dnum.s-sun{color:var(--sun)}
  /* 날짜 숫자 — 오늘은 파란 배지로 한눈에 */
  .dn-n{display:inline-flex; align-items:center; justify-content:center; min-width:25px; height:25px;
    border-radius:9px; font-size:15px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .dnum.is-today .dn-n{background:var(--blue); color:#fff}
  .holi-tag{font-size:10px; font-weight:700; color:var(--red); background:var(--canvas); padding:1px 6px;
    border-radius:6px; border:1px solid var(--red-soft)}
  .duty-slot{display:flex; align-items:center; gap:6px}
  .duty-slot.off{opacity:.5; transition:opacity .15s}
  .duty-slot.off:hover, .daycell:hover .duty-slot.off{opacity:1}
  .slot-tag{font-size:10px; font-weight:700; letter-spacing:0; line-height:1.4; padding:3px 0; border-radius:6px;
    flex:0 0 auto; width:34px; text-align:center}
  .slot-tag.day{background:#ffefc2; color:#7a4f00}
  .slot-tag.aft{background:#d5e8ff; color:#00509e}
  .slot-tag.nit{background:#e0dbff; color:#3f38b5}
  .slot-tag.inst{background:#c9f0da; color:#0d6437}
  .duty-slot.off .slot-tag{background:var(--surface); color:var(--muted)}
  /* 이름 = 이 화면의 주인공. 굵고 진하게, 배경 없이 */
  .slot-field{flex:1; min-width:0; font-size:14px; font-weight:700; letter-spacing:-.02em; color:var(--ink);
    padding:2px 6px; border:1px solid transparent; border-radius:8px; background:transparent; cursor:text;
    font-family:inherit; min-height:25px; line-height:21px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .duty-slot.off .slot-field{min-height:21px; line-height:17px}
  .slot-field:hover{background:var(--surface); border-color:var(--line-soft)}
  /* 대시보드에서 고쳐 시트 값을 덮은 칸 — 어느 값이 어디서 왔는지 구분되게 */
  .slot-field.ovr{background:#fff8e5; border-color:#f0d69b}
  .slot-field.ovr:hover{background:#fff2d6}
  .ovr-undo{flex:0 0 auto; border:none; background:transparent; cursor:pointer; font-size:12px;
    color:var(--gray2); padding:0 3px; line-height:1}
  .ovr-undo:hover{color:var(--ink)}
  .slot-field:empty::before{content:""}
  .daycell:hover .slot-field:empty::before, .slot-field:focus:empty::before{content:"+"; color:var(--muted); font-weight:600; font-size:13px}
  .slot-field:focus{outline:none; border-color:var(--blue); background:var(--canvas); box-shadow:0 0 0 3px var(--blue-soft);
    white-space:normal}
  .duty-slot.off .slot-field:focus{opacity:1}
  /* 다크 모드 — 파스텔 태그·노란 덮어쓰기 칸은 톤을 낮춰야 눈이 편하다 */
  :root[data-theme="dark"] .slot-tag.day{background:rgba(255,159,10,.20); color:#ffca7a}
  :root[data-theme="dark"] .slot-tag.aft{background:rgba(10,132,255,.20); color:#7db8ff}
  :root[data-theme="dark"] .slot-tag.nit{background:rgba(139,136,255,.22); color:#b6b3ff}
  :root[data-theme="dark"] .slot-tag.inst{background:rgba(48,209,88,.18); color:#6fe093}
  :root[data-theme="dark"] .duty-slot.off .slot-tag{background:var(--surface); color:var(--muted)}
  :root[data-theme="dark"] .slot-field.ovr{background:rgba(255,159,10,.16); border-color:rgba(255,159,10,.42); color:#ffd699}
  :root[data-theme="dark"] .slot-field.ovr:hover{background:rgba(255,159,10,.24)}
  :root[data-theme="dark"] .holi-tag{background:transparent}
  /* 날짜 메모 — 날짜를 클릭하면 팝업(행사·교육·특이사항 등) */
  .dnum.memo-open{cursor:pointer; border-radius:9px; padding:1px 3px; margin:-1px -3px; transition:.15s}
  .dnum.memo-open:hover{background:var(--surface)}
  .memo-btn{margin-left:auto; width:21px; height:21px; border-radius:6px; border:none; cursor:pointer;
    background:transparent; color:var(--muted); font-size:11px; line-height:1;
    display:inline-flex; align-items:center; justify-content:center; transition:.15s}
  .daycell:hover .memo-btn{background:var(--surface); color:var(--gray)}
  .memo-btn:hover{background:var(--blue); color:#fff}
  .memo-btn.on{background:#fff3d6; color:#b45309}
  .memo-chip{margin-top:3px; font-size:11.5px; font-weight:600; line-height:1.4; color:#8a5a00;
    background:#fffbe8; border:1px solid #f0e0a8; border-radius:9px; padding:5px 7px; cursor:pointer;
    white-space:pre-wrap; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
    overflow:hidden; transition:.15s}
  .memo-chip:hover{background:#fff5cf; border-color:#e5cf88}
  :root[data-theme="dark"] .memo-chip{background:rgba(255,159,10,.13); border-color:rgba(255,159,10,.32); color:#f0c88a}
  :root[data-theme="dark"] .memo-btn.on{background:rgba(255,159,10,.20); color:#ffca7a}
  .memo-ta{width:100%; font-family:inherit; font-size:14px; line-height:1.6; padding:11px 13px;
    border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); resize:vertical}
  .memo-ta:focus{outline:none; border-color:var(--blue); background:var(--canvas); box-shadow:0 0 0 3px var(--blue-soft)}

  /* ===== Share calendar ===== */
  .sel{font-family:inherit; font-size:14px; padding:9px 13px; border:1px solid var(--line);
    border-radius:11px; background:var(--canvas); color:var(--ink); cursor:pointer}
  .daycell.share{min-height:172px; gap:6px}
  .daycell.share .dnum{justify-content:space-between; width:100%}
  .add-ev{margin-left:auto; width:20px; height:20px; border-radius:6px; border:none; cursor:pointer;
    background:var(--surface); color:var(--gray); font-size:15px; line-height:1; font-weight:700;
    display:inline-flex; align-items:center; justify-content:center; transition:.15s}
  .add-ev:hover{background:var(--blue); color:#fff}
  .ev-list{display:flex; flex-direction:column; gap:5px; overflow:hidden}
  /* 여러 날 일정 막대 — 칸 사이 여백(padding+border+gap/2)만큼 밖으로 늘려 옆 칸 막대와 이어 붙인다 */
  .daycell.share{--bar-out:13px}
  .cal-grid{isolation:isolate}   /* 막대 이름표(z-index)가 팝업·모달 위로 새지 않게 */
  .ev-bars{display:flex; flex-direction:column; gap:4px}
  .ev-bar, .ev-bar-gap{height:24px; flex:0 0 auto}
  .ev-bar{position:relative; display:flex; align-items:center; gap:4px; padding:0 4px 0 9px; border-radius:7px;
    color:#fff; font-size:12.5px; font-weight:700; cursor:pointer}
  .ev-bar:hover{box-shadow:inset 0 0 0 99px rgba(255,255,255,.12)}
  .ev-bar.dragging{opacity:.4}
  .ev-bar.cont-l{margin-left:calc(-1 * var(--bar-out)); padding-left:0; border-top-left-radius:0; border-bottom-left-radius:0}
  .ev-bar.cont-r{margin-right:calc(-1 * var(--bar-out)); border-top-right-radius:0; border-bottom-right-radius:0}
  .bar-lab{position:relative; z-index:2; flex:0 0 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bar-lab small{font-weight:600; opacity:.9; margin-left:5px}
  .ev-bar .ev-del{position:relative; z-index:3; margin-left:auto; padding:0 2px}
  .ev-chip{display:flex; align-items:flex-start; gap:6px; font-size:13px; font-weight:700; padding:7px 8px 7px 10px;
    border-radius:10px; line-height:1.4; color:#fff; box-shadow:0 1px 2px rgba(0,0,0,.12); transition:.15s}
  .ev-chip:hover{filter:brightness(1.08)}
  .ev-chip{cursor:grab}
  .ev-chip:active{cursor:grabbing}
  .ev-chip.dragging{opacity:.4}
  .daycell.share.drop-hover{border:2px dashed var(--blue); background:var(--blue-soft)}
  .ev-dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto; margin-top:3px; display:inline-block}
  .ev-txt{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; white-space:normal; word-break:keep-all; color:#fff}
  .ev-head{font-weight:800; font-size:14px; letter-spacing:-.01em}
  .ev-sub{font-weight:700; font-size:12px; opacity:.95}
  .ev-time{font-weight:700; opacity:.95}
  .ev-memo{font-weight:600; font-size:11.5px; opacity:.9}
  .ev-del{flex:0 0 auto; border:none; background:transparent; color:#fff; cursor:pointer;
    font-size:15px; line-height:1; opacity:.7; padding:0 1px; margin-top:-1px; font-weight:700}
  .ev-del:hover{opacity:1}
  .ev-chip.gcal{background:#e8f0fe; color:#174ea6; border:1px solid #c6dafc; box-shadow:none; cursor:default}
  .ev-chip.gcal .ev-txt{color:#174ea6}
  .ev-chip.gcal .ev-sub{opacity:.85}
  .ev-gtag{flex:0 0 auto; width:18px; height:18px; border-radius:5px; background:#1a73e8; color:#fff;
    font-size:11px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; margin-top:1px}
  .ev-chip.gcal.duty{border-color:#ffd8a8; background:#fff8ef}
  .ev-duty{display:block; font-size:11.5px; font-weight:800; color:#b45309; background:#fff3d6; border-radius:5px; padding:1px 6px; margin-top:3px; align-self:flex-start}
  .ev-duty.pick{cursor:pointer; border:1px dashed #f0b429}
  .ev-duty.pick:hover{background:#ffe9b8; color:#8a4708}
  .ev-duty .duty-lab{font-weight:700; opacity:.75; margin-left:3px}
  /* 근무당번 선택 팝업 */
  .dp-meta{font-size:13px; color:var(--gray); margin:2px 0 12px}
  .dp-list{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .dp-item{border:1px solid var(--line); background:var(--canvas,#fff); color:var(--ink); border-radius:12px;
    padding:11px 8px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; transition:.12s}
  .dp-item:hover{border-color:#f0b429; background:#fff8ef}
  .dp-item.on{background:#fff3d6; border-color:#f0b429; color:#8a4708}
  .dp-note{margin-top:12px; font-size:12px; color:var(--gray2); line-height:1.5}
  .dp-auto{width:100%; margin-top:10px; border:1px dashed var(--line); background:var(--surface2); color:var(--gray);
    border-radius:10px; padding:9px; font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer}

  .lock-desc{font-size:14.5px; color:var(--gray); line-height:1.6; margin-bottom:20px}

  .lock-err{min-height:20px; font-size:13px; font-weight:700; color:var(--red); margin:10px 0 2px}

    background:linear-gradient(135deg,#00b3e6,#0071e3); box-shadow:0 10px 24px rgba(0,113,227,.4); transition:.15s}

  /* 🔒 비밀번호 모달 — 브라우저 prompt() 는 입력이 그대로 보여서 직접 만든다 */
  .pw-input{width:100%; margin-top:16px; padding:13px 15px; font-size:20px; font-family:inherit;
    text-align:center; letter-spacing:.5em; text-indent:.5em; border:1.5px solid var(--line);

  .pw-input:focus{border-color:var(--blue); background:var(--canvas)}

  .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--gray); margin-top:16px}

  @media (max-width:900px){
    .sidebar{display:none}
    .main{padding:22px 18px 48px}
    .kpis{grid-template-columns:repeat(2,1fr)}

  @media (max-width:640px){

    .daycell.share .dnum{flex-wrap:nowrap; min-width:0} .daycell.share .holi-tag{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
    .ev-bar, .ev-bar-gap{height:20px} .ev-bar{font-size:11px; padding-left:5px}

      white-space:normal; overflow-wrap:anywhere}
    .memo-chip{font-size:10.5px; padding:4px 5px; -webkit-line-clamp:2}
    .legend{gap:10px; font-size:11.5px}
  }
</style>

<body>

<!-- Lock / Login screen -->
<div class="lock" id="lock">
  <span class="float-emoji e1">⏰</span>
  <span class="float-emoji e2">🖐️</span>
  <span class="float-emoji e3">✅</span>
  <span class="float-emoji e4">⏰</span>
  <div class="lock-card">
    <div class="lock-badge">⚠️ 대시보드 입장 전 필수 체크</div>
    <div class="lock-wordmark">Shifty <span>· 출근 체크</span></div>
    <h3 class="lock-q">아 맞다,<br><em>시프티</em> 찍으셨나요? <span class="wave">🖐️</span></h3>
    <p class="lock-desc">확인하셨다면 아래에 답변을 입력하고 입장하세요.</p>
    <input type="text" id="lockInput" class="lock-input" placeholder="답변을 입력하세요"
      autocomplete="off" onkeydown="if(event.key==='Enter') submitLogin()">
    <div class="lock-err" id="lockErr"></div>
    <button class="lock-btn" onclick="submitLogin()">입장하기</button>
    <div class="lock-foot">Offline Care Team · 원격파트 대시보드</div>
  </div>
</div>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="brand">
    <h1>원격파트 대시보드</h1>
    <p>iShopCare</p>
  </div>
  <div class="nav-label">카테고리</div>
  <nav id="nav"></nav>
  <button class="lock-out" onclick="relock()">🔒 잠금</button>
</aside>
<!-- 어디서든 보이는 야간모드 토글 (모바일/사이드바 숨김 대응) -->
<button class="theme-fab" id="themeToggle" onclick="toggleTheme()" title="야간 모드">🌙</button>

<!-- Main -->
<main class="main" id="main"></main>

<!-- Duty alert modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="bell">🔔</div>
    <h4>당직근무 알림</h4>
    <p id="modalText"></p>
    <div class="date-line" id="modalDate"></div>
    <div class="acts">
      <button class="btn primary" onclick="closeModal()">확인</button>
    </div>
  </div>
</div>

<!-- 🔒 비밀번호 모달 (관리 · VOC Monthly) -->
<div class="overlay" id="pwOverlay">
  <div class="modal">
    <div class="bell">🔒</div>
    <h4 id="pwTitle">비밀번호</h4>
    <p>접속 비밀번호를 입력하세요</p>
    <input type="password" id="pwInput" class="pw-input" autocomplete="off"
      inputmode="numeric" placeholder="••••" aria-label="접속 비밀번호"
      onkeydown="if(event.key==='Enter'){event.preventDefault();pwSubmit()} else if(event.key==='Escape'){event.preventDefault();pwCancel()}">
    <div class="pw-err" id="pwErr"></div>
    <div class="acts">
      <button class="btn" onclick="pwCancel()">취소</button>
      <button class="btn primary" onclick="pwSubmit()">입장</button>
    </div>
  </div>
</div>

<!-- Share event form modal -->
<div class="overlay" id="shareOverlay">
  <div class="modal form-modal">
    <h4 id="sfHeading" style="margin-bottom:18px">일정 공유 추가</h4>
    <div class="form-row"><label id="sfDateLabel">시작일</label><input type="date" id="sfDate" onchange="onShareStartChange()"></div>
    <div class="form-row" id="sfEndDateRow"><label>종료일</label><input type="date" id="sfEndDate"></div>
    <div class="form-row"><label>직원</label>
      <select id="sfEmp"></select></div>

      </div></div>

    <div class="acts">

<!-- 날짜 메모 modal (당직근무 달력) -->
<div class="overlay" id="dutyMemoOverlay">

      <button class="btn" onclick="closeDutyMemo()">취소</button>

<!-- 슬랙 집계 데이터는 캐시 무효화하여 아래 스크립트에서 동적 로드 -->
<script>
/* ================= Config ================= */
const EMPLOYEES = ["김기범","서상원","김규빈","김동욱","송태양","김현기","배선유","최민석","심성현","고경림","박하림"];
/* 2026-09-01 VOC DRI 이관 (원격팀 → CX팀).
 * 이 날짜 이후 완료된 VOC 는 우리 팀 처리 실적으로 집계하지 않는다 —
 * 직원별 처리량·MVP·랭킹·야간 처리·업적·일별 처리 추이에서 모두 빠진다.
 * 저점 모니터링은 그대로 유지된다: 저점 표·처리완료 이동·완료일/담당자 표기는 계속 동작하고,
 * CX팀 담당자(김유나·홍지혜 등) 이모지도 그대로 '✓ 9/1 완료 · 홍지혜' 로 표시된다. */
const VOC_DRI_HANDOVER = "2026-09-01";
function vocCredited(doneDate){ return !!doneDate && doneDate < VOC_DRI_HANDOVER; }   // 우리 팀 실적으로 셀 완료건인가
// 공유 캘린더 — 직원별 고유 색상(흰 글씨가 잘 보이는 진한 톤)
const EMP_COLORS = {
  "김기범":"#1f6feb","서상원":"#2f9e44","김규빈":"#e8590c","김동욱":"#6741d9",
  "송태양":"#e03131","김현기":"#0c8599","배선유":"#9c36b5","최민석":"#c2255c","심성현":"#495057",
  "고경림":"#5c940d","박하림":"#8d5524"
};
function empColor(n){ return EMP_COLORS[n] || "#495057"; }

// 주 단위 순번 계산(변경 이력 반영). w = 앵커로부터 몇째 주인지.
function rotPerson(order, idx, anchor, changes, ds){
  const wk=v=>Math.round((parseYmd(v)-parseYmd(anchor))/(7*86400000));
  const at=(o,i,n)=>o[(((i+n)%o.length)+o.length)%o.length];
  let w0=0;
  for(const c of changes){
    if(ds<c.from) break;
    const wc=wk(c.from), who=at(order, idx, wc-w0);   // 바뀌는 첫 주 = 이전 순번의 담당
    order=c.order; idx=Math.max(0, order.indexOf(who)); w0=wc;
  }
  return at(order, idx, wk(ds)-w0);
}
// 보고 있는 달이 바뀌는 달이거나 그 전이면 '언제부터 누가 합류' 예고 (달 마지막 날 기준 순번을 보여주므로)
function orderChangeNote(changes, y, m){
  const first=ymd(new Date(y,m,1));
  const last=ymd(new Date(y,m+1,0));
  const c=changes.find(c=>c.from>=first); if(!c) return '';
  const p=c.from.split('-'), when=(+p[1])+'/'+(+p[2])+'부터';
  if(c.from<=last) return ` <span style="font-weight:600;color:var(--gray2)">(${when} 적용)</span>`;   // 이 달 안에 바뀜 → 새 순번 + 시작일
  return ` <span style="font-weight:600;color:var(--gray2)">· ${when}: ${c.order.join(' → ')}</span>`;   // 다가올 변경 예고
}
// 그 날짜에 적용되는 순번 목록 (안내 문구·교체 팝업용)

function meetingDutyList(){

  Object.keys(days).forEach(d=>(days[d]||[]).forEach(e=>{ if(isDutyMeeting(e.title)) list.push({date:d, time:e.time||"", title:e.title}); }));
  list.sort((a,b)=>(a.date+"|"+a.time).localeCompare(b.date+"|"+b.time));
  return list;
}

function dutyMap(){
  const map={};

}
function meetingStart(m){
  const t=(m.time||"").split("~")[0].trim(); if(!/^\d{1,2}:\d{2}$/.test(t)) return null;
  const p=m.date.split("-").map(Number), q=t.split(":").map(Number);
  return new Date(p[0],p[1]-1,p[2],q[0],q[1],0,0);
}
// 30분 전 알림 체크(탭 열려 있을 때). 1분마다 호출됨.
function checkDutyAlert(){
  if(!window.GCAL_DATA) return;
  const now=new Date(), today=ymd(now), map=dutyMap(), alerted=load(LS_DUTYALERT,{});
  meetingDutyList().filter(m=>m.date===today).forEach(m=>{
    const st=meetingStart(m); if(!st) return;
    const diff=(st-now)/60000, key=m.date+"|"+m.time+"|"+m.title;
    if(diff>0 && diff<=30 && !alerted[key]){ alerted[key]=true; showDutyPopup(m, map[key], Math.max(1,Math.round(diff))); }
  });
  Object.keys(alerted).forEach(k=>{ if((k.split("|")[0]||"")<today) delete alerted[k]; });
  save(LS_DUTYALERT,alerted);
}

/* 소요시간 git 복원분(done-backfill.js · scripts/mine-emoji-times.js) — 폴링 추적이 재지 못한 곳만 메운다.

 * 응답시간(첫 확인)은 복원이 안 돼 min 이 없다 — 소요시간에만 쓰인다. 같은 건(시각|사업자)을 추적이 쟀으면 추적값이 우선. */
const RESP_TRACK_START='2026-08-31', BACKFILL_ALWAYS=['transfer','menu','delivery'];
function respItemsOf(dates){
  const R=(window.SLACK_DATA&&window.SLACK_DATA.resp&&window.SLACK_DATA.resp.days)||{};
  const B=(window.DONE_BACKFILL&&window.DONE_BACKFILL.days)||{};
  const out=[];
  for(const d of dates){ const arr=(R[d]&&R[d].items)||[], bf=B[d]||[]; if(!arr.length&&!bf.length) continue;
    const fin={}; ((slackDay(d)||{}).done||[]).forEach(x=>{ fin[(x.time||'')+'|'+(x.biz||'')]=x; });
    const seen=new Set();
    for(const it of arr){ const k=(it.hm||'')+'|'+(it.biz||''); seen.add(k); out.push(Object.assign({date:d}, it, {cat:(fin[k]&&fin[k].cat)||it.cat||'as'})); }
    for(const [hm,biz,dmin,cat0] of bf){ const k=hm+'|'+biz; if(seen.has(k)) continue;
      const fx=fin[k], cat=(fx&&fx.cat)||cat0||'as';
      if(d>=RESP_TRACK_START && !BACKFILL_ALWAYS.includes(cat)) continue;
      out.push({date:d, hm, biz, min:null, dmin, cat, store:fx?fx.store:'', who:fx?fx.emp:'', src:'git'}); }
  }
  return ovShift==='night' ? out.filter(x=>isNightTime(x.hm)) : out;

  const hidden = HIDDEN_ACH.includes(it.ach);
  const revealed = !hidden || owned || (a && a.ok);
  const cond = a ? a.label : achShort(it.ach);
  const prog = (a && a.prog && a.prog!=='미달' && a.prog!=='-') ? a.prog : '';
  return { cond: revealed ? cond : '???', prog: revealed ? prog : maskProg(prog), ok: !!(a && a.ok), revealed };
}
// 낚시 전용 아이템이 어느 낚시터에서 나오는지 힌트 (지정 드롭 + 등급별)
function fishSpotHint(it){
  const targeted={ft_wanderer:'초급 낚시터', t_whale:'중급 낚시터', ft_captain:'고급 낚시터'};
  if(targeted[it.id]) return targeted[it.id];
  return ({common:'초급 낚시터', rare:'초급·중급 낚시터', epic:'중급 낚시터', legendary:'고급 낚시터', mythic:'고급 낚시터'})[it.rarity] || '낚시터';
}
// 달성 상태 { ok, label, prog } — 조건(it.ach) 없으면 null (=일반 코인 아이템)
function achStatus(emp, it){
  if(!it || !it.ach || !emp) return it&&it.ach ? {ok:false, label:achShort(it.ach), prog:'-'} : null;
  if(it.ach==='hand'){ const best=Math.max(0,...Object.values(empWorkByDay(emp))); return {ok:best>=35, label:'하루 원격 35건 처리', prog:`${best}/35건`}; }
  if(it.ach==='phoenix'){ const toMin=t=>{ const p=(t||'').split(':'); return (+p[0]||0)*60+(+p[1]||0); }; let ok=false, bestSpan=0; monthSlackDates().forEach(d=>{ const ts=((slackDay(d)||{}).done||[]).filter(x=>x.emp===emp&&x.time).map(x=>toMin(x.time)); if(ts.length>=2){ const span=Math.max(...ts)-Math.min(...ts); if(span>bestSpan) bestSpan=span; if(span>=720) ok=true; } }); return {ok, label:'하루 원격 처리 이력 12시간 이상 (첫~마지막 처리 간격)', prog:ok?'달성 ✓':`최고 ${Math.floor(bestSpan/60)}시간 ${bestSpan%60}분/12시간`}; }
  if(it.ach==='master'){ let ok=false; const W=['onboarding','as','transfer','menu','delivery','extern']; monthSlackDates().forEach(d=>{ const day=slackDay(d)||{}; const dn=(day.done||[]).filter(x=>x.emp===emp); const cs={}; dn.forEach(x=>{ cs[x.cat]=(cs[x.cat]||0)+1; }); const all6=W.every(c=>(cs[c]||0)>=2); const anyPending=(day.pending||[]).some(p=>p.handler===emp); if(all6&&!anyPending) ok=true; }); return {ok, label:'하루에 온보딩·AS·명변·메뉴·배달·외주 각 2건 이상 + 부재·미처리 0건', prog:ok?'달성 ✓':'미달'}; }
  if(it.ach==='god'){ const best=Math.max(0,...Object.values(empWorkByDay(emp))); const mvp=mvpCountOf(emp); return {ok:best>=50&&mvp>=10, label:'하루 50건 이상 처리 + MVP 10회 이상 선정', prog:`하루최고 ${best}/50 · MVP ${mvp}/10`}; }
  if(it.ach==='night'){ const have=nightHandled(emp,'20:00'); return {ok:have>=300, label:'밤 20:00 이후 300건 처리', prog:`${have}/300건`}; }
  if(it.ach==='fool'){ const miss=missCumCount(emp); return {ok:miss>=5, label:'이번 달 누락 이력 5건 이상 (해결해도 누적)', prog:`${miss}/5건`}; }   // 히든(달성 시 공개)
  if(it.ach==='layoff'){ const miss=missCumCount(emp); return {ok:miss>=30, label:'이번 달 누락 이력 30건 이상 (해결해도 누적)', prog:`${miss}/30건`}; }   // 히든
  if(it.ach==='fast'){ let c=0; monthSlackDates().forEach(d=>((slackDay(d)||{}).done||[]).forEach(x=>{ if(x.emp===emp && x.urgent) c++; })); return {ok:c>=3, label:'이번 달 긴급/사이렌 처리 3건', prog:`${c}/3건`}; }   // 히든
  if(it.ach==='thunder'){ let c=0; allSlackDates().forEach(d=>((slackDay(d)||{}).done||[]).forEach(x=>{ if(x.emp===emp && x.urgent) c++; })); return {ok:c>=100, label:'긴급/사이렌 처리 100건(누적)', prog:`${c}/100건`}; }   // 히든
  if(it.ach==='beta'){ const ok=(it.onlyFor||[]).includes(emp); return {ok, label:'베타테스터 지정 인원 전용', prog:ok?'달성 ✓':'대상 아님'}; }   // 배선유·김동욱 전용
  if(it.ach==='bomb'){ const c=gs(emp).fishMiss||0; return {ok:c>=5000, label:'낚시터 꽝 5,000회 달성', prog:`${c.toLocaleString()}/5,000회`}; }   // 히든: 꽝 누적(카운터 도입 시점부터)
  if(it.ach==='bling'){ const COS=['nametag','hat','pet','skin','hair','dye','eyes','brows','mouth','beard','top','pants','shoes','gloves','cape']; const c=(gs(emp).owned||[]).filter(o=>COS.includes(String(o).split(':')[0])).length; return {ok:c>=50, label:'꾸미기 치장 아이템 50개 수집 (타이틀 제외)', prog:`${c}/50개`}; }
  if(it.ach==='star'){ const c=(gs(emp).owned||[]).filter(o=>String(o).split(':')[0]==='title').length; return {ok:c>=20, label:'타이틀 20개 이상 보유', prog:`${c}/20개`}; }
  if(it.ach==='angler'){ const c=gs(emp).fishCasts||0; return {ok:c>=10000, label:'낚시터 캐스팅 10,000회 달성', prog:`${c.toLocaleString()}/10,000회`}; }
  if(it.ach==='first'){   // 히든: 그날의 첫 원격 처리 건이 본인 111회 (누적 · 월간 초기화 없음)
    let c=0;
    allSlackDates().forEach(d=>{
      const dn=((slackDay(d)||{}).done||[]).filter(x=>x.time&&x.emp);
      if(!dn.length) return;
      const min=dn.reduce((a,x)=>x.time<a?x.time:a, dn[0].time);
      if(dn.some(x=>x.time===min&&x.emp===emp)) c++;
    });
    return {ok:c>=111, label:'그날 아침 첫 원격 건 처리 111회 (누적)', prog:`${c}/111회`};
  }
  if(it.ach==='workaholic'){
    // 평일 90일 연속: 각 평일 09:00~18:00 사이 본인 처리 이력 1건 이상.
    // 주말은 건너뜀 · 전사 이력이 아예 없는 평일(공휴일·휴무 추정)도 스트릭을 끊지 않고 건너뜀. (누적 데이터 기준)
    const dates=allSlackDates().slice().sort();
    const isWd=d=>{ const g=new Date(d+'T00:00:00Z').getUTCDay(); return g>=1&&g<=5; };
    let best=0,cur=0;
    for(const d of dates){
      if(!isWd(d)) continue;
      const dn=((slackDay(d)||{}).done||[]);
      if(!dn.length) continue;   // 전사 무이력 평일 = 휴일로 간주
      const okDay=dn.some(x=>x.emp===emp && (x.time||'')>='09:00' && (x.time||'')<='18:00');
      if(okDay){ cur++; if(cur>best) best=cur; } else cur=0;
    }
    return {ok:best>=90, label:'평일 90일 연속, 매일 09~18시 원격 처리 이력 (주말·공휴일 제외)', prog:`최장 연속 ${best}/90일`};
  }
  return null;
}
// ── 누락 이력 '누적' 집계 (바보·권고사직 타이틀용) ──
// 슬랙 원본은 최근 3일을 다시 훑기 때문에, 누락을 확인·처리하면 그 건이 pending에서 사라짐.
// → 한 번 뜬 누락 건은 키(날짜|시간|상호|유형)로 기록해두고, 나중에 해결돼도 그 달 누적에는 남김. 매월 1일 초기화.
function missKey(d,p){ return d+'|'+(p.time||'')+'|'+(p.store||'')+'|'+(p.cat||''); }
function recordMissLog(emp){
  if(!emp || !cloudReady) return;   // 클라우드 로드 전에는 기록하지 않음(서버 데이터 덮어쓰기 방지)
  const mk=curMonthKey(), g=gs(emp);
  const log=g.missLog=g.missLog||{}; const cur=log[mk]=log[mk]||{}; let changed=false;
  for(const k in log) if(k!==mk) { delete log[k]; changed=true; }   // 지난 달 기록은 정리(초기화)
  allSlackDates().filter(d=>d.slice(0,7)===mk).forEach(d=>{
    ((slackDay(d)||{}).pending||[]).forEach(p=>{ if(p.handler!==emp) return; const k=missKey(d,p); if(!cur[k]){ cur[k]=1; changed=true; } });
  });
  if(changed) saveGame();
}
// 이번 달 누락 누적 건수 = 기록해둔 이력 ∪ 지금 보이는 미처리 건
function missCumCount(emp){
  const mk=curMonthKey(); const set=new Set(Object.keys(((gs(emp).missLog||{})[mk])||{}));
  allSlackDates().filter(d=>d.slice(0,7)===mk).forEach(d=>{
    ((slackDay(d)||{}).pending||[]).forEach(p=>{ if(p.handler===emp) set.add(missKey(d,p)); });
  });
  return set.size;
}
// 자동 획득 타이틀(autoGrant): 조건 충족 시 클릭 없이 owned에 추가 + 미착용이면 착용(최초 1회). 대상=현재 선택된 직원.
function autoGrantTitles(emp){
  if(!emp) return; recordMissLog(emp); const g=gs(emp); let changed=false;
  // 예전 버그(히든 타이틀 price:0 → 누구나 착용) 잔재 정리: 보유하지 않은 타이틀이 착용돼 있으면 해제
  if(g.equipped && g.equipped.title && !owns(emp,'title',g.equipped.title)){ delete g.equipped.title; changed=true; }
  for(const it of (GAME_ITEMS.title||[])){
    if(!it.autoGrant || owns(emp,'title',it.id)) continue;
    const a=achStatus(emp,it);
    if(a && a.ok){ g.owned=g.owned||[]; g.owned.push('title:'+it.id); g.equipped=g.equipped||{}; if(!g.equipped.title) g.equipped.title=it.id; changed=true; }
  }
  if(changed) saveGame();
}
// ── 전체현황 shift 대응 데이터 (전체=COUNTS 기반 / 야간=done 시간필터) ──
function ovCnt(cat, dates, emp){
  if(ovShift!=='night') return sumRange(cat, dates, emp);
  let n=0; dates.forEach(d=>((slackDay(d)||{}).done||[]).forEach(x=>{ if(isNightTime(x.time)&&x.cat===cat&&(!emp||x.emp===emp)) n++; })); return n;
}
function ovVocDone(dates){

  allSlackDates().forEach(d=>{ const v=(slackDay(d)||{}).voc; if(!v)return; [...(v.alerts||[]),...(v.praises||[])].forEach(x=>{ const e=vocEmpAt(d,x), dd=vocDoneAt(d,x); if(e&&vocCredited(dd)&&set.has(dd)&&isNightTime(x.time)){ cnt++; byEmp[e]=(byEmp[e]||0)+1; } }); });

/* 2차 부재(재부재·연락 불가) — 종결 건이라 미처리·누락 랭킹·직원 실적에는 없고 '원격 총 건수'에만 센다 (days[d].absent) */
function ovAbsent2Raw(dates){ const out=[]; dates.forEach(d=>((slackDay(d)||{}).absent||[]).forEach(p=>{ if(ovShift!=='night'||isNightTime(p.time)) out.push(p); })); return out; }
function ovPendingRaw(dates){ const out=[]; dates.forEach(d=>((slackDay(d)||{}).pending||[]).forEach(p=>{ if(ovShift!=='night'||isNightTime(p.time)) out.push(p); })); return out; }
/* 설치 OB — 구글시트 '⚒️설치일정 확인해주세요' 의 D열(확인여부)에 담당자 이름이 적힌 행.
 * slack-data.js days[d].ob = {count, byEmp:{}, items:[{key,handler,status,recvDate,planDate,link}]}
 * 기준일은 '담당자 이름을 처음 본 날'. 시트에 시각 컬럼이 없어 주간/야간 구분은 불가하다. */
function obItems(dates){
  const out=[];
  dates.forEach(d=>{ const ob=(slackDay(d)||{}).ob; if(!ob) return;
    (ob.items||[]).forEach(it=>out.push({...it,_date:d})); });
  return out;
}
// 야간/주간과 무관한 순수 건수. 관리탭은 전체현황의 야간 토글을 따르면 안 되므로 이쪽을 쓴다.
function obCntRaw(dates){
  let n=0;
  dates.forEach(d=>{ const ob=(slackDay(d)||{}).ob; if(!ob) return;
    n += (ob.items||[]).length || ob.count || 0; });
  return n;
}
// 야간 탭에서는 null — 시트에 확인 시각이 없어 야간 건만 골라낼 방법이 없다(0으로 찍으면 '없다'로 오해된다)
function obCnt(dates){ return ovShift==='night' ? null : obCntRaw(dates); }
/* 설치 OB 를 슬랙 done 항목과 같은 모양으로 바꾼다.
 * 관리탭의 표·차트가 전부 이 모양을 쓰므로, 여기 한 곳만 맞추면 시간대별·DRI·전월비교가 같이 따라온다.
 * 시각은 시트 A열(접수 시각)이다 — 확인 시각은 시트에 없다. 날짜 기준도 대시보드 전체와 같은 접수일이라
 * 시간대 그래프에서만 '접수 시각'이라는 점을 표에 밝혀 둔다. */
function obTimeOf(key){
  const m=/(오전|오후)\s*(\d{1,2}):(\d{2})/.exec(String(key||''));
  if(!m) return '';
  let h=Number(m[2])%12; if(m[1]==='오후') h+=12;
  return String(h).padStart(2,'0')+':'+m[3];
}
function obAsDone(dates){
  return obItems(dates).map(x=>({date:x._date, time:obTimeOf(x.key), store:x.status||'(상태 미기재)',
    biz:'', cat:'ob', emp:x.handler, req:'', hw:'', intake:'', note:x.status||'', link:x.link, _ob:true}));
}
// 담당자별 설치 OB — 직원별 표의 별도 열용
function obByEmp(dates){ return ovShift==='night' ? {} : obByEmpRaw(dates); }
function obByEmpRaw(dates){
  const out={};
  dates.forEach(d=>{ const ob=(slackDay(d)||{}).ob; if(!ob) return;
    if(ob.byEmp) for(const e in ob.byEmp) out[e]=(out[e]||0)+ob.byEmp[e];
    else (ob.items||[]).forEach(it=>{ if(it.handler) out[it.handler]=(out[it.handler]||0)+1; }); });
  return out;
}
let ovStart = ymd(addDays(today(),-6));

/* ================= Count data access ================= */
function getCount(cat, date, emp){ return (COUNTS[cat] && COUNTS[cat][date] && COUNTS[cat][date][emp]) || 0; }
/* ── 관리자 보정 ───────────────────────────────────────────────────────────
 * 슬랙 이모지로 안 잡힌 처리 건을 관리자가 직접 더하거나 빼는 값.
 * { "YYYY-MM-DD|담당자|카테고리": {n, by, at} } — 날짜별로 두므로 조회 기간 필터를 그대로 탄다.
 * 반영은 sumRange(집계 경로)에서만 한다. getCount 는 카테고리 페이지의 수정 input 이
 * 그대로 읽어 setCount 로 되쓰는 자리라, 여기에 더하면 보정이 COUNTS 에 구워져 이중 계산된다.
 * 야간 모드(ovShift='night')는 보정에 시각 정보가 없어 제외된다(설치 OB 와 동일). */
/* 키는 '날짜|담당자|카테고리|uid'. uid 를 붙여 건별로 따로 저장한다 —
 * 같은 칸에 여러 번 보정하면 사유도 여러 개이므로, 합쳐버리면 사유 이력이 사라진다. */
function adjKey(date, emp, cat, uid){ return date+'|'+emp+'|'+cat+'|'+(uid||adjUid()); }
function adjUid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function adjParse(k){ const p=k.split('|'); return {date:p[0]||'', emp:p[1]||'', cat:p[2]||'', uid:p[3]||''}; }
// 삭제된 건은 다른 브라우저에 묘비('')로 도착한다 → 합계·목록에서 모두 걸러낸다
function adjLive(k){ const r=ADJUST[k]; return !!(r && Number(r.n)); }
function adjN(date, emp, cat){
  let n=0;
  for(const k in ADJUST){ if(!adjLive(k)) continue; const p=adjParse(k);
    if(p.date===date && p.emp===emp && p.cat===cat) n+=Number(ADJUST[k].n)||0; }
  return n;
}
function adjDay(cat, date){    // 담당자 구분 없는 그날 보정 합계(카테고리 총계·기타 행 계산용)
  let n=0;
  for(const k in ADJUST){ if(!adjLive(k)) continue; const p=adjParse(k);
    if(p.date===date && p.cat===cat) n+=Number(ADJUST[k].n)||0; }
  return n;
}
function adjEntries(dates){   // 조회 기간에 걸치는 보정 목록 (최신순)
  const set=new Set(dates||[]);
  return Object.keys(ADJUST).filter(k=>adjLive(k))
    .map(k=>({k, ...adjParse(k), ...ADJUST[k]}))
    .filter(x=>set.has(x.date))
    .sort((a,b)=> (b.at||'').localeCompare(a.at||'') || b.date.localeCompare(a.date));
}
function adjCountIn(dates){ return adjEntries(dates).length; }
// 표 하단 공개 목록 — 암호 없이 팀 전원이 '누가 왜 몇 건 보정했는지' 를 볼 수 있어야 한다
function adjPublicList(dates){

    ${list.map(x=>`<div class="adj-pub-row">

      <span class="apw">${x.why?escapeHtml(x.why):'<span style="color:var(--gray2)">사유 미기재</span>'}</span>
      ${x.by?`<span class="apb">${escapeHtml(x.by)}</span>`:'<span class="apb"></span>'}
    </div>`).join('')}
  </div>`;
}
function catNameOfKey(key){ const c=WORK_CATS.find(x=>x.key===key); return c?`${c.icon} ${c.name}`:key; }

// ── 보정 모달 ─────────────────────────────────────────────────────────────
function openAdjust(){
  const dates=ovDates();
  const defDate=dates[dates.length-1]||ymd(today());
  const list=adjEntries(dates);
