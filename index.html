  fn();
}
function flushDeferredRender(){
  if(!deferredRender || syncBlocked()) return;
  const fn=deferredRender; deferredRender=null; fn();
}
function menuReqReload(){
  loadData('menu-requests.js', function(){ if(activeCat==='menureg') renderWhenIdle(renderMain); });
}
function slackDataReload(){
  const prev=(window.SLACK_DATA && window.SLACK_DATA.version) || 0;
  reloadSlackData(function(){
    const cur=(window.SLACK_DATA && window.SLACK_DATA.version) || 0;
    if(cur!==prev){ applySlackData(); if(activeCat!=="duty" && activeCat!=="share") renderWhenIdle(renderMain); }
  });
}
function calendarReload(){
  const gprev=(window.GCAL_DATA && window.GCAL_DATA.version) || 0;
  reloadCalendarData(function(){
    const gcur=(window.GCAL_DATA && window.GCAL_DATA.version) || 0;
    if(gcur!==gprev && activeCat==="share") renderShare();
  });
}
// 빠른 루프에서 도는 확인들. 화면에 안 보이거나 입력 중이면 건너뛴다.
function checkDataUpdates(){
  if(document.hidden) return;                  // 숨은 탭은 폴링하지 않음
  flushDeferredRender();                       // 입력이 끝났으면 미뤄둔 갱신부터 반영
  // syncBlocked() 여도 확인·다운로드는 진행한다 — 재렌더만 renderWhenIdle 로 미뤄진다.
  checkDataFile('slack-data.js', slackDataReload);
  if(activeCat==='menureg') checkDataFile('menu-requests.js', menuReqReload);
}
function startAutoRefresh(){
  setInterval(checkCloudRev, SYNC_FAST_MS);
  setInterval(checkDataUpdates, SYNC_DATA_MS);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ checkCloudRev(); checkDataUpdates(); } });  // 탭 복귀 즉시 반영
  // 입력칸에서 빠져나오면 미뤄둔 갱신을 바로 반영 — 다음 확인 주기(30초)까지 기다리지 않는다.
  // focusout 직후에는 activeElement 가 아직 옛 값이라 한 틱 뒤에 확인한다.
  document.addEventListener('focusout', function(){ setTimeout(flushDeferredRender, 150); });
  // 이벤트에만 기대지 않는다 — 포커스 이동 경로가 다양하고(창 전환·프로그램적 blur 등)
  // 이벤트가 안 오는 경우가 실제로 있었다. 네트워크를 쓰지 않는 로컬 검사라 부담이 없다.
  setInterval(flushDeferredRender, 2000);
  setInterval(function(){
    if(syncBlocked()) return;
    // 캘린더는 시간당 1회 갱신이라 느린 루프로 충분하다(4.9KB 라 통째로 받아도 부담 없음).
    calendarReload();
    // 팀 공유 클라우드 안전망 동기화 (낚시 대기·코인·아이템·VOC편집·당번) — 바뀐 경우에만 재렌더
    syncCloudNow();
    // 안전망: HEAD 판별이 막혔거나(dataTagOk=false) 파일 크기가 우연히 같아
    // 위 빠른 루프가 못 잡은 변경을 여기서 확실히 받는다.
    if(dataTagOk['slack-data.js']===false) slackDataReload();
    if(activeCat==='menureg' && dataTagOk['menu-requests.js']===false) menuReqReload();
  }, SYNC_SLOW_MS);
}

// slack-data.js 의 날짜별 집계를 대시보드에 반영 (AS/온보딩은 슬랙이 원본 → 매 로드 시 해당 날짜 덮어씀)
function applySlackData(){
  const days=(window.SLACK_DATA&&window.SLACK_DATA.days)||{};
  for(const [date,entry] of Object.entries(days)){
    for(const [cat,obj] of Object.entries(entry.counts||{})){
      if(!COUNTS[cat]) COUNTS[cat]={};
      COUNTS[cat][date]=Object.assign({}, obj);
    }
  }
  save(LS_COUNT, COUNTS);
  if(typeof gameMe!=='undefined' && gameMe) recordMissLog(gameMe);   // 누락 이력 누적 기록(해결돼도 남도록 데이터 갱신 때마다)
}
// 선택한 날짜의 슬랙 집계 항목 (없으면 null)
function slackDay(date){ return (window.SLACK_DATA&&window.SLACK_DATA.days&&window.SLACK_DATA.days[date])||null; }
function allSlackDates(){ return (window.SLACK_DATA&&window.SLACK_DATA.days)?Object.keys(window.SLACK_DATA.days).sort():[]; }
// VOC 처리(완료)를 완료일(doneDate) 기준으로 집계 — 설문 원본 날짜와 무관
function vocDoneByDay(){ const map={}; allSlackDates().forEach(d=>{ const v=(slackDay(d)||{}).voc; if(!v)return; [...(v.alerts||[]),...(v.praises||[])].forEach(x=>{ const dd=vocDoneAt(d,x); if(vocEmpAt(d,x)&&vocCredited(dd)) map[dd]=(map[dd]||0)+1; }); }); return map; }
function vocDoneInRange(dates){ const set=new Set(dates); let cnt=0; const byEmp={}; allSlackDates().forEach(d=>{ const v=(slackDay(d)||{}).voc; if(!v)return; [...(v.alerts||[]),...(v.praises||[])].forEach(x=>{ const e=vocEmpAt(d,x), dd=vocDoneAt(d,x); if(e&&vocCredited(dd)&&set.has(dd)){ cnt++; byEmp[e]=(byEmp[e]||0)+1; } }); }); return {cnt, byEmp}; }

function seedShare(){
  const base=today();
  const add=(off,emp,type,title,time)=>{ const ds=ymd(addDays(base,off));
    if(!SHARE[ds])SHARE[ds]=[]; SHARE[ds].push({id:"seed"+off+emp.length+type,emp,type,title:title||"",time:time||""}); };
  add(0,"김기범","meeting","주간 파트 회의","10:00~11:00");
  add(0,"서상원","outside","거래처 방문","14:00~");
  add(1,"김규빈","annual","");
  add(1,"송태양","time","병원","15:00~17:00");
  add(2,"최민석","half","오후 반차");
  add(3,"김동욱","meeting","월간 리뷰","16:00~17:00");
  add(5,"배선유","annual","");
  add(-1,"심성현","outside","교육 참석");
  save(LS_SHARE, SHARE);
}

</script>
