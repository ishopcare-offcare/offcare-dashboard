function saveAdjust(){
  const err=document.getElementById('adjErr');
  const date=(document.getElementById('adjDate')||{}).value||'';
  const emp=(document.getElementById('adjEmp')||{}).value||'';
  const cat=(document.getElementById('adjCat')||{}).value||'';
  const n=parseInt((document.getElementById('adjNum')||{}).value,10);
  const why=((document.getElementById('adjWhy')||{}).value||'').trim();
  const pw=(document.getElementById('adjPw')||{}).value||'';
  if(pw!==ADMIN_PASS){ err.textContent='관리자 암호가 올바르지 않습니다.'; return; }
  if(!date||!emp||!cat){ err.textContent='날짜·담당자·카테고리를 모두 선택하세요.'; return; }
  if(!n || isNaN(n)){ err.textContent='건수는 0이 아닌 정수로 입력하세요.'; return; }
  if(!why){ err.textContent='보정 사유를 입력하세요. (표 하단과 처리상세에 공개됩니다)'; return; }
  const key=adjKey(date,emp,cat);                    // uid 포함 → 건별로 따로 쌓인다
  ADJUST[key]={n, why:why.slice(0,80), by:(typeof gameMe!=='undefined'&&gameMe)||'', at:new Date().toISOString().slice(0,16)};
  save(LS_ADJUST, ADJUST);
  pushPatch({adjust:{[key]: ADJUST[key]}});
  renderMain(); openAdjust();
}
function deleteAdjust(key){
  const pw=prompt('관리자 암호를 입력하세요 (보정 삭제)');
  if(pw===null) return;
  if(pw!==ADMIN_PASS){ alert('관리자 암호가 올바르지 않습니다.'); return; }
  delete ADJUST[key];
  save(LS_ADJUST, ADJUST);
  pushPatch({adjust:{[key]:''}});
  renderMain(); openAdjust();
}
function setCount(cat, date, emp, n){
  if(!COUNTS[cat]) COUNTS[cat]={};
  if(!COUNTS[cat][date]) COUNTS[cat][date]={};
  if(n>0) COUNTS[cat][date][emp]=n; else delete COUNTS[cat][date][emp];
  save(LS_COUNT, COUNTS);
}
function rangeDates(mode, refStr){
  if(mode==="custom"){
    const out=[]; let s=parseYmd(rangeStart), e=parseYmd(rangeEnd);
    if(e<s){ const t=s; s=e; e=t; }               // 뒤집혀 선택돼도 정상 처리
    for(let d=new Date(s); d<=e; d=addDays(d,1)) out.push(ymd(d));
    return out;
  }
  const ref = parseYmd(refStr); const out=[];
  if(mode==="day"){ out.push(refStr); }
  else if(mode==="week"){ const s=startOfWeek(ref); for(let i=0;i<7;i++) out.push(ymd(addDays(s,i))); }
  else { const y=ref.getFullYear(), m=ref.getMonth(), last=new Date(y,m+1,0).getDate();
    for(let i=1;i<=last;i++) out.push(ymd(new Date(y,m,i))); }
  return out;
}

function sumRange(cat, dates, emp){
  return dates.reduce((a,d)=>{
    if(emp) return a + getCount(cat,d,emp) + adjN(d,emp,cat);
    const day = COUNTS[cat] && COUNTS[cat][d] ? Object.values(COUNTS[cat][d]).reduce((x,y)=>x+y,0) : 0;
    return a + day + adjDay(cat,d);
  }, 0);
}

// 브라우저 prompt() 는 입력값이 그대로 보여서 type=password 모달을 직접 띄운다 → 비동기.
let pwResolve=null, pwExpect='';
function askPw(label, pw){
  return new Promise(resolve=>{
    if(pwResolve) pwResolve(false);            // 이미 떠 있으면 앞 요청은 취소 처리
    pwResolve=resolve; pwExpect=pw;
    document.getElementById('pwTitle').textContent=label;
    document.getElementById('pwErr').textContent='';
    const el=document.getElementById('pwInput'); el.value='';
    document.getElementById('pwOverlay').classList.add('show');
    // 여는 버튼이 포커스를 물고 있고 오버레이는 .25s 페이드 중이라 focus() 가 한 번에 안 먹을 때가 있다.
    // 실제로 들어갈 때까지 몇 프레임 재시도한다(사람이 첫 글자를 치기 전에 끝난다).
    if(document.activeElement && document.activeElement!==el) document.activeElement.blur();
    (function grab(n){
      el.focus();
      if(document.activeElement!==el && n>0) requestAnimationFrame(()=>grab(n-1));
    })(30);
  });
}
function pwClose(ok){
  document.getElementById('pwOverlay').classList.remove('show');
  document.getElementById('pwInput').value='';                // 입력값을 DOM 에 남기지 않는다
  const r=pwResolve; pwResolve=null; if(r) r(ok);
}
function pwSubmit(){
  const el=document.getElementById('pwInput');
  if(el.value===pwExpect){ pwClose(true); return; }
  document.getElementById('pwErr').textContent='비밀번호가 틀렸습니다.';
  el.value=''; el.focus();
}
function pwCancel(){ pwClose(false); }

const OCR_JUNK = /magic|pos|봉사료?|회원|히원|써스|승인|매출|합계|잔액|미수|거스름|카드|현금|신용|캐시|포인트|소계|인원|전달사항|부가기능|매장정보|영수증|배달|주문서|출력물|상품키|카테고리|순서편집|설정|할인|보이는|반영|테이블|결제|주문|점장|사업자|대표|전화|주소|과세|면세|소비자|포스|화면|메뉴판|추가메뉴|주류|식사류|^\s*사리\s*$|^\s*식사\s*$/i;
function ocrExtractMenu(text, store){
  const dig=t=>t.replace(/[^\d]/g,'');
  const isPrice=t=>/^\d{1,3}([.,]\d{3})+$|^\d{3,6}$/.test(t)&&+dig(t)>=300&&+dig(t)<=900000;
  const isSigg=t=>/^[(\[]?\s*(시가|싯가|시세)\s*[)\]]?$/.test(t);   // 가격 자리의 '시가' 는 상품명이 아니라 가격표기다
  const isName=t=>/[가-힣]/.test(t)&&t.replace(/[^가-힣]/g,'').length>=2&&!OCR_JUNK.test(t)&&!isSigg(t);
  const norm=t=>t.replace(/[|_~\-—ㅣ]/g,' ').replace(/\s+/g,' ').trim();
  const storeK=(store||'').replace(/[^가-힣]/g,'');
  const lines=String(text||'').split('\n').map(norm).filter(Boolean).filter(l=>!OCR_JUNK.test(l));
  const out=[], seen=new Set();
  const push=(n,p)=>{ n=n.replace(/[^가-힣0-9()]/g,'').trim();
    if(n.length<2||!/[가-힣]/.test(n))return;
    if(storeK&&(storeK.includes(n)||n.includes(storeK)))return;
    if(seen.has(n))return; seen.add(n);
    out.push(n+' | '+(p==='시가'?'시가':(p?(+dig(p)).toLocaleString('en-US'):''))); };
  for(let i=0;i<lines.length;i++){
    const toks=lines[i].split(' ').filter(Boolean);
    const names=toks.filter(isName), prices=toks.filter(isPrice);
    if(names.length&&prices.length&&names.length<=prices.length+1){ names.forEach((n,j)=>push(n,prices[j]||prices[prices.length-1])); continue; }
    if(names.length>=2&&prices.length===0&&i+1<lines.length){ const pt=lines[i+1].split(' ').filter(isPrice); if(pt.length>=2){ names.forEach((n,j)=>push(n,pt[j])); i++; continue; } }
    if(names.length&&prices.length===0){ const sg=toks.some(isSigg)?'시가':''; names.forEach(n=>push(n,sg)); }
  }
  return out.join('\n');
}

const MR_OPEN='([{（［｛【〔', MR_CLOSE=')]}）］｝】〕';
function menuregSplitVariants(name){
  const raw=String(name==null?'':name).trim();
  if(!/[\/／]/.test(raw)) return raw?[raw]:[];
  // 괄호 안의 '/' 는 나열이 아니다 — '아메리카노(핫/아이스)' 를 쪼개면 이름이 깨진다
  const parts=[]; let buf='', depth=0;
  for(let i=0;i<raw.length;i++){
    const ch=raw[i];
    if(MR_OPEN.includes(ch)) depth++;
    else if(MR_CLOSE.includes(ch)) depth=Math.max(0,depth-1);
    // 숫자 사이의 '/' 는 분수다 — '후라이드 1/2 마리' 를 쪼개면 안 된다
    const frac = /\d/.test(raw[i-1]||'') && /\d/.test(raw[i+1]||'');
    if((ch==='/'||ch==='／') && depth===0 && !frac){ parts.push(buf); buf=''; continue; }
    buf+=ch;
  }
  parts.push(buf);
  const seg=parts.map(s=>s.trim()).filter(Boolean);
  if(seg.length<2) return raw?[raw]:[];
  // '1/2 마리' 같은 분수·기호는 나열이 아니다 — 조각마다 글자가 2자 이상 있어야 나열로 본다
  const letters=s=>s.replace(/[^가-힣A-Za-z0-9]/g,'').length;
  if(!seg.every(s=>/[가-힣A-Za-z]/.test(s) && letters(s)>=2)) return [raw];
  // 반반 메뉴('순대반/수육반', '갈릭반/양념반')는 두 맛이 한 접시라 나누면 없는 메뉴가 생긴다.
  // 조각이 '반' 으로 끝나거나 이름에 '반반' 이 있으면 통째로 둔다.
  if(/반반/.test(raw) || seg.some(s=>/반$/.test(s))) return [raw];
  const head=seg[0].split(/\s+/), rest=seg.slice(1);
  const brand=head.slice(0,-1).join(' ');
  const brandCaps=/^[A-Z0-9&.'\- ]+$/.test(brand);       // 전부 대문자 라틴 = 브랜드 표기(SNAPPLE·JARRITOS)
  // 브랜드 전파는 뒤 조각이 '맛 이름'처럼 짧을 때만. 라틴 조각은 브랜드가 대문자일 때만 붙인다 —
  // 'Cheoeum Cheoreom / Saero' 를 'Cheoeum Saero' 로 만들면 없는 상품이 된다(처음처럼·새로는 다른 제품).
  const flavorLike=s=>!/\s/.test(s) && letters(s)<=5 && (/[가-힣]/.test(s) || brandCaps);
  if(head.length>=2 && rest.every(flavorLike)) return [seg[0], ...rest.map(v=>brand+' '+v)];
  return seg;
}
function menuregParseGrid(gridId){

/* 중복 정리 — POS 는 같은 상품명을 거부하거나 덮어쓰고, 바코드는 유일해야 등록된다.
 * 원본에 중복이 있으면 그대로 올려서 실패하지 않게 내보내는 시점에 정리한다.
 *   상품명 중복 → 두 번째부터 뒤에 '.' 을 붙여 구분 (누크바 / 누크바. / 누크바..)
 *   바코드 중복 → 두 번째부터 비운다 (첫 건만 바코드를 갖는다)
 * 그리드(원본)는 건드리지 않는다 — 매장이 보낸 값 그대로 보이는 게 검수에 낫다. */
let menuregDedupLast={name:0,bar:0};
function menuregDedupe(rows){
  const usedName=new Set(), usedBar=new Set();
  let nameFix=0, barClear=0;
  for(const r of rows){
    let nm=r.name;
    if(usedName.has(nm)){
      let k=1;
      do{ nm=r.name+'.'.repeat(k); k++; }while(usedName.has(nm));
      nameFix++;
    }
    usedName.add(nm); r.name=nm;
    if(r.bar){
      if(usedBar.has(r.bar)){ r.bar=''; barClear++; }
      else usedBar.add(r.bar);
    }
  }
  menuregDedupLast={name:nameFix, bar:barClear};
  return rows;
}

function menuregDl(name,blob){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
/* 양식을 내려받고 나면 변환란을 비운다.
 * menuregFillFromOcr 은 기존 내용 '뒤에 이어붙이는' 동작이라, 매장을 연달아 처리하면
 * 앞 매장 메뉴가 남아 다음 매장 양식에 섞여 들어갔다. 파일명에 쓰는 menuregXlName 도
 * 처음 값이 계속 남아 다른 매장 이름으로 저장되는 문제가 있었다.
 * 같은 매장의 다른 POS 양식을 이어서 받을 수도 있으므로 한 단계 되돌리기를 남겨둔다. */
let menuregXlUndo=null;
// 되돌리기 안내는 재렌더(매장 이동·탭 복귀)에도 살아남아야 한다.
// 안 그러면 탭을 옮긴 순간 비워지고 버튼도 같이 사라져 되살릴 방법이 없다.
function menuregUndoHTML(){
  if(!menuregXlUndo) return '';
  const n=String(menuregXlUndo.text||'').split('\n').filter(l=>l.trim()).length;
  return '🧹 '+escapeHtml(menuregXlUndo.name||'이전 매장')+' 내용 '+n+'줄을 비웠습니다. '
    +'<button class="btn" style="padding:2px 10px;font-size:12px;margin-left:4px" onclick="menuregUndoClear()">↩ 되돌리기</button>';
}
function menuregClearGrid(reason){
  const ta=document.getElementById('mrXlGrid');
  const prev=(ta?ta.value:menuregXlCache)||'';
  if(!prev.trim()) return false;
  menuregXlUndo={text:prev, name:menuregXlName};
  if(ta) ta.value='';
  menuregXlCache=''; menuregXlName='';
  const info=document.getElementById('mrXlInfo');
  if(info) info.innerHTML='🧹 '+escapeHtml(reason)+' — 변환란을 비웠습니다 (다음 매장과 섞이지 않도록). '
    +'<button class="btn" style="padding:2px 10px;font-size:12px;margin-left:4px" onclick="menuregUndoClear()">↩ 되돌리기</button>';
  return true;
}
function menuregUndoClear(){
  if(!menuregXlUndo) return;
  const ta=document.getElementById('mrXlGrid');
  if(ta) ta.value=menuregXlUndo.text;
  menuregXlCache=menuregXlUndo.text; menuregXlName=menuregXlUndo.name||'';
  menuregXlUndo=null;
  const info=document.getElementById('mrXlInfo');
  if(info) info.textContent='↩ 되돌렸습니다 — 같은 내용으로 다른 POS 양식도 받을 수 있습니다.';
}
async function menuregGen(pi,gridId){
  const P=MENUREG_POS[pi]; const rows=menuregParseGrid(gridId);
  if(!rows.length){ alert('메뉴 항목이 없습니다.\n한 줄당 "'+FMT_HINT+'" 형식입니다.\n뒤쪽 4칸은 없으면 생략해도 됩니다 (최소 "상품명 | 가격").\n가격이 정해지지 않은 상품은 가격 칸에 "시가" 라고 적으면 시가상품으로 넣습니다.'); return; }
  // 시가상품은 토스포스(가격 타입)·스파로스(싯가여부)에만 넣을 칸이 있다. 나머지 두 양식은
  // 어떤 값이 시가인지 확인되지 않아 임의로 채우지 않고, 0원으로 올린 뒤 손으로 바꾸도록 알린다.
  const sigg=rows.filter(r=>r.sigg);
  if(sigg.length && !P.cols.some(c=>MENUREG_HEAD.sigg.test(c))){
    alert('⚠ '+P.label+' 양식에는 시가 표시 칸이 없습니다.\n\n'
      + '아래 '+sigg.length+'개는 0원으로 내려갑니다 — POS 에 올린 뒤 시가상품으로 바꿔주세요.\n\n'
      + sigg.slice(0,15).map(r=>'· '+r.name).join('\n') + (sigg.length>15?'\n· … 외 '+(sigg.length-15)+'개':''));
  }
  const base=gridId==='mrXlGrid'?(menuregXlName||'엑셀변환'):((menuregItems().find(i=>i.ts===menuregSel)||{}).store||'매장');
  const safe=base.replace(/[\\/:*?"<>|]/g,'_');
  const aoa=menuregAoa(P,rows);
  // POS 업로드가 xlsx 만 받으므로 CSV 로는 내려주지 않는다.
  // 라이브러리를 못 불러오면 못 쓰는 CSV 를 주는 대신, 붙여넣기 경로를 안내한다.
  try{ await loadXlsxLib(); }
  catch(e){
    // 화면에 복사 버튼을 따로 두지 않으므로(엑셀 받기 하나로 통일), 여기서 바로 복사로 넘긴다.
    alert('❌ 엑셀 변환 라이브러리를 불러오지 못했습니다 (네트워크 차단 가능).\n\n'
      + 'POS 는 xlsx 만 받으므로 CSV 로는 내려드리지 않습니다.\n'
      + '대신 붙여넣기용 텍스트를 클립보드에 복사해 드릴 테니, 공식 양식 파일에 붙여넣어 주세요.');
    menuregCopy(pi, gridId);
    return;
  }
  const ws=XLSX.utils.aoa_to_sheet(aoa);                      // 문자열로 넣은 칸은 그대로 텍스트 셀이 된다
  for(let c=0;c<P.cols.length;c++){                            // 열 서식도 텍스트로(재편집·붙여넣기 대비)
    if(!MENUREG_TEXTCOL.test(P.cols[c])) continue;
    for(let r=(P.header?1:0); r<aoa.length; r++){
      const ref=XLSX.utils.encode_cell({r,c}); if(ws[ref]) ws[ref].z='@';
    }
  }
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'상품등록');
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  menuregDl(P.key+'_업로드_'+safe+'.xlsx', new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  // 라이브러리 실패로 복사 경로를 탄 경우는 위에서 이미 return 했고, 거기서 menuregCopy 가 비운다.
  const cleared=menuregClearGrid(P.label+' 양식을 내려받았습니다');
  alert((P.note?'⚠️ '+P.note:'✅ '+P.label+' 양식 '+rows.length+'행을 xlsx 로 내려받았습니다.')+menuregDedupMsg()
    +(cleared?'\n\n🧹 변환란을 비웠습니다 — 다음 매장 메뉴와 섞이지 않습니다.\n같은 매장으로 다른 POS 양식도 받으려면 화면의 [↩ 되돌리기] 를 누르세요.':''));
}
// 붙여넣기용 TSV(탭 구분) — 엑셀 양식의 데이터 첫 행 첫 칸에 Ctrl+V 하면 컬럼에 맞게 들어감
function menuregTsv(pi,gridId){
  const P=MENUREG_POS[pi]; const rows=menuregParseGrid(gridId);
  if(!rows.length) return null;
  return rows.map(r=>{ const o=Object.assign({},P.defaults||{},P.row(r)); return P.cols.map(h=>String(o[h]!==undefined?o[h]:'').replace(/[\t\n]/g,' ')).join('\t'); }).join('\n');
}
function menuregCopy(pi,gridId){
  const t=menuregTsv(pi,gridId);
  if(!t){ alert('메뉴 항목이 없습니다.\n한 줄당 "'+FMT_HINT+'" 형식입니다.'); return; }
  const P=MENUREG_POS[pi];
  // 복사도 '이 매장 작업을 끝냈다'는 뜻이라 내려받기와 똑같이 변환란을 비운다.
  // (안 비우면 앞 매장 메뉴가 남아 다음 매장 양식에 섞인다) 되돌리기는 그대로 제공.
  const clearMsg=()=>{
    const cleared=menuregClearGrid(P.label+' 양식용 텍스트를 복사했습니다');
    return cleared?'\n\n🧹 변환란을 비웠습니다 — 다음 매장 메뉴와 섞이지 않습니다.\n같은 매장으로 다른 POS 양식도 만들려면 화면의 [↩ 되돌리기] 를 누르세요.':'';
  };
  const done=()=>alert('📋 '+P.label+' 양식용 텍스트 복사 완료!\n\n엑셀 양식을 열고 데이터 시작 행'+(P.key==='스파로스포스'?'(스파로스는 4행)':'(헤더 아래 첫 행)')+'의 첫 칸 클릭 → 붙여넣기(Ctrl+V) 하면 컬럼에 맞게 들어갑니다.'+(P.note?'\n\n⚠️ '+P.note:'')+menuregDedupMsg()+clearMsg());
  // 자동 복사가 막힌 환경(권한·비보안 컨텍스트)에서는 직접 복사하도록 창을 띄운 뒤 비운다.
  const manual=()=>{ prompt('자동 복사 실패 — 아래를 전체선택(Ctrl+A)·복사(Ctrl+C) 하세요:',t); const m=clearMsg(); if(m) alert(m.trim()); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,manual);
  else manual();
}
// ── 📂 매장 엑셀 업로드 → 메뉴 추출 → POS 양식 변환 ──────────────────────
let menuregXlName='', menuregXlCache='', xlsxLibP=null;
function loadXlsxLib(){   // SheetJS 지연 로드 (업로드 시에만)
  if(window.XLSX) return Promise.resolve();
  if(xlsxLibP) return xlsxLibP;
  xlsxLibP=new Promise((res,rej)=>{ const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=res; s.onerror=()=>{ xlsxLibP=null; rej(new Error('변환 라이브러리 로드 실패 — 네트워크 확인')); };
    document.head.appendChild(s); });
  return xlsxLibP;
}
/* ── 워드류 문서에서 표/문단을 뽑아 엑셀과 같은 rows 형태로 만든다 ──────────────
 * docx·hwpx·odt 는 전부 ZIP + XML 이라 브라우저 기본 기능만으로 열 수 있다(외부 라이브러리 불필요).
 * hwp(한글 바이너리 5.0)는 OLE 복합문서 + raw deflate 라, xlsx 용으로 이미 불러온 SheetJS 의
 * CFB 파서를 재사용해 BodyText 스트림을 꺼낸 뒤 문단 텍스트 레코드만 읽는다. */
async function inflateRaw(u8){
  if(typeof DecompressionStream==='undefined') throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다');
  const ds=new DecompressionStream('deflate-raw');
  const buf=await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(buf);
}
// ZIP 중앙 디렉터리를 읽어 {파일명: 바이트} 로 — 필요한 항목만 푼다
async function unzip(ab, wanted){
  const dv=new DataView(ab), u8=new Uint8Array(ab);
  let eo=-1;
  for(let i=u8.length-22;i>=0 && i>u8.length-66000;i--) if(dv.getUint32(i,true)===0x06054b50){ eo=i; break; }
  if(eo<0) throw new Error('ZIP 구조를 읽지 못했습니다');
  const n=dv.getUint16(eo+10,true); let p=dv.getUint32(eo+16,true);
  const out={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nlen));
    p+=46+nlen+elen+clen;
    if(!wanted(name)) continue;
    const lnlen=dv.getUint16(lho+26,true), lelen=dv.getUint16(lho+28,true);
    const start=lho+30+lnlen+lelen, raw=u8.subarray(start,start+csize);
    out[name]= method===0 ? raw : await inflateRaw(raw);
  }
  return out;
}
// "아메리카노 4,500" 처럼 한 줄에 이름+가격이 붙은 문단을 두 칸으로 쪼갠다
function splitNamePrice(s){
  const m=String(s||'').trim().match(/^(.+?)[\s.·:]+([\d][\d,\.]{2,})\s*원?$/);
  return m ? [m[1].trim(), m[2]] : [String(s||'').trim()];
}
// XML 문자열 → {tables, paras}. 표와 표 밖 문단을 섞지 않는다 —
// 섞으면 표 헤더로 잡은 컬럼 위치에 문단 행이 끼어들어 문단 쪽이 통째로 버려진다.
function xmlToRows(xml, tag){
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const tables=[], paras=[], seen=new Set();
  const txt=(el)=>Array.from(el.getElementsByTagName('*'))
    .filter(n=>n.localName===tag.text).map(n=>n.textContent).join('').replace(/\s+/g,' ').trim();
  for(const tr of Array.from(doc.getElementsByTagName('*')).filter(n=>n.localName===tag.row)){
    const cells=Array.from(tr.getElementsByTagName('*')).filter(n=>n.localName===tag.cell).map(txt);
    if(cells.some(Boolean)){ tables.push(cells); cells.forEach(c=>seen.add(c)); }
  }
  for(const p of Array.from(doc.getElementsByTagName('*')).filter(n=>n.localName===tag.para)){
    const t=txt(p); if(t && !seen.has(t)) paras.push(splitNamePrice(t));
  }
  return {tables, paras};
}
// 한글 바이너리(.hwp) — 본문 스트림의 문단 텍스트 레코드(HWPTAG_PARA_TEXT=67)만 읽는다
async function hwpToRows(ab){
  if(!window.XLSX || !XLSX.CFB) throw new Error('한글 파일 해석기를 불러오지 못했습니다');
  const cfb=XLSX.CFB.read(new Uint8Array(ab),{type:'array'});
  const head=cfb.FileIndex.find(f=>/FileHeader/i.test(f.name));
  const compressed = head ? !!(head.content[36] & 1) : true;      // FileHeader 플래그: 압축 여부
  const lines=[];
  for(const f of cfb.FileIndex){
    if(!/Section\d+/i.test(f.name||'')) continue;
    let data=new Uint8Array(f.content);
    if(compressed){ try{ data=await inflateRaw(data); }catch(e){ continue; } }
    const dv=new DataView(data.buffer,data.byteOffset,data.byteLength);
    let o=0;
    while(o+4<=data.length){
      const h=dv.getUint32(o,true), tag=h&0x3ff; let size=(h>>20)&0xfff; o+=4;
      if(size===0xfff){ size=dv.getUint32(o,true); o+=4; }
      if(o+size>data.length) break;
      if(tag===67){                                               // 문단 텍스트(UTF-16LE)
        let s='';
        for(let i=0;i+1<size;i+=2){ const c=dv.getUint16(o+i,true);
          if(c===13||c===10){ s+='\n'; } else if(c>=32) s+=String.fromCharCode(c); }
        s.split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>lines.push(x));
      }
      o+=size;
    }
  }
  if(!lines.length) throw new Error('본문 텍스트를 찾지 못했습니다 (구버전 .hwp 이거나 암호가 걸린 파일일 수 있습니다)');
  return {tables:[], paras:lines.map(splitNamePrice)};
}
async function docToRows(file){
  const ext=(file.name.match(/\.[A-Za-z0-9]+$/)||[''])[0].toLowerCase();
  const ab=await file.arrayBuffer();
  if(ext==='.docx'){
    const z=await unzip(ab,n=>n==='word/document.xml');
    if(!z['word/document.xml']) throw new Error('word/document.xml 이 없습니다');
    return xmlToRows(new TextDecoder().decode(z['word/document.xml']), {row:'tr',cell:'tc',para:'p',text:'t'});
  }
  if(ext==='.hwpx'){
    const z=await unzip(ab,n=>/^Contents\/section\d+\.xml$/i.test(n));
    const names=Object.keys(z); if(!names.length) throw new Error('Contents/section0.xml 이 없습니다');
    const all={tables:[],paras:[]};
    names.sort().forEach(n=>{ const r=xmlToRows(new TextDecoder().decode(z[n]), {row:'tr',cell:'tc',para:'p',text:'t'});
      all.tables.push(...r.tables); all.paras.push(...r.paras); });
    return all;
  }
  if(ext==='.odt'){
    const z=await unzip(ab,n=>n==='content.xml');
    if(!z['content.xml']) throw new Error('content.xml 이 없습니다');
    return xmlToRows(new TextDecoder().decode(z['content.xml']), {row:'table-row',cell:'table-cell',para:'p',text:'span'});
  }
  if(ext==='.hwp') return await hwpToRows(ab);
  return null;   // 엑셀 계열 → 기존 경로
}
/* 매장이 보내는 파일에는 이름·가격 말고도 바코드·제조사·상품코드·재고가 함께 오는 경우가 많다.
 * 그리드 한 줄 형식을 확장해 그대로 나른다(뒤쪽은 없으면 생략 — 기존 3칸 형식도 그대로 동작):
 *   분류 | 상품명 | 가격 | 바코드 | 제조사 | 상품코드 | 재고 */
const MENUREG_HEAD = {
  name:  /메뉴\s*(이름|명)?$|상품\s*(이름|명)|제품\s*(이름|명)|품명|^이름$/,
  price: /가격|판매가|판매단가|단가|금액|소비자가|소비자|출고가|공급가|정가|매가/,
  cat:   /분류|카테고리|category/i,
  bar:   /바코드|barcode|bar\s*code/i,
  maker: /제조사|제조업체|메이커|브랜드|공급사|거래처|maker/i,
  code:  /상품코드|제품코드|품목코드|자체코드|sku/i,
  // '입수' 는 박스당 개수라 재고가 아니다(사용자 확인) — 넣으면 전 품목이 같은 수량으로 잡힌다
  stock: /재고|현재수량|초기재고|수량$/,
  // 시가(가격 미정) 상품 표시 — 점주 파일에 '시가/싯가' 로 적혀 온다
  sigg:  /시가|싯가|시세/,
};
function menuregXlExtract(rows){
  const norm=(c)=>String(c==null?'':c).replace(/\s+/g,' ').trim();   // 헤더 셀에 줄바꿈이 흔하다('소비자가\n(EA)')
  // 1) 헤더 행 탐지 — 이름 + 가격이 같은 행에 있으면 그 행을 헤더로 본다
  let col={}, headerRow=-1;
  for(let r=0;r<Math.min(rows.length,15);r++){
    const cells=(rows[r]||[]).map(norm);
    const ni=cells.findIndex(c=>MENUREG_HEAD.name.test(c));
    const pi2=cells.findIndex(c=>MENUREG_HEAD.price.test(c));
    if(ni>-1&&pi2>-1){
      col={name:ni, price:pi2};
      for(const k of ['cat','bar','maker','code','stock']){ const i=cells.findIndex(c=>MENUREG_HEAD[k].test(c)); if(i>-1&&i!==ni&&i!==pi2) col[k]=i; }
      headerRow=r; break;
    }
  }
  const out=[]; let curCat='메뉴';
  const pick=(row,i)=>i===undefined?'':norm(row[i]);
  const digits=(v)=>parseInt(String(v).replace(/[^0-9]/g,''),10)||0;
  for(let r=(headerRow>-1?headerRow+1:0); r<rows.length; r++){
    const row=rows[r]||[]; if(!row.length) continue;
    let name='', price=0, cat='', bar='', maker='', code='', stock='', sigg=false;
    if(headerRow>-1){                                   // 컬럼 매핑 방식
      name=pick(row,col.name);
      const rawP=pick(row,col.price);
      sigg=MENUREG_HEAD.sigg.test(rawP);                // 가격 칸에 '시가' 라고 적어 보내는 경우
      price=digits(rawP);
      const c=pick(row,col.cat); if(c) curCat=c;
      bar=pick(row,col.bar).replace(/[^0-9A-Za-z\-]/g,'');
      maker=pick(row,col.maker); code=pick(row,col.code);
      const st=pick(row,col.stock); stock = st && /^\d+$/.test(st.replace(/[^0-9]/g,'')) ? String(digits(st)) : '';
    }else{                                              // 휴리스틱: 첫 텍스트=이름, 첫 금액(100~)=가격
      const texts=[], nums=[];
      for(const cv of row){ const s=norm(cv); if(!s) continue;
        if(/^[\d,\.\s원₩]+$/.test(s)){ const n=digits(s); if(n>=100&&n<10000000) nums.push(n); }
        else if(/[가-힣a-zA-Z]/.test(s)) texts.push(s);
      }
      name=texts[0]||''; price=nums[0]||0;
      // 가격 없는 단독 텍스트 행 = 카테고리 구분. 단 '제조사: 전체(사용)' 같은 라벨 문구는 제외 —
      // 표 위쪽 제목/설명이 카테고리로 잡혀 전 품목에 붙는 사고가 있었다.
      if(name&&!price&&texts.length===1&&name.length<=20&&!/[:：]/.test(name)){ curCat=name.replace(/[\[\]<>【】]/g,''); continue; }
    }
    // 가격 대신 '시가/싯가' 만 적힌 칸이 따로 있는 경우도 시가상품으로 본다(상품명 칸은 제외 — 이름이 '시가' 인 상품도 있다)
    if(!sigg && !price) sigg=row.some((cv)=>norm(cv)!==name&&/^[(\[]?\s*(시가|싯가|시세)\s*[)\]]?$/.test(norm(cv)));
    if(!name||(!price&&!sigg)||name.length>50) continue;
    // 'SNAPPLE 애플 / 망고' 같은 나열은 여기서 맛별로 펼친다 — 그리드에 펼쳐진 채로 보여야 검수가 된다.
    // 이름 안의 '|' 는 칸 구분자라 뺀다. '/' 가 아니라 '·' 로 바꾼다(바꿔놓고 다시 나열로 읽으면 안 된다).
    for(const nm of menuregSplitVariants(name)){
      const cells=[(curCat||'메뉴'), nm.replace(/\|/g,'·'), sigg?'시가':String(price), bar, maker.replace(/\|/g,'·'), code, stock];
      while(cells.length>3 && !cells[cells.length-1]) cells.pop();   // 뒤쪽 빈 칸은 떼고 저장
      out.push(cells.join(' | '));
    }
  }
  return out;
}
async function menuregXlUpload(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const info=document.getElementById('mrXlInfo'); if(info) info.textContent='⏳ 변환 중...';
  try{
    const ext=(f.name.match(/\.[A-Za-z0-9]+$/)||[''])[0].toLowerCase();
    let lines=[];
    if(ext==='.hwp') await loadXlsxLib();          // 한글 바이너리는 SheetJS 의 CFB 파서를 쓴다
    const docRows=await docToRows(f);             // 워드류(docx·hwpx·odt·hwp)
    if(docRows){
      // 표와 문단을 따로 뽑아 합친다(표 헤더 매핑이 문단 행을 삼키지 않도록). 같은 항목은 한 번만.
      const seen=new Set();
      for(const part of [docRows.tables, docRows.paras]){
        if(!part.length) continue;
        for(const l of menuregXlExtract(part)) if(!seen.has(l)){ seen.add(l); lines.push(l); }
      }
    }else{                                        // 엑셀 계열(xlsx·xls·csv)
      await loadXlsxLib();
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      for(const sn of wb.SheetNames) lines.push(...menuregXlExtract(XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''})));
    }
    if(!lines.length){ if(info) info.textContent='❌ 메뉴 항목을 찾지 못했습니다 — 파일에 메뉴명·가격이 있는지 확인해주세요.'; return; }
    menuregXlName=f.name.replace(/\.(xlsx?|csv|docx|hwpx?|odt)$/i,'');
    menuregXlCache=lines.join('\n');
    const ta=document.getElementById('mrXlGrid'); if(ta) ta.value=menuregXlCache;
    if(info) info.textContent='✅ '+f.name+' → '+lines.length+'개 항목 추출 — 검수 후 복사/다운로드하세요';
  }catch(e){ if(info) info.textContent='❌ 변환 실패: '+e.message; }
  input.value='';
}

/* 판독 결과 전부를 아래 '양식 변환' 그리드로 옮긴다.
 * 사진을 10장 넘게 나눠 올리는 매장(또래오래 파파빈 등)은 카드마다 복사하기가 번거롭다.
 * 사진 사이에 같은 항목이 겹치는 일이 많아 완전히 같은 줄은 한 번만 넣는다.
 * 기존 그리드 내용이 있으면 덮지 않고 뒤에 이어붙인다. */
/* 판독 결과 [{category,name,price}] → 변환란 줄('분류 | 상품명 | 가격'). 반환: 가격 미판독 수.
 * 맛별로 펼친다 — 'JARRITOS 자몽 / 구아바 / 망고' 가 한 줄로 오는 경우가 많다.
 * 이름 안의 '|' 는 칸 구분자라 '·' 로 바꾼다('/' 로 바꾸면 다시 나열로 읽힌다). */
function menuregPushMenu(menu, lines, seen){
  let noPrice=0;
  for(const m0 of menu) for(const vName of menuregSplitVariants(String(m0.name||'').replace(/\|/g,'·'))){
    const name=String(vName||'').replace(/\|/g,'/').trim(); if(!name) continue;
    const cat=String(m0.category||'').replace(/\|/g,'/').trim()||'메뉴';
    const price=Number(m0.price)||0;
    const key=cat+' '+name+' '+price;
    if(seen.has(key)) continue; seen.add(key);
    if(!price) noPrice++;
    lines.push(cat+' | '+name+' | '+(price||''));
  }
  return noPrice;
}
/* ── 🖼 사진·PDF → 텍스트 변환 (즉시 판독) ──────────────────────────────────
 * 슬랙·메일로 들어오지 않은 사진(카톡으로 받은 메뉴판, 화면 캡처 등)을 바로 변환란에 넣는다.
 * 판독은 menu-ocr.gs(Apps Script 웹 앱)가 한다 — 이 페이지는 공개라 API 키를 여기 둘 수 없다.
 * 팀 암호는 선택 — 서버에 TEAM_CODE 가 있을 때만 처음 한 번 묻고 이 브라우저에 기억한다. */
const MENU_OCR_API = "https://script.google.com/macros/s/AKfycbzsBTjqxtP-dZrL2Q1yt-Q-AtyD50g0s9k1-q95rTyL8sQdG8iOjKJBTVTNYv4eRAMJEQ/exec";   // menu-ocr.gs 웹 앱 배포 URL (…/exec)
const LS_MENUOCR_CODE = "opcare_menuocr_code_v1";
let menuregOcrBusy=false;
function menuregBlobB64(blob){ return new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]||''); r.onerror=()=>no(new Error('파일을 읽지 못했습니다')); r.readAsDataURL(blob); }); }
// 사진은 JPEG 로 다시 굽는다 — 폰 원본(10MB)·PNG 캡처는 API 상한(5MB)을 넘기 쉽다.
// 긴 변은 2400px 로 줄이되, 세로로 긴 스크롤 캡처는 줄이면 글자가 뭉개져 API 상한(8000px) 가까이 둔다.
async function menuregPrepImage(f){
  if(f.type==='application/pdf'){ if(f.size>4.8*1048576) throw new Error('PDF가 5MB를 넘습니다'); return {mime:f.type, data:await menuregBlobB64(f)}; }
  let bmp;
  try{ bmp=await createImageBitmap(f); }
  catch(e){ throw new Error(/heic|heif/i.test((f.type||'')+(f.name||''))?'아이폰 HEIC 사진은 브라우저에서 열 수 없습니다 — jpg로 저장해 올려주세요':'이미지를 열 수 없습니다'); }
  const long=Math.max(bmp.width,bmp.height), ratio=long/Math.max(1,Math.min(bmp.width,bmp.height));
  const s=Math.min(1,(ratio>2.5?7800:2400)/long);
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
  let q=0.88, blob;
  do{ blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q)); q-=0.15; }while(blob&&blob.size>4.5*1048576&&q>0.3);
  if(!blob) throw new Error('이미지 변환 실패');
  return {mime:'image/jpeg', data:await menuregBlobB64(blob)};
}
async function menuregOcrCall(p, retried){
  // 암호는 서버에 TEAM_CODE 가 설정된 경우에만 필요하다 — 먼저 저장된 값(없으면 빈 값)으로 보내 보고,
  // 서버가 bad_code 라고 하면 그때 묻는다.
  const code=localStorage.getItem(LS_MENUOCR_CODE)||'';
  const r=await fetch(MENU_OCR_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({code,mime:p.mime,data:p.data})});
  let d=null; const t=await r.text(); try{ d=JSON.parse(t); }catch(e){ throw new Error('판독 서버 응답 오류'); }
  if(d.error==='bad_code'){
    localStorage.removeItem(LS_MENUOCR_CODE);
    if(retried) throw new Error('암호가 맞지 않습니다 — 다시 올리면 새로 묻습니다');
    const c=(prompt('🔑 사진 판독 팀 암호를 입력하세요 (처음 한 번만 묻습니다)')||'').trim();
    if(!c) throw new Error('암호를 입력하지 않았습니다');
    localStorage.setItem(LS_MENUOCR_CODE,c);
    return menuregOcrCall(p, true);
  }
  if(!d.ok) throw new Error(d.error||'판독 실패');
  return d;
}
async function menuregOcrFiles(fileList){
  const files=[...(fileList||[])].filter(f=>/^image\/|^application\/pdf$/.test(f.type)||/\.(heic|heif|pdf)$/i.test(f.name||''));
  if(!files.length) return;
  if(!MENU_OCR_API){ alert('사진 판독 서버가 아직 연결되지 않았습니다.\nmenu-ocr.gs 를 웹 앱으로 배포한 뒤 URL을 MENU_OCR_API 에 넣어야 합니다.'); return; }
  if(menuregOcrBusy){ alert('앞서 올린 사진을 판독하는 중입니다. 끝난 뒤 다시 올려주세요.'); return; }
  menuregOcrBusy=true;
  const say=t=>{ const el=document.getElementById('mrXlInfo'); if(el) el.textContent=t; };
  // 변환란에 이미 있는 줄은 다시 넣지 않는다(같은 사진을 두 번 올리거나 슬랙 판독분과 겹칠 때)
  const ta0=document.getElementById('mrXlGrid');
  const seen=new Set((ta0?ta0.value:menuregXlCache).split('\n').map(l=>{ const p=l.split('|').map(x=>x.trim()); return p.length>=2?(p[0]||'메뉴')+' '+p[1]+' '+(Number(String(p[2]||'').replace(/,/g,''))||0):''; }).filter(Boolean));
  const lines=[], fails=[], empty=[]; let noPrice=0, got=0;
  try{
    for(const [i,f] of files.entries()){
      const nm=f.name&&f.name!=='image.png'?f.name:'붙여넣은 이미지';
      say(`⏳ 사진 판독 중 ${i+1}/${files.length} — ${nm} (장당 10~30초)`);
      try{
        const d=await menuregOcrCall(await menuregPrepImage(f));
        if(!(d.items||[]).length) empty.push(nm); else { got+=d.items.length; noPrice+=menuregPushMenu(d.items, lines, seen); }
      }catch(e){ fails.push(nm+': '+e.message); if(/암호/.test(e.message)) break; }
    }
  }finally{ menuregOcrBusy=false; }
  const ta=document.getElementById('mrXlGrid');   // 판독하는 동안 화면이 다시 그려졌을 수 있다 — 새로 찾는다
  const cur=((ta?ta.value:menuregXlCache)||'').trim();
  if(lines.length){
    menuregXlCache = cur ? cur+'\n'+lines.join('\n') : lines.join('\n');
    if(ta) ta.value=menuregXlCache;
    if(!menuregXlName){ const s=menuregItems().find(x=>x.ts===menuregSel); menuregXlName=(s&&s.store)||String(files[0].name||'매장').replace(/\.[A-Za-z0-9]+$/,''); }
  }
  say((lines.length?`✅ 사진 ${files.length-fails.length-empty.length}장에서 ${lines.length}개를 옮겼습니다`+(cur?' (기존 내용 뒤에 추가)':''):(got?`ℹ️ 판독한 ${got}개가 모두 변환란에 이미 있습니다`:'❌ 옮길 메뉴를 찾지 못했습니다'))
    +(noPrice?` · 가격 미판독 ${noPrice}개는 가격을 채워야 변환됩니다`:'')
    +(empty.length?` · 메뉴 목록이 아닌 사진 ${empty.length}장`:'')
    +(fails.length?` · 실패 ${fails.length}장 (${fails.join(' / ').slice(0,200)})`:'')
    +(lines.length?' — 원본과 대조해 검수하세요':''));
  if(ta&&lines.length){ ta.scrollIntoView({behavior:'smooth',block:'center'}); }
}

/* ================= 🔐 관리 — 파트리더 전용 리포트 =================
 * 주의: 이 대시보드는 공개 저장소로 배포된다. 아래 비밀번호는 소스보기로 보이므로

 * 데이터는 전부 대시보드 자체 집계(slack-data.js)로만 만든다. 원격 시트는 사람이 편집해
 * 오염이 잦아 쓰지 않기로 했다. 상세(done·시각)는 2026-07-01 부터 쌓이므로 월별 이력은
 * 그 달부터 시작하고 달이 지날수록 자동으로 늘어난다.
 */

  {k:'workday', n:'근무일·1일 평균',   ic:'📆'},

/* ── 라이브 데이터 헬퍼 ── */
// 처리 상세(done)가 실제로 있는 날짜만. 6월은 날짜 키만 있고 내용이 비어 있어 자동 제외된다
// 처리 상세(done)나 설치 OB 가 실제로 있는 날만. 6월은 날짜 키만 있고 내용이 비어 있어 자동 제외된다
function adminLiveDates(){
  return allSlackDates().filter(d => { const y=slackDay(d)||{};
    return (y.done||[]).length>0 || obCntRaw([d])>0; });
}
function adminDates(){
  const all = adminLiveDates();
  if(adminRange==='all') return all;
  if(adminRange==='range'){
    if(!adminStart||!adminEnd) return all;
    const [s,e] = adminStart<=adminEnd ? [adminStart,adminEnd] : [adminEnd,adminStart];  // 거꾸로 골라도 동작하게
    return all.filter(d => d>=s && d<=e);
  }
  return all.slice(-Number(adminRange));   // 최근 N '일' 은 데이터가 있는 날 기준(빈 날은 애초에 빠져 있다)
}
// 관리탭 전 화면의 공통 항목 목록 = 슬랙 처리 상세 + 설치 OB
function adminItems(dates){
  const out=[];
  for(const d of dates) for(const x of ((slackDay(d)||{}).done||[])) out.push({date:d, ...x});
  return out.concat(obAsDone(dates));
}

// 모르는 유형은 'etc'. 예전에는 'extern' 으로 떨궜는데 그건 외주의 키라 외주 건수에 조용히 섞였다.

function admCatKey(x){ return x.cat==='voc' ? 'voc' : (ADM_CATS.some(c=>c.key===x.cat) ? x.cat : ETC_CAT.key); }
const ADM_H0=8, ADM_H1=23;                                   // 표에 세울 시간대. 밖은 '기타' 로 모은다
const ADM_HOURS = Array.from({length:ADM_H1-ADM_H0+1},(_,i)=>ADM_H0+i);
function hourOf(t){ const m=/^(\d{1,2}):/.exec(t||''); return m?Number(m[1]):null; }
const ADMIN_RANGES = [{v:'7',n:'최근 7일'},{v:'30',n:'최근 30일'},{v:'all',n:'전체'},{v:'range',n:'기간'}];
function adminRangeSeg(){
  return ADMIN_RANGES.map(r=>`<button class="${adminRange===r.v?'on':''}" onclick="setAdminRange('${r.v}')">${r.n}</button>`).join('');
}
// 표·카드의 '조회 기간' 문구
function adminRangeLabel(){
  if(adminRange==='all') return '전체 기간';
  if(adminRange==='range'){ const d=adminDates(); return d.length?periodRangeText(d):'선택 기간(데이터 없음)'; }

function setAdminRange(v){

function setAdminEnd(v){ adminRange='range'; adminEnd=v; renderAdmin(); }

/* ── DRI 정·부 담당 (업무 카테고리별) ──
 * 플랫 딕셔너리로 둔다("as|main" → 이름). mergeCloudDict 가 평면 키만 병합하므로
 * 중첩 객체로 두면 타 브라우저 값과 합쳐질 때 통째로 덮인다. 해제는 ''(묘비). */
const LS_DRI = "opcare_dri_v1";
let DRI = load(LS_DRI, {});
// 온보딩·AS 는 전담 DRI 가 없어 제외하고, VOC 를 넣는다
const DRI_CATS = [
  ...WORK_CATS.filter(c=>c.key!=='onboarding' && c.key!=='as'),
  {key:'voc', name:'VOC', icon:'💬', color:'#ff2d55'},
  OB_CAT,                                   // 설치 OB 도 정·부를 지정해 처리량을 본다
];
const DRI_ROLES = [{k:'main', n:'정'}, {k:'sub1', n:'부1'}, {k:'sub2', n:'부2'}];
function driGet(cat, role){
  let v=DRI[cat+'|'+role];
  if((v===undefined||v==='') && role==='sub1') v=DRI[cat+'|sub'];   // 부가 1명이던 시절의 키 호환
  return (typeof v==='string'?v:'').trim();
}
// 카테고리별 담당자 처리 건수. VOC 는 done[] 에 없고 완료일 기준으로 따로 집계된다
function driCounts(catKey, dates){
  if(catKey==='voc') return vocDoneInRange(dates).byEmp || {};
  if(catKey==='ob')  return obByEmpRaw(dates);          // 시트의 확인 담당자 기준
  const by={};
  for(const d of dates) for(const x of ((slackDay(d)||{}).done||[]))
    if(x.cat===catKey && x.emp) by[x.emp]=(by[x.emp]||0)+1;
  return by;
}
function driSet(cat, role, name){
  DRI[cat+'|'+role] = name||'';
  save(LS_DRI, DRI);
  pushPatch({dri:{[cat+'|'+role]: name||''}});
  renderAdmin();
}

/* ── 월별 집계 (대시보드 자체 데이터) ──
 * 시트는 사람이 편집해 오염이 잦아 쓰지 않는다. 전체현황과 같은 소스(COUNTS/sumRange)로 계산해
 * 관리 화면 숫자가 공개 화면과 어긋나지 않게 한다. 이력은 데이터가 쌓인 달부터 자동으로 늘어난다. */
function admMonths(){
  return [...new Set(allSlackDates().filter(d=>((slackDay(d)||{}).done||[]).length>0).map(d=>d.slice(0,7)))].sort();
}
// 평일(토·일 아니고 공휴일도 아닌 날) 여부 — 근무일 수·1일 평균의 기준
function admIsBizDay(ds){
  const dt=parseYmd(ds), w=dt.getDay();
  return w!==0 && w!==6 && !HOLIDAYS[ds];
}
// 그 달에 '평일이면서 공휴일이 아닌' 날 수. 진행 중인 달은 마지막 데이터 날짜까지만 센다(경과 평일)
function admBizDays(m, upto){
  const [y,mo]=m.split('-').map(Number), last=new Date(y,mo,0).getDate();
  const end = upto ? Number(upto.slice(8,10)) : last;
  let n=0;
  for(let d=1; d<=Math.min(last,end); d++){
    const dt=new Date(y,mo-1,d), w=dt.getDay();
    if(w===0||w===6) continue;
    if(HOLIDAYS[ymd(dt)]) continue;
    n++;
  }
  return n;
}
/* 2026년 상반기(1~6월) 월간 리포트 수치 — 대시보드 집계(2026-07-01~) 이전 구간이라

// 리포트 행을 라이브 행과 같은 모양으로 맞춘다(평일 수는 달력에서 계산 — 1일 평균 비교용)
function admHistRows(){
  // total 은 라이브 행과 기준을 맞춰 '실 처리 건수'(done)를 쓴다.
  // 라이브의 total 은 처리 건수 합이라, 리포트의 '원격 인입 건수'를 넣으면 같은 열에 인입/처리가 섞인다.
  // 인입 값은 intake 로 따로 남겨 전월 비교 탭에서 쓴다.
  return ADM_HIST.map(h=>Object.assign({}, h, {hist:true, days:0, biz:admBizDays(h.m),
    intake:h.total, total:h.done, bizCnt:h.done, emps:0, ob:0, voc:h.by.voc||0}));

// 온·오프라인 월별 · 온보딩·AS 월별 두 탭이 함께 쓴다.
function admMonthlyWithHist(){
  const live=admMonthly(), have=new Set(live.map(r=>r.m));
  return admHistRows().filter(r=>!have.has(r.m)).concat(live);
}
function admHistNote(rows){

    <b>2026.07</b> 부터는 <b>대시보드 집계</b>(전체현황과 동일 소스) · 이력 <b>${first.m.replace('-','.')} ~ ${last.m.replace('-','.')}</b>
    ${last.days&&last.days<20?`<br>⚠️ <b>${last.m.replace('-','.')}</b> 는 진행 중(평일 ${last.biz}일)이라 총 건수는 아직 작습니다 — <b>1일 평균</b>으로 보세요.`:''}</div>`;

function admMonthly(){
  const all=adminLiveDates();
  return admMonths().map(m=>{
    const ds=all.filter(d=>d.startsWith(m));
    const bizDs=ds.filter(admIsBizDay);
    const by={}; let total=0;
    for(const c of WORK_CATS){ const n=sumRange(c.key, ds); by[c.key]=n; total+=n; }
    by.ob=obCntRaw(ds); total+=by.ob;                        // 설치 OB 도 총 건수에 넣는다
    // 평일에 처리된 건수 — 총 건수와의 차이가 곧 주말·공휴일(당직) 처리분
    const bizCnt=WORK_CATS.reduce((a,c)=>a+sumRange(c.key, bizDs), 0)+obCntRaw(bizDs);
    // 인입유형 미상은 온라인으로 합산 — 전체현황과 같은 팀 정책
    const ik=ds.reduce((a,d)=>{ const k=(slackDay(d)||{}).intake||{}; a.online+=(k.online||0)+(k.unknown||0); a.offline+=k.offline||0; return a; },{online:0,offline:0});
    const emps=new Set();
    ds.forEach(d=>{ for(const o of Object.values((slackDay(d)||{}).counts||{})) Object.keys(o).forEach(e=>emps.add(e)); });
    Object.keys(obByEmpRaw(ds)).forEach(e=>emps.add(e));      // 설치 OB 만 한 담당자도 활동 인원에 넣는다
    // VOC 처리(완료일 기준)·부재는 WORK_CATS 에 없어 따로 센다 — 온·오프라인 탭의 유형별 행에 쓴다.
    // ovShift 에 좌우되지 않도록 pending 을 직접 세고, sumRange 와 같은 기준(주야 구분 없음)을 유지한다.
    const absent=ds.reduce((a,d)=>a+((slackDay(d)||{}).pending||[]).filter(p=>(p.reasons||[]).some(r=>/부재/.test(r))).length, 0);
    return {m, days:ds.length, biz:admBizDays(m, ds[ds.length-1]), bizCnt, by, total, online:ik.online, offline:ik.offline, emps:emps.size,
            voc:vocDoneInRange(ds).cnt, absent};
  });
}

/* ── 탭 1. 담당자 개인별 시간대별 처리추이 ── */
function admHourly(){
  const dates=adminDates(), items=adminItems(dates);
  if(!items.length) return `<div class="empty-note">해당 기간에 처리 상세가 없습니다.</div>`;
  const nd = dates.length || 1;
  // 담당자 × 시간대
  const grid={}, hourTot={}, etcBy={};
  for(const x of items){
    const e=x.emp||'(미지정)', h=hourOf(x.time);
    grid[e]=grid[e]||{};
    if(h===null||h<ADM_H0||h>ADM_H1){ etcBy[e]=(etcBy[e]||0)+1; }
    else { grid[e][h]=(grid[e][h]||0)+1; hourTot[h]=(hourTot[h]||0)+1; }
  }
  const rows=Object.keys(grid).map(e=>{
    const cells=ADM_HOURS.map(h=>grid[e][h]||0);
    const etc=etcBy[e]||0;
    return {emp:e, cells, etc, total:cells.reduce((a,b)=>a+b,0)+etc};
  }).sort((a,b)=>b.total-a.total);
  const mx=Math.max(1,...rows.flatMap(r=>r.cells));
  const colTot=ADM_HOURS.map(h=>hourTot[h]||0);
  const etcTot=Object.values(etcBy).reduce((a,b)=>a+b,0);
  const grand=rows.reduce((a,r)=>a+r.total,0);

  const table=`<div style="overflow-x:auto"><table class="matrix hm">
    <thead><tr><th>담당자</th>${ADM_HOURS.map(h=>`<th class="num">${h}</th>`).join('')}<th class="num">기타</th><th class="num">합계</th><th class="num">1일<br>평균</th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr>
      <td class="emp-name emp-click" onclick="showDoneDetail('emp','${r.emp}')" title="🔎 ${escapeHtml(r.emp)}님 처리 내역">${medal(i)} ${escapeHtml(r.emp)}</td>
      ${r.cells.map(n=>`<td class="num mcell" style="${n>0?`background:${hexA('#0071e3',0.06+n/mx*0.42)}`:''}">${n||'<span class="zero">·</span>'}</td>`).join('')}
      <td class="num mcell">${r.etc||'<span class="zero">·</span>'}</td>
      <td class="num tot">${r.total}</td>
      <td class="num" style="font-weight:700;color:var(--gray2)">${(r.total/nd).toFixed(1)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>합계</td>${colTot.map(n=>`<td class="num">${n}</td>`).join('')}<td class="num">${etcTot}</td><td class="num tot">${grand}</td><td class="num">${(grand/nd).toFixed(1)}</td></tr></tfoot>
  </table></div>`;

  const obN=items.filter(x=>x._ob).length;
  return `<div class="adm-note">기간 <b>${dates[0]} ~ ${dates[dates.length-1]}</b> · 실데이터 <b>${nd}일</b> · 총 <b>${grand}건</b>
    · 셀 색이 진할수록 그 시간대 처리량이 많습니다 · <b>기타</b>는 ${ADM_H0}시 이전·${ADM_H1}시 이후 건입니다.
    ${obN?`<br>📞 <b>설치 OB ${obN}건</b> 포함 — 시트에 확인 시각이 없어 <b>접수 시각</b> 자리에 넣었습니다(건수는 정확, 시간대만 접수 기준).`:''}</div>
    <div class="card"><div class="card-head"><h3>담당자 × 시간대 처리량</h3><span class="hint">1일 평균 = 합계 ÷ ${nd}일</span></div>${table}</div>
    <div class="card"><div class="card-head"><h3>시간대별 유형 구성</h3>
      <span class="hint">전 담당자 합산 · 배달·설치 OB 처럼 건수가 적은 유형은 <b>유형별 따로</b>로 보세요</span></div>
      ${hourStackChart(items)}</div>`;
}
/* 시간대(가로) × 유형(누적) 막대.
 * 고정 780px 라 카드 안에서 작게 눌려 유형 구분이 안 보였다. viewBox + width:100% 로 카드 폭을
 * 꽉 채우고 세로도 키웠다. 눈금선·구분 간격·조각 안 숫자를 넣어 어떤 유형이 얼마인지 바로 읽히게 한다.
 * '비율' 모드는 시간대마다 100% 로 맞춰, 건수가 적은 시간대의 구성비도 볼 수 있게 한다. */
let admStackMode = 'cnt';        // 'cnt' 누적 건수 | 'pct' 시간대별 100% 비율 | 'each' 유형별 따로
function setAdmStack(m){ admStackMode=m; renderAdmin(); }
/* 유형별 따로 보기 — 누적 막대에서는 AS 가 3분의 2를 차지해 배달·설치 OB 같은 소수 유형이
 * 실오라기처럼 깔려 안 보인다. 유형마다 자기 최대값에 맞춰 따로 그리면 전부 읽힌다.
 * 대신 유형끼리 높이를 비교하면 안 되므로 각 칸에 자기 최대 건수를 적어 둔다. */
function hourEachChart(byHour, cats, tot, grand){
  const W=380, H=150, padL=8, padR=8, topPad=16, botPad=26;
  const base=H-botPad, plotH=H-topPad-botPad, step=(W-padL-padR)/ADM_HOURS.length;
  const barW=Math.min(18, step*0.72);
  const cell=cats.map(c=>{
    const vals=ADM_HOURS.map(h=>(byHour[h]||{})[c.key]||0);
    const mx=Math.max(1,...vals);
    const pi=vals.indexOf(mx), peak=ADM_HOURS[pi];   // 같은 최댓값이 여러 시간대면 첫 번째만 표시한다
    const bars=ADM_HOURS.map((h,i)=>{
      const v=vals[i], x=padL+i*step+(step-barW)/2;
      if(!v) return `<rect x="${x.toFixed(1)}" y="${base-2}" width="${barW.toFixed(1)}" height="2" rx="1" style="fill:var(--line-soft)"/>`;
      const bh=Math.max(3,(v/mx)*plotH), y=base-bh;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="2.5" fill="${c.color}"${i===pi?' opacity="1"':' opacity="0.82"'}>`
        + `<title>${h}시 · ${c.name} ${v}건</title></rect>`
        + (i===pi?`<text x="${(x+barW/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" style="fill:var(--ink)">${v}</text>`:'');
    }).join('');
    const xlab=ADM_HOURS.map((h,i)=> h%3===0
      ? `<text x="${(padL+i*step+step/2).toFixed(1)}" y="${base+15}" text-anchor="middle" font-size="10.5" font-weight="600" style="fill:var(--muted)">${h}</text>` : '').join('');
    return `<div style="border:1px solid var(--line-soft);border-radius:12px;padding:12px 12px 6px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px">
        <span style="font-size:13.5px;font-weight:800;color:var(--ink)">
          <span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${c.color};margin-right:6px"></span>${c.name}</span>
        <span style="font-size:12px;color:var(--gray2)">${(tot[c.key]||0).toLocaleString()}건 · ${Math.round((tot[c.key]||0)/grand*100)}%</span></div>
      <div style="font-size:11.5px;color:var(--muted);margin-bottom:2px">최다 <b style="color:var(--ink-soft)">${peak}시 ${mx}건</b></div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">
        <line x1="${padL}" y1="${base}" x2="${W-padR}" y2="${base}" style="stroke:var(--line)"/>${bars}${xlab}</svg></div>`;
  }).join('');
  return `<div class="adm-note" style="margin-bottom:14px">유형마다 <b>자기 최대값에 맞춰</b> 따로 그렸습니다 — 한 칸 안에서 시간대끼리는 비교되지만,
      <b>칸끼리 막대 높이를 비교하면 안 됩니다</b>(총 건수는 각 칸 오른쪽 위에 적어 뒀습니다).</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px">${cell}</div>`;
}
function hourStackChart(items){
  const byHour={}, tot={};
  for(const x of items){
    const h=hourOf(x.time); if(h===null||h<ADM_H0||h>ADM_H1) continue;
    const k=admCatKey(x);
    byHour[h]=byHour[h]||{}; byHour[h][k]=(byHour[h][k]||0)+1;
    tot[k]=(tot[k]||0)+1;
  }
  const cats=[...ADM_CATS, ETC_CAT].filter(c=>tot[c.key]>0);        // 건수 있는 유형만 그린다
  const colTot=ADM_HOURS.map(h=>Object.values(byHour[h]||{}).reduce((a,b)=>a+b,0));
  const grand=colTot.reduce((a,b)=>a+b,0);
  if(!grand) return `<div class="empty-note">${ADM_H0}~${ADM_H1}시 사이에 그릴 데이터가 없습니다.</div>`;
  const pct = admStackMode==='pct';
  const toggle=`<div class="seg" style="margin-bottom:14px">
    <button class="${admStackMode==='cnt'?'on':''}" onclick="setAdmStack('cnt')">누적 건수</button>
    <button class="${admStackMode==='pct'?'on':''}" onclick="setAdmStack('pct')">비율 100%</button>
    <button class="${admStackMode==='each'?'on':''}" onclick="setAdmStack('each')">유형별 따로</button></div>`;
  if(admStackMode==='each') return toggle+hourEachChart(byHour, cats, tot, grand);

  const W=1180, H=480, padL=64, padR=28, topPad=40, botPad=58;
  const base=H-botPad, plotH=H-topPad-botPad, plotW=W-padL-padR;
  const step=plotW/ADM_HOURS.length, barW=Math.min(62, step*0.70), off=(step-barW)/2;

  // Y축 — 눈금이 어중간한 숫자로 끊기지 않게 올림한다
  const niceMax=(v)=>{ const p=Math.pow(10,Math.floor(Math.log10(v)||0)); for(const k of [1,1.5,2,2.5,3,4,5,6,8,10]) if(v<=k*p) return k*p; return 10*p; };
  const yMax = pct ? 100 : niceMax(Math.max(1,...colTot));
  const TICKS=5;
  const grid=Array.from({length:TICKS+1},(_,i)=>{
    const v=yMax*i/TICKS, y=base-(v/yMax)*plotH;
    return `<line x1="${padL-10}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" style="stroke:var(--line-soft)"${i?' stroke-dasharray="3 5"':''}/>`
      + `<text x="${padL-18}" y="${(y+5).toFixed(1)}" text-anchor="end" font-size="14" style="fill:var(--muted)">${pct?v+'%':Math.round(v).toLocaleString()}</text>`;
  }).join('');

  const bars=ADM_HOURS.map((h,i)=>{
    const x=padL+i*step+off, t=colTot[i];
    const hourLabel=`<text x="${(x+barW/2).toFixed(1)}" y="${base+24}" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--gray2)">${h}</text>`;
    if(!t) return `<rect x="${x.toFixed(1)}" y="${base-3}" width="${barW.toFixed(1)}" height="3" rx="1.5" style="fill:var(--line-soft)"/>`+hourLabel;
    const denom = pct ? t : yMax;
    let y=base; const segs=[];
    for(const c of cats){
      const v=(byHour[h]||{})[c.key]||0; if(!v) continue;
      const sh=(v/denom)*plotH; y-=sh;
      const p=Math.round(v/t*100);
      // 조각 사이를 2px 비워 색이 붙어 보이지 않게 한다
      segs.push(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1.5,sh-2).toFixed(1)}" rx="3" fill="${c.color}">`
        + `<title>${h}시 · ${c.name} ${v}건 (${p}%)</title></rect>`);
      if(sh>=24) segs.push(`<text x="${(x+barW/2).toFixed(1)}" y="${(y+sh/2+5).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" style="pointer-events:none">${pct?p+'%':v}</text>`);
    }
    return segs.join('')
      + `<text x="${(x+barW/2).toFixed(1)}" y="${(y-9).toFixed(1)}" text-anchor="middle" font-size="14.5" font-weight="800" style="fill:var(--ink)">${pct?t:t.toLocaleString()}</text>`
      + hourLabel;
  }).join('');

  // 범례에 유형별 총 건수·비중을 같이 적어, 색만 보고 되짚지 않아도 되게 한다
  const legend=`<div class="legend">${cats.map(c=>`<span><span class="swatch" style="background:${c.color}"></span>${c.name}
    <b style="color:var(--ink);font-weight:800">${(tot[c.key]||0).toLocaleString()}</b>
    <small style="color:var(--muted)">${Math.round((tot[c.key]||0)/grand*100)}%</small></span>`).join('')}</div>`;

  return toggle
    + `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;min-height:300px" preserveAspectRatio="xMidYMid meet">
        ${grid}<line x1="${padL-10}" y1="${base}" x2="${W-padR}" y2="${base}" style="stroke:var(--line)" stroke-width="1.5"/>${bars}
        <text x="${padL-18}" y="${topPad-14}" text-anchor="end" font-size="13" font-weight="700" style="fill:var(--muted)">${pct?'비중':'건'}</text>
        <text x="${W-padR}" y="${base+46}" text-anchor="end" font-size="13" style="fill:var(--muted)">시(時)</text>
      </svg></div>`
    + legend;
}

/* ── 탭 2. DRI별 정·부 개인별 처리추이 ── */
function admDri(){
  const dates=adminDates();
  const editor=`<div class="dri-grid">${DRI_CATS.map(c=>{
    const opt=(sel)=>`<option value="">—</option>`+EMPLOYEES.map(e=>`<option value="${e}"${e===sel?' selected':''}>${e}</option>`).join('');
    return `<div class="dri-cell"><div class="dc-h">${c.icon} ${c.name}</div>
      ${DRI_ROLES.map(r=>`<label>${r.n} <select onchange="driSet('${c.key}','${r.k}',this.value)">${opt(driGet(c.key,r.k))}</select></label>`).join('')}</div>`;
  }).join('')}</div>`;

  const mapped=DRI_CATS.filter(c=>DRI_ROLES.some(r=>driGet(c.key,r.k)));
  if(!mapped.length){
    return `<div class="adm-note">카테고리별 <b>정담당 1명 · 부담당 2명</b>을 지정하면 아래에 처리량 비교가 그려집니다.
      지정 내용은 <b>팀 전체에 공유</b>되고 담당이 바뀌면 여기서 바로 바꾸면 됩니다.
      <b>온보딩·AS</b>는 전담 DRI 가 없어 제외했습니다.</div>${editor}
      <div class="empty-note">아직 지정된 DRI 가 없습니다. 위에서 카테고리별 정·부를 선택해 주세요.</div>`;
  }
  const rows=mapped.map(c=>{
    const by=driCounts(c.key, dates);
    const total=Object.values(by).reduce((a,b)=>a+b,0);
    // 같은 사람이 정·부에 중복 지정돼도 한 번만 센다 (정 > 부1 > 부2 우선)
    const used=new Set();
    const take=n=>{ if(!n||used.has(n)) return 0; used.add(n); return by[n]||0; };
    const names=DRI_ROLES.map(r=>driGet(c.key,r.k));
    const v=names.map(take);
    return {c, names, v, o:Math.max(0,total-v.reduce((a,b)=>a+b,0)), t:total};
  });
  // 카테고리 카드 안에 담당자별로 한 줄씩 — 이름·건수·비중 막대를 한 눈에 붙여 놓는다
  const ROLE_C=['#0071e3','#34c759','#5e5ce6'];
  const cards=`<div class="dri-res">${rows.map(r=>{
    const pct=n=>r.t?Math.round(n/r.t*100):0;
    const line=(badge,color,name,val)=>`<div class="dr-row">
      <span class="dr-badge" style="background:${name?color:'var(--muted)'}">${badge}</span>
      <div>
        <div class="dr-nm${name?'':' none'}">${name?escapeHtml(name):'미지정'}</div>
        <div class="dr-bar">${(name&&val>0)?`<i style="width:${pct(val)}%;background:${color}"></i>`:''}</div>
      </div>
      <div class="dr-v">${name?`<b style="color:${color}">${val.toLocaleString()}</b><small>${pct(val)}%</small>`
                             :'<b style="color:var(--muted)">—</b>'}</div></div>`;
    const share=r.t?Math.round(r.v.reduce((a,b)=>a+b,0)/r.t*100):0;
    return `<div class="dri-card">
      <div class="dr-h"><span class="dr-t">${r.c.icon} ${r.c.name}</span>
        <span class="dr-s">총 ${r.t.toLocaleString()}건 · 정+부 <b style="color:${share>=70?'var(--green)':share>=40?'var(--ink)':'var(--red)'}">${share}%</b></span></div>
      ${DRI_ROLES.map((role,i)=>line(role.n, ROLE_C[i], r.names[i], r.v[i])).join('')}
      <div class="dr-etc">${line('기타','#c7c7cc','그 외 담당자',r.o)}</div>
    </div>`;
  }).join('')}</div>`;
  // 정·부1·부2·그 외 4계열 묶음 막대
  const chart=(function(){
    const g=[{n:'정담당',c:'#0071e3',f:r=>r.v[0]},{n:'부담당1',c:'#34c759',f:r=>r.v[1]},
             {n:'부담당2',c:'#5e5ce6',f:r=>r.v[2]},{n:'그 외',c:'#c7c7cc',f:r=>r.o}];
    const barW=16, barGap=4, groupGap=30, padL=24, padR=18, topPad=22, botPad=42;
    const groupW=g.length*barW+(g.length-1)*barGap;
    const W=Math.max(420, padL+padR+rows.length*groupW+(rows.length-1)*groupGap), H=250, base=H-botPad, plotH=H-topPad-botPad;
    const mx=Math.max(1,...rows.flatMap(r=>g.map(x=>x.f(r))));
    const body=rows.map((r,gi)=>{
      const gx=padL+gi*(groupW+groupGap);
      const bars=g.map((x,bi)=>{
        const v=x.f(r), bx=gx+bi*(barW+barGap);
        if(v<=0) return `<rect x="${bx}" y="${base-2}" width="${barW}" height="2" rx="1" style="fill:var(--line-soft)"/>`;
        const h=v/mx*plotH, y=base-h;
        return `<rect x="${bx}" y="${y.toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" rx="2.5" fill="${x.c}"><title>${r.c.name} · ${x.n} ${v}건</title></rect>`
          + `<text x="${bx+barW/2}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" style="fill:var(--ink-soft)">${v}</text>`;
      }).join('');
      return bars+`<text x="${gx+groupW/2}" y="${base+20}" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--ink)">${r.c.name}</text>`;
    }).join('');
    return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
      <line x1="${padL-8}" y1="${base}" x2="${W-padR}" y2="${base}" style="stroke:var(--line)"/>${body}</svg></div>
      <div class="legend">${g.map(x=>`<span><span class="swatch" style="background:${x.c}"></span>${x.n}</span>`).join('')}</div>`;
  })();
  return `<div class="adm-note">기간 <b>${dates[0]} ~ ${dates[dates.length-1]}</b> · 지정 내용은 팀 전체에 공유됩니다.
    <b>그 외</b>는 정·부가 아닌 담당자가 처리한 건으로, 이 값이 크면 DRI 가 실제와 다르다는 뜻입니다.
    <b>온보딩·AS</b>는 전담 DRI 가 없어 제외했고, <b>VOC</b>는 확인 담당자·완료일 기준,
    <b>설치 OB</b>는 시트 확인 담당자·접수일 기준으로 셉니다.</div>
    ${editor}
    <div class="card"><div class="card-head"><h3>카테고리별 정·부 처리량</h3><span class="hint">${adminRangeLabel()} · 막대는 그 카테고리 안에서의 비중</span></div>${cards}</div>
    <div class="card"><div class="card-head"><h3>정 · 부 · 그 외 비교</h3></div>${chart}</div>`;
}

/* ── 탭 3. 전월 업무 비교표 (주간/야간 따로) ── */
/* 리포트(1~6월) 달의 전월 비교 — 주/야 구분이 없어 '전체' 한 블록으로 낸다.
 * 증감은 라이브와 같은 기준(1일 평균끼리)으로 계산한다. 1월은 전월(2025.12)이 없어 '—'. */
function admHistPrevBlock(cur, histMonths){
  const H=m=>ADM_HIST.find(h=>h.m===m);
  const a=H(cur), i=histMonths.indexOf(cur), pm=i>0?histMonths[i-1]:null, b=pm?H(pm):null;
  const ad=admBizDays(cur)||1, bd=pm?(admBizDays(pm)||1):1;
  const per=(n,d)=>(n/d).toFixed(1);
  const dl=(x,y)=>{ if(!b) return '<span class="zero">—</span>';
    if(!y) return x?'<span style="color:var(--green);font-weight:700">신규</span>':'<span class="zero">—</span>';
    const p=Math.round((x-y)/y*100);
    return `<span style="color:${p>0?'var(--green)':p<0?'var(--red)':'var(--gray2)'};font-weight:700">${p>0?'▲':p<0?'▼':''}${Math.abs(p)}%</span>`; };
  const line=(label,ax,bx,strong)=>`<tr><td>${label}</td>
    <td class="num"${strong?' style="font-weight:800"':''}>${ax.toLocaleString()}</td>
    <td class="num" style="font-weight:800">${per(ax,ad)}</td>
    <td class="num" style="color:var(--gray2)">${b?bx.toLocaleString():'—'}</td>
    <td class="num" style="color:var(--gray2);font-weight:800">${b?per(bx,bd):'—'}</td>
    <td class="num">${dl(ax/ad, b?bx/bd:0)}</td></tr>`;
  // 리포트 표의 유형별 순서 그대로. 설치 OB 는 리포트에 없다.
  const ROWS=[['🚀 온보딩','onboarding'],['🔧 AS','as'],['🧩 외주설치','extern'],['📝 명의변경','transfer'],
              ['💬 VOC','voc'],['🍱 메뉴등록','menu'],['🛵 배달','delivery']];
  const rowsH=ROWS.map(([n,k])=>line(n, a.by[k]||0, b?(b.by[k]||0):0)).join('')
    + line('📵 부재', a.absent||0, b?(b.absent||0):0);
  return `<div class="card"><div class="card-head">
      <h3>📄 전체 — ${cur.replace('-','.')} vs ${pm?pm.replace('-','.'):'전월 없음'}</h3>
      <span class="hint">월간 리포트 수치 · 주/야 구분 없음 · 평일 ${ad}일 / 전월 평일 ${pm?bd+'일':'—'}</span></div>
    <div style="overflow-x:auto"><table class="matrix">
      <thead><tr><th>유형</th>
        <th class="num">${cur.replace('-','.')}<br><span style="font-weight:600;color:var(--muted)">건수</span></th>
        <th class="num">${cur.replace('-','.')}<br>1일 평균</th>
        <th class="num">${pm?pm.replace('-','.'):'전월'}<br><span style="font-weight:600;color:var(--muted)">건수</span></th>
        <th class="num">${pm?pm.replace('-','.'):'전월'}<br>1일 평균</th>
        <th class="num">1일 평균<br>증감</th></tr></thead>
      <tbody>${rowsH}</tbody>
      <tfoot>${line('원격 인입 건수', a.total, b?b.total:0, true)}${line('실 처리 건수', a.done, b?b.done:0, true)}</tfoot>
    </table></div></div>`;
}
function admPrevMonth(){
  const withData=adminLiveDates();
  const liveMonths=[...new Set(withData.map(d=>d.slice(0,7)))].sort();
  const histMonths=ADM_HIST.map(h=>h.m).filter(m=>!liveMonths.includes(m));
  const months=[...histMonths, ...liveMonths];
  if(months.length<1) return `<div class="empty-note">처리 상세 데이터가 없습니다.</div>`;
  const cur = adminMonth && months.includes(adminMonth) ? adminMonth : months[months.length-1];
  const pick=`<div class="seg">${months.map(m=>`<button class="${m===cur?'on':''}" onclick="setAdminMonth('${m}')">${m.replace('-','.')}${histMonths.includes(m)?'<span style="font-size:10px;opacity:.65"> 리포트</span>':''}</button>`).join('')}</div>`;
  if(histMonths.includes(cur)){
    return `<div class="adm-note">📄 <b>${cur.replace('-','.')}</b> 은 월간 리포트 수치입니다 — 건별 상세가 없어 <b>주/야 구분은 불가</b>하고 '전체' 한 표로 보여줍니다.
        주/야 비교는 <b>2026.07</b> 이후 달을 고르세요.</div>${pick}${admHistPrevBlock(cur, histMonths)}`;
  }
  // 라이브 달의 전월은 '직전 라이브 달' 만 쓴다 — 리포트 달과는 주/야 기준이 달라 비교하면 전부 급감으로 보인다.
  const ci = liveMonths.indexOf(cur), prev = ci>0 ? liveMonths[ci-1] : null;

  const agg = (mm, night) => {
    if(!mm) return null;
    const o={}; let n=0, days=new Set();
    // 설치 OB 포함(adminItems). OB 는 확인 시각이 없어 접수 시각으로 주/야를 가른다.
    for(const x of adminItems(withData.filter(d=>d.startsWith(mm)))){
      if(isNightTime(x.time)!==night) continue;
      o[admCatKey(x)]=(o[admCatKey(x)]||0)+1; n++; days.add(x.date);
    }
    return {by:o, total:n, days:days.size};
  };
  const block = (night) => {
    const a=agg(cur,night), b=agg(prev,night);
    // 분모는 관리 페이지 공통 기준인 '평일 수'(토·일·공휴일 제외, 진행 중인 달은 경과분)
    const lastOf=mm=>{ const l=withData.filter(d=>d.startsWith(mm)); return l[l.length-1]; };
    const ad=admBizDays(cur, lastOf(cur))||1, bd=(prev?admBizDays(prev, lastOf(prev)):0)||1;
    // 진행 중인 달은 날짜 수가 달라 '건수' 증감이 무의미하다(8월 4일치 vs 7월 30일치 → 전부 ▼94%).
    // 증감은 반드시 1일 평균끼리 비교한다.
    const dl=(x,y)=>{ if(b===null) return '<span class="zero">—</span>';
      if(!y) return x?'<span style="color:var(--green);font-weight:700">신규</span>':'<span class="zero">—</span>';
      const p=Math.round((x-y)/y*100);
      return `<span style="color:${p>0?'var(--green)':p<0?'var(--red)':'var(--gray2)'};font-weight:700">${p>0?'▲':p<0?'▼':''}${Math.abs(p)}%</span>`; };
    const per=(n,d)=>(n/d).toFixed(1);
    const line=(label,ax,bx)=>`<tr><td>${label}</td>
      <td class="num">${ax}</td><td class="num" style="font-weight:800">${per(ax,ad)}</td>
      <td class="num" style="color:var(--gray2)">${b?bx:'—'}</td><td class="num" style="color:var(--gray2);font-weight:800">${b?per(bx,bd):'—'}</td>
      <td class="num">${dl(ax/ad, b?bx/bd:0)}</td></tr>`;
    // 미상 유형이 있는 달에만 기타 행을 붙인다 — 없으면 빈 행이 늘 남는다
    const rowCats=[...ADM_CATS, ...((a.by.etc||(b&&b.by.etc))?[ETC_CAT]:[])];
    const rowsH=rowCats.map(c=>line(`${c.icon} ${c.name}`, a.by[c.key]||0, b?(b.by[c.key]||0):0)).join('');
    return `<div class="card"><div class="card-head">
        <h3>${night?'🌙 야간':'☀️ 주간'} — ${cur.replace('-','.')} vs ${prev?prev.replace('-','.'):'전월 없음'}</h3>
        <span class="hint">${night?NIGHT_FROM+' 이후':NIGHT_FROM+' 이전'} 처리 건 · 평일 ${ad}일 / 전월 평일 ${prev?bd+'일':'—'}</span></div>
      <div style="overflow-x:auto"><table class="matrix">
        <thead><tr><th>유형</th>
          <th class="num">${cur.replace('-','.')}<br><span style="font-weight:600;color:var(--muted)">건수</span></th>
          <th class="num">${cur.replace('-','.')}<br>1일 평균</th>
          <th class="num">${prev?prev.replace('-','.'):'전월'}<br><span style="font-weight:600;color:var(--muted)">건수</span></th>
          <th class="num">${prev?prev.replace('-','.'):'전월'}<br>1일 평균</th>
          <th class="num">1일 평균<br>증감</th></tr></thead>
        <tbody>${rowsH}</tbody>
        <tfoot>${line('합계', a.total, b?b.total:0)}</tfoot>
      </table></div></div>`;
  };
  const curDays=withData.filter(d=>d.startsWith(cur)).length;
  const isPartial = cur===months[months.length-1] && curDays<20;
  const warn = !prev
    ? `<div class="adm-note">⚠️ <b>${cur.replace('-','.')}</b> 앞에 비교할 달이 없습니다.
       대시보드 처리 상세는 <b>7/1부터</b> 쌓여서 그 이전 달은 주/야 구분이 불가능합니다. 월별 총량은 시트 기반 탭을 보세요.</div>`
    : (isPartial ? `<div class="adm-note">⚠️ <b>${cur.replace('-','.')}</b> 은 아직 <b>${curDays}일</b>치입니다.
       건수를 그대로 비교하면 날짜 수 차이 때문에 전부 급감으로 보이므로, 증감은 <b>1일 평균끼리</b> 계산했습니다.
       분모는 <b>평일 수</b>(토·일·공휴일 제외)입니다.</div>` : '');
  return `<div class="adm-note">기준 시각 <b>${NIGHT_FROM}</b> — 그 이후 처리 건을 야간으로 봅니다. 조회할 달을 고르세요.</div>
    ${pick}${warn}${block(false)}${block(true)}`;
}

/* ── 탭 4~6. 월별 리포트 (대시보드 자체 데이터) ── */
// 월 묶음 막대. 달 수가 적어도(현재 2개) 읽히도록 라인 대신 막대를 쓴다
function monthBarChart(labels, series, fmt){
  const f = fmt || (v=>Number(v).toLocaleString());
  const barW=52, barGap=8, groupGap=46, padL=26, padR=20, topPad=28, botPad=40;
  const groupW=series.length*barW+(series.length-1)*barGap;
  const W=Math.max(420, padL+padR+labels.length*groupW+(labels.length-1)*groupGap);
  const H=280, base=H-botPad, plotH=H-topPad-botPad;
  const mx=Math.max(1,...series.flatMap(s=>s.v.map(Number)));
  const groups=labels.map((lab,gi)=>{
    const gx=padL+gi*(groupW+groupGap);
    const bars=series.map((s,bi)=>{
      const v=Number(s.v[gi])||0, bx=gx+bi*(barW+barGap);
      if(v<=0) return `<rect x="${bx}" y="${base-2}" width="${barW}" height="2" rx="1" style="fill:var(--line-soft)"/>`;
      const h=v/mx*plotH, y=base-h;
      return `<rect x="${bx}" y="${y.toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" rx="3" fill="${s.c}"><title>${lab} · ${s.n} ${f(v)}</title></rect>`
        + `<text x="${bx+barW/2}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" style="fill:${s.c}">${f(v)}</text>`;
    }).join('');
    return bars+`<text x="${gx+groupW/2}" y="${base+20}" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:var(--ink)">${lab}</text>`;
  }).join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
      <line x1="${padL-8}" y1="${base}" x2="${W-padR}" y2="${base}" style="stroke:var(--line)"/>${groups}</svg></div>
    <div class="legend">${series.map(s=>`<span><span class="swatch" style="background:${s.c}"></span>${s.n}</span>`).join('')}</div>`;
}
// 월별 수치표 — 각 계열의 1일 평균을 같이 보여준다(진행 중인 달과 끝난 달을 나란히 비교하려면 필수)
/* 월별 수치 표. rows 항목에 {group:'라벨'} 을 넣으면 그 자리에 구간 머리행이 들어간다. */
function monthTable(labels, series, rows){
  const n=labels.length;
  const years=[...new Set(labels.map(l=>String(l).split('.')[0]))];
  const oneYear=years.length===1;                       // 같은 해면 '01월' 로 짧게 쓰고 연도는 좌상단에 한 번만
  const lab=l=>{ const p=String(l).split('.'); return oneYear? Number(p[1])+'월' : l; };
  const cls=i=>{
    const m=Number(String(labels[i]).split('.')[1]||0);
    return 'num'+(i%2?' alt':'')+(m%3===0&&i<n-1?' qend':'')+(i===n-1?' last':'');
  };
  const cells=(vals, fmt, style)=>vals.map((v,i)=>`<td class="${cls(i)}"${style?` style="${style}"`:''}>${fmt(v)}</td>`).join('');
  const numFmt=v=>Number(v)?Number(v).toLocaleString():'<span class="zero">·</span>';
  const rawFmt=v=>(v===''||v==null)?'<span class="zero">·</span>':v;
  return `<div class="mtbl-wrap"><table class="matrix mtbl">
    <thead><tr><th class="mh-lab">구분${oneYear?`<span class="mh-y">${years[0]}년</span>`:''}</th>
      ${labels.map((l,i)=>`<th class="${cls(i)}">${lab(l)}</th>`).join('')}<th class="num tot">합계</th></tr></thead>
    <tbody>${series.map(s=>`<tr>
      <td class="mlab"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${s.c};margin-right:7px"></span>${s.n}</td>
      ${cells(s.v, numFmt)}
      <td class="num tot">${s.v.reduce((a,b)=>a+(Number(b)||0),0).toLocaleString()}</td></tr>`).join('')}
      ${(rows||[]).map(r=>r.group
        ? `<tr class="mgrp"><td colspan="${n+2}">${r.group}</td></tr>`
        : `<tr>
      <td class="mlab" style="color:var(--gray2)">${r.n}</td>
      ${cells(r.v, rawFmt, 'color:var(--gray2);font-weight:700')}
      <td class="num" style="color:var(--gray2)">${r.tot!==undefined?r.tot:'—'}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function admOnbAs(){
  const R=admMonthlyWithHist(); if(!R.length) return `<div class="empty-note">집계 데이터가 없습니다.</div>`;
  const L=R.map(r=>r.m.replace('-','.'));
  const s=[{n:'온보딩',c:'#0071e3',v:R.map(r=>r.by.onboarding||0)},{n:'A/S',c:'#34c759',v:R.map(r=>r.by.as||0)}];
  return admHistNote(R)
    + `<div class="card"><div class="card-head"><h3>온보딩 · A/S 월 건수</h3><span class="hint">막대 위 숫자 = 월 총 건수</span></div>${monthBarChart(L,s)}</div>`
    + `<div class="card"><div class="card-head"><h3>1일 평균 비교</h3><span class="hint">월 건수 ÷ 평일 수(토·일·공휴일 제외) — 진행 중인 달도 공정하게 비교됩니다</span></div>
        ${monthBarChart(L,[{n:'온보딩',c:'#0071e3',v:R.map(r=>admPerDay(r.by.onboarding,r))},{n:'A/S',c:'#34c759',v:R.map(r=>admPerDay(r.by.as,r))}], v=>Number(v).toFixed(1))}</div>`
    + `<div class="card"><div class="card-head"><h3>월별 수치</h3></div>
        ${monthTable(L, s, [{n:'평일 수', v:R.map(r=>r.biz), tot:R.reduce((a,r)=>a+r.biz,0)},
                            {n:'온보딩 1일 평균', v:R.map(r=>admPerDay(r.by.onboarding,r))},
                            {n:'A/S 1일 평균',   v:R.map(r=>admPerDay(r.by.as,r))}])}</div>`;
}
function admChannel(){
  const R=admMonthlyWithHist(); if(!R.length) return `<div class="empty-note">집계 데이터가 없습니다.</div>`;
  const L=R.map(r=>r.m.replace('-','.'));
  const s=[{n:'온라인',c:'#0071e3',v:R.map(r=>r.online)},{n:'오프라인',c:'#ff9500',v:R.map(r=>r.offline)}];
  const share=R.map(r=>{ const t=r.online+r.offline; return t?Math.round(r.online/t*100):0; });
  return admHistNote(R)
    + `<div class="card"><div class="card-head"><h3>온라인 · 오프라인 월 건수</h3></div>${monthBarChart(L,s)}</div>`
    + `<div class="card"><div class="card-head"><h3>1일 평균 비교</h3><span class="hint">월 건수 ÷ 평일 수(토·일·공휴일 제외)</span></div>
        ${monthBarChart(L,[{n:'온라인',c:'#0071e3',v:R.map(r=>admPerDay(r.online,r))},
                           {n:'오프라인',c:'#ff9500',v:R.map(r=>admPerDay(r.offline,r))}], v=>Number(v).toFixed(1))}</div>`
    + `<div class="card"><div class="card-head"><h3>월별 수치</h3>
          <span class="hint">유형별: <b>01~06</b> 월간 리포트 · <b>07~</b> 대시보드 집계 · VOC는 처리 완료 건</span></div>
        <div class="adm-note" style="margin:0 0 10px">⚠️ <b>부재*</b> 는 두 구간의 기준이 다릅니다 —
          <b>01~06</b> 은 그 달에 <b>발생한</b> 부재 건수(리포트), <b>07~</b> 은 <b>미해결로 남은</b> 부재 건수입니다.
          대시보드는 부재가 처리되면 처리 건으로 옮기고 미처리에서 빼기 때문에 발생 누계를 복원할 수 없습니다. 두 구간을 직접 비교하지 마세요.</div>
        ${monthTable(L, s, [{n:'평일 수', v:R.map(r=>r.biz), tot:R.reduce((a,r)=>a+r.biz,0)},
                            {n:'온라인 비중', v:share.map(p=>p+'%')},
                            {group:'유형별 처리 건수'},
                            ...admTypeRows(R)])}</div>`;
}
/* 월별 수치 표의 유형별 세부 행 — 리포트(1~6월)와 라이브(7월~)를 같은 행에 이어 붙인다.
 * VOC·부재는 WORK_CATS 에 없어 admMonthly 가 따로 담아 둔 값을 쓴다. */
function admTypeRows(R){
  const TYPES=[
    ['🚀 온보딩',   r=>r.by.onboarding],
    ['🔧 AS',       r=>r.by.as],
    ['🧩 외주설치', r=>r.by.extern],
    ['📝 명의변경', r=>r.by.transfer],
    ['💬 VOC',      r=>r.voc],
    ['🍱 메뉴등록', r=>r.by.menu],
    ['📵 부재*',    r=>r.absent],
    ['🛵 배달',     r=>r.by.delivery],
  ];
  return TYPES.map(([n,get])=>{
    const v=R.map(r=>Number(get(r))||0);
    return {n, v:v.map(x=>x?x.toLocaleString():'·'), tot:v.reduce((a,b)=>a+b,0).toLocaleString()};
  });
}
function admWorkday(){
  const R=admMonthlyWithHist(); if(!R.length) return `<div class="empty-note">집계 데이터가 없습니다.</div>`;
  const L=R.map(r=>r.m.replace('-','.'));
  const perDay=R.map(r=>admPerDay(r.total,r));
  const perPer=R.map(r=>+(r.total/(r.biz||1)/(r.emps||1)).toFixed(1));
  const weekend=R.map(r=>r.total-r.bizCnt);   // 주말·공휴일에 처리한 건 (분자에는 포함, 분모에는 미포함)
  const table=`<div style="overflow-x:auto"><table class="matrix">
    <thead><tr><th>월</th><th class="num">근무일 수<br><span style="font-weight:600;color:var(--muted)">평일</span></th>
      <th class="num">총 건수</th><th class="num">1일 평균</th><th class="num">담당자</th><th class="num tot">1인 1일 평균</th>
      <th class="num">주말·공휴일<br><span style="font-weight:600;color:var(--muted)">처리분</span></th></tr></thead>
    <tbody>${R.map((r,i)=>`<tr><td>${r.m.replace('-','.')}</td>
      <td class="num" style="font-weight:800">${r.biz}</td>
      <td class="num">${r.total.toLocaleString()}</td><td class="num" style="font-weight:800">${perDay[i]}</td>
      <td class="num" style="color:var(--gray2)">${r.hist?'—':r.emps}</td><td class="num tot">${r.hist?'—':perPer[i]}</td>
      <td class="num" style="color:var(--gray2)">${r.hist?'—':weekend[i].toLocaleString()}</td></tr>`).join('')}</tbody>
  </table></div>`;
  // 막대 = 근무일 수(평일), 선 = 1일 평균 — 참고 이미지의 '근무일 수, 1일 평균' 형태
  const chart=(function(){
    const colW=64, gap=54, padL=40, padR=26, topPad=30, botPad=38;
    const W=Math.max(420, padL+padR+R.length*colW+(R.length-1)*gap), H=260, base=H-botPad, plotH=H-topPad-botPad;
    const mxD=Math.max(1,...R.map(r=>r.biz)), mxP=Math.max(1,...perDay);
    const cx=i=>padL+i*(colW+gap)+colW/2;
    const bars=R.map((r,i)=>{
      const x=padL+i*(colW+gap), h=r.biz/mxD*plotH*0.6, y=base-h;
      // 막대가 짧으면 안쪽 흰 글씨가 축 밖으로 삐져나간다 — 그럴 땐 막대 위에 파란 글씨로
      const inside=h>=26;
      return `<rect x="${x}" y="${y.toFixed(1)}" width="${colW}" height="${h.toFixed(1)}" rx="3" fill="#0071e3"><title>${r.m} 근무일(평일) ${r.biz}일</title></rect>
        <text x="${x+colW/2}" y="${(inside?y+18:y-7).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="${inside?'#fff':'#0071e3'}">${r.biz}</text>
        <text x="${x+colW/2}" y="${base+20}" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:var(--ink)">${r.m.replace('-','.')}</text>`;
    }).join('');
    const Y=v=>base-v/mxP*plotH;
    const pts=perDay.map((v,i)=>`${cx(i)},${Y(v).toFixed(1)}`).join(' ');
    const dots=perDay.map((v,i)=>`<circle cx="${cx(i)}" cy="${Y(v).toFixed(1)}" r="4" fill="#ff3b30"><title>${R[i].m} 1일 평균 ${v}건</title></circle>
      <text x="${cx(i)}" y="${(Y(v)-10).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="#ff3b30">${v}</text>`).join('');
    return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
        <line x1="${padL-10}" y1="${base}" x2="${W-padR}" y2="${base}" style="stroke:var(--line)"/>${bars}
        ${R.length>1?`<polyline points="${pts}" fill="none" stroke="#ff3b30" stroke-width="2.5"/>`:''}${dots}</svg></div>
      <div class="legend"><span><span class="swatch" style="background:#0071e3"></span>근무일 수(평일)</span><span><span class="swatch" style="background:#ff3b30"></span>1일 평균 처리</span></div>`;
  })();
  return admHistNote(R)
    + `<div class="adm-note">ℹ️ <b>2026.01~06</b> 은 월간 리포트 수치라 <b>담당자 수·1인 1일 평균·주말 처리분</b>은 알 수 없어 <b>—</b> 로 둡니다.</div>`
    + `<div class="adm-note"><b>근무일 수 = 평일</b>(토·일·공휴일 제외, 공휴일은 대체공휴일 포함). 진행 중인 달은 <b>오늘까지 경과한 평일</b>만 셉니다.
       <b>1일 평균 = 총 건수 ÷ 평일 수</b> — 주말·당직에 처리한 건도 분자에는 들어갑니다(맨 오른쪽 열에 따로 표기).</div>`
    + `<div class="card"><div class="card-head"><h3>근무일 수 · 1일 평균</h3><span class="hint">막대 = 평일 수 · 선 = 1일 평균 처리 건수</span></div>${chart}</div>`
    + `<div class="card"><div class="card-head"><h3>월별 수치</h3><span class="hint">1인 1일 평균 = 총 건수 ÷ 평일 수 ÷ 그 달 활동 담당자 수</span></div>${table}</div>`;
}

/* ================= 🎁 팀 목표 (월별 원격 처리 건수 리워드) ================= */
// 기준은 '그 달의 팀 전체 원격 처리 건수'(COUNTS 합계). 코인처럼 상점에서 쓴다고 줄어들지 않음.
const LS_TEAMGOAL = "opcare_teamgoal_v1";
let TEAMGOAL = load(LS_TEAMGOAL, {});   // { 'YYYY-MM': {t1:{cases,reward,icon,by}, t2:{...}} }
const TEAMGOAL_DEFAULT = {
  t1:{cases:4500, reward:'원격파트 커피 선물', icon:'☕', by:'파트리더'},
  t2:{cases:5500, reward:'OC팀 전체 회식권',   icon:'🍖', by:'팀장님'},
};
let teamGoalRef = today();
function tgPad(n){ return String(n).padStart(2,'0'); }
function tgMonthKey(){ return `${teamGoalRef.getFullYear()}-${tgPad(teamGoalRef.getMonth()+1)}`; }
// 예전(코인 기준) 저장값 호환: coins만 있으면 그 값을 목표 건수로 사용
function tgTier(def, o){ const t=Object.assign({}, def, o||{}); if(t.cases==null) t.cases=t.coins||def.cases; delete t.coins; return t; }
function tgGoalOf(){ const o=TEAMGOAL[tgMonthKey()]||{}; return { t1:tgTier(TEAMGOAL_DEFAULT.t1, o.t1), t2:tgTier(TEAMGOAL_DEFAULT.t2, o.t2) }; }
// 그 달의 원격 처리 건수 (직원별 / 팀 전체)
function tgCasesEmp(emp, mk){ let t=0; for(const cat in COUNTS){ const cc=COUNTS[cat]; for(const d in cc){ if(d.slice(0,7)===mk) t+=cc[d][emp]||0; } } return t; }
function tgCasesTotal(mk){ let t=0; for(const cat in COUNTS){ const cc=COUNTS[cat]; for(const d in cc){ if(d.slice(0,7)!==mk) continue; for(const e in cc[d]) t+=cc[d][e]||0; } } return t; }
let tgCelebrated=false;
function tgNav(n){ teamGoalRef=new Date(teamGoalRef.getFullYear(), teamGoalRef.getMonth()+n, 1); renderTeamGoal(); }
function tgTodayMonth(){ teamGoalRef=today(); renderTeamGoal(); }
function tgTierCard(t, total){
  const pct=Math.min(100, t.cases?total/t.cases*100:0), reached=total>=t.cases, remain=Math.max(0, t.cases-total);
  return `<div class="tg-tier ${reached?'reached':''}">
    <div class="tg-tier-ic">${t.icon}</div>
    <div class="tg-tier-body">
      <div class="tg-tier-top"><span class="tg-tier-reward">${escapeHtml(t.reward)}</span><span class="tg-tier-pct ${reached?'done':''}">${Math.round(pct)}%</span></div>
      <div class="tg-tier-by">🎯 목표 ${t.cases.toLocaleString()}건 · 🎖️ ${escapeHtml(t.by)} 제공</div>
      <div class="tg-bar"><div class="tg-bar-fill" style="width:${pct}%"></div></div>
      <div class="tg-tier-stat">${reached?`<b class="tg-done">🎉 달성! 보상 확정 (100%)</b>`:`${total.toLocaleString()} / ${t.cases.toLocaleString()}건 · 달성률 <b>${Math.round(pct)}%</b> · <b>${remain.toLocaleString()}</b>건 남음`}</div>
    </div>
  </div>`;
}
function renderTeamGoal(){
  const mk=tgMonthKey(), g=tgGoalOf(), total=tgCasesTotal(mk);
  const byEmp=EMPLOYEES.map(e=>({emp:e, cases:tgCasesEmp(e,mk)})).sort((a,b)=>b.cases-a.cases);
  const maxE=Math.max(1,...byEmp.map(r=>r.cases));
  const y=teamGoalRef.getFullYear(), mo=teamGoalRef.getMonth()+1;
  const isThis = mk===`${today().getFullYear()}-${tgPad(today().getMonth()+1)}`;
  const topTier=Math.max(g.t1.cases, g.t2.cases, 1);
  const overallPct=Math.min(100, total/topTier*100);
  document.getElementById("main").innerHTML=`
    <div class="page-head">
      <div><h2>🎁 팀 목표 <span class="tg-sub-lab">월별 원격 처리 건수</span></h2>
        <div class="sub">그 달 <b>팀 전체 원격 처리 건수</b>로 보상 달성! 상점·낚시터에서 코인을 써도 <b>줄어들지 않아요</b> · 매월 1일 새로 시작</div></div>
      <div class="controls">
        <button class="navround" onclick="tgNav(-1)">‹</button>
        <span class="tg-month">${y}년 ${mo}월</span>
        <button class="navround" onclick="tgNav(1)">›</button>
        ${isThis?'':`<button class="btn" onclick="tgTodayMonth()">이번달</button>`}
        <button class="btn" onclick="tgEdit()">🎯 목표 수정</button>
      </div>
    </div>

    <div class="card tg-hero">
      <div class="tg-hero-lab">📊 ${y}.${tgPad(mo)} 팀 전체 원격 처리 건수${isThis?' <span style="font-weight:600;color:var(--gray2)">· 이번 달 누적</span>':''}</div>
      <div class="tg-hero-big">${total.toLocaleString()}<span style="font-size:.45em;font-weight:700"> 건</span></div>
      <div class="tg-hero-bar"><div class="tg-hero-fill" style="width:${overallPct}%"></div>
        <span class="tg-hero-mark" style="left:${Math.min(100,g.t1.cases/topTier*100)}%" title="${escapeHtml(g.t1.reward)}">${g.t1.icon}</span>
        <span class="tg-hero-mark" style="left:${Math.min(100,g.t2.cases/topTier*100)}%" title="${escapeHtml(g.t2.reward)}">${g.t2.icon}</span>
      </div>
      <div class="tg-hero-sub">최고 목표 ${topTier.toLocaleString()}건까지 <b>${Math.round(overallPct)}%</b></div>
    </div>

    <div class="grid2">
      ${tgTierCard(g.t1, total)}
      ${tgTierCard(g.t2, total)}
    </div>

    <div class="card">
      <div class="card-head"><h3>👥 팀원별 처리 건수</h3><span class="hint">${y}년 ${mo}월 누적</span></div>
      ${byEmp.some(r=>r.cases!==0)? byEmp.map(r=>`<div class="bar-row"><div class="bar-meta"><span class="nm">${escapeHtml(r.emp)}</span><span class="ct">${r.cases.toLocaleString()}건</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,r.cases)/maxE*100}%;background:#7c5cff"></div></div></div>`).join('') : '<div class="empty-note">이 달 처리 건수 데이터가 없습니다</div>'}
    </div>
  `;
  if(isThis && total>=g.t1.cases && !tgCelebrated){ tgCelebrated=true; setTimeout(()=>{ if(typeof fireMvpConfetti==='function'){ try{ fireMvpConfetti(); }catch(e){} } }, 300); }
}
function tgEdit(){
  const g=tgGoalOf(), k=tgMonthKey();
  const c1=prompt(`[${k}] 1단계 목표 처리 건수 (예: 4500)`, g.t1.cases); if(c1===null) return;
  const r1=prompt('1단계 보상 이름', g.t1.reward); if(r1===null) return;
  const b1=prompt('1단계 제공자', g.t1.by); if(b1===null) return;
  const c2=prompt('2단계 목표 처리 건수 (예: 5500)', g.t2.cases); if(c2===null) return;
  const r2=prompt('2단계 보상 이름', g.t2.reward); if(r2===null) return;
  const b2=prompt('2단계 제공자', g.t2.by); if(b2===null) return;
  TEAMGOAL[k]={ t1:{cases:Math.max(1,parseInt(c1)||g.t1.cases), reward:r1||g.t1.reward, icon:g.t1.icon, by:b1||g.t1.by},
                t2:{cases:Math.max(1,parseInt(c2)||g.t2.cases), reward:r2||g.t2.reward, icon:g.t2.icon, by:b2||g.t2.by} };
  save(LS_TEAMGOAL, TEAMGOAL); renderTeamGoal();
}

/* 코인 획득 건수 — 팀 공용 자산이라 기기마다 달라선 안 된다.
 * 예전에는 COUNTS(브라우저 localStorage)를 셌는데, applySlackData 가 '덮어쓰기만' 하고
 * 사라진 값은 지우지 않아서 오래 켜둔 브라우저일수록 획득이 부풀려졌다.

 * 그래서 모두가 같은 파일인 slack-data 를 직접 세고, slack 이 주지 않는
 * (카테고리,날짜) 조합만 로컬 수기입력으로 보완한다(이중 계산 방지). */
function slackHasCount(cat, date){ return !!(((slackDay(date)||{}).counts||{})[cat]); }
function empHandled(emp, monthKey){
  let t=0;
  const days=(window.SLACK_DATA&&window.SLACK_DATA.days)||{};
  for(const d in days){
    if(monthKey && d.slice(0,7)!==monthKey) continue;
    const c=days[d].counts||{};
    for(const cat in c) t+=c[cat][emp]||0;
  }
  for(const cat in COUNTS){ const cc=COUNTS[cat];
    for(const d in cc){
      if(monthKey && d.slice(0,7)!==monthKey) continue;
      if(slackHasCount(cat,d)) continue;      // slack 이 준 칸은 slack 값만 쓴다
      t+=cc[d][emp]||0;

}

/* ── 🛠 코인 수동 보정 (COIN_FIX) ────────────────────────────────────────────────

 *   grant : 보정 시점의 시작 잔액 (이 값이 곧 '지금 보유 코인')

 * 보정 대상자는 사용액을 spentFix 에 따로 적는다 — spentM 이력은 그대로 남겨,
 * 클라우드 복구 후 실제 사용 내역과 대조해 정산할 수 있게 한다.
 * 왜 마이너스가 났나: 2026-09-02 커밋(825ec80a)에서 코인 '획득'을 브라우저 COUNTS 대신

 * 기준을 정확하게 만든 순간 획득만 내려가고 이미 쓴 사용액은 그대로 남아 10명 중 5명이 음수가 됐다.
 * → 개인 과소비가 아니라 정산 기준 변경이 원인이라, 잃은 만큼(사용 − 획득)을 되돌려준다.

 * ⚠️ 이 표는 지우면 안 된다. 적립 기준선 자체를 옮긴 것이라, 지우면 그 사람의 잔액이
 *    다시 (획득 − 사용) = 음수 → 0 으로 돌아간다. 클라우드 spentM 을 직접 깎지 않은 이유는
 *    팀 공용 장부를 조용히 고치는 대신 git 에 남는 코드로 근거를 남기기 위해서다. */
const COIN_FIX = {

  '김기범': { grant: 190, since: '2026-09-18' },   // 획득 533 · 사용 723

  //   grant 0 = 마이너스만 지우고 0 에서 다시 시작. 캐스팅·아이템은 이미 받았으므로 추가 지급은 안 한다.

// 보정 대상의 적립 — since 이후 날짜의 처리 건수만 센다 (empHandled 의 날짜 제한판)
function empHandledSince(emp, from){
  let t=0;
  const days=(window.SLACK_DATA&&window.SLACK_DATA.days)||{};
  for(const d in days){ if(d<from) continue; const c=days[d].counts||{}; for(const cat in c) t+=c[cat][emp]||0; }
  for(const cat in COUNTS){ const cc=COUNTS[cat];
    for(const d in cc){ if(d<from) continue; if(slackHasCount(cat,d)) continue; t+=cc[d][emp]||0; } }

function empSpent(emp){

  const m=g.spentM||{}; let t=0; for(const k in m) t+=m[k]||0; return t;   // 전 기간 사용 코인

function addSpent(emp, delta){ const g=gs(emp);

  if(COIN_FIX[emp]) g.spentFix=Math.max(0, (g.spentFix||0)+delta);

function empAvail(emp){ return Math.max(0, empCoins(emp)-empSpent(emp)); }          // 보유 코인 = 누적 획득 − 누적 사용 (음수 방지)
