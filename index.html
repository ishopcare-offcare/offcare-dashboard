 * 다시 어긋나면 본인 카드·상점 상단·구매 실패 안내에서 즉시 드러나게 한다. */
function empOver(emp){ return Math.max(0, empSpent(emp)-empCoins(emp)); }
function coinShortMsg(emp){ const o=empOver(emp);
  if(!o) return `
원격을 더 처리하면 코인이 쌓여요 (1건 = 1코인)`;
  return `
⚠️ 사용(${empSpent(emp)})이 획득(${empCoins(emp)})보다 ${o}코인 많아 잔액이 0 으로 묶여 있습니다.
일해도 이 차이를 메꿀 때까지 계속 0 이니 담당자에게 알려주세요.`; }
// 전 직원 초과 현황 — 상점 상단 배너용 (아무도 초과가 아니면 빈 배열)
function coinOverList(){ return (typeof EMPLOYEES!=='undefined'?EMPLOYEES:[]).map(e=>({emp:e,over:empOver(e)})).filter(x=>x.over>0); }
function owns(emp,cat,id){ const it=itemById(cat,id); if(it&&it.price===0) return true; return (gs(emp).owned||[]).includes(cat+':'+id); }
function partE(cat,id){ const it=itemById(cat,id); return it?(it.e||''):''; }
function titleName(eq){ const t=itemById('title',(eq||{}).title); return t?t.name:''; }
function nametagStyle(eq){ const n=itemById('nametag',(eq||{}).nametag); if(!n) return ''; if(n.grad) return `background:${n.grad};-webkit-background-clip:text;background-clip:text;color:transparent`; let s=''; if(n.color) s+=`color:${n.color};`; if(n.glow) s+=`text-shadow:0 0 8px ${n.glow};`; return s; }

      if(pin===null) return false;

function randInt(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
// 코인 획득량: 1~1000, 큰 금액일수록 극희박 (1000코인 ≈ 0.001%)

function pickCoinAmount(){ const T=[{w:600000,a:1,b:3},{w:280000,a:4,b:10},{w:90000,a:11,b:25},{w:25000,a:26,b:50},{w:4999,a:51,b:99},{w:1,a:100,b:100}]; const tot=T.reduce((s,t)=>s+t.w,0); let r=Math.random()*tot; for(const t of T){ if((r-=t.w)<0) return randInt(t.a,t.b); } return 1; }
function rollLoot(loot){ const tot=loot.reduce((a,x)=>a+x.w,0); let r=Math.random()*tot; for(const x of loot){ if((r-=x.w)<0) return x; } return loot[loot.length-1]; }
// 0.0005 → '0.05%', 0.025 → '2.5%', 0.01 → '1%' (소수 뒤 0 제거)
function fmtPct(x){ return (Math.round(x*10000)/100).toFixed(2).replace(/\.?0+$/,'')+'%'; }
// ── 펫 능력치(perk): 낚시 결과에 반영 ──
function petPerk(emp){ const it=itemById('pet',(gs(emp).equipped||{}).pet); return (it&&it.perk)||{}; }
// ── 👑 타이틀 보유 효과: 착용 여부와 무관하게 '보유한 모든 타이틀'의 perk 합산 ──
// 상한 — 아이템 확률 +5%, (꽝 감소 + 코인 유지) 합계 +20%. 타이틀이 계속 늘어도 이 선을 절대 넘지 않음.
const TITLE_PERK_CAP={item:0.05, sway:0.20, dbl:0.30, save:0.50, casts:3};
// casts(동시 캐스팅 횟수)는 합산이 아니라 '가장 높은 값' 적용 — 타이틀이 늘어도 횟수가 눈덩이처럼 불어나지 않게
function ownedTitlePerk(emp){
  const out={};
  (GAME_ITEMS.title||[]).forEach(it=>{ if(!it.perk||!owns(emp,'title',it.id)) return; for(const k in it.perk){ if(k==='casts') out.casts=Math.max(out.casts||1, it.perk.casts); else out[k]=(out[k]||0)+it.perk[k]; } });
  if(out.casts) out.casts=Math.min(out.casts, TITLE_PERK_CAP.casts);
  if(out.item) out.item=Math.min(out.item, TITLE_PERK_CAP.item);
  if(out.dbl) out.dbl=Math.min(out.dbl, TITLE_PERK_CAP.dbl);
  if(out.save) out.save=Math.min(out.save, TITLE_PERK_CAP.save);
  const sway=(out.miss||0)+(out.keep||0);
  if(sway>TITLE_PERK_CAP.sway){ const r=TITLE_PERK_CAP.sway/sway; if(out.miss) out.miss*=r; if(out.keep) out.keep*=r; }
  return out;
}
// 낚시 능력치: 보유 타이틀 전체 + 착용한 펫의 perk 합산 (타이틀은 보유만 해도 적용, 펫은 착용해야 적용)
function activePerk(emp){ const out=ownedTitlePerk(emp); const pet=itemById('pet',(gs(emp).equipped||{}).pet); if(pet&&pet.perk){ for(const k in pet.perk) out[k]=(out[k]||0)+pet.perk[k]; } return out; }
// 능력치는 '각 결과의 자기 확률'에 곱연산 → 아이템 1% + 아이템+10%펫 = 정확히 1.1%.
// 아이템↑(item)·꽝↓(miss)·손실↓(loss)을 각 확률에 곱하고, 남는 확률은 코인획득이 흡수.
function rollLootPerk(loot, perk){
  perk=perk||{};
  const tot=loot.reduce((a,x)=>a+x.w,0)||1;
  const items=loot.filter(x=>x.t==='item');
  const nones=loot.filter(x=>x.t==='none');
  const coins=loot.filter(x=>x.t==='coin');
  const pOf=arr=>arr.reduce((a,x)=>a+x.w,0)/tot;
  const pItem=pOf(items)*(1+(perk.item||0));
  const pNone=pOf(nones)*Math.max(0, 1-(perk.miss||0)-(perk.keep||0));   // miss·keep 만큼 꽝 감소
  const pCoin=Math.max(0, 1-pItem-pNone);   // 줄어든 꽝만큼 '코인 유지'가 흡수 = 코인유지 확률 증가
  const sum=pItem+pCoin+pNone;
  const pick=arr=>{ const t2=arr.reduce((a,x)=>a+x.w,0)||1; let rr=Math.random()*t2; for(const x of arr){ if((rr-=x.w)<0) return x; } return arr[arr.length-1]; };
  // 🕊️ [천사] 타이틀 보유 효과: 꽝이 나와도 확률(perk.save)로 '코인 유지'로 구제
  const nonePick=()=>{ if(perk.save && coins.length && Math.random()<perk.save) return Object.assign({}, pick(coins), {saved:true}); return pick(nones); };
  const r=Math.random()*sum; let acc=pItem;
  if(r<acc && items.length) return pick(items);
  acc+=pCoin; if(r<acc && coins.length) return pick(coins);
  return nones.length?nonePick():(coins.length?pick(coins):loot[0]);
}
function perkDesc(perk){ if(!perk) return ''; const p=[]; const pct=x=>fmtPct(x); if(perk.item)p.push(`아이템 확률 +${pct(perk.item)}`); if(perk.coin)p.push(`코인 유지 시 +${perk.coin}개 추가 지급 (지급 상한 = 캐스트 비용)`); if(perk.miss)p.push(`꽝 -${pct(perk.miss)}`); if(perk.keep)p.push(`코인 유지 확률 +${pct(perk.keep)}`); if(perk.dbl)p.push(`코인 유지 당첨 시 ${pct(perk.dbl)} 확률로 코인 2배 획득`); if(perk.save)p.push(`꽝 당첨 시 ${pct(perk.save)} 확률로 코인 유지`); if(perk.casts>1)p.push(`모든 낚시터에서 한 번에 ${perk.casts}번 캐스팅 (비용도 ${perk.casts}배)`); return p.join(' · '); }
// 한 번의 '낚싯대 던지기'로 진행되는 캐스팅 횟수 ([세월을 낚은] 타이틀 보유 시 2회)
function castCount(emp){ return Math.max(1, ownedTitlePerk(emp).casts||1); }
function pickItem(rars, fishOnly, emp){ const pool=[]; for(const cat in GAME_ITEMS){ for(const it of GAME_ITEMS[cat]){ if(it.price===0) continue; if(it.targetOnly) continue; if(it.ach || it.onlyFor) continue; if(it.gender && emp && !genderOK(emp,it)) continue; if(!rars.includes(it.rarity)) continue; if(fishOnly && !it.fishOnly) continue; if(!fishOnly && it.fishOnly) continue; if(emp && owns(emp,cat,it.id)) continue; pool.push(Object.assign({cat},it)); } } if(!pool.length) return null; const tot=pool.reduce((a,it)=>a+(it.dropWeight||1),0); let r=Math.random()*tot; for(const it of pool){ if((r-=(it.dropWeight||1))<0) return it; } return pool[pool.length-1]; }
const CAT_KO={title:'타이틀',nametag:'네임택',hat:'모자',pet:'펫',skin:'피부',hair:'헤어',dye:'염색',eyes:'눈',brows:'눈썹',mouth:'입',beard:'수염',top:'상의',pants:'하의',shoes:'신발',gloves:'장갑',cape:'망토'};
// 💧 낚시 1회로 받는 코인은 절대 '캐스트 비용'을 넘지 않는다 — 던질수록 코인이 불어나는 무한 증식 차단.
//    (코인 유지 + 펫 보너스 + 고래 2배 · 아이템 풀 소진 보상 · 중복 환급 모두 동일 규칙)
function coinCap(v, cost){ return cost ? Math.min(v, cost) : v; }
function resolveLoot(emp,out,cost){ const g=gs(emp);
  if(out.t==='none'){ g.fishMiss=(g.fishMiss||0)+1; return {emoji:'🐚',big:'꽝!',sub:'빈 낚싯대... 다음 기회에!',cls:'miss'}; }   // 꽝 누적 카운트(💣 타이틀용)
  if(out.t==='coin'){ const perk=activePerk(emp); let n = randInt(out.min,out.max);
    if(n<0){   // 손실 결과: 추가 차감 없음 — 던질 때 낸 캐스트 비용만 소모됨
      g.fishMiss=(g.fishMiss||0)+1;
      return {emoji:'🎣',big:'꽝!',sub:'입질 실패... 캐스트 비용만 소모됐어요',cls:'bad'};
    }
    if(!out.dbl) n=n+(perk.coin||0);   // 펫 코인 보너스는 일반(코인 유지) 결과에만 — '코인 2배 획득'은 표기 금액 그대로 지급
    // 🐋 [고래] 타이틀 보유 효과: 코인 유지 당첨 시 확률(perk.dbl)로 획득 코인 2배
    let whaled=false;
    if(!out.dbl && perk.dbl && Math.random()<perk.dbl){ n*=2; whaled=true; }
    // 상한: 기본은 캐스트 비용까지. 단 [고래] 2배가 터진 회차만 2배까지 허용(발동률 10%라 기대값은 여전히 마이너스)
    if(!out.dbl) n=coinCap(n, cost*(whaled?2:1));
    addSpent(emp, -n);
    if(out.dbl) return {emoji:'💰',big:'+'+n+' 코인',sub:'🎣 대박! 코인 2배 획득!',cls:'coin',rarity:'epic'};
    if(out.saved) return {emoji:'🕊️',big:'+'+n+' 코인',sub:whaled?'[천사] 구원 + [고래] 2배! 꽝이 코인으로!':'[천사] 구원! 꽝이 코인 유지로 바뀌었어요',cls:'coin',rarity:'epic'};
    if(whaled) return {emoji:'🐋',big:'+'+n+' 코인',sub:'[고래] 발동! 코인 2배 획득!',cls:'coin',rarity:'epic'};
    const jackpot=n>=100, huge=n>=50, big=n>=25;
    return {emoji:jackpot?'💰':huge?'🤑':big?'💵':'🪙', big:'+'+n+' 코인',
      sub:jackpot?'🎉 잭팟!!! 100코인 대박!!!':huge?'🌟 초대박! 엄청난 월척!':big?'월척! 대량 획득!':'코인 유지',
      cls:'coin', rarity:jackpot?'mythic':huge?'legendary':big?'epic':null}; }
  const it = out.id ? itemByIdAny(out.id) : pickItem(out.rar,out.fish,emp);
  if(!it){ const n=coinCap(3,cost); addSpent(emp, -n); return {emoji:'🪙',big:'+'+n+' 코인',sub:'낚을 새 아이템이 없어 코인으로!',cls:'coin'}; }
  if(owns(emp,it.cat,it.id)){ const ref=coinCap(Math.max(3,Math.ceil(it.price*0.25)), cost); addSpent(emp, -ref); return {emoji:'♻️',big:'중복 → +'+ref+'코인',sub:'['+it.name+'] 이미 보유! 코인 환급',cls:'coin'}; }
  g.owned=g.owned||[]; g.owned.push(it.cat+':'+it.id);
  return {emoji:it.e||'🎁',big:'['+it.name+']',sub:RARITY_KO[it.rarity]+' '+(CAT_KO[it.cat]||'')+' 획득!',cls:'item',rarity:it.rarity};
}
// 캐스팅 n회분을 한 번에 추첨 → 결과 배열
function rollCasts(emp, f, n){ const out=[]; for(let i=0;i<n;i++) out.push(resolveLoot(emp, rollLootPerk(f.loot, activePerk(emp)), f.cost)); return out; }
async function castFish(spot){
  const emp=gameMe; if(!emp){ alert('먼저 본인을 선택하세요 🙂'); return; }
  const f=FISH[spot]; if(fishBusy) return;
  const pend=fishPending(emp,spot);
  if(pend){
    if(!pend.ready) return;   // 아직 대기 중 (버튼은 비활성)
    // 대기 완료 → 결과 확인(추첨·지급) — 던질 때 결제한 횟수만큼
    const n=(gs(emp).pendN&&gs(emp).pendN[spot])||castCount(emp);
    fishBusy=true; stopFishTick(); clearFishCast(emp,spot); showFishing(f,n);
    const res=rollCasts(emp,f,n); if(gs(emp).pendN) delete gs(emp).pendN[spot]; saveGame();
    setTimeout(()=>{ showFishResults(res); renderMain(); fishBusy=false; }, 1200);
    return;
  }
  // 새 캐스팅 → 대기 시작(결과는 대기 후 확인)
  const gate=fishGate(emp,f); if(!gate.ok){ alert(gate.msg); return; }
  const cg=fishCastGate(emp,f); if(!cg.ok){ alert(cg.msg); return; }
  const n=castCount(emp), cost=f.cost*n;   // [세월을 낚은] 보유 시 2회 동시 캐스팅 (비용도 2회분)
  const short=()=>alert('🪙 코인이 부족해요! (캐스트 '+cost+'코인'+(n>1?` · ${n}회분`:'')+')'+coinShortMsg(emp));
  if(empAvail(emp)<cost){ short(); return; }
  /* ⚠️ 바로 위 잔액 확인과 아래 차감 사이에 await(본인 인증)가 있다. 예전엔 fishBusy 를 차감
   * '뒤'에야 켜서 이 구간이 비어 있었고, 더블클릭하면 두 호출이 모두 확인을 통과한 다음
   * 각자 차감해 잔액이 음수로 내려갔다. (실측: 1코인 보유 상태로 5연타 → 5회 차감, 경고도 없음)
   * → 확인 직후 잠그고, 차감 직전에 잔액을 한 번 더 본다. */
  fishBusy=true;
  const authed=await requireAuth(emp);
  if(!authed || empAvail(emp)<cost){ fishBusy=false; if(authed) short(); return; }
  addSpent(emp, cost); gs(emp).fishCasts=(gs(emp).fishCasts||0)+n; saveGame();   // 캐스팅 누적(세월을 낚은 타이틀용)
  if((FISH_WAIT[spot]||0)<=0){   // 대기 0(초급) → 던지자마자 바로 결과
    showFishing(f,n);   // fishBusy 는 위에서 이미 켜 뒀다
    const res=rollCasts(emp,f,n); saveGame();
    setTimeout(()=>{ showFishResults(res); renderMain(); fishBusy=false; }, 1200);
    return;
  }
  const g=gs(emp); g.pendN=g.pendN||{}; g.pendN[spot]=n;   // 결제한 횟수 기억(대기 중 타이틀 변동과 무관하게 정산)
  setFishCast(emp,spot); saveGame();

}

function renderOverview(){
  const NIGHT = ovShift==='night';
  const viewDates = ovDates();
  const viewLabel = ovLabel();
  const trendDates = []; for(let i=6;i>=0;i--) trendDates.push(ymd(addDays(today(),-i)));   // 처리 추이는 항상 최근 7일

  const prevDates = ovPrevDates();
  const workCatTotals = WORK_CATS.map(c=>({...c, total:ovCnt(c.key, viewDates), prev:ovCnt(c.key, prevDates)}));
  const workGrand = workCatTotals.reduce((a,c)=>a+c.total,0);
  const workGrandPrev = workCatTotals.reduce((a,c)=>a+c.prev,0);
  const vAlerts = ovVocAlerts(viewDates), vAlertsPrev = ovVocAlerts(prevDates);
  const vocTot = vAlerts.length, vocPrevN = vAlertsPrev.length;                                  // VOC 인입(저점, 인입일 기준)
  // VOC 처리 = 완료일(doneDate)이 이 기간인 모든 VOC(저점+칭찬) — 완료한 날짜 기준
  const vocDoneCur = ovVocDone(viewDates), vocDonePrv = ovVocDone(prevDates);
  const vocAttr = vocDoneCur.cnt, vocAttrPrev = vocDonePrv.cnt;
  // VOC 타일 제외 (CX팀 이관) — vocTot/vocPrevN 은 아래 저점 알림에서 계속 쓴다
  // 온보딩 타일 = 온보딩 + 미설치 (TILE_GROUPS) · AS 타일 = AS + 예약 (TILE_ALSO). parts 는 타일 안 내역 줄용
  const catTotals = workCatTotals.map(c=>{
    const mem=tileMembers(c.key); if(mem.length<2) return c;
    const parts=mem.map(k=>workCatTotals.find(x=>x.key===k)).filter(Boolean);
    return {...c, total:parts.reduce((a,x)=>a+x.total,0), prev:parts.reduce((a,x)=>a+x.prev,0), parts};
  });
  /* 설치 OB — 시트(설치일정 확인해주세요) D열 기준.
   * '원격 총 건수' 에는 넣지 않고, 직원별 처리건수·랭킹·MVP 에만 넣는다(사용자 결정).
   * 원격 인입으로 들어온 건이 아니라서 총 건수에 섞으면 인입량이 부풀지만, 담당자가 실제로
   * 처리한 일이라 개인 실적에는 반영해야 한다. 그래서 합계를 두 개로 나눠 쓴다.
   * 야간 탭에서는 시트에 시각이 없어 obCnt 가 null → 0으로 취급해 다른 집계를 흔들지 않는다. */
  const obCur = obCnt(viewDates), obPrev = obCnt(prevDates);
  const obSum = obCur || 0, obSumPrev = obPrev || 0;
  const obEmp = obByEmp(viewDates);                             // 담당자별
  const obEtc = Math.max(0, Object.entries(obEmp).reduce((a,[e,n])=>a+(EMPLOYEES.includes(e)?0:n),0));
  const grandProc = workGrand;                        // 원격 총 건수용 처리 = 업무 처리만 (VOC·설치 OB 제외)
  const grandProcPrev = workGrandPrev;
  const grandEmp = grandProc + obSum;                 // 직원별 표 합계·랭킹용 = 위 + 설치 OB
  const grandEmpPrev = grandProcPrev + obSumPrev;
  // 부재 미처리(1차부재)도 '원격 총 건수'에 포함 — 해당 기간 각 날짜의 부재 pending 합
  const pendCntOf = ds => ovPendingRaw(ds).length;
  const absCntOf = ds => ovPendingRaw(ds).filter(p=>(p.reasons||[]).some(r=>/부재/.test(r))).length;
  const absentCnt = absCntOf(viewDates) + ovAbsent2Raw(viewDates).length;   // 1차(미처리로 남은) + 2차(종결) 부재
  const confirmCnt = pendCntOf(viewDates) - absCntOf(viewDates);   // 확인필요(부재 아닌 미처리)
  const grandAll = grandProc + pendCntOf(viewDates) + ovAbsent2Raw(viewDates).length;      // 원격 총 건수 = 처리 + 부재(1·2차) + 확인필요

  // 인입유형(온라인/오프라인) — 전체 원격 건 기준. 미기재(미상)는 온라인으로 합산(팀 정책) — 기존 저장분의 unknown도 포함

  // 기타(미등록 담당자 = 미지정·타파트 지원 등) — 랭킹/MVP·차트엔 미포함, 표에서 숫자만 일치시키는 집계 행

let celebrateMvp = true;
function fireMvpConfetti(){
  const card=document.getElementById('mvpCard'); if(!card) return;
  card.classList.remove('celebrate'); void card.offsetWidth; card.classList.add('celebrate');
  const layer=document.getElementById('mvpConfetti'); if(!layer) return;
  layer.innerHTML='';
  const colors=['#ffd34e','#ff5a8a','#4ea8ff','#7ee081','#c77dff','#ff9f43','#ffffff'];
  for(let i=0;i<40;i++){
    const s=document.createElement('span'); s.className='confetti';
    const ang=Math.random()*Math.PI*2, dist=50+Math.random()*130;
    s.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(0)+'px');
    s.style.setProperty('--dy',(Math.sin(ang)*dist).toFixed(0)+'px');
    s.style.setProperty('--rot',(Math.random()*720-360).toFixed(0)+'deg');
    s.style.background=colors[i%colors.length];
    s.style.animationDelay=(Math.random()*0.18).toFixed(2)+'s';
    if(Math.random()>0.5) s.style.borderRadius='50%';
    layer.appendChild(s);
  }
  setTimeout(()=>{ if(layer) layer.innerHTML=''; }, 1700);
}
// hex + alpha → rgba
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }

function catLabelOf(k){ if(k==='voc')return 'VOC'; if(k==='ob')return '설치 OB'; const c=WORK_CATS.find(w=>w.key===k); return c?c.name:k; }
function catChip(k){ const c=WORK_CATS.find(w=>w.key===k); const col=k==='voc'?'#ff2d55':(k==='ob'?'#5856d6':(c?c.color:'#8e8e93')); return `<span class="cat-chip" style="background:${hexA(col,.14)};color:${col}">${catLabelOf(k)}</span>`; }

function showDoneDetail(mode, key){
  const dates=ovDates(), set=new Set(dates); let items=[], title='';
  const pushVocDone=(empFilter)=>{ allSlackDates().forEach(d=>{ const v=(slackDay(d)||{}).voc; if(!v)return; [...(v.alerts||[]),...(v.praises||[])].forEach(x=>{ const e=vocEmpAt(d,x), dd=vocDoneAt(d,x); if(e&&(!empFilter||e===empFilter)&&vocCredited(dd)&&set.has(dd)) items.push({time:'',store:x.store,biz:x.storeId,emp:e,cat:'voc',date:dd,st:'처리',nt:isNightTime(x.time)}); }); }); };
  // 설치 OB — 시트 기준이라 상호·사업자·시각이 없다. 상태를 상호 칸에 넣어 무엇인지 알아보게 한다.
  // 야간 탭에서는 obItems 가 시각 정보를 못 주므로 아예 넣지 않는다(집계에서도 빠져 있어 숫자가 맞는다).
  const pushOb=(filter)=>{ if(ovShift==='night') return; obItems(dates).forEach(x=>{ if(filter&&!filter(x)) return; items.push({time:'',store:x.status||'(상태 미기재)',biz:'',emp:x.handler,cat:'ob',date:x._date,st:'처리',nt:false}); }); };
  if(mode==='cat'){
    title = tileMembers(key).length>1 ? tileMembers(key).map(catLabelOf).join('+')+' 처리 상세' : catLabelOf(key)+' 처리 상세';
    if(key==='voc'){ pushVocDone(); }
    else if(key==='ob'){ pushOb(); }
    else { const mem=tileMembers(key); dates.forEach(d=>((slackDay(d)||{}).done||[]).forEach(x=>{ if(mem.includes(x.cat)) items.push({time:x.time,store:x.store,biz:x.biz,emp:x.emp,cat:x.cat,date:d,st:'처리'}); })); }
  } else if(mode==='emp'){
    title = key+' 처리 상세';
    dates.forEach(d=>((slackDay(d)||{}).done||[]).forEach(x=>{ if(x.emp===key) items.push({time:x.time,store:x.store,biz:x.biz,emp:x.emp,cat:x.cat,date:d,st:'처리'}); }));
    pushVocDone(key);                     // 이 직원의 VOC 처리도 포함 (랭킹 수치와 일치)
    pushOb(x=>x.handler===key);           // 설치 OB 도 포함 — 합계에 들어가므로 상세도 맞춰야 한다
  } else if(mode==='etc'){   // 미등록 담당자(미지정·타파트 지원 등) 전체
    title = '기타(미지정·타파트) 처리 상세';
    dates.forEach(d=>((slackDay(d)||{}).done||[]).forEach(x=>{ if(!EMPLOYEES.includes((x.emp||'').trim())) items.push({time:x.time,store:x.store,biz:x.biz,emp:x.emp||'미지정',cat:x.cat,date:d,st:'처리'}); }));
    allSlackDates().forEach(d=>{ const v=(slackDay(d)||{}).voc; if(!v)return; [...(v.alerts||[]),...(v.praises||[])].forEach(x=>{ const e=vocEmpAt(d,x), dd=vocDoneAt(d,x); if(vocCredited(dd)&&set.has(dd)&&!EMPLOYEES.includes((e||'').trim())) items.push({time:'',store:x.store,biz:x.storeId,emp:e||'미지정',cat:'voc',date:dd,st:'처리',nt:isNightTime(x.time)}); }); });
    pushOb(x=>!EMPLOYEES.includes((x.handler||'').trim()));
  } else { // 'all' = 원격 총 건수 (처리 + 설치 OB + 부재 + 확인필요)
    title = '원격 총 건수 상세';
    dates.forEach(d=>((slackDay(d)||{}).done||[]).forEach(x=>items.push({time:x.time,store:x.store,biz:x.biz,emp:x.emp,cat:x.cat,date:d,st:'처리'})));
    pushVocDone();
    pushOb();
    dates.forEach(d=>((slackDay(d)||{}).pending||[]).forEach(x=>{ const ab=(x.reasons||[]).some(r=>/부재/.test(r)); items.push({time:x.time,store:x.store,biz:x.biz,emp:x.handler,cat:x.cat,date:d,st:ab?'부재':'확인필요'}); }));
    dates.forEach(d=>((slackDay(d)||{}).absent||[]).forEach(x=>items.push({time:x.time,store:x.store,biz:x.biz,emp:x.handler,cat:x.cat,date:d,st:'부재'})));   // 2차 부재
  }
  // 관리자 보정 — 표 숫자에는 이미 들어가 있으므로 상세에도 같이 보여야 합이 맞는다.
  // 상호 칸에 '⚖️ 보정 +70건 · 사유' 로 넣어 무엇 때문에 늘었는지 바로 읽히게 한다.
  const pushAdj=(filter)=>{ if(ovShift==='night') return;   // 야간은 보정이 집계에서도 빠져 있다
    adjEntries(dates).forEach(x=>{ if(filter && !filter(x)) return;
      items.push({time:'', date:x.date, cat:x.cat, emp:x.emp, st:'보정', biz:'',
        store:`⚖️ ${x.n>0?'+':''}${x.n}건 · ${x.why||'사유 미기재'}${x.by?' ('+x.by+')':''}`}); }); };
  if(mode==='cat')      pushAdj(x=>tileMembers(key).includes(x.cat));
  else if(mode==='emp') pushAdj(x=>x.emp===key);
  else if(mode==='etc') pushAdj(x=>!EMPLOYEES.includes((x.emp||'').trim()));
  else                  pushAdj();

  if(ovShift==='night'){ items=items.filter(x=> x.cat==='voc' ? x.nt : isNightTime(x.time)); title='🌙 '+title; }
  openDetailModal(title, items, (mode==='cat' && WORK_CATS.some(c=>c.key===key)) ? catRespStrip(key, dates) : '');
}
// 카테고리 상세 창 상단 — 이 카테고리의 평균 응답·소요시간. 누르면 건별 응답/소요시간 상세로.
function catRespStrip(key, dates){

  const box=(on, lab, val, sub, sort)=>`<div class="rt-box${on?' clickable':''}" style="--c:${col}"${on?` onclick="showRespDetail(null,'${sort}','${key}')" title="클릭 → 건별 상세"`:''}>
      <div class="rt-l">${lab}${on?' 🔎':''}</div><div class="rt-v">${on?`${val}<small>분</small>`:'<span style="font-size:16px;color:var(--gray2)">측정 건 없음</span>'}</div><div class="rt-s">${sub}</div></div>`;
  return `<div class="rt-strip">${box(st.rCnt,'⏱️ 평균 응답시간',st.rAvg, st.rCnt?`${st.rCnt}건 기준 · 지연(30분↑) ${st.over}%`:'요청 → 첫 확인 이모지','fast')}${box(st.dCnt,'🛠️ 평균 소요시간',st.dAvg, st.dCnt?`${st.dCnt}건 기준`:'요청 → 완료 이모지','dslow')}</div>`;
}

}

// 🔍 매장 이력 조회 — 상호명/사업자번호로 전체 기간 인입 이력·유형별 횟수·처리내역
function openStoreSearch(){

    <input class="search-box" id="storeSearchBox" type="text" placeholder="상호명 또는 사업자번호 입력 (2글자 이상)…" oninput="runStoreSearch(this.value)">

function runStoreSearch(q){
  const body=document.getElementById('storeSearchBody'); if(!body) return;
  q=(q||'').trim(); if(q.length<2){ body.innerHTML='<div class="empty-note">두 글자 이상 입력하세요.</div>'; return; }
  const ql=q.toLowerCase(), bizQ=q.replace(/[^0-9]/g,'');
  const matchWork=(store,biz)=> (store&&store.toLowerCase().includes(ql)) || (bizQ.length>=4 && biz&&String(biz).includes(bizQ));
  const rows=[];
  for(const d of allSlackDates()){ const dd=slackDay(d)||{};
    (dd.done||[]).forEach(x=>{ if(matchWork(x.store,x.biz)) rows.push({date:d,time:x.time,store:x.store,cat:x.cat,emp:x.emp,st:'처리',note:x.note||''}); });
    (dd.pending||[]).forEach(x=>{ if(matchWork(x.store,x.biz)){ const ab=(x.reasons||[]).some(r=>/부재/.test(r)); rows.push({date:d,time:x.time,store:x.store,cat:x.cat,emp:x.handler,st:ab?'부재':'확인필요',note:(x.reasons||[]).join(', ')}); } });
    const v=dd.voc; if(v)(v.alerts||[]).forEach(x=>{ if((x.store&&x.store.toLowerCase().includes(ql))||(x.storeId&&String(x.storeId).toLowerCase().includes(ql))) rows.push({date:d,time:x.time,store:x.store,cat:'voc',emp:vocEmpAt(d,x),st:vocDone(x.autoStatus||'')?'처리':'저점',note:x.autoNote||((x.reasons||[]).map(r=>r.text).filter(Boolean).join(' / '))}); });
  }
  if(!rows.length){ body.innerHTML=`<div class="empty-note">"${escapeHtml(q)}" 검색 결과가 없습니다.</div>`; return; }
  rows.sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||'')));
  const byCat={}; rows.forEach(r=>byCat[r.cat]=(byCat[r.cat]||0)+1);
  const doneN=rows.filter(r=>r.st==='처리').length, pendN=rows.filter(r=>r.st==='부재'||r.st==='확인필요').length, vocN=byCat['voc']||0;
  const stores=[...new Set(rows.map(r=>r.store).filter(Boolean))];
  const catChips=WORK_CATS.map(c=>byCat[c.key]?`<span class="ss-chip">${c.icon} ${c.name} <b>${byCat[c.key]}</b></span>`:'').filter(Boolean).join('')+(vocN?`<span class="ss-chip">💬 VOC저점 <b>${vocN}</b></span>`:'');
  const summary=`<div class="ss-summary"><div class="ss-total">총 <b>${rows.length}</b>회 인입${stores.length>1?` · <b>${stores.length}</b>개 매장`:''} · 최근 ${fmtShort(rows[0].date)}</div><div class="ss-chips">${catChips}</div><div class="ss-status">✅ 처리 ${doneN} · ⚠️ 부재·미처리 ${pendN}</div></div>`;
  const trs=rows.map(r=>`<tr><td class="trow-time">${fmtShort(r.date)}<br><span style="color:var(--gray2)">${escapeHtml(r.time||'')}</span></td><td class="emp-name">${escapeHtml(r.store||'-')}</td><td>${catChip(r.cat)}</td><td class="dm-emp">${escapeHtml(r.emp||'-')}</td><td>${detailStatusBadge(r.st==='저점'?'확인필요':r.st)}</td><td class="ss-note">${r.note?escapeHtml(r.note):'<span style="color:var(--gray2)">—</span>'}</td></tr>`).join('');
  body.innerHTML=`${summary}<div style="overflow-x:auto"><table class="voc-table" style="margin-top:12px"><thead><tr><th style="width:62px">인입일</th><th style="min-width:100px">상호</th><th style="width:72px">유형</th><th style="width:86px">담당</th><th style="width:70px">상태</th><th style="min-width:150px">처리내역</th></tr></thead><tbody>${trs}</tbody></table></div>`;
}
// ⏱️ 평균 응답시간 카드 클릭 → 건별 상세(올라온시간·응답분·담당), 응답 빠른순/느린순 정렬
let respDetailItems=[]; let respSortMode='fast'; let respDetailLabel='';
// days 를 주면 최근 N일(카드의 7일·30일 추세 행 클릭), 없으면 화면에서 선택한 기간
function showRespDetail(days, sort, cat){
  const dates = typeof days==='number' ? lastNDays(days) : ovDates();
  respDetailLabel = typeof days==='number' ? `최근 ${days}일` : ovRangeText();
  if(cat){   // 카테고리 상세 창에서 연 경우 — 그 카테고리 건만(최종 카테고리 기준)
    respDetailLabel = catLabelOf(cat)+' · '+respDetailLabel;
    respDetailItems = respItemsOf(dates).filter(x=>tileMembers(cat).includes(x.cat));
    const old=document.getElementById('respModal'); if(old) old.remove();   // 카테고리 창 위에 새로 띄운다
    respSortMode = sort || 'fast';
    renderRespModal(); return;
  }
  const R=(window.SLACK_DATA&&window.SLACK_DATA.resp&&window.SLACK_DATA.resp.days)||{};
  respDetailItems=[];
  for(const d of dates){ const arr=(R[d]&&R[d].items)||[]; for(const it of arr) respDetailItems.push(Object.assign({date:d}, it)); }
  respDetailItems=respDetailItems.filter(x=>!(x.cat&&RESP_EXCL_CATS.includes(x.cat)));   // 응답/소요시간 카드와 같은 규칙(RESP_EXCL_CATS)
  if(ovShift==='night') respDetailItems=respDetailItems.filter(x=>isNightTime(x.hm));
  respSortMode = sort || 'fast';
  renderRespModal();
}
function respSort(mode){ respSortMode=mode; renderRespModal(); }
function renderRespModal(){
  const DUR = respSortMode==='dslow'||respSortMode==='dfast';   // 소요시간 기준 보기
  const val = x => DUR ? (x.dmin||0) : (x.min||0);
  const asc = respSortMode==='fast'||respSortMode==='dfast';
  // 소요시간 보기에서는 아직 완료 이모지가 안 찍힌 건(dmin 없음)을 빼야 평균이 왜곡되지 않는다
  const base = DUR ? respDetailItems.filter(x=>x.dmin!=null) : respDetailItems.filter(x=>x.min!=null);   // git 복원분은 응답시간이 없다
  const items=base.slice().sort((a,b)=> asc ? (val(a)-val(b)) : (val(b)-val(a)));
  const avg=items.length?Math.round(items.reduce((a,x)=>a+val(x),0)/items.length):0;
  const rows=items.length? items.map((x,i)=>`<tr class="dm-row" data-k="${((x.store||'')+' '+(x.biz||'')).toLowerCase()}"><td class="dm-num">${i+1}</td><td class="trow-time">${fmtShort(x.date)}<br>${escapeHtml(x.hm||'')}</td><td style="font-weight:800;color:${x.min>30?'var(--red)':'var(--green)'}">${x.min!=null?`${x.min}분`:'<span style="color:var(--gray2);font-weight:600" title="git 기록으로 복원한 소요시간 — 응답시간은 없음">—</span>'}</td><td style="font-weight:700;color:var(--ink-soft)">${x.dmin!=null?`${x.dmin}분`:'<span style="color:var(--gray2)">—</span>'}</td><td class="emp-name">${escapeHtml(x.store||'-')}</td><td>${x.cat?catChip(x.cat):'<span style="color:var(--gray2)">—</span>'}</td><td class="dm-emp">${escapeHtml(x.who||'-')}</td></tr>`).join('')
    : `<tr><td colspan="7" style="text-align:center;color:var(--gray2);padding:22px">아직 측정된 응답 건이 없습니다.<br><span style="font-size:12px">배포 후 새로 인입·확인된 건부터 순차 집계됩니다.</span></td></tr>`;
  let el=document.getElementById('respModal'); if(!el){ el=document.createElement('div'); el.id='respModal'; el.className='detail-overlay'; el.onclick=e=>{ if(e.target===el) el.remove(); }; document.body.appendChild(el); }
  el.innerHTML=`<div class="detail-box"><div class="detail-head"><h3>${DUR?'🛠️ 소요시간':'⏱️ 응답시간'} 상세${respDetailLabel?` · ${escapeHtml(respDetailLabel)}`:''} <span class="cnt-badge">${items.length}건 · 평균 ${avg}분</span></h3><button class="detail-x" onclick="document.getElementById('respModal').remove()">✕</button></div>
    <div class="seg" style="margin-top:10px"><button class="${respSortMode==='fast'?'on':''}" onclick="respSort('fast')">응답 빠른순 ↑</button><button class="${respSortMode==='slow'?'on':''}" onclick="respSort('slow')">응답 느린순 ↓</button><button class="${respSortMode==='dslow'?'on':''}" onclick="respSort('dslow')">소요 느린순 ↓</button><button class="${respSortMode==='dfast'?'on':''}" onclick="respSort('dfast')">소요 빠른순 ↑</button></div>
    <div class="detail-scroll"><table class="voc-table"><thead><tr><th style="width:34px">#</th><th style="width:70px">올라온</th><th style="width:60px">응답</th><th style="width:60px">소요</th><th>상호</th><th style="width:84px">유형</th><th style="width:86px">담당</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

// 전체 처리 추이 (기간 내 일별 전 카테고리 합계)
function overviewTrend(dates){
  const NIGHT=ovShift==='night';
  const vals=dates.map(d=>{ if(NIGHT) return nightItems([d]).length; const ab=((slackDay(d)||{}).pending||[]).filter(p=>(p.reasons||[]).some(r=>/부재/.test(r))).length+((slackDay(d)||{}).absent||[]).length; const ob=obCnt([d])||0; return WORK_CATS.reduce((a,c)=>a+sumRange(c.key,[d]),0)+ob+ab; });   // 업무 + 설치 OB + 부재 미처리 = 원격 총 건수와 동일 기준 (VOC 제외 · 야간이면 야간 항목 수)
  const mx=Math.max(1,...vals);
  // 카드 가로폭을 꽉 채우도록 viewBox 고정 + width 100% (빈 여백 없이 막대를 두껍게)
  const W=760, H=230, pad=26, gap=(W-pad*2)/dates.length, bw=Math.min(76, gap*0.72);
  const many=dates.length>16;
  const fs=Math.max(11, Math.min(17, gap*0.24));
  const bars=dates.map((d,i)=>{ const v=vals[i], h=(H-56)*(v/mx), x=pad+i*gap+(gap-bw)/2, y=H-32-h, dd=parseYmd(d), isT=d===ymd(today());
    const lbl=many?dd.getDate():`${dd.getMonth()+1}/${dd.getDate()}`;
    const holi=HOLIDAYS[d];
    const lblCol=dateAxisColor(d);
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="5" fill="${isT?'var(--purple)':'#cfe3fb'}"><title>${fmtShort(d)}${holi?' · '+holi:''} · ${v}건</title></rect>`
      +(v>0?`<text x="${(x+bw/2).toFixed(1)}" y="${(y-7).toFixed(1)}" text-anchor="middle" font-size="${fs.toFixed(1)}" font-weight="800" style="fill:var(--ink-soft)">${v}</text>`:'')
      +`<text x="${(x+bw/2).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="${(fs*0.85).toFixed(1)}" font-weight="${dateAxisBold(d)?'800':'600'}" style="fill:${lblCol}">${lbl}${holi?`<title>${escapeHtml(holi)}</title>`:''}</text>`;}).join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" style="display:block"><line x1="${pad}" y1="${H-32}" x2="${W-pad}" y2="${H-32}" stroke="var(--line)"/>${bars}</svg></div>`;
}
// 시간대별 처리 추이 — done(처리완료) 항목을 인입 시각(HH) 시간대로 버킷팅
function overviewHourly(dates){
  const NIGHT=ovShift==='night';
  const buckets=new Array(24).fill(0);
  for(const d of dates){ const dn=slackDay(d); if(!dn||!dn.done) continue;
    for(const it of dn.done){ const h=parseInt(String(it.time||'').slice(0,2),10); if(isNaN(h)) continue; if(NIGHT&&h<18) continue; buckets[h]++; } }
  const withData=[]; for(let h=0;h<24;h++) if(buckets[h]>0) withData.push(h);
  if(!withData.length) return '<div class="empty-note">시간대별 처리 데이터 없음</div>';
  let lo=Math.min(...withData), hi=Math.max(...withData);
  if(NIGHT){ lo=Math.min(lo,18); hi=Math.max(hi,22); } else { lo=Math.min(lo,9); hi=Math.max(hi,18); }   // 축 최소 범위 유지
  const hrs=[]; for(let h=lo;h<=hi;h++) hrs.push(h);
  const vals=hrs.map(h=>buckets[h]);
  const mx=Math.max(1,...vals);
  // 카드 가로폭을 꽉 채우도록 viewBox 고정 + width 100% · 피크 시간대는 진한 색으로 강조
  const W=760, H=230, pad=26, gap=(W-pad*2)/hrs.length, bw=Math.min(70, gap*0.72);
  const fs=Math.max(11, Math.min(17, gap*0.24));
  const bars=hrs.map((h,i)=>{ const v=vals[i], bh=(H-56)*(v/mx), x=pad+i*gap+(gap-bw)/2, y=H-32-bh, peak=v===mx&&v>0;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="5" fill="${peak?'var(--blue)':'#9dc4ef'}"><title>${h}시~${h+1}시: ${v}건</title></rect>`
      +(v>0?`<text x="${(x+bw/2).toFixed(1)}" y="${(y-7).toFixed(1)}" text-anchor="middle" font-size="${fs.toFixed(1)}" font-weight="800" style="fill:var(--ink-soft)">${v}</text>`:'')
      +`<text x="${(x+bw/2).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="${(fs*0.85).toFixed(1)}" font-weight="${peak?'800':'600'}" style="fill:${peak?'var(--blue)':'var(--gray2)'}">${h}시</text>`;}).join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" style="display:block"><line x1="${pad}" y1="${H-32}" x2="${W-pad}" y2="${H-32}" stroke="var(--line)"/>${bars}</svg></div>`;
}
// 도넛 차트
function donutChart(entries){
  const total=entries.reduce((a,e)=>a+e[1],0);
  if(!total) return '<div class="empty-note">데이터 없음</div>';
  const cx=72,cy=72,rm=50,C=2*Math.PI*rm,sw=22; let acc=0;
  const segs=entries.map(([label,val,color])=>{ const len=val/total*C; const s=`<circle cx="${cx}" cy="${cy}" r="${rm}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"><title>${label} ${val} (${Math.round(val/total*100)}%)</title></circle>`; acc+=len; return s; }).join('');
  const legend=entries.map(([label,val,color])=>`<span><span class="swatch" style="background:${color}"></span>${label} ${val} (${Math.round(val/total*100)}%)</span>`).join('');

}
// ── AS 유형 분류 — 요청 '내용'(req) + 처리내역(note) 키워드 기반 ──

  {label:'CAT/무선단말기',  color:'#ff9500', kw:['cat','캣프','프캣','무선단말기','무선단말','무선기','단말기','카드','결제','승인','정산','환불','매출전표','van','밴','조회기','카드기']},
  {label:'네트워크/연동',   color:'#00c7be', kw:['네트워크','랜','lan','인터넷','와이파이','wifi','연동','배달','통신','공유기','ap']},

// 캣프·프캣(CAT 프린터 일체형)은 '프린터'·프린터 모델명과 같이 적혀도 CAT/무선단말기로 분류
// — 규칙 배열은 첫 매칭이 이기고 '프린터'가 CAT보다 앞이라, 키워드 추가만으로는 프린터로 새어나감
const CAT_COMBO_RE = /캣프|프캣/;
// 프린터 모델명(ts100·ts400·cpp-3000·8385 등)은 다른 기기 단어(pos·연동 등)보다 우선 → 프린터로 분류
const PRINTER_MODEL_RE = /\bts-?\s?\d{3,4}\b|\bcpp-?\s?\d{3,4}\b|(?:^|[^0-9])8385(?:[^0-9]|$)/i;
function classifyAsIssue(text){ const t=(text||'').toLowerCase();
  if(CAT_COMBO_RE.test(t)) return 'CAT/무선단말기';
  if(PRINTER_MODEL_RE.test(t)) return '프린터';
  for(const r of AS_ISSUE_RULES){ if(r.kw.some(k=>t.includes(k.toLowerCase()))) return r.label; } return AS_ISSUE_ETC; }

function asIssueOf(x){ const hwIssue = x.hw ? classifyAsIssue(x.hw) : AS_ISSUE_ETC; return hwIssue!==AS_ISSUE_ETC ? hwIssue : classifyAsIssue((x.req||'')+' '+(x.note||'')); }
function asIssueRows(dates){ const rows=[]; for(const d of dates){ const dd=slackDay(d)||{}; (dd.done||[]).forEach(x=>{ if(x.cat!=='as')return; rows.push({date:d,time:x.time,store:x.store,emp:x.emp,req:x.req||'',hw:x.hw||'',note:x.note||'',issue:asIssueOf(x)}); }); } return rows; }
function asIssueBreakdown(dates){

  const entries=order.map(l=>[l,counts[l]||0]).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);

  return `<div class="as-brk">${entries.map(([l,n])=>`<div class="as-brk-row" onclick="showAsIssueDetail('${encodeURIComponent(l)}')" title="클릭 → 매장 목록">
    <div class="as-brk-lab">${escapeHtml(l)}</div>
    <div class="as-brk-bar"><div class="as-brk-fill" style="width:${Math.max(5,Math.round(n/mx*100))}%;background:${AS_ISSUE_COLOR[l]||'#8e8e93'}"></div></div>
    <div class="as-brk-n"><b>${n}</b>건 · ${Math.round(n/total*100)}%</div></div>`).join('')}</div>${note}`;

function showAsIssueDetail(t){ t=decodeURIComponent(t); const rows=asIssueRows(ovDates()).filter(r=>r.issue===t);

  el.innerHTML=`<div class="detail-box" style="max-width:780px"><div class="detail-head"><h3>🔧 AS · ${escapeHtml(t)} <span class="cnt-badge">${rows.length}건</span></h3><button class="detail-x" onclick="document.getElementById('asIssueModal').remove()">✕</button></div>
    <div class="detail-scroll"><table class="voc-table"><thead><tr><th style="width:62px">인입일</th><th style="min-width:90px">상호</th><th style="width:86px">담당</th><th style="min-width:130px">요청내용</th><th style="min-width:150px">처리내역</th></tr></thead><tbody>${trs}</tbody></table></div></div>`;

// 현재 보기(일/주/월/기간)의 '직전 동일 기간' 날짜들
function prevViewDates(){
  if(viewMode==='day')   return rangeDates('day',  ymd(addDays(parseYmd(selDate),-1)));
  if(viewMode==='week')  return rangeDates('week', ymd(addDays(startOfWeek(parseYmd(selDate)),-7)));
  if(viewMode==='month'){ const r=parseYmd(selDate); return rangeDates('month', ymd(new Date(r.getFullYear(), r.getMonth()-1, 15))); }
  const cur=rangeDates('custom',selDate), len=cur.length||1, start=parseYmd(cur[0]), out=[];
  for(let i=len;i>=1;i--) out.push(ymd(addDays(start,-i)));   // 같은 길이의 직전 구간
  return out;
}
// 전체현황의 비교 라벨. 예전엔 viewMode(카테고리 통계 페이지 상태)를 읽어서, 전체현황에서
// 어떤 기간을 골라도 항상 '전일'로 떨어졌다. 전체현황은 ovMode/ovDates 를 봐야 한다.
// 비교 대상은 ovPrevDates() = 선택 기간 '바로 직전'의 같은 길이 구간이다.
function ovPrevLabel(){ return ovDates().length <= 1 ? '전일' : '이전 기간'; }
function deltaHTML(cur,prev){
  const diff=cur-prev, cls=diff>0?'up':diff<0?'down':'flat', arrow=diff>0?'▲':diff<0?'▼':'–';
  const pct=prev>0?Math.round(Math.abs(diff)/prev*100)+'%':(cur>0?'신규':'0%');
  const pd=ovPrevDates();
  // 어느 구간과 비교한 값인지 툴팁으로 확인 가능하게 (숫자만 보고는 검증이 안 된다)
  const tip=pd.length?`비교 기준 ${periodRangeText(pd)}  →  현재 ${periodRangeText(ovDates())}  ·  ${prev}건 → ${cur}건`:'';
  // 이전 기간이 0이면 '신규' 만 — '신규 이전 기간 대비' 로 읽히는 어색함 방지
  const suffix = prev>0 ? ` <span>${ovPrevLabel()} 대비</span>` : (cur>0?` <span>${ovPrevLabel()}엔 없던 항목</span>`:'');
  return `<div class="ov-delta ${cls}"${tip?` title="${escapeHtml(tip)}"`:''}>${arrow} ${pct}${suffix}</div>`;
}

// 직원별 그룹(묶음) 세로 막대차트 — 직원마다 카테고리별 막대를 분리 표시
function columnChart(empRows, maxCell){
  const cats=OV_CHART_CATS, nc=cats.length, ng=empRows.length;
  const barW=12, barGap=3, groupGap=32, padL=20, padR=20, topPad=22, botPad=46;
  const groupW=nc*barW+(nc-1)*barGap;
  const W=Math.max(560, padL+padR + ng*groupW + (ng-1)*groupGap);
  const H=340, base=H-botPad, plotH=H-topPad-botPad;
  const mx=Math.max(1, maxCell);
  const groups=empRows.map((r,gi)=>{
    const gx=padL + gi*(groupW+groupGap);
    const vals=[...r.cells, r.ob||0];   // cells 는 업무 카테고리만 — 설치 OB 는 별도 필드 (VOC 는 전체현황에서 제외)
    const bars=cats.map((c,ci)=>{
      const v=vals[ci];
      const bx=gx+ci*(barW+barGap);
      if(v<=0) return `<rect x="${bx}" y="${base-2}" width="${barW}" height="2" rx="1" style="fill:var(--line-soft)"/>`;
      const h=v/mx*plotH, y=base-h;
      return `<rect x="${bx}" y="${y.toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" rx="2.5" fill="${c.color}"><title>${r.emp} · ${c.name} ${v}건</title></rect>`
        + `<text x="${bx+barW/2}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" style="fill:var(--ink-soft)">${v}</text>`;
    }).join("");
    const sep = gi>0 ? `<line x1="${(gx-groupGap/2).toFixed(1)}" y1="${topPad}" x2="${(gx-groupGap/2).toFixed(1)}" y2="${base}" stroke="var(--line-soft)"/>` : "";
    const name = `<text class="emp-click" x="${gx+groupW/2}" y="${base+22}" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--ink);cursor:pointer" onclick="showDoneDetail('emp','${r.emp}')"><title>🔎 ${r.emp}님 처리 내역 보기</title>${r.emp}</text>`;
    const tot = `<text x="${gx+groupW/2}" y="${base+38}" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--gray2)">합계 ${r.total}</text>`;
    return sep+bars+name+tot;
  }).join("");
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <line x1="${padL-8}" y1="${base}" x2="${W-padR+8}" y2="${base}" style="stroke:var(--line)"/>
    ${groups}
  </svg></div>`;
}
// 단일 카테고리 세로 막대차트 (직원별) — 외주 등
function simpleColumn(pairs, color){

/* ================= VOC (고객 설문) page ================= */
// 기간 내 VOC 집계 합산
function aggVoc(dates){
  const agg={responses:0,install:{count:0,low:0},nps:{count:0,low:0},high:{install:0,nps:0},npsDist:{},installDist:{},byIndustry:{},byTenure:{},byVan:{},reasonCounts:{},alerts:[],praises:[]};
  const mergePair=(dst,src)=>{ for(const k in (src||{})){ if(!dst[k])dst[k]={total:0,low:0}; dst[k].total+=src[k].total||0; dst[k].low+=src[k].low||0; } };
  dates.forEach(d=>{ const v=(slackDay(d)||{}).voc; if(!v) return;
    agg.responses+=v.responses||0;
    if(v.install){agg.install.count+=v.install.count||0; agg.install.low+=v.install.low||0;}
    if(v.nps){agg.nps.count+=v.nps.count||0; agg.nps.low+=v.nps.low||0;}
    if(v.high){agg.high.install+=v.high.install||0; agg.high.nps+=v.high.nps||0;}
    for(const k in (v.npsDist||{})) agg.npsDist[k]=(agg.npsDist[k]||0)+v.npsDist[k];
    for(const k in (v.installDist||{})) agg.installDist[k]=(agg.installDist[k]||0)+v.installDist[k];
    for(const k in (v.byIndustry||{})) agg.byIndustry[k]=(agg.byIndustry[k]||0)+v.byIndustry[k];
    for(const k in (v.reasonCounts||{})) agg.reasonCounts[k]=(agg.reasonCounts[k]||0)+v.reasonCounts[k];
    mergePair(agg.byTenure, v.byTenure); mergePair(agg.byVan, v.byVan);
    (v.alerts||[]).forEach(a=>agg.alerts.push(Object.assign({date:d},a)));
    (v.praises||[]).forEach(p=>agg.praises.push(Object.assign({date:d},p)));
  });
  return agg;
}
// NPS 지표 계산
function vocNpsStats(dist){
  let total=0,prom=0,pass=0,det=0,sum=0;
  for(const k in dist){ const s=+k,c=dist[k]; total+=c; sum+=s*c; if(s>=9)prom+=c; else if(s>=7)pass+=c; else det+=c; }
  return {total,prom,pass,det, nps: total?Math.round((prom-det)/total*100):0, avg: total?(sum/total):0};
}
function avgScore(dist){ let t=0,s=0; for(const k in dist){t+=dist[k]; s+=(+k)*dist[k];} return t?(s/t):0; }
// 점수 분포 세로 막대
function distColumnChart(dist, maxScore, colorFn){
  const scores=[]; for(let i=0;i<=maxScore;i++) scores.push(i);
  const counts=scores.map(s=>dist[s]||0), mx=Math.max(1,...counts);

  const W=Math.max(360, padL+padR+n*(bw+gap));

    return `<rect x="${x}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="3" fill="${colorFn(s)}"></rect>`
      +(c>0?`<text x="${x+bw/2}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" style="fill:var(--ink-soft)">${c}</text>`:'')
      +`<text x="${x+bw/2}" y="${base+15}" text-anchor="middle" font-size="10.5" font-weight="600" style="fill:var(--gray2)">${s}</text>`;}).join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><line x1="${padL-4}" y1="${base}" x2="${W-padR+4}" y2="${base}" stroke="#d2d2d7"/>${bars}</svg></div>`;

// 전월 대비 타일 (higherBad=true면 증가가 나쁨→빨강)
function momTile(label,cur,prev,higherBad,suffix,tone){
  const diff=cur-prev, good=higherBad?diff<0:diff>0, cls=diff===0?'flat':(good?'up':'down'), arrow=diff>0?'▲':diff<0?'▼':'–';
  const pct=prev?Math.round(Math.abs(diff)/Math.abs(prev)*100)+'%':(cur?'신규':'0%');
  return `<div class="kpi ${tone||''}"><div class="lab">${label}</div><div class="val">${cur}${suffix||'<small>건</small>'}</div>
    <div class="delta ${cls}">${arrow} ${pct} <span style="color:var(--gray2);font-weight:500">전월 ${prev}</span></div></div>`;
}
function progressBar(pct,color){ return `<div class="prog"><div class="prog-fill" style="width:${Math.min(100,pct)}%;background:${color}"></div></div>`; }
// 전월 대비 인라인 칩 — o.unit('%p'/'점'/'건'), o.digits(소수 자리), o.higherBad(증가가 나쁨)
// .mom.up = 빨강(악화), .mom.down = 초록(개선) 규칙이라 '좋아졌으면 down' 클래스를 준다.
function momChip(cur, prev, o){
  o=o||{}; const d=(cur||0)-(prev||0), dg=o.digits||0;
  const f=n=>Number(n||0).toFixed(dg);
  if(prev==null || (!prev && !cur)) return '';
  const cls = d===0 ? 'same' : ((o.higherBad ? d<0 : d>0) ? 'down' : 'up');
  const arrow = d>0?'▲':d<0?'▼':'–';
  const bu = o.unit==='%p' ? '%' : (o.unit||'');   // 증감은 %p, 전월 값 자체는 %
  return `<span class="mom ${cls}" title="전월 ${f(prev)}${bu}">${arrow} ${f(Math.abs(d))}${o.unit||''} <span style="font-weight:600;opacity:.75">전월 ${f(prev)}${bu}</span></span>`;
}

// 팀 공유 시 '남의 필드를 지우는' 사고를 막기 위한 패치 본문 생성.
//
// 서버는 patch 의 키 값을 통째로 대입한다 → 두 사람이 같은 건의 다른 필드
// (한 명은 상태, 한 명은 처리내용)를 비슷한 시각에 고치면, 나중 사람이 보낸 객체에
// 앞사람 필드가 없어서 앞사람 편집이 사라진다. 그래서 지운 필드는 빠뜨리는 대신
// 명시적으로 null 을 실어 보낸다(백엔드가 필드 단위 병합을 하면 그 필드만 삭제).
// 백엔드가 아직 구버전이어도 안전하다 — null 이 그대로 저장되고, 읽는 쪽은
// ed.note!=null / ed.status||... 처럼 전부 null 을 기본값으로 흘려보낸다.
function fieldPatch(obj, field, val){
  const p = Object.assign({}, obj||{});
  if(val==='') p[field]=null;    // 이 필드만 삭제하라는 표시
  return p;
}
function saveVocEdit(key, field, val){
  if(!VOCEDIT[key]) VOCEDIT[key]={};
  if(val==='') delete VOCEDIT[key][field]; else VOCEDIT[key][field]=val;
  // 표에서 직접 처리완료로 바꾼 건은 슬랙 자동 완료일(doneDate)이 없다 → 바꾼 날짜를 완료일로 찍는다.
  // 직원별 VOC 처리 집계가 '완료일 기준'이라, 이걸 안 찍으면 지정한 담당자 실적이 잡히지 않는다.
  // 오적재는 처리 실적이 아니므로(vocVoid) 제외한다.
  if(field==='status'){
    if(vocDone(val)&&!vocVoid(val)){ if(!VOCEDIT[key].doneAt) VOCEDIT[key].doneAt=ymd(today()); }
    else delete VOCEDIT[key].doneAt;
  }
  const gone = Object.keys(VOCEDIT[key]).length===0;
  if(gone) delete VOCEDIT[key];
  save(LS_VOCEDIT, VOCEDIT);
  pushPatch({vocEdit:{[key]: gone ? '' : fieldPatch(VOCEDIT[key], field, val)}});
  if(field==='reasonCat'||field==='status') renderVoc();   // 사유차트/상태이동 반영
}

let VOCDRILL={}, vdSeq=0;   // 업종/이유 클릭 → 큰 모달로 보여줄 상세 저장
// 전월 대비 비교 맵: {name:{isNew}|{rankDelta,pctDelta}}  (저점이라 ↑=악화(빨강), ↓=개선(파랑))

let VOCCMP=null;   // renderVocMonthly에서 이번달·전월 스냅샷을 채움

// 순위표 — 1위부터 쭉 (건수·비중, 상대 월 대비 순위 변동)
function vocRankPanel(entries, otherEntries){
  const total=entries.reduce((a,e)=>a+e[1].length,0)||1;
  const orank={}; otherEntries.forEach(([n],i)=>{ orank[n]=i+1; });
  if(!entries.length) return '<div class="empty-note">인입 없음</div>';
  return `<div class="vc-rank">`+entries.map(([name,items],i)=>{
    const n=items.length, pct=Math.round(n/total*100), pr=orank[name];
    const chg = pr==null ? '<span class="mom new">NEW</span>'
      : pr-(i+1)>0 ? `<span class="mom down" title="상대 월 대비 ${pr-(i+1)}단계 상승">▲${pr-(i+1)}</span>`
      : pr-(i+1)<0 ? `<span class="mom up" title="상대 월 대비 ${(i+1)-pr}단계 하락">▼${(i+1)-pr}</span>`
      : '<span class="mom same">=</span>';
    return `<div class="vc-rrow"><span class="vc-rk ${i<3?'top':''}">${i+1}</span><span class="vc-rname">${escapeHtml(name)}</span><span class="vc-rcnt">${n}건 <span style="color:var(--gray2);font-weight:600">${pct}%</span></span>${chg}</div>`;
  }).join('')+`</div>`;
}
function openVocCompare(kind){

  else if(kind==='ind'||kind==='rea'){ const g=C[kind];
    title=(kind==='ind'?'🏭 업종별 인입':'😟 인입 이유별')+' — 전월 순위 비교';
    body=vocCmpBox(L.cur+' (이번달)','cur',vocRankPanel(g.cur,g.prev))+vocCmpBox(L.prev+' (전월)','prev',vocRankPanel(g.prev,g.cur)); }
  else return;
  let el=document.getElementById('vocCmpModal');
  if(!el){ el=document.createElement('div'); el.id='vocCmpModal'; el.className='detail-overlay'; el.onclick=e=>{ if(e.target===el) el.remove(); }; document.body.appendChild(el); }
  el.innerHTML=`<div class="detail-box" style="max-width:860px">
    <div class="detail-head"><h3>${title}</h3><button class="detail-x" onclick="document.getElementById('vocCmpModal').remove()">✕</button></div>
    <div class="detail-scroll"><div class="vc-grid">${body}</div></div></div>`;
}
function buildMoMCmp(cur, prev, total, prevTotal){
  const pr={}, pp={}, pc={}; prev.forEach(([n,it],i)=>{ pr[n]=i+1; pp[n]=Math.round(it.length/(prevTotal||1)*100); pc[n]=it.length; });
  const m={};
  cur.forEach(([n,it],i)=>{ const cr=i+1, cp=Math.round(it.length/(total||1)*100);
    m[n] = (pr[n]==null) ? {isNew:true, pctDelta:cp} : {rankDelta:pr[n]-cr, pctDelta:cp-pp[n], prevRank:pr[n], prevCnt:pc[n]}; });
  return m;
}
function momBadge(c){
  if(!c) return '<span class="mom-wrap"><span class="mom same" title="전월 데이터 없음">–</span></span>';
  if(c.isNew) return '<span class="mom-wrap"><span class="mom new" title="전월 미인입 신규">NEW</span></span>';
  const rd=c.rankDelta, pd=c.pctDelta;
  const rank = rd>0?`<span class="mom up" title="순위 ${rd}단계 상승(악화)">▲${rd}</span>`:rd<0?`<span class="mom down" title="순위 ${-rd}단계 하락(개선)">▼${-rd}</span>`:`<span class="mom same" title="순위 동일">순위=</span>`;
  const pct = pd>0?`<span class="mom up" title="비중 ${pd}%p 증가">+${pd}%p</span>`:pd<0?`<span class="mom down" title="비중 ${-pd}%p 감소">${pd}%p</span>`:`<span class="mom same">0%p</span>`;
  return `<span class="mom-wrap">${rank}${pct}</span>`;
}
function vocGroupDrill(entries, max, color, topReason, cmp){
  const total=entries.reduce((a,e)=>a+e[1].length,0)||1;   // 전체 모수(인입 합계)
  return entries.map(([name, items], idx)=>{
    const cnt=items.length, pct=Math.round(cnt/total*100);
    const rank=idx+1, rankCls=rank<=3?'r'+rank:'', rowCls=rank<=3?' top'+rank:'';
    let topLine='';
    if(topReason){
      const rc={}; items.forEach(x=>rc[x.rea]=(rc[x.rea]||0)+1);
      const rows=Object.entries(rc).sort((a,b)=>b[1]-a[1]);
      const rmax=Math.max(1,...rows.map(r=>r[1]));
      topLine=`<div class="vd-reasons">
        <div class="vd-reasons-h">🥇 가장 많은 이유: <b>${escapeHtml(rows[0][0].split('(')[0])}</b> (${rows[0][1]}건, ${Math.round(rows[0][1]/cnt*100)}%) · 전체 이유 ${rows.length}개</div>
        ${rows.map(([r,c])=>`<div class="vd-rrow"><span class="vd-rname" title="${escapeHtml(r)}">${escapeHtml(r.split('(')[0])}</span><span class="vd-rbar"><span style="width:${c/rmax*100}%"></span></span><span class="vd-rcnt">${c}건 <span class="vd-rpct">${Math.round(c/cnt*100)}%</span></span></div>`).join('')}
      </div>`;
    }
    const nm=name.split('(')[0], id='vd'+(vdSeq++);
    // 업종 드릴은 처음 화면에 '인입 이유'만 보이게 → 매장별 상세는 접어둠(클릭 시 펼침). 이유별 드릴은 매장 상세를 바로 표시.
    const bodyHtml = topLine
      ? `${topLine}<details class="vd-stores"><summary>🏪 매장별 상세 보기 (${cnt}곳)</summary>${storeDetailList(items)}</details>`
      : storeDetailList(items);
    VOCDRILL[id]={title:nm, cnt, pct, icon:topReason?'🏭':'😟', html:bodyHtml};
    const cc=cmp?cmp[name]:null;
    const prevInfo=cc?(cc.isNew?'<span class="vd-prev new" title="전월 미인입">전월 없음</span>':`<span class="vd-prev" title="전월 순위·건수">전월 <b>${cc.prevRank}위</b>·${cc.prevCnt}건</span>`):'';
    return `<div class="voc-drill-sum${rowCls}" onclick="showVocDrill('${id}')" title="클릭 → 크게 보기">
      <span class="vd-rank ${rankCls}">${rank}위</span><span class="vd-name">${escapeHtml(nm)}</span><span class="vd-bar"><span class="vd-fill" style="width:${cnt/max*100}%;background:${color}"></span></span><span class="vd-cnt">${cnt}건 <span class="vd-pct">${pct}%</span></span>${cmp?momBadge(cmp[name]):''}${prevInfo}<span class="vd-open">🔍</span>
    </div>`;
  }).join('');
}
function showVocDrill(id){ const d=VOCDRILL[id]; if(!d) return;
  let el=document.getElementById('vocDrillModal'); if(!el){ el=document.createElement('div'); el.id='vocDrillModal'; el.className='detail-overlay'; el.onclick=e=>{ if(e.target===el) el.remove(); }; document.body.appendChild(el); }
  el.innerHTML=`<div class="detail-box vd-modal"><div class="detail-head"><h3>${d.icon||'🔎'} ${escapeHtml(d.title)} <span class="cnt-badge">${d.cnt}건 · ${d.pct}%</span></h3><button class="detail-x" onclick="document.getElementById('vocDrillModal').remove()">✕</button></div><div class="detail-scroll vd-modal-body">${d.html}</div></div>`;
}
// ── 업종/이유 섹션 자동 코멘트(데이터 분석 기반) + 코멘트 칸 ──
let VOCMOMDATA=null;   // renderVocMonthly가 채우는 스냅샷(자동 코멘트 재생성용)
function autoComment(entries, cmp, total, kind){
  if(!entries || !entries.length) return `이번 달 ${kind}별 저점 인입이 없습니다.`;
  const nm=e=>e[0].split('(')[0];
  const t=entries[0], tn=nm(t), tc=t[1].length, tp=Math.round(tc/(total||1)*100), c=cmp[t[0]]||{};
  let s=`이번 달 ${kind}별 저점은 '${tn}' ${tc}건(${tp}%)으로 1위입니다.`;
  if(c.isNew) s+=` 전월엔 없던 신규 최다 항목이라 원인 점검이 필요합니다.`;
  else if(c.rankDelta>0) s+=` 전월 대비 ${c.rankDelta}단계 상승했습니다.`;
  else if(c.rankDelta<0) s+=` 전월 대비 ${-c.rankDelta}단계 내렸지만 여전히 1위입니다.`;
  else s+=` 전월과 같은 1위입니다.`;
  if(c.pctDelta>0) s+=` 비중은 전월比 ${c.pctDelta}%p 증가.`;
  else if(c.pctDelta<0) s+=` 비중은 전월比 ${-c.pctDelta}%p 감소.`;
  const arr=entries.map(e=>({n:nm(e), c:cmp[e[0]]||{}}));
  const rise=arr.filter(x=>!x.c.isNew && (x.c.pctDelta||0)>=5 && x.n!==tn).sort((a,b)=>b.c.pctDelta-a.c.pctDelta)[0];
  if(rise) s+=` 특히 '${rise.n}'이 ${rise.c.pctDelta}%p 급증해 주의가 필요합니다.`;
  const news=arr.filter(x=>x.c.isNew && x.n!==tn).map(x=>x.n).slice(0,2);
  if(news.length) s+=` 신규 유입: ${news.join(', ')}.`;
  const fall=arr.filter(x=>(x.c.pctDelta||0)<=-5 && x.n!==tn).sort((a,b)=>a.c.pctDelta-b.c.pctDelta)[0];
  if(fall) s+=` 반면 '${fall.n}'은 ${-fall.c.pctDelta}%p 감소해 개선세입니다.`;
  return s;
}
function vocSecCommentBox(type, mkey, entries, cmp, total, kind){
  const key=mkey+'|'+type, saved=VOCCOMMENT[key];
  const shown=(saved!=null&&saved!=='')?saved:autoComment(entries,cmp,total,kind);
  return `<div class="voc-sec-comment">
    <div class="vsc-head"><span>💬 코멘트</span><button class="btn xs" onclick="genVocSecComment('${type}')" title="전월 대비 데이터로 코멘트 자동 작성">🤖 자동 코멘트 생성</button></div>
    <textarea class="voc-comment sm" id="vsc-${type}" placeholder="전월 대비 인사이트를 적거나 AI 자동 생성을 눌러보세요 (자동 저장)" onchange="saveVocComment('${key}', this.value)">${escapeHtml(shown)}</textarea>
  </div>`;
}
function genVocSecComment(type){
  const d=VOCMOMDATA; if(!d) return;
  const src = type==='ind' ? {e:d.indEntries, c:d.indCmp, k:'업종'} : {e:d.reaEntries, c:d.reaCmp, k:'이유'};
  const txt = autoComment(src.e, src.c, d.total, src.k);
  const ta=document.getElementById('vsc-'+type); if(ta){ ta.value=txt; saveVocComment(d.mkey+'|'+type, txt); }
}

      <div class="vday-grid">${lastNDays(10).map(d=>{ const n=vDoneByDay[d]||0; return `<div class="vday${n>0?' has':''}"><div class="vday-n">${n}</div><div class="vday-d">${fmtShort(d)}</div></div>`; }).join('')}</div>

// 일별 인입 추이 — 막대 폭을 날짜 수에 맞춰 계산해 카드 가로폭을 꽉 채움(빈 공간 없음)
function vocDailyTrend(dates){
  const counts=dates.map(d=>{ const vv=(slackDay(d)||{}).voc; return vv?(vv.alerts||[]).length:0; });
  const mx=Math.max(1,...counts);
  const n=Math.max(1,dates.length), padL=14, padR=14, H=190, base=H-30, plotH=H-48;
  const W=880;                                   // 기준 폭(가로 100%로 늘어남) — 슬롯을 균등 분할해 막대를 두껍게
  const slot=(W-padL-padR)/n, bw=Math.max(6, slot*0.82), gap=slot-bw;
  const fs=Math.max(8, Math.min(13, slot*0.46));   // 날짜·건수 글자도 막대 폭에 맞춰 조정
  const bars=dates.map((d,i)=>{ const c=counts[i], h=c/mx*plotH, x=padL+i*slot+gap/2, y=base-h, day=parseYmd(d).getDate(), holi=HOLIDAYS[d];
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${c>0?'#ff3b30':'#ececf0'}"><title>${fmtShort(d)}${holi?' · '+holi:''} · ${c}건</title></rect>`
      +(c>0?`<text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="${fs.toFixed(1)}" font-weight="800" style="fill:var(--ink-soft)">${c}</text>`:'')
      +`<text x="${(x+bw/2).toFixed(1)}" y="${base+16}" text-anchor="middle" font-size="${(fs*0.92).toFixed(1)}" font-weight="${dateAxisBold(d)?'800':'600'}" style="fill:${dateAxisColor(d)}">${day}${holi?`<title>${escapeHtml(holi)}</title>`:''}</text>`;
  }).join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" style="display:block"><line x1="${padL-4}" y1="${base}" x2="${W-padR+4}" y2="${base}" stroke="#d2d2d7"/>${bars}</svg></div>`;
}

function vocMonthNav(n){ const r=parseYmd(selDate); selDate=ymd(new Date(r.getFullYear(), r.getMonth()+n, 1)); renderVocMonthly(); }
function vocMonthToday(){ selDate=ymd(today()); renderVocMonthly(); }
function saveVocComment(mkey, text){ if(text&&text.trim()) VOCCOMMENT[mkey]=text; else delete VOCCOMMENT[mkey]; save(LS_VOCCOMMENT, VOCCOMMENT); pushPatch({vocComment:{[mkey]:VOCCOMMENT[mkey]||''}}); }
function vocGenComment(mkey){
  const {v,byInd,byReason,totalIn}=vocMonthAgg();
  const ti=Object.entries(byInd).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const tr=Object.entries(byReason).sort((a,b)=>b[1]-a[1]).slice(0,3);
  let s=`[${mkey} VOC 먼슬리 요약]\n`;
  s+=`• 총 응답 ${v.responses}건 중 VOC 인입(저점) ${totalIn}건 (저점률 ${v.responses?Math.round(totalIn/v.responses*100):0}%)\n`;
  s+=`• 구매설치 저점 ${v.install.low}건 · 추천의향 저점 ${v.nps.low}건\n`;
  if(ti.length) s+=`• 업종: ${ti.map(([n,c])=>n+' '+c+'건').join(' / ')}\n`;
  if(tr.length) s+=`• 주요 사유: ${tr.map(([n,c])=>n.split('(')[0]+' '+c+'건').join(' / ')}\n`;
  s+=`• 인사이트/액션: `;
  const el=document.getElementById('vocComment'); if(el){ el.value=s; el.focus(); }
  saveVocComment(mkey, s);
}

/* ================= Stats page ================= */
function renderStats(){
  const cat = CATEGORIES.find(c=>c.key===activeCat);
  const dayDates   = rangeDates("day", selDate);
  const weekDates  = rangeDates("week", selDate);
  const monthDates = rangeDates("month", selDate);

  const todayTotal = sumRange(activeCat, dayDates);
  const weekTotal  = sumRange(activeCat, weekDates);
  const monthTotal = sumRange(activeCat, monthDates);

  const prevDay   = sumRange(activeCat, [ymd(addDays(parseYmd(selDate),-1))]);
  const prevWeek  = sumRange(activeCat, rangeDates("week", ymd(addDays(startOfWeek(parseYmd(selDate)),-7))));

function kpiCard(lab, val, prev, tag){
  const diff = val-prev;
  const cls = diff>0?"up":diff<0?"down":"flat";
  const arrow = diff>0?"▲":diff<0?"▼":"–";
  const pct = prev>0? Math.round(Math.abs(diff)/prev*100)+"%" : (val>0?"신규":"0%");
  return `<div class="kpi">
    <div class="lab">${lab}</div>
    <div class="val">${val}<small>건</small></div>
    <div class="delta ${cls}">${arrow} ${pct} <span style="color:var(--gray2);font-weight:500">${tag}</span></div>
  </div>`;
}
function kpiPlain(lab, val){
  return `<div class="kpi">
    <div class="lab">${lab}</div>
    <div class="val">${val.toFixed(1)}<small>건</small></div>
    <div class="delta flat">평균 처리량</div>
  </div>`;
}
function medal(i){ return i===0?"🥇":i===1?"🥈":i===2?"🥉":`<span style="color:var(--gray2)">${i+1}.</span>`; }
function viewRangeText(mode,ref){
  const dates=rangeDates(mode,ref);
  if(mode==="day") return fmtKDate(parseYmd(ref));
  return `${fmtShort(dates[0])} ~ ${fmtShort(dates[dates.length-1])}`;
}

// 7일 스파크라인
function spark(cat,emp){
  const end=parseYmd(selDate); let vals=[];
  for(let i=6;i>=0;i--) vals.push(getCount(cat,ymd(addDays(end,-i)),emp));
  const mx=Math.max(1,...vals);
  return `<span class="spark">${vals.map(v=>{
    const h=Math.max(3, v/mx*22);
    return `<i class="${v===mx&&v>0?'hi':''}" style="height:${h}px"></i>`;}).join("")}</span>`;
}

// 기간 추이 막대 차트 (SVG)
function trendChart(cat, mode, ref){
  const dates = rangeDates(mode, ref);
  const vals = dates.map(d=> sumRange(cat,[d]));
  const mx = Math.max(1, ...vals);
  const gapUnit = Math.min(64, Math.max(30, 720/dates.length));
  const W=Math.max(560, dates.length*gapUnit);
  const H=220, pad=28, gap=(W-pad*2)/dates.length, bw=gap*0.6;
  const bars = dates.map((d,i)=>{
    const v=vals[i]; const h=(H-50)*(v/mx);
    const x=pad + i*gap + (gap-bw)/2, y=H-30-h;
    const dd=parseYmd(d); const isToday=d===ymd(today());
    const holi=HOLIDAYS[d];
    const lbl = mode==="month"? (dd.getDate()) : `${dd.getMonth()+1}/${dd.getDate()}`;
    const col = isToday? "var(--purple)" : "#cfe3fb";   // 오늘 막대 — 토요일 파랑과 겹치지 않게
    const lblCol = dateAxisColor(d), lblW = dateAxisBold(d) ? 700 : 400;
    return `<g>
      <rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${col}"></rect>
      ${v>0?`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--ink-soft)">${v}</text>`:''}
      <text x="${x+bw/2}" y="${H-12}" text-anchor="middle" font-size="10" font-weight="${lblW}" style="fill:${lblCol}">${lbl}${holi?`<title>${escapeHtml(holi)}</title>`:""}</text>
    </g>`;
  }).join("");
  const total = vals.reduce((a,b)=>a+b,0);
  return `<div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
      <line x1="${pad}" y1="${H-30}" x2="${W-pad}" y2="${H-30}" stroke="var(--line)" stroke-width="1"></line>
      ${bars}
    </svg>
  </div>
  <div class="legend">
    <span><span class="swatch" style="background:#cfe3fb"></span>처리건수</span>
    <span><span class="swatch" style="background:var(--purple)"></span>오늘</span>
    <span><span class="swatch" style="background:var(--sat)"></span>토요일</span>
    <span><span class="swatch" style="background:var(--sun)"></span>일요일 · 공휴일</span>
    <span style="margin-left:auto;font-weight:600;color:var(--ink)">기간 합계 ${total}건</span>
  </div>`;
}

const DUTY_SLOTS=[['day','주간','☀️'],['aft','오후','🌇'],['nit','야간','🌙'],['inst','행사','🎪']];

// 달력을 훑기 전에 “누가 당직인지”부터 보여준다
function dutyHeroHTML(){
  const t=today(), tds=ymd(t), rToday=dutyOf(tds);

  const ds=hasToday?tds:dutyNextDutyDate();
  const d=ds?parseYmd(ds):t, r=ds?dutyOf(ds):{};

  let sub;
  if(hasToday){
    const nt=addDays(t,1), nr=dutyOf(ymd(nt));
    const next=DUTY_SLOTS.map(([k,lab])=>`${lab} ${nr[k]?`<b>${escapeHtml(nr[k])}</b>`:'<span class="none">미지정</span>'}`).join(" · ");
    sub=`내일 ${dutyDowLabel(nt)} · ${next}`;
  }else if(ds){

function renderDuty(){
  const y=dutyMonth.getFullYear(), m=dutyMonth.getMonth();
  const first=new Date(y,m,1), lastDate=new Date(y,m+1,0).getDate();
  const lead=first.getDay();
  const cells=[];
  for(let i=0;i<lead;i++) cells.push(null);
  for(let d=1;d<=lastDate;d++) cells.push(d);

  const dows=["일","월","화","수","목","금","토"];
  const todayStr=ymd(today());

  const dayCells = cells.map(d=>{
    if(d===null) return `<div class="daycell empty"></div>`;
    const dateObj=new Date(y,m,d), ds=ymd(dateObj), dow=dateObj.getDay();
    const holi=HOLIDAYS[ds]; const isSun=dow===0||!!holi; const isSat=dow===6;
    const rec=dutyOf(ds);
    const numCls = isSun?"s-sun":isSat?"s-sat":"";
    const memo=dutyMemoText(ds);
    return `<div class="daycell ${ds===todayStr?'today':''} ${holi?'holi':''}">
      <div class="dnum memo-open ${numCls} ${ds===todayStr?'is-today':''}" title="클릭 → 이 날짜 메모" onclick="openDutyMemo('${ds}')"><span class="dn-n">${d}</span>${holi?`<span class="holi-tag">${holi}</span>`:''}
        <button class="memo-btn ${memo?'on':''}" title="${memo?'메모 보기·수정':'메모 추가'}" onclick="event.stopPropagation();openDutyMemo('${ds}')">📝</button></div>
      ${slot("day","주간",ds,rec.day)}
      ${slot("aft","오후",ds,rec.aft)}
      ${slot("nit","야간",ds,rec.nit)}
      ${slot("inst","행사",ds,rec.inst)}
      ${memo?`<div class="memo-chip" title="클릭 → 메모 수정" onclick="openDutyMemo('${ds}')">${escapeHtml(memo)}</div>`:''}
    </div>`;
  }).join("");

  document.getElementById("main").innerHTML = `
    <div class="page-head">
      <div>
        <h2>📅 당직근무</h2>
        <div class="sub">${(function(){
          const D=window.DUTY_DATA;
          if(D&&Object.keys(D.days||{}).length) return `<a href="${D.url}" target="_blank" rel="noopener"><b>원격 당직시트</b></a>를 자동으로 불러옵니다 (${D.updatedAt} 기준 ${Object.keys(D.days).length}일). <b>여기서 고친 값이 시트보다 우선</b>이라 동기화에 지워지지 않고, <span style="background:#fff7e6;border:1px solid #f0c36d;border-radius:4px;padding:0 4px">노란 칸</span>으로 표시됩니다. ↺ 를 누르면 시트 값으로 되돌아갑니다.`;
          return '날짜별 주간 · 오후 · 야간 · 행사 담당자를 지정하세요. 항목을 클릭하면 바로 수정됩니다. 날짜(또는 📝)를 클릭하면 그 날짜에 메모를 남길 수 있습니다.';
        })()}</div>
      </div>
      <div class="controls">
        <button class="btn" onclick="dutyToday()">이번 달</button>
      </div>
    </div>

    ${dutyHeroHTML()}
    <div class="card">
      <div class="cal-toolbar">
        <button class="navround" onclick="dutyNav(-1)">‹</button>
        <div class="mtitle">${y}년 ${m+1}월</div>
        <button class="navround" onclick="dutyNav(1)">›</button>
      </div>
      <div class="cal-grid">
        ${dows.map((w,i)=>`<div class="dow ${i===6?'s-sat':i===0?'s-sun':''}">${w}</div>`).join("")}
        ${dayCells}
      </div>
      <div class="legend">
        <span><span class="swatch" style="background:var(--sat)"></span>토요일</span>
        <span><span class="swatch" style="background:var(--sun)"></span>일요일 · 공휴일</span>
        ${DUTY_SLOTS.map(([k,lab])=>`<span><span class="slot-tag ${k}" style="width:auto;padding:2px 7px">${lab}</span></span>`).join("")}
        <span style="margin-left:auto">이름을 클릭하면 바로 고칠 수 있어요</span>
      </div>
    </div>
  `;
}
function slot(type,label,ds,val){
  const cls = type==="day"?"day":type==="aft"?"aft":type==="nit"?"nit":"inst";
  const ovr = dutyIsOverride(ds,type);
  const sheetVal = dutySheetOf(ds)[type] || '';
  // 여기서 고친 값이 시트를 이긴다. 비우면 다시 시트 값으로 돌아간다.
  const tip = ovr ? `대시보드에서 수정한 값 (시트: ${sheetVal||'없음'}) · 비우면 시트 값으로 되돌아갑니다`
                  : (sheetVal ? '당직시트 값 · 고치면 이 값 대신 표시됩니다' : '');
  return `<div class="duty-slot ${val?'on':'off'}"><span class="slot-tag ${cls}">${label}</span>
    <div class="slot-field${ovr?' ovr':''}" contenteditable="true" spellcheck="false"${tip?` title="${escapeHtml(tip)}"`:''}
      onblur="saveDuty('${ds}','${type}',this.innerText)">${val?escapeHtml(val):''}</div>
    ${ovr?`<button class="ovr-undo" title="시트 값으로 되돌리기" onclick="saveDuty('${ds}','${type}','')">↺</button>`:''}
  </div>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function saveDuty(ds,type,text){
  const v=text.trim();
  const before=JSON.stringify(DUTY[ds]||{});
  if(!DUTY[ds]) DUTY[ds]={};
  // 시트 값과 같아지면 덮어쓰기를 지운다 — 굳이 남겨두면 나중에 시트가 바뀌어도 옛 값에 묶인다
  if(v && v!==(dutySheetOf(ds)[type]||'')) DUTY[ds][type]=v; else delete DUTY[ds][type];
  if(DUTY[ds] && Object.keys(DUTY[ds]).length===0) delete DUTY[ds];
  save(LS_DUTY, DUTY); pushDutyDates([ds]);
  if(JSON.stringify(DUTY[ds]||{})!==before) renderDuty();   // 덮어쓰기 표시·되돌리기 버튼 갱신
}
function dutyNav(n){ dutyMonth=new Date(dutyMonth.getFullYear(), dutyMonth.getMonth()+n, 1); renderDuty(); }
function dutyToday(){ dutyMonth=new Date(today().getFullYear(), today().getMonth(), 1); renderDuty(); }

/* ===== 날짜 메모 (당직근무 달력) ===== */
let dutyMemoDate = "";
function dutyMemoText(ds){ const v=DUTYMEMO[ds]; return (typeof v==="string"?v:"").trim(); }   // ''(묘비)는 메모 없음으로 취급
function dutyMemoLabel(ds){
  const p=ds.split("-").map(Number), dt=new Date(p[0],p[1]-1,p[2]);
  const w=["일","월","화","수","목","금","토"][dt.getDay()];
  return `${p[0]}년 ${p[1]}월 ${p[2]}일 (${w})${HOLIDAYS[ds]?` · ${HOLIDAYS[ds]}`:""}`;
}
function openDutyMemo(ds){
  dutyMemoDate=ds;
  const cur=dutyMemoText(ds);
  document.getElementById("dmDate").textContent = dutyMemoLabel(ds);
  document.getElementById("dmText").value = cur;
  document.getElementById("dmDelete").style.display = cur?"":"none";
  document.getElementById("dutyMemoOverlay").classList.add("show");
  setTimeout(()=>{ const t=document.getElementById("dmText"); t.focus(); t.setSelectionRange(cur.length,cur.length); }, 60);
}
function closeDutyMemo(){ document.getElementById("dutyMemoOverlay").classList.remove("show"); dutyMemoDate=""; }
function saveDutyMemo(){
  const ds=dutyMemoDate; if(!ds) return;
  const v=(document.getElementById("dmText").value||"").trim();
  if(v) DUTYMEMO[ds]=v; else delete DUTYMEMO[ds];
  save(LS_DUTYMEMO, DUTYMEMO); pushDutyMemo(ds);
  closeDutyMemo(); renderDuty();
}
function deleteDutyMemo(){
  const ds=dutyMemoDate; if(!ds) return;
  if(!confirm("이 날짜의 메모를 삭제할까요?")) return;
  delete DUTYMEMO[ds];
  save(LS_DUTYMEMO, DUTYMEMO); pushDutyMemo(ds);
  closeDutyMemo(); renderDuty();
}

/* ================= Share (공유 일정) page ================= */
function shareEvents(ds){
  let list = SHARE[ds] || [];
  if(shareFilter!=="all") list = list.filter(e=>e.emp===shareFilter);
  return list;
}
function typeMeta(t){ return SHARE_TYPES[t] || SHARE_TYPES.etc; }

// 여러 날 일정 = 같은 grp 로 묶인 하루짜리 이벤트들. 2일 이상인 묶음만 막대로 그린다.
function shareGroups(){
  const g={};
  for(const ds in SHARE) shareEvents(ds).forEach(e=>{
    if(!e.grp) return;
    const x=g[e.grp]=g[e.grp]||{grp:e.grp, ev:e, ids:{}};
    x.ids[ds]=e.id;
  });
  const out={};
  for(const k in g){ const days=Object.keys(g[k].ids).sort(); if(days.length<2) continue;
    out[k]=Object.assign(g[k], {a:days[0], b:days[days.length-1], n:days.length}); }
  return out;
}
// 주(달력 한 줄)마다 막대에 레인(세로 칸)을 배정 — 같은 일정은 그 주 안에서 같은 높이에 놓여야 이어져 보인다
function shareBarLanes(cells, y, m, groups){
  const weeks=[], at={};
  for(let w=0; w*7<cells.length; w++){
    const days=cells.slice(w*7, w*7+7).filter(d=>d!==null).map(d=>ymd(new Date(y,m,d)));
    const hit=Object.values(groups).map(x=>({x, ds:days.filter(ds=>x.ids[ds])})).filter(o=>o.ds.length)
      .sort((p,q)=>p.ds[0]<q.ds[0]?-1:p.ds[0]>q.ds[0]?1:(q.x.n-p.x.n));
    let n=0;
    hit.forEach(o=>{ let l=0; while(o.ds.some(ds=>at[ds+'|'+l])) l++; o.ds.forEach(ds=>at[ds+'|'+l]=o.x); n=Math.max(n,l+1); });
    // 🕙 10출: 달력 한 줄(일~토)의 월요일이 그 주 담당 기준. 달이 주 중간에 시작해도 앞 달 월요일로 찾는다.
    const any=days[0] ? parseYmd(days[0]) : null;
    const mon=any ? ymd(addDays(any, 1-any.getDay())) : '';
    const hasWeekday=days.some(ds=>{ const w=parseYmd(ds).getDay(); return w>=1 && w<=5; });
    weeks.push({n, mon, ten: hasWeekday && mon ? tenPersonAt(mon) : ''});
  }
  return {weeks, at};
}
// 막대 한 칸. 앞(같은 주·같은 달)에서 이어지면 왼쪽을, 뒤로 이어지면 오른쪽을 옆 칸까지 늘린다.
// 이름표는 줄의 첫 칸에만 쓰고, 이어지는 칸 수만큼 넓게 보여준다.
function shareBarSeg(x, dateObj, d, lastDate){
  const ds=ymd(dateObj), dow=dateObj.getDay(), id=x.ids[ds], e=x.ev, t=typeMeta(e.type);
  const contL = dow!==0 && d>1 && !!x.ids[ymd(addDays(dateObj,-1))];
  const contR = dow!==6 && d<lastDate && !!x.ids[ymd(addDays(dateObj,1))];
  let run=1; if(!contL){ let c=dateObj; while(c.getDay()!==6 && c.getDate()<lastDate && x.ids[ymd(addDays(c,1))]){ c=addDays(c,1); run++; } }
  const md=v=>{ const p=v.split('-'); return (+p[1])+'/'+(+p[2]); };
  const range=`${md(x.a)}~${md(x.b)} · ${x.n}일`;
  const tt=`${e.emp} · ${t.label} · ${range}${e.time?' · '+e.time:''}${e.title?' · '+e.title:''} — 클릭: 수정 · 드래그: 기간째 이동`;
  const lab = contL ? '' : `<span class="bar-lab" style="max-width:calc(${run*100}% + ${(run-1)*30}px)">${escapeHtml(e.emp)} · ${t.label}${e.time?' · '+escapeHtml(e.time):''}${e.title?' · '+escapeHtml(e.title):''}<small>${range}</small></span>`;
  const del = contR ? '' : `<button class="ev-del" title="기간 전체 삭제" onclick="event.stopPropagation();removeShare('${ds}','${id}')">×</button>`;
  return `<div class="ev-bar${contL?' cont-l':''}${contR?' cont-r':''}" draggable="true" ondragstart="shareDragStart(event,'${ds}','${id}')" ondragend="shareDragEnd(event)" onclick="openShareEdit('${ds}','${id}')" style="background:${empColor(e.emp)}" title="${escapeHtml(tt)}">${lab}${del}</div>`;
}
// 🕙 10출 막대 한 칸 — 월~금을 잇는다(주말은 빈 칸). 클릭하면 그 주 담당 교체.
function tenBarSeg(who, mon, dateObj, d, lastDate){
  const dow=dateObj.getDay();
  const contL = dow>1 && d>1, contR = dow<5 && d<lastDate;
  let run=1; if(!contL){ let c=dateObj; while(c.getDay()<5 && c.getDate()<lastDate){ c=addDays(c,1); run++; } }
  const lab = contL ? '' : `<span class="bar-lab" style="max-width:calc(${run*100}% + ${(run-1)*30}px)">🕙 ${escapeHtml(who)} <span class="ten-lab">10출</span></span>`;
  return `<div class="ev-bar ten-bar${contL?' cont-l':''}${contR?' cont-r':''}" onclick="openTenPicker('${mon}')" title="${escapeHtml(who)} · 이번 주(월~금) 10시 출근 — 클릭: 교체">${lab}</div>`;
}
// 일정 정렬 키: 시간 문자열의 첫 HH:MM(분). 시간이 없으면(종일) -1 → 맨 위.
// "~ 12:00"처럼 끝 시각만 있으면 그 시각으로 정렬한다.
function shareTimeKey(t){ const x=/(\d{1,2}):(\d{2})/.exec(t||''); return x ? (+x[1])*60+(+x[2]) : -1; }
// 개인 일정(하루짜리) 칩
function shareChipHtml(ds, e, t){
  const col=empColor(e.emp);
  const tt=`${e.emp} · ${t.label}${e.time?' · '+e.time:''}${e.title?' · '+e.title:''}`;
  return `<div class="ev-chip" draggable="true" ondragstart="shareDragStart(event,'${ds}','${e.id}')" ondragend="shareDragEnd(event)" onclick="shareChipClick(event,'${ds}','${e.id}')" style="background:${col}" title="${escapeHtml(tt)} — 클릭: 수정 · 드래그: 이동">
    <span class="ev-txt"><span class="ev-head">${escapeHtml(e.emp)}</span><span class="ev-sub">${t.label}${e.time?' · '+escapeHtml(e.time):''}</span>${e.title?`<span class="ev-memo">${escapeHtml(e.title)}</span>`:''}</span>
    <button class="ev-del" title="삭제" onclick="event.stopPropagation();removeShare('${ds}','${e.id}')">×</button></div>`;
}
// 같은 grp 의 살아있는 이벤트 id 들 (직원 필터와 무관하게 전체)
function shareGroupIds(grp){ return Object.keys(SHAREEV).filter(k=>{ const e=SHAREEV[k]; return e && !e.deleted && e.grp===grp; }); }

function renderShare(){
  const y=shareMonth.getFullYear(), m=shareMonth.getMonth();
  const first=new Date(y,m,1), lastDate=new Date(y,m+1,0).getDate();
  const lead=first.getDay();
  const cells=[];
  for(let i=0;i<lead;i++) cells.push(null);
  for(let d=1;d<=lastDate;d++) cells.push(d);
  const dows=["일","월","화","수","목","금","토"];
  const todayStr=ymd(today());
  const dmap=dutyMap();   // 회의별 원격 당번(순번 자동)
  const groups=shareGroups();
  const lanes=shareBarLanes(cells, y, m, groups);

  const dayCells = cells.map((d,ci)=>{
    if(d===null) return `<div class="daycell share empty"></div>`;
    const dateObj=new Date(y,m,d), ds=ymd(dateObj), dow=dateObj.getDay();
    const wk=lanes.weeks[Math.floor(ci/7)];
    const tenRow = wk.ten ? (dow>=1 && dow<=5 ? tenBarSeg(wk.ten, wk.mon, dateObj, d, lastDate) : '<div class="ev-bar-gap"></div>') : '';
    const bars = (wk.n || wk.ten) ? `<div class="ev-bars">${tenRow}${Array.from({length:wk.n},(_,l)=>{
      const x=lanes.at[ds+'|'+l]; if(!x) return '<div class="ev-bar-gap"></div>';
      return shareBarSeg(x, dateObj, d, lastDate);
    }).join('')}</div>` : '';
    const holi=HOLIDAYS[ds]; const isSun=dow===0||!!holi; const isSat=dow===6;
    const numCls = isSun?"s-sun":isSat?"s-sat":"";
    const evs=shareEvents(ds).filter(e=>!(e.grp && groups[e.grp]));   // 여러 날 일정은 위 막대로
    const chips = evs.map(e=>{
      const t=typeMeta(e.type);
      return {k:shareTimeKey(e.time), h:shareChipHtml(ds, e, t)};
    });
    // 구글 캘린더 회의(읽기 전용) + 원격 근무 당번 표시
    const gchips = gcalDay(ds).map(g=>{
      const gk=ds+"|"+(g.time||"")+"|"+g.title; const who=dutyPersonAt(gk, dmap[gk]);
      const tt=`${g.title}${g.time?' · '+g.time:''}${who?' · 원격 근무당번: '+who:''} — 구글 캘린더(읽기 전용)`;
      const gi=who?dutyKeyIdx(gk):-1;   // 당번 이름 클릭 → 직원 목록 팝업에서 교체
      return {k:shareTimeKey(g.time), h:`<div class="ev-chip gcal ${who?'duty':''}" title="${escapeHtml(tt)}">
        <span class="ev-gtag">G</span>
        <span class="ev-txt"><span class="ev-head">${escapeHtml(g.title)}</span><span class="ev-sub">${g.time?'🕒 '+escapeHtml(g.time):'종일'}</span>${who?`<span class="ev-duty pick" title="클릭 → 근무당번 변경" onclick="event.stopPropagation();openDutyPicker(${gi})">🏠 ${escapeHtml(who)}<span class="duty-lab">근무당번</span></span>`:''}</span></div>`};
    });
    // 개인 일정 + 구글 회의를 한 줄로 시간순 정렬 — 시간 없는(종일) 일정이 맨 위, 그다음 이른 시각부터.
    // 같은 시각이면 원래 순서(개인 → 회의) 유지 (Array.sort 는 안정 정렬)
    const dayItems = chips.concat(gchips).sort((a,b)=>a.k-b.k).map(x=>x.h).join("");
    return `<div class="daycell share ${ds===todayStr?'today':''} ${holi?'holi':''}"
      ondragover="shareDragOver(event,this)" ondragleave="shareDragLeave(this)" ondrop="shareDrop(event,'${ds}',this)">
      <div class="dnum ${numCls} ${ds===todayStr?'is-today':''}"><span class="dn-n">${d}</span>${holi?`<span class="holi-tag">${holi}</span>`:''}
        <button class="add-ev" title="일정 추가" onclick="openShareForm('${ds}')">+</button></div>
      ${bars}<div class="ev-list">${dayItems}</div>
    </div>`;
  }).join("");

  document.getElementById("main").innerHTML = `
    <div class="page-head">
      <div>
        <h2>📢 공유</h2>
        <div class="sub">연차 · 반차 · 시간차 · 휴가 등 개인 일정은 <b>직원별 색상</b>으로 표시되고, <b>회사 구글 캘린더의 회의 일정</b>은 파란 <b>G</b> 칩으로 자동 표시됩니다(읽기 전용). 개인 일정은 <b>클릭 수정 · 드래그 이동 · × 삭제</b>가 됩니다.</div>
      </div>
      <div class="controls">
        <select class="sel" onchange="setShareFilter(this.value)">
          <option value="all" ${shareFilter==='all'?'selected':''}>전체 직원</option>
          ${EMPLOYEES.map(e=>`<option value="${e}" ${shareFilter===e?'selected':''}>${e}</option>`).join("")}
        </select>
        <button class="btn primary" onclick="openShareForm('${ymd(today())}')">+ 일정 추가</button>
        <button class="btn" onclick="shareToday()">이번 달</button>
      </div>
    </div>

    <div class="card">
      <div class="cal-toolbar">
        <button class="navround" onclick="shareNav(-1)">‹</button>
        <div class="mtitle">${y}년 ${m+1}월</div>
        <button class="navround" onclick="shareNav(1)">›</button>
      </div>
      <div class="cal-grid">
        ${dows.map((w,i)=>`<div class="dow ${i===6?'s-sat':i===0?'s-sun':''}">${w}</div>`).join("")}
        ${dayCells}
      </div>
      <div class="legend">
        ${EMPLOYEES.map(n=>`<span><span class="swatch" style="background:${empColor(n)}"></span>${n}</span>`).join("")}
        <span style="margin-left:6px"><span class="swatch" style="background:#e8f0fe;border:1px solid #c6dafc"></span>회의(구글)</span>
      </div>
      <div class="duty-order">🏠 회의 중 원격 근무당번 순서 · ${orderAt(DUTY_ORDER, DUTY_ORDER_CHANGES, ymd(new Date(y,m+1,0))).join(' → ')}${orderChangeNote(DUTY_ORDER_CHANGES, y, m)}</div>
      <div class="duty-order ten-order">🕙 10시 출근 로테이션(주 단위 · 월요일 시작) · ${orderAt(TEN_ORDER, TEN_ORDER_CHANGES, ymd(new Date(y,m+1,0))).join(' → ')}${orderChangeNote(TEN_ORDER_CHANGES, y, m)} <span style="font-weight:600;color:var(--gray2)">· 달력의 <b>10출</b> 막대 클릭 → 이름 변경</span></div>
    </div>
  `;
}

// 시작~종료(YYYY-MM-DD) 사이 날짜 배열
function eachDate(a,b){
  const out=[]; let d=parseYmd(a);
  while(ymd(d)<=b){ out.push(ymd(d)); d.setDate(d.getDate()+1); if(out.length>366) break; }
  return out;
}
function timeOptions(){

    }
  }
  return opts;
}

function shareDragOver(ev, cell){ ev.preventDefault(); ev.dataTransfer.dropEffect="move"; cell.classList.add("drop-hover"); }
function shareDragLeave(cell){ cell.classList.remove("drop-hover"); }
function shareDrop(ev, targetDs, cell){
  ev.preventDefault(); cell.classList.remove("drop-hover");
  let src=shareDrag;
  if(!src){ const d=(ev.dataTransfer.getData("text/plain")||"").split("|"); if(d.length===2) src={ds:d[0], id:d[1]}; }
  shareDrag=null;
  if(!src || src.ds===targetDs) return;           // 같은 날이면 무시
  const se=SHAREEV[src.id]; if(!se||se.deleted) return;
  // 여러 날 일정은 잡은 날 → 놓은 날 만큼 기간 전체를 옮긴다
  const ids = se.grp ? shareGroupIds(se.grp) : [src.id];
  const shift=Math.round((parseYmd(targetDs)-parseYmd(src.ds))/86400000);
  ids.forEach(k=>{ const e=SHAREEV[k]; e.ds = k===src.id ? targetDs : ymd(addDays(parseYmd(e.ds), shift)); e.ts=Date.now(); });
  save(LS_SHAREEV, SHAREEV); rebuildShare(); pushShareEv(ids);
  renderShare();
}

// raw 실패 시 로컬(Pages) 파일로 폴백. 파일은 "window.XXX = {...};" 형태라 함수로 실행해 window에 반영.
var DATA_BASE = "https://raw.githubusercontent.com/ishopcare-offcare/offcare-dashboard/main/";
function loadData(file, cb){
  var urls = [DATA_BASE + file, file];   // 원본 우선 → 안되면 로컬(Pages)
  (function tryNext(i){
    if(i >= urls.length){ if(cb) cb(false); return; }
    fetch(urls[i] + "?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(txt){ (new Function(txt))(); if(cb) cb(true); })
      .catch(function(){ tryNext(i+1); });
  })(0);
}

//     rev 엔드포인트가 없는 구버전 백엔드에서도 이 루프 덕분에 기존과 똑같이 동작한다.
const SYNC_FAST_MS=12000, SYNC_SLOW_MS=120000;
// 정적 데이터 파일 확인 주기. 팀 공유 클라우드(12초)와 달리 이건 GitHub raw 를 때리는 것이고,
// 집계는 몇 초 빨리 보여봐야 의미가 없다. 사무실 전체가 한 IP 로 나가므로(레이트리밋)

  }).catch(()=>{});

// 정적 데이터 파일은 "바뀌었을 때만" 다시 받는다.
//
// 이 대시보드는 slack-data.js(6.2MB)·menu-requests.js(0.9MB)를 주기마다 통째로 다시
// 받고 있었다. slack-data.js 만 해도 접속자 1명당 시간당 약 190MB 다. 대부분의 주기에는
// 파일이 그대로인데도 매번 전부 받은 것이다.
// → HEAD(본문 0바이트)로 먼저 확인하고, 바뀐 경우에만 실제로 받는다.
//
// 판별에 ETag 를 쓸 수 없다: raw/Pages 모두 ETag 를 보내지만 CORS 로 노출하지 않아
// 브라우저 JS 에서 읽으면 null 이다(헤드리스 크롬으로 확인). Content-Length 와
// Last-Modified 는 CORS 안전목록이라 읽힌다.
const dataTag={}, dataTagOk={};   // 파일별 마지막 지문 / HEAD 판별 가능 여부
function checkDataFile(file, onChanged){
  if(dataTagOk[file]===false) return;              // 이 환경에선 판별 불가 → 느린 루프 안전망에 맡김
  // ?t= 로 CDN 캐시(raw 5분 · Pages 10분)를 우회한다. loadData 도 같은 방식을 쓴다.
  fetch(DATA_BASE+file+'?t='+Date.now(), {method:'HEAD', cache:'no-store'}).then(r=>{
    if(!r.ok) throw 0;
    const len=r.headers.get('content-length'), lm=r.headers.get('last-modified');
    const tag=(len||'')+'|'+(lm||'');
    if(tag==='|'){ dataTagOk[file]=false; return; }        // 둘 다 못 읽음 → 이 방식 포기
    dataTagOk[file]=true;
    if(dataTag[file]==null){ dataTag[file]=tag; return; }  // 최초 기준값
    if(tag===dataTag[file]) return;
    dataTag[file]=tag;
    onChanged();
  }).catch(()=>{ dataTagOk[file]=false; });
}
// 입력 중에는 '데이터는 받되 다시 그리지만 않는다'.
//
// 전에는 syncBlocked() 면 확인 자체를 건너뛰었는데, 메뉴등록 탭은 양식 변환란(textarea)에
// 커서가 놓인 채로 작업하는 시간이 대부분이라 새 요청이 들어와도 목록이 영영 갱신되지 않았다.
// 재렌더만 미루면 타이핑을 방해하지 않으면서 데이터는 항상 최신으로 유지된다.
let deferredRender=null;
function renderWhenIdle(fn){
