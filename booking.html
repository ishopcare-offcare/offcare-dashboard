<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원격 예약 · Offcare</title>
<link rel="icon" href="favicon.png">
<style>
  :root{
    --blue:#0066cc; --focus:#0071e3;
    --ink:#1d1d1f; --ink80:#333333; --ink48:#7a7a7a;
    --white:#ffffff; --parch:#f5f5f7; --pearl:#fafafc; --dark:#272729;
    --hair:#e0e0e0; --hair-soft:rgba(0,0,0,.04);
    --ok:#1d8a3a; --warn:#b25e00; --full:#c4302b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Inter','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--ink);background:var(--white);font-size:17px;line-height:1.47;letter-spacing:-.374px;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
  button{cursor:pointer;border:0;background:none}
  button:active:not(:disabled){transform:scale(.95)}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  .nav{background:#000;height:44px;display:flex;align-items:center;justify-content:center;gap:28px;font-size:12px}
  .nav a{color:#ccc;text-decoration:none}
  .nav a.on{color:#fff}

  .hero{background:var(--parch);padding:56px 24px 40px;text-align:center}
  .hero h1{font-size:48px;font-weight:600;line-height:1.08;letter-spacing:-.28px}
  .hero p{font-size:21px;color:var(--ink80);margin-top:12px}

  .wrap{max-width:1180px;margin:0 auto;padding:40px 24px 80px}
  .grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:start}
  h2{font-size:24px;font-weight:600;letter-spacing:-.2px;margin-bottom:14px}
  .step{font-size:14px;color:var(--ink48);font-weight:600;margin-bottom:4px}
  section.blk{margin-bottom:36px}

  /* segmented */
  .seg{display:inline-flex;background:var(--parch);border-radius:9999px;padding:4px}
  .seg button{padding:8px 22px;border-radius:9999px;font-size:17px;color:var(--ink80)}
  .seg button.on{background:var(--white);color:var(--ink);font-weight:600}
  .seg-note{font-size:14px;color:var(--ink48);margin-top:10px}

  /* dates */
  .dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .date{flex:0 0 auto;min-width:68px;padding:10px 8px;border-radius:18px;border:1px solid var(--hair);text-align:center;background:var(--white)}
  .date .d1{font-size:12px;color:var(--ink48)}
  .date .d2{font-size:20px;font-weight:600;line-height:1.2}
  .date .d3{font-size:12px;color:var(--ink48);margin-top:2px}
  .date.on{border-color:var(--blue);background:var(--blue);color:#fff}
  .date.on .d1,.date.on .d3{color:rgba(255,255,255,.85)}
  .date.sun .d1{color:var(--full)} .date.on.sun .d1{color:#fff}

  /* slots */
  .slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .slot{border:1px solid var(--hair);border-radius:12px;padding:9px 10px 10px;text-align:left;background:var(--white);position:relative}
  .slot .t{font-size:17px;font-weight:600}
  .slot .c{font-size:12px;color:var(--ink48);margin-top:1px}
  .slot .bar{height:4px;border-radius:4px;background:var(--parch);margin-top:7px;overflow:hidden}
  .slot .bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
  .slot.mid .bar i{background:var(--warn)}
  .slot.full{background:var(--parch)} .slot.full .bar i{background:var(--full)}
  .slot.full .c{color:var(--full);font-weight:600}
  .slot.lunch::after{content:'점심';position:absolute;top:8px;right:9px;font-size:11px;color:var(--ink48)}
  .slot:disabled{opacity:.38;cursor:not-allowed}
  .slot.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
  .slot.on .t{color:var(--blue)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--ink48);margin-top:12px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  /* form */
  .card{background:var(--parch);border-radius:18px;padding:24px}
  .sel-summary{font-size:21px;font-weight:600;letter-spacing:-.2px}
  .sel-summary.empty{color:var(--ink48);font-weight:400;font-size:17px}
  .paste{margin-top:18px}
  .paste summary{font-size:14px;color:var(--blue);cursor:pointer;list-style:none}
  .paste summary::-webkit-details-marker{display:none}
  .paste textarea{margin-top:8px;height:120px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  .f{display:flex;flex-direction:column;gap:4px}
  .f.w{grid-column:1/-1}
  .f label{font-size:12px;color:var(--ink80);font-weight:600}
  .f label em{color:var(--full);font-style:normal}
  input,select,textarea{width:100%;border:1px solid var(--hair);border-radius:11px;padding:10px 12px;background:var(--white);font-size:16px}
  textarea{resize:vertical;min-height:84px;line-height:1.45}
  input.bad{border-color:var(--full)}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink80);margin-top:2px}
  .chk input{width:auto}
  .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;border-radius:9999px;padding:11px 22px;font-size:17px}
  .btn:disabled{background:var(--ink48);cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
  .btn.sm{padding:6px 14px;font-size:14px}
  .submit{width:100%;margin-top:20px}
  .err{color:var(--full);font-size:14px;margin-top:10px;min-height:20px}

  .preview{margin-top:18px}
  .preview .lbl{font-size:12px;color:var(--ink48);font-weight:600;margin-bottom:6px}
  .preview pre{background:var(--white);border:1px solid var(--hair);border-radius:12px;padding:14px;font-family:inherit;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:var(--ink80)}

  /* lists */
  table.lst{width:100%;border-collapse:collapse;font-size:14px}
  table.lst th{text-align:left;font-size:12px;color:var(--ink48);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--hair)}
  table.lst td{padding:10px;border-bottom:1px solid var(--hair-soft);vertical-align:middle}
  .tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:9999px;background:var(--parch);color:var(--ink80)}
  .tag.transfer{background:#eef3fb;color:var(--blue)}
  .empty-row{color:var(--ink48);font-size:14px;padding:16px 0}

  /* status / toast */
  .banner{background:#fff4e5;color:var(--warn);border-radius:12px;padding:12px 16px;font-size:14px;margin-bottom:20px;display:none}
  .banner.show{display:block}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:12px 22px;border-radius:9999px;font-size:15px;opacity:0;pointer-events:none;transition:.25s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* nudge dialog */
  .dim{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .dim.show{display:flex}
  .dlg{background:var(--white);border-radius:18px;padding:28px 26px 22px;max-width:440px;width:100%}
  .dlg .ic{font-size:30px;line-height:1}
  .dlg h3{font-size:21px;font-weight:600;margin-top:10px;letter-spacing:-.2px}
  .dlg p{font-size:15px;color:var(--ink80);margin-top:8px}
  .alts{display:flex;flex-direction:column;gap:8px;margin-top:18px}
  .alt{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--hair);border-radius:12px;padding:12px 14px;text-align:left}
  .alt b{font-size:17px;font-weight:600}
  .alt span{font-size:14px;color:var(--ok);font-weight:600}
  .dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

  @media (max-width:900px){
    .grid{grid-template-columns:minmax(0,1fr)}
    .hero h1{font-size:34px} .hero p{font-size:17px}
  }
  @media (max-width:520px){
    .slots{grid-template-columns:repeat(3,minmax(0,1fr))}
    .fields{grid-template-columns:1fr}
    .wrap{padding:28px 16px 64px}
  }
</style>
</head>
<body>
<nav class="nav"><a href="./">Offcare 대시보드</a><a class="on" href="booking.html">원격 예약</a></nav>

<header class="hero">
  <h1>원격 예약</h1>
  <p>시간을 고르고 매장 정보를 넣으면, 그 시각에 슬랙으로 자동 접수돼요.</p>
</header>

<main class="wrap">
  <div class="banner" id="banner"></div>
  <div class="grid">
    <div>
      <section class="blk">
        <div class="step">STEP 1</div>
        <h2>요청 유형</h2>
        <div class="seg" id="typeSeg"></div>
        <div class="seg-note" id="typeNote"></div>
      </section>

      <section class="blk">
        <div class="step">STEP 2</div>
        <h2>날짜와 시간</h2>
        <div class="dates" id="dates"></div>
        <div class="slots" id="slots" style="margin-top:16px"></div>
        <div class="legend">
          <span><i style="background:var(--ok)"></i>여유</span>
          <span><i style="background:var(--warn)"></i>절반 이상</span>
          <span><i style="background:var(--full)"></i>마감</span>
          <span id="lunchLegend"></span>
        </div>
      </section>

      <section class="blk">
        <h2 id="dayListTitle">이 날의 예약</h2>
        <div id="dayList"></div>
      </section>
    </div>

    <div>
      <section class="blk">
        <div class="step">STEP 3</div>
        <h2>매장 정보</h2>
        <div class="card">
          <div class="sel-summary empty" id="selSummary">시간을 먼저 골라주세요.</div>

          <details class="paste" id="pasteBox">
            <summary>슬랙 양식을 통째로 붙여넣어 자동 채우기 ›</summary>
            <textarea id="pasteText" placeholder="상호: 현스킨케어 / KPN&#10;오프/온라인: 온라인 / 임대&#10;사업자번호 : 8772000015&#10;..."></textarea>
          </details>

          <div class="fields">
            <div class="f"><label>상호 <em>*</em></label><input id="store" maxlength="60"></div>
            <div class="f"><label>밴사</label><input id="van" maxlength="30" placeholder="예: KPN" list="vanList"></div>
            <div class="f"><label>오프/온라인</label>
              <select id="onoff"><option>오프라인</option><option>온라인</option></select></div>
            <div class="f"><label>계약 형태</label><input id="contract" maxlength="20" placeholder="예: 임대" list="contractList"></div>
            <div class="f w"><label>사업자번호 <em>*</em></label><input id="biz" inputmode="numeric" maxlength="12" placeholder="숫자 10자리"></div>
            <div class="f"><label>대표자명 <em>*</em></label><input id="owner" maxlength="20"></div>
            <div class="f"><label>대표자 전화번호 <em>*</em></label><input id="ownerPhone" inputmode="tel" maxlength="20" placeholder="010-0000-0000"></div>
            <div class="f w"><label>가게 연락처</label><input id="storePhone" inputmode="tel" maxlength="20">
              <label class="chk"><input type="checkbox" id="samePhone">대표자 전화번호와 같음</label></div>
            <div class="f w"><label>주소</label><input id="addr" maxlength="150"></div>
            <div class="f w"><label>내용</label><textarea id="content" maxlength="1000" placeholder="요청 내용을 적어주세요"></textarea></div>
            <div class="f w"><label>요청자 <em>*</em></label><input id="requester" maxlength="20" placeholder="본인 이름 (다음부터 자동 입력)"></div>
          </div>
          <datalist id="vanList"><option>KPN</option><option>KICC</option><option>NICE</option><option>KSNET</option><option>KIS</option><option>스마트로</option><option>토스</option></datalist>
          <datalist id="contractList"><option>임대</option><option>구매</option></datalist>

          <button class="btn submit" id="submitBtn" disabled>예약하기</button>
          <div class="err" id="err"></div>

          <div class="preview">
            <div class="lbl">슬랙에 올라갈 메시지</div>
            <pre id="preview"></pre>
          </div>
        </div>
      </section>

      <section class="blk">
        <h2>내 예약</h2>
        <div id="myList"></div>
      </section>
    </div>
  </div>
</main>

<div class="dim" id="dim"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwlPj0fbNjMWTpU1jiGI3gUNPvOE8MlZ7ANqgQP41ZrWE0vo4r2en1pSYZVgEiYYR8M_A/exec";
const DOW = ['일','월','화','수','목','금','토'];
const MY_KEY = 'offcare.booking.mine';
const REQ_KEY = 'offcare.booking.requester';
const $ = id => document.getElementById(id);

/* 상태 — cfg·bookings 는 서버가 단일 출처. 서버와 브라우저 시계 차이는 skew 로 보정한다. */
const S = { cfg:null, bookings:[], today:'', skew:0, type:'as', date:'', time:'', busy:false };

/* ---------- 시간 계산 (전부 KST 고정: 브라우저 시간대와 무관) ---------- */
const pad = n => String(n).padStart(2,'0');
const hm = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };
const fmtHm = m => pad(Math.floor(m/60)) + ':' + pad(m%60);
const kstMs = (date, time) => { const [y,mo,d] = date.split('-').map(Number); return Date.UTC(y,mo-1,d,0,hm(time)) - 9*3600000; };
const addDays = (date, n) => { const [y,m,d] = date.split('-').map(Number); const t = new Date(Date.UTC(y,m-1,d+n)); return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate()); };
const dowOf = date => { const [y,m,d] = date.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); };
const nowMs = () => Date.now() + S.skew;
const md = date => { const [,m,d] = date.split('-').map(Number); return m + '/' + d + '(' + DOW[dowOf(date)] + ')'; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function slotTimes(){
  const c = S.cfg, out = [];
  for (let m = hm(c.open); m + c.step <= hm(c.close); m += c.step) out.push(fmtHm(m));
  return out;
}
function isLunch(time){ const m = hm(time), L = S.cfg.lunch; return m >= hm(L.from) && m < hm(L.to); }
function capOf(type, time){ const t = S.cfg.types[type]; return isLunch(time) ? t.lunchCap : t.cap; }
function usedOf(type, date, time){ return S.bookings.filter(b => b.type===type && b.date===date && b.time===time).length; }
function bookable(date, time){ return kstMs(date, time) >= nowMs() + S.cfg.minLeadMin*60000; }
function dates(){
  const out = [];
  for (let i = 0; i < S.cfg.days; i++){ const d = addDays(S.today, i); if (!S.cfg.closedDays.includes(dowOf(d))) out.push(d); }
  return out;
}

/* ---------- 분산 유도 ----------
   고른 칸이 절반 이상 찼는데 ±30분 안에 확실히 한가한 칸(점유율이 50%p 이상 낮은 칸)이 있으면 그쪽을 권한다.
   예) 11:00 이 3/4, 10:45 가 0/4 → 권유. 마감 칸을 누르면 ±1시간 안에서 남은 칸을 보여준다. */
function suggestions(type, date, time){
  const cap = capOf(type, time), used = usedOf(type, date, time), ratio = used / cap;
  const full = used >= cap;
  const range = full ? 4 : 2;           // 칸 수 (15분 × n)
  const times = slotTimes(), idx = times.indexOf(time), out = [];
  for (let k = -range; k <= range; k++){
    const t = times[idx + k];
    if (!k || !t || !bookable(date, t)) continue;
    const c2 = capOf(type, t), u2 = usedOf(type, date, t);
    if (u2 >= c2) continue;
    if (!full && u2 / c2 > ratio - 0.5) continue;
    out.push({ time:t, used:u2, cap:c2, dist:Math.abs(k), ratio:u2/c2 });
  }
  out.sort((a,b) => a.ratio - b.ratio || a.dist - b.dist || a.time.localeCompare(b.time));
  return { full, used, cap, alts: out.slice(0, 3) };
}

/* ---------- 렌더 ---------- */
function renderTypes(){
  $('typeSeg').innerHTML = Object.entries(S.cfg.types).map(([k,t]) =>
    `<button data-type="${k}" class="${k===S.type?'on':''}">${esc(t.label)}</button>`).join('');
  const t = S.cfg.types[S.type];
  $('typeNote').textContent = `15분마다 최대 ${t.cap}건 · 점심(${S.cfg.lunch.from}~${S.cfg.lunch.to})에는 ${t.lunchCap}건`;
  $('lunchLegend').textContent = `점심 ${S.cfg.lunch.from}~${S.cfg.lunch.to} 정원 축소`;
}
function renderDates(){
  const times = slotTimes();
  $('dates').innerHTML = dates().map(d => {
    const left = times.reduce((s,t) => s + (bookable(d,t) ? Math.max(0, capOf(S.type,t) - usedOf(S.type,d,t)) : 0), 0);
    const [,m,dd] = d.split('-').map(Number);
    return `<button class="date ${d===S.date?'on':''} ${dowOf(d)===0?'sun':''}" data-date="${d}">
      <div class="d1">${d===S.today?'오늘':DOW[dowOf(d)]}</div><div class="d2">${m}/${dd}</div><div class="d3">${left ? '잔여 '+left : '마감'}</div></button>`;
  }).join('');
}
function renderSlots(){
  $('slots').innerHTML = slotTimes().map(t => {
    const cap = capOf(S.type, t), used = usedOf(S.type, S.date, t), ok = bookable(S.date, t);
    const cls = used >= cap ? 'full' : used / cap >= 0.5 ? 'mid' : '';
    const label = !ok ? '지남' : used >= cap ? '마감' : `${used}/${cap} · 잔여 ${cap-used}`;
    return `<button class="slot ${cls} ${isLunch(t)?'lunch':''} ${t===S.time?'on':''}" data-time="${t}" ${ok?'':'disabled'}>
      <div class="t">${t}</div><div class="c">${label}</div><div class="bar"><i style="width:${Math.min(100, used/cap*100)}%"></i></div></button>`;
  }).join('');
}
function renderDayList(){
  const rows = S.bookings.filter(b => b.date === S.date).sort((a,b) => a.time.localeCompare(b.time) || a.type.localeCompare(b.type));
  $('dayListTitle').textContent = `${md(S.date)} 예약 ${rows.length}건`;
  $('dayList').innerHTML = rows.length ? `<table class="lst"><thead><tr><th>시간</th><th>유형</th><th>상호</th><th>요청자</th></tr></thead><tbody>${
    rows.map(b => `<tr><td><b>${b.time}</b></td><td><span class="tag ${b.type}">${esc(S.cfg.types[b.type]?.label||b.type)}</span></td><td>${esc(b.store)}</td><td>${esc(b.requester)}</td></tr>`).join('')
  }</tbody></table>` : `<div class="empty-row">아직 예약이 없어요.</div>`;
}
function myBookings(){ try { return JSON.parse(localStorage.getItem(MY_KEY)) || []; } catch(e){ return []; } }
function saveMine(list){ localStorage.setItem(MY_KEY, JSON.stringify(list)); }
function renderMine(){
  const live = new Set(S.bookings.map(b => b.id));
  // 지난 예약과 다른 곳에서 취소된 예약은 정리한다 (조회 범위 = 오늘부터라 지난 건은 목록에 없다)
  // 서버 목록을 못 받은 상태(offline)에서는 정리하지 않는다 — 빈 목록 기준으로 지우면 취소코드가 사라진다
  const mine = S.offline ? myBookings() : myBookings().filter(b => b.date >= S.today && live.has(b.id));
  if (!S.offline) saveMine(mine);
  mine.sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
  $('myList').innerHTML = mine.length ? `<table class="lst"><tbody>${mine.map(b => {
    const posted = kstMs(b.date, b.time) <= nowMs() + 60000;
    return `<tr><td><b>${md(b.date)} ${b.time}</b></td><td><span class="tag ${b.type}">${esc(S.cfg.types[b.type]?.label||b.type)}</span></td><td>${esc(b.store)}</td>
      <td style="text-align:right">${posted ? '<span class="tag">접수됨</span>' : `<button class="btn ghost sm" data-cancel="${b.id}">취소</button>`}</td></tr>`;
  }).join('')}</tbody></table>` : `<div class="empty-row">이 브라우저에서 한 예약이 여기에 보여요.</div>`;
}
function renderSummary(){
  const el = $('selSummary');
  if (!S.time){ el.className = 'sel-summary empty'; el.textContent = '시간을 먼저 골라주세요.'; }
  else { el.className = 'sel-summary'; el.textContent = `${md(S.date)} ${S.time} · ${S.cfg.types[S.type].label}`; }
  renderPreview();
}
function renderAll(){ renderTypes(); renderDates(); renderSlots(); renderDayList(); renderMine(); renderSummary(); }

/* ---------- 입력 ---------- */
const FIELDS = ['store','van','onoff','contract','biz','owner','ownerPhone','storePhone','addr','content','requester'];
function formData(){ const o = {}; FIELDS.forEach(k => o[k] = $(k).value.trim()); o.biz = o.biz.replace(/\D/g,''); return o; }
function validate(){
  const f = formData(), miss = [];
  if (!S.time) miss.push('시간');
  if (!f.store) miss.push('상호');
  if (f.biz.length !== 10) miss.push('사업자번호 10자리');
  if (!f.owner) miss.push('대표자명');
  if (!f.ownerPhone) miss.push('대표자 전화번호');
  if (!f.requester) miss.push('요청자');
  $('biz').classList.toggle('bad', !!f.biz && f.biz.length !== 10);
  $('submitBtn').disabled = S.busy || S.offline || miss.length > 0;
  $('submitBtn').textContent = S.busy ? '예약 중…' : S.offline ? '서버 연결 후 예약할 수 있어요' : miss.length ? `${miss[0]} 입력 필요` : '예약하기';
  return miss.length === 0;
}
/* 서버의 bookingText_ 와 같은 양식 — 미리보기용 */
function renderPreview(){
  if (!S.cfg) return;                   // 서버 설정을 받기 전 입력
  const f = formData();
  const head = S.time ? `[예약] ${md(S.date)} ${S.time} · ${S.cfg.types[S.type].label}` : '[예약] (시간 미선택)';
  $('preview').textContent = [head,
    '상호: ' + f.store + (f.van ? ' / ' + f.van : ''),
    '오프/온라인: ' + f.onoff + (f.contract ? ' / ' + f.contract : ''),
    '사업자번호 : ' + f.biz, '대표자명 : ' + f.owner, '대표자 전화번호 : ' + f.ownerPhone,
    '가게 연락처 : ' + f.storePhone, '주소 : ' + f.addr, '내용: ' + f.content, '요청자: ' + f.requester].join('\n');
  validate();
}
/* 슬랙 양식 붙여넣기 → 칸 채우기. 라벨 뒤 콜론(:/：) 앞뒤 공백은 제각각이라 느슨하게 받는다. */
function parsePaste(txt){
  const get = re => { const m = txt.match(re); return m ? m[1].trim() : ''; };
  const store = get(/상호\s*[:：]\s*(.*)/), onoff = get(/오프\s*\/\s*온라인\s*[:：]\s*(.*)/);
  const set = (id, v) => { if (v) $(id).value = v; };
  if (store){ const [a, ...b] = store.split('/'); set('store', a.trim()); set('van', b.join('/').trim()); }
  if (onoff){
    const [a, ...b] = onoff.split('/');
    $('onoff').value = /온라인/.test(a) ? '온라인' : '오프라인';
    set('contract', b.join('/').trim());
  }
  set('biz', get(/사업자\s*번?호?\s*[:：]\s*([\d\-\s]+)/).replace(/\D/g,''));
  set('owner', get(/대표자\s*명\s*[:：]\s*(.*)/));
  set('ownerPhone', get(/대표자\s*전화\s*번?호?\s*[:：]\s*(.*)/));
  set('storePhone', get(/가게\s*연락처\s*[:：]\s*(.*)/));
  set('addr', get(/주소\s*[:：]\s*(.*)/));
  const content = txt.match(/내용\s*[:：]\s*([\s\S]*)/);
  if (content && content[1].trim()) $('content').value = content[1].replace(/\n?요청자\s*[:：].*$/, '').trim();
  $('samePhone').checked = !!$('ownerPhone').value && $('ownerPhone').value === $('storePhone').value;
  renderPreview();
}

/* ---------- 네트워크 ---------- */
/* 서버에 닿기 전·실패 시에도 시간표는 보여준다(예약만 막는다). 값은 game-backend.gs 의 BOOKING 과 맞출 것 —
   서버가 응답하면 서버 값으로 덮어쓴다. */
const FALLBACK_CFG = { days:14, open:'09:00', close:'18:00', step:15, closedDays:[], lunch:{ from:'12:00', to:'14:00' }, minLeadMin:2,
  types:{ as:{ label:'원격AS', cap:4, lunchCap:2 }, transfer:{ label:'명의변경', cap:2, lunchCap:1 } } };
function kstTodayLocal(){ const t = new Date(Date.now() + 9*3600000); return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate()); }
function applyState(){
  if (!S.cfg.types[S.type]) S.type = Object.keys(S.cfg.types)[0];
  const ds = dates();
  if (!ds.includes(S.date)) S.date = ds[0];
  if (S.time && !bookable(S.date, S.time)) S.time = '';
  renderAll();
}
async function load(quiet){
  try {
    const r = await fetch(API + '?action=bookings&t=' + Date.now());
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '응답 오류');
    S.cfg = d.cfg; S.bookings = d.bookings; S.today = d.today; S.skew = d.now - Date.now(); S.offline = false;
    $('banner').classList.remove('show');
    applyState();
  } catch(e){
    // unknown_action = 예약 기능이 들어간 백엔드가 아직 배포되지 않음
    $('banner').textContent = /unknown_action/.test(e.message)
      ? '예약 서버가 아직 준비되지 않았어요(백엔드 배포 전). 시간표는 볼 수 있지만 예약은 아직 안 돼요.'
      : '예약 서버에 연결하지 못했어요. 잠시 후 새로고침해 주세요. (' + e.message + ')';
    $('banner').classList.add('show');
    if (!quiet) console.error(e);
    if (!S.cfg || S.offline){ S.cfg = FALLBACK_CFG; S.today = kstTodayLocal(); S.skew = 0; S.offline = true; applyState(); }
    else validate();
  }
}
const ERR = {
  full:'방금 다른 분이 마지막 자리를 예약했어요.', too_late:'이미 지났거나 곧 시작하는 시간이에요.',
  bad_biz:'사업자번호 10자리를 확인해 주세요.', missing_field:'필수 항목을 채워주세요.',
  out_of_range:'예약할 수 없는 날짜예요.', closed_day:'예약을 받지 않는 요일이에요.',
  slack_not_in_channel:'슬랙 봇이 채널에 초대되어 있지 않아요. 관리자에게 알려주세요.',
  slack_missing_scope:'슬랙 봇 권한(chat:write)이 없어요. 관리자에게 알려주세요.',
  no_slack_token:'슬랙 토큰이 설정되지 않았어요. 관리자에게 알려주세요.'
};
async function submit(){
  if (!validate()) return;
  S.busy = true; validate(); $('err').textContent = '';
  const f = formData();
  const booking = Object.assign({ type:S.type, date:S.date, time:S.time }, f);
  try {
    const r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ action:'book', booking }) });
    const txt = await r.text(); let d = null; try { d = JSON.parse(txt); } catch(e){}
    if (!d) throw new Error('서버 응답을 읽지 못했어요.');
    if (!d.ok){
      $('err').textContent = ERR[d.error] || ('예약하지 못했어요: ' + d.error);
      if (d.error === 'full'){ await load(true); const s = suggestions(S.type, S.date, S.time); if (s.alts.length) openNudge(S.time, s); }
      return;
    }
    const mine = myBookings(); mine.push({ id:d.id, code:d.code, date:d.date, time:d.time, type:d.type, store:f.store }); saveMine(mine);
    localStorage.setItem(REQ_KEY, f.requester);
    toast(`${md(d.date)} ${d.time} 예약 완료 — 그 시각에 슬랙으로 올라가요`);
    ['store','van','contract','biz','owner','ownerPhone','storePhone','addr','content','pasteText'].forEach(k => $(k).value = '');
    $('samePhone').checked = false; $('pasteBox').open = false;
    S.time = '';
    await load(true);
  } catch(e){
    $('err').textContent = '네트워크 오류: ' + e.message;
  } finally { S.busy = false; validate(); }
}
async function cancel(id){
  const b = myBookings().find(x => x.id === id);
  if (!b || !confirm(`${md(b.date)} ${b.time} ${b.store} 예약을 취소할까요?\n슬랙 예약 메시지도 함께 지워져요.`)) return;
  try {
    const r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ action:'cancelBooking', id, code:b.code }) });
    const d = await r.json();
    if (!d.ok){ toast(d.error === 'already_posted' ? '이미 슬랙에 올라간 예약이라 취소할 수 없어요' : '취소 실패: ' + d.error); return; }
    saveMine(myBookings().filter(x => x.id !== id));
    toast('예약을 취소했어요');
    await load(true);
  } catch(e){ toast('네트워크 오류: ' + e.message); }
}

/* ---------- 분산 유도 팝업 ---------- */
function openNudge(time, s){
  const lbl = S.cfg.types[S.type].label;
  $('dlg').innerHTML = `
    <div class="ic">${s.full ? '⛔' : '⏳'}</div>
    <h3>${s.full ? `${time}은 마감됐어요` : `${time}은 거의 찼어요 (${s.used}/${s.cap})`}</h3>
    <p>${s.full ? '가까운 시간 중 자리가 남은 곳이에요.' : `같은 시간에 몰리면 처리가 늦어져요. 바로 옆 시간이 한가해요 — 옮겨주시면 더 빨리 처리돼요.`}</p>
    <div class="alts">${s.alts.map(a => `<button class="alt" data-alt="${a.time}"><b>${a.time}</b><span>${a.used}/${a.cap} · 잔여 ${a.cap-a.used}</span></button>`).join('')}</div>
    <div class="row">${s.full ? '<button class="btn ghost sm" data-close>닫기</button>' : `<button class="btn ghost sm" data-keep="${time}">그래도 ${time}로</button>`}</div>`;
  $('dim').classList.add('show');
  $('dlg').querySelector('[data-alt]')?.focus();
}
function closeNudge(){ $('dim').classList.remove('show'); }
function pickTime(t){ S.time = t; renderSlots(); renderSummary(); }

/* ---------- 이벤트 ---------- */
$('typeSeg').addEventListener('click', e => { const b = e.target.closest('[data-type]'); if (!b) return; S.type = b.dataset.type; S.time = ''; renderAll(); });
$('dates').addEventListener('click', e => { const b = e.target.closest('[data-date]'); if (!b) return; S.date = b.dataset.date; S.time = ''; renderAll(); });
$('slots').addEventListener('click', e => {
  const b = e.target.closest('[data-time]'); if (!b || b.disabled) return;
  const t = b.dataset.time, s = suggestions(S.type, S.date, t);
  if (s.full){ if (s.alts.length) openNudge(t, s); else toast('마감된 시간이에요'); return; }
  if (s.alts.length){ openNudge(t, s); return; }
  pickTime(t);
});
$('dlg').addEventListener('click', e => {
  const a = e.target.closest('[data-alt]'), k = e.target.closest('[data-keep]');
  if (a){ pickTime(a.dataset.alt); closeNudge(); toast(`${a.dataset.alt}로 옮겼어요 — 감사해요!`); }
  else if (k){ pickTime(k.dataset.keep); closeNudge(); }
  else if (e.target.closest('[data-close]')) closeNudge();
});
$('dim').addEventListener('click', e => { if (e.target === $('dim')) closeNudge(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeNudge(); });
$('myList').addEventListener('click', e => { const b = e.target.closest('[data-cancel]'); if (b) cancel(b.dataset.cancel); });
FIELDS.forEach(k => $(k).addEventListener('input', () => {
  if (k === 'ownerPhone' && $('samePhone').checked) $('storePhone').value = $('ownerPhone').value;
  renderPreview();
}));
$('onoff').addEventListener('change', renderPreview);
$('samePhone').addEventListener('change', () => { if ($('samePhone').checked) $('storePhone').value = $('ownerPhone').value; renderPreview(); });
$('pasteText').addEventListener('input', e => parsePaste(e.target.value));
$('submitBtn').addEventListener('click', submit);

let toastTimer = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }

$('requester').value = localStorage.getItem(REQ_KEY) || '';
load();
// 다른 사람 예약이 실시간에 가깝게 보이도록 30초마다 새로 읽는다 (탭이 보일 때만)
setInterval(() => { if (!document.hidden && !S.busy && !$('dim').classList.contains('show')) load(true); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
</script>
</body>
