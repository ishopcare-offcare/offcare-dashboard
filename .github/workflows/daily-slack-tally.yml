name: daily-slack-tally (progress)

# 근실시간 진행 집계: 업무시간(09:00~22:50 KST = 00:00~13:50 UTC) '오늘' 집계 + 수동 실행
#
# schedule 은 '*/10' 이지만 GitHub 무료 러너가 예약 실행을 건너뛰어 실제로는 15분마다만 돈다
# (커밋 시각이 정확히 :00/:15/:30/:45 격자에 찍힘). 집계 자체는 ~30초라 대기가 전부 병목이었다.
# → Apps Script 1분 트리거가 슬랙에 새 글을 발견하면 repository_dispatch 로 즉시 깨운다.
#   (game-backend.gs 의 watchSlackAndDispatch / GH_EVENT 와 이름이 일치해야 함)
#   schedule 은 트리거가 죽었을 때를 대비한 안전망으로 그대로 둔다.
on:
  schedule:
    # 업무일이 05:30~다음날 01:00 KST 로 넓어져서 실행 창도 맞춘다(UTC = KST-9).
    # 05:30 KST = 20:30 UTC(전날) · 01:00 KST = 16:00 UTC → 20:30~23:59, 00:00~16:00 UTC
    - cron: '30,40,50 20 * * *'
    - cron: '*/10 21-23 * * *'
    - cron: '*/10 0-16 * * *'
  repository_dispatch:
    types: [slack-new-message]
  workflow_dispatch: {}

permissions:
  contents: write

# 즉시 실행이 붙으면서 동시 실행 가능성이 커졌다. 같은 파일을 커밋하는 잡이 겹치면
# 푸시 경합(아래 8회 재시도)이 잦아지므로 아예 직렬화한다. 실행 중이면 뒤 것이 기다린다.
concurrency:
  group: slack-tally
  cancel-in-progress: false

jobs:
  tally:
    runs-on: ubuntu-latest
    steps:
      # ref: main 필수. 기본값은 '이벤트가 생긴 시점'의 커밋이라, concurrency 로 앞 실행을
      # 기다린 뒤에도 앞 실행이 방금 푸시한 커밋이 빠진 옛 기준으로 집계한다.
      # 그 결과 아래 rebase 가 slack-data.js 에서 충돌해 푸시가 8회 전부 실패했다(9/27 실행의 14%).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 슬랙 집계 실행 (오늘)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: C09HRUSG4TX
          TALLY_DATE_OFFSET: '0'
          # 설치 OB — 구글시트 '⚒️설치일정 확인해주세요' 를 CSV 로 읽는다(drive.readonly 로 충분).
          # 시크릿이 없으면 설치 OB만 건너뛰고 나머지 집계는 그대로 진행된다.
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: node scripts/fetch-and-tally.js

      - name: 당직시트 동기화 (구글 당직시트 → 당직근무 달력)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: node scripts/fetch-duty.js || echo "당직시트 동기화 실패 — 집계는 계속"

      - name: 판독 SDK 설치 (@anthropic-ai/sdk · 메뉴 이미지 판독)
        run: npm install --no-audit --no-fund || echo "SDK 설치 실패 — 판독 없이 진행"

      - name: 메뉴요청 적재 (대시보드 메뉴등록 카테고리)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Drive 링크 이미지 수집용 — 시크릿이 없으면 Drive만 건너뛰고 적재는 그대로 진행된다
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          # 메뉴 이미지 판독(Claude 비전) — 없으면 판독만 건너뛴다. 실행당 OCR_CAP(기본 12)장 상한.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-menu-requests.js || echo "메뉴요청 적재 실패 — 집계는 계속"

      - name: 방문설치 채널 적재 (현장방문)
        # #ishopcare_new_방문설치 워크플로우 글 → visit-data.js.
        # 대시보드가 상호명으로 브랜드를 갈라 각 브랜드의 '현장방문' 에 합친다.
        # slack-data.js 는 건드리지 않는다 — 원격파트 대시보드가 같은 파일을 읽는다.
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: node scripts/fetch-visits.js || echo "방문설치 적재 실패 — 집계는 계속"

      - name: 프랜차이즈 고객사 원장 생성 (컴포즈커피)
        # slack-data.js 에서 브랜드 매칭으로 컴포즈커피 건만 추려 franchise/data/compose.js 로.
        # 슬랙 재호출이 없어 실패해도 본 집계에는 영향이 없다.
        run: node scripts/tally-compose.js || echo "컴포즈 원장 생성 실패 — 집계는 계속"

      - name: 고객사 공유 페이지 빌드
        # --hosted: 원장을 런타임에 읽는 호스팅본만 만든다.
        # 단독 파일(원장 인라인)은 적재마다 100KB씩 쌓여 CI 에서는 만들지 않는다.
        run: node scripts/build-compose-share.js --hosted || echo "공유 페이지 빌드 실패 — 집계는 계속"

      - name: 변경 시 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain slack-data.js menu-requests.js duty-data.js menu-files visit-data.js franchise/data share/compose 2>/dev/null)" ]; then
            echo "변경 없음 — 커밋 생략"
          else
            git add slack-data.js
            [ -f menu-requests.js ] && git add menu-requests.js
            [ -f duty-data.js ] && git add duty-data.js
            [ -d menu-files ] && git add -A menu-files
            [ -f visit-data.js ] && git add visit-data.js
            [ -d franchise/data ] && git add -A franchise/data
            [ -d share/compose ] && git add -A share/compose
            git commit -m "chore: 원격 AS 집계 자동 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            # 그래도 겹치면(로컬 푸시 등) 충돌 구간은 방금 만든 집계 결과로 덮는다 —
            # 전부 슬랙에서 새로 만든 산출물이라 이번 실행 쪽이 최신이다.
            # (rebase 에서 -X theirs = 지금 올리려는 내 커밋 쪽)
            # 실패한 rebase 는 반드시 abort — 안 하면 남은 재시도가 전부 'rebase 진행 중'으로 죽는다.
            for i in 1 2 3 4 5 6 7 8; do
              if git pull --rebase --autostash -X theirs origin main; then
                git push && { echo "푸시 성공"; exit 0; }
              else
                git rebase --abort 2>/dev/null || true
              fi
              echo "푸시 경합 — 재시도 $i..."; sleep $((i*3))
            done
            echo "푸시 8회 실패 — 다음 실행에서 재시도"; exit 1
          fi
