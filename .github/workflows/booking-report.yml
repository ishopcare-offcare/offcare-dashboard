name: booking-report (예약 리포트)

# [예약]·(예약) 로 올라온 요청의 실제 처리 이모지 분포를 집계해 공유용 페이지·CSV 를 만든다.
# 슬랙 원문을 다시 읽어야 하는데 SLACK_BOT_TOKEN 이 여기(Actions 시크릿)에만 있어 워크플로로 돌린다.
#
# 실행: Actions 탭 → booking-report → Run workflow → 기간 확인 → 실행 (약 1분)
# 결과: share/booking-report.html · share/booking-report-share.html(외부 공유본) · share/booking-report.csv · share/nosetup-report.csv 가 커밋된다
#   https://ishopcare-offcare.github.io/offcare-dashboard/share/booking-report.html
on:
  workflow_dispatch:
    inputs:
      from_date:
        description: '집계 시작일 (YYYY-MM-DD)'
        required: true
        default: '2026-08-01'
      to_date:
        description: '집계 종료일 (YYYY-MM-DD, 이 날짜 포함)'
        required: true
        default: '2026-08-31'
      target_ids:
        description: '미설치건 요청자 슬랙 ID (예: U08BA4PDNLT=김봉수,U0AAA=최승훈). 비우면 이름으로 찾는다'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 예약 리포트 생성
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          FROM: ${{ inputs.from_date }}
          TO: ${{ inputs.to_date }}
          TARGET_IDS: ${{ inputs.target_ids }}
        run: node scripts/booking-report.js

      - name: 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain share/booking-report.html share/booking-report-share.html share/booking-report.csv share/nosetup-report.csv 2>/dev/null)" ]; then
            echo "변경 없음 — 커밋 생략"
          else
            git add share/booking-report.html share/booking-report-share.html share/booking-report.csv share/nosetup-report.csv
            git commit -m "chore: 예약 리포트 갱신 (${{ inputs.from_date }} ~ ${{ inputs.to_date }})"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && { echo "푸시 성공"; exit 0; }
              echo "푸시 경합 — 재시도 $i..."; sleep $((i*3))
            done
            echo "푸시 5회 실패"; exit 1
          fi
