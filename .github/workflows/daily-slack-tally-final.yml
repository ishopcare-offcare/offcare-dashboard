name: daily-slack-tally (final)

# 최종 마감 집계: 매일 01:10 KST (16:10 UTC)에 '방금 끝난 업무일'을 완전 집계.
# 업무일 경계가 새벽 1시라 그 이후에 돌려야 야간당직자의 00시대 업무까지 포함된다.
# (01:10 KST 시점의 업무일은 오늘 → TALLY_DATE_OFFSET=-1 이 방금 닫힌 어제 업무일)
on:
  schedule:
    - cron: '10 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# progress 와 같은 파일(slack-data.js)을 커밋하므로 같은 그룹으로 직렬화한다.
concurrency:
  group: slack-tally
  cancel-in-progress: false

jobs:
  tally-final:
    runs-on: ubuntu-latest
    steps:
      # ref: main — 기다린 뒤에도 최신 커밋 기준으로 집계하도록(progress 워크플로 주석 참고)
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 슬랙 집계 실행 (방금 닫힌 업무일 최종)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: C09HRUSG4TX
          # offset 0 이 맞다. 업무일 기준이 05:30 이라 01:10 KST 시점의 '오늘 업무일'은
          # 이미 어제 날짜(방금 01:00 에 닫힌 그 날)다. -1 로 두면 이틀 전을 집계한다.
          TALLY_DATE_OFFSET: '0'
        run: node scripts/fetch-and-tally.js

      - name: 변경 시 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet slack-data.js; then
            echo "변경 없음 — 커밋 생략"
          else
            git add slack-data.js
            git commit -m "chore: 원격 AS 최종 집계 ($(TZ=Asia/Seoul date -d 'yesterday' +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs origin main; then
                git push && { echo "푸시 성공"; exit 0; }
              else
                git rebase --abort 2>/dev/null || true
              fi
              echo "푸시 경합 — 재시도 $i..."; sleep 4
            done
            echo "푸시 5회 실패"; exit 1
          fi
