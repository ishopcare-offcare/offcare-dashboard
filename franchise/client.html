<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<script>try{if(localStorage.getItem('opcare_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<title>프랜차이즈 전용 대시보드 · iShopCare</title>
<link rel="icon" type="image/png" href="../favicon.png">
<style>
  :root{
    --ink:#1d1d1f; --ink-soft:#424245; --gray:#6e6e73; --gray2:#86868b;
    --line:#d2d2d7; --line-soft:#e8e8ed; --surface:#f5f5f7; --surface2:#fafafa;
    --surface-soft:#f0f0f3;
    --canvas:#ffffff; --blue:#0071e3; --blue-soft:#e8f1fd; --blue-deep:#0060c0;
    --red:#ff3b30; --red-soft:#ffecec; --green:#34c759; --green-soft:#e7f8ec;
    --orange:#ff9500; --purple:#5e5ce6; --muted:#aeaeb4;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.05);
    --radius:18px;
  }
  :root[data-theme="dark"]{
    --ink:#f2f2f7; --ink-soft:#c9c9ce; --gray:#a0a0a6; --gray2:#8a8a90;
    --line:#3a3a3f; --line-soft:#2a2a2e; --surface:#17171a; --surface2:#202024;
    --surface-soft:#2c2c31;
    --canvas:#242429; --blue:#0a84ff; --blue-soft:rgba(10,132,255,.22); --blue-deep:#5aa9ff;
    --red:#ff453a; --red-soft:rgba(255,69,58,.20); --green:#30d158; --green-soft:rgba(48,209,88,.20);
    --orange:#ff9f0a; --purple:#8b88ff; --muted:#7a7a80;
    --shadow:0 1px 3px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.55);
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro KR","Apple SD Gothic Neo",
      "Pretendard","맑은 고딕","Segoe UI",Roboto,sans-serif;
    background:var(--surface); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.45; display:flex; min-height:100vh;
  }

  .sidebar{width:252px; flex:0 0 252px; background:var(--canvas);
    border-right:1px solid var(--line-soft); padding:26px 16px;
    display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh}
  .brand{padding:4px 12px 20px}
  .brand h1{font-size:17px; font-weight:700; letter-spacing:-.02em; line-height:1.3}
  .brand p{font-size:12px; color:var(--gray2); margin-top:4px}
  .brand .since{display:inline-block; margin-top:8px; font-size:11px; font-weight:700;
    background:var(--blue-soft); color:var(--blue-deep); padding:2px 9px; border-radius:20px}
  .brand .since.gray{background:var(--surface); color:var(--gray)}
  .nav-label{font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--gray2);
    padding:8px 12px 4px; text-transform:uppercase}
  .navbtn{display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:11px 13px; border:none; background:none; border-radius:11px;
    font-size:15px; font-weight:600; color:var(--ink-soft); cursor:pointer;
    transition:background .15s,color .15s; font-family:inherit}
  .navbtn:hover{background:var(--surface)}
  .navbtn.active{background:var(--blue); color:#fff}
  .navbtn .ic{width:20px; text-align:center; font-size:16px}
  .nav-div{height:1px; background:var(--line-soft); margin:8px 12px}
  .side-foot{margin-top:auto; padding:10px 11px}
  .side-foot a{display:block; color:var(--blue); text-decoration:none;
    font-size:14px; font-weight:700; padding:7px 2px; border-radius:8px; transition:background .15s}
  .side-foot a:hover{background:var(--surface)}
  .side-sel{margin:0 11px 4px}
  .side-sel label{display:block; font-size:11px; font-weight:700; letter-spacing:.06em;
    color:var(--gray2); padding:8px 2px 5px; text-transform:uppercase}
  .side-sel select{width:100%}

  .main{flex:1; min-width:0; padding:32px 40px 72px; overflow-x:hidden}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px;
    flex-wrap:wrap; margin-bottom:22px}
  .page-head h2{font-size:30px; font-weight:700; letter-spacing:-.03em}
  .page-head .sub{font-size:14px; color:var(--gray); margin-top:5px}
  .controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  select,input[type=search]{font-family:inherit; font-size:14px; padding:9px 13px;
    border:1px solid var(--line); border-radius:11px; background:var(--canvas); color:var(--ink)}
  select{cursor:pointer; font-weight:600}
  .btn{background:var(--canvas); border:1px solid var(--line); padding:9px 15px; border-radius:11px;
    font-size:13px; font-weight:600; color:var(--ink); cursor:pointer; font-family:inherit; transition:.15s}
  .btn:hover{background:var(--surface)}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:var(--blue); color:#fff; border-color:var(--blue)}
  .btn.primary:hover{background:var(--blue-deep)}
  .btn.sm{padding:6px 11px; font-size:12.5px}
  .seg{display:inline-flex; background:var(--surface); border-radius:11px; padding:3px; border:1px solid var(--line-soft)}
  .seg button{border:none; background:none; padding:8px 15px; border-radius:8px;
    font-size:13px; font-weight:600; color:var(--gray); cursor:pointer; font-family:inherit}
  .seg button.on{background:var(--canvas); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}

  .notice{display:flex; gap:11px; align-items:flex-start; background:var(--blue-soft);
    border-radius:14px; padding:14px 16px; margin-bottom:20px}
  .notice .k{flex:0 0 auto; background:var(--blue); color:#fff; font-size:11.5px; font-weight:800;
    padding:3px 10px; border-radius:20px}
  .notice .t{font-size:13.5px; color:var(--ink-soft); line-height:1.6}
  .notice .t code{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px;
    background:rgba(0,0,0,.06); padding:1px 5px; border-radius:5px}
  .notice.warn{background:#fff4e0} .notice.warn .k{background:var(--orange)}
  .notice.danger{background:var(--red-soft)} .notice.danger .k{background:var(--red)}
  :root[data-theme="dark"] .notice.warn{background:rgba(255,159,10,.16)}
  :root[data-theme="dark"] .notice .t code{background:rgba(255,255,255,.1)}

  .ov-tiles{display:grid; grid-template-columns:repeat(var(--n,4),1fr); gap:14px; margin-bottom:22px}
  .ov-tile{background:var(--canvas); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow);
    border-left:4px solid var(--c,var(--blue))}
  .ov-tile .ov-name{font-size:15px; font-weight:600; color:var(--gray); display:flex; align-items:center; gap:6px}
  .ov-tile .ov-val{font-size:38px; font-weight:800; letter-spacing:-.03em; margin-top:9px; line-height:1}
  .ov-tile .ov-val small{font-size:15px; font-weight:600; color:var(--gray2); margin-left:4px}
  .ov-tile .ov-sub{font-size:12.5px; font-weight:600; margin-top:7px; color:var(--gray2)}
  .ov-tile.grand{background:linear-gradient(135deg,#0071e3,#4a9bff); border-left-color:#0060c0}
  .ov-tile.grand .ov-name{color:rgba(255,255,255,.9)}
  .ov-tile.grand .ov-val{color:#fff}
  .ov-tile.grand .ov-val small,.ov-tile.grand .ov-sub{color:rgba(255,255,255,.88)}

  .card{background:var(--canvas); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); margin-bottom:22px}
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap}
  .card-head h3{font-size:17px; font-weight:700; letter-spacing:-.01em}
  .card-head .hint{font-size:12.5px; color:var(--gray2)}
  .grid2{display:grid; grid-template-columns:1.25fr .75fr; gap:22px; align-items:start}
  .grid2.even{grid-template-columns:1fr 1fr}
  .chart-wrap{width:100%; overflow-x:auto}
  svg{display:block; max-width:100%}
  .chart-wrap svg{max-width:none}
  /* 순차(sequential) 색 단계 — 건수가 많을수록 진하다. 한 가지 색조만 쓴다.
     라이트/다크 각각 인접 단계가 구분되는지 검증한 값이다. */
  :root{ --seq1:#cde2fb; --seq2:#86b6ef; --seq3:#2a78d6; --seq4:#104281;
         --seq1-ink:#0d366b; --seq2-ink:#0d366b; --seq3-ink:#ffffff; --seq4-ink:#ffffff; }
  :root[data-theme="dark"]{ --seq1:#0d366b; --seq2:#256abf; --seq3:#6da7ec; --seq4:#cde2fb;
         --seq1-ink:#dbe9fb; --seq2-ink:#ffffff; --seq3-ink:#10233d; --seq4-ink:#10233d; }
  .cal-wrap{display:flex; flex-wrap:wrap; justify-content:center; gap:20px 30px; margin-top:4px}
  .vd-card{border:1px solid var(--line-soft); border-radius:12px; padding:12px 14px; margin-bottom:10px}
  .vd-head{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:14.5px}
  .vd-head .vd-meta{color:var(--gray2); font-size:12.5px; font-weight:600; margin-left:auto}
  .vd-tbl{width:100%; border-collapse:collapse; font-size:13px}
  .vd-tbl th{width:88px; text-align:left; padding:4px 8px 4px 0; color:var(--gray);
    font-weight:600; vertical-align:top; white-space:nowrap}
  .vd-tbl td{padding:4px 0; color:var(--ink-soft); word-break:break-all}
  .dlt{display:block; margin-top:5px; font-size:11.5px; font-weight:700}
  .ov-tile.grand .dlt{color:rgba(255,255,255,.95)}
  .dlt.up{color:var(--red)} .dlt.down{color:var(--green)} .dlt.flat,.dlt.new{color:var(--gray2)}
  .ov-tile.tile-btn{cursor:pointer; transition:transform .12s, box-shadow .12s}
  .ov-tile.tile-btn:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.10)}
  .lead-sum{display:flex; flex-wrap:wrap; gap:10px 34px; padding:2px 2px 18px}
  .lead-sum .ls{display:flex; flex-direction:column}
  .lead-sum .ls-v{display:flex; align-items:baseline; gap:3px}   /* 숫자와 '일' 을 같은 줄에 */
  .lead-sum b{font-size:28px; font-weight:800; letter-spacing:-.02em; line-height:1.1}
  .lead-sum small{font-size:13.5px; color:var(--gray2); font-weight:700}
  .lead-sum span{font-size:12px; color:var(--gray2); font-weight:600; margin-top:3px}
  /* 반복 인입 — 전체 폭이라 지점명·막대·건수·구성을 한 줄에 둔다 */
  .rep-row{display:flex; align-items:center; gap:14px; cursor:pointer;
    padding:7px 8px; border-radius:10px; transition:background .12s}
  .rep-row:hover{background:var(--surface)}
  .rep-nm{flex:0 0 132px; font-size:14px; font-weight:700; color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rep-bar{flex:1 1 150px; min-width:80px; height:12px; background:var(--surface);
    border-radius:7px; overflow:hidden}
  .rep-fill{height:100%; border-radius:7px; background:#ff9500; min-width:6px;
    -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .rep-n{flex:0 0 auto; font-size:12.5px; color:var(--gray); white-space:nowrap; min-width:58px}
  .rep-n b{font-size:15px; color:var(--ink)}
  .rep-cats{flex:1 1 240px; display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end}
  @media (max-width:860px){
    .rep-row{flex-wrap:wrap; gap:8px}
    .rep-nm{flex:1 1 100%}
    .rep-cats{flex:1 1 100%; justify-content:flex-start}
  }
  .vendors{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-top:14px;
    padding-top:12px; border-top:1px solid var(--line-soft)}
  .vendors .vh{font-size:11.5px; font-weight:700; color:var(--gray2)}
  .as-brk{display:flex; flex-direction:column; gap:9px}
  .as-brk-row{display:flex; align-items:center; gap:12px; cursor:pointer;
    padding:5px 6px; border-radius:9px; transition:background .12s}
  .as-brk-row:hover{background:var(--surface)}
  .as-brk-lab{flex:0 0 118px; font-size:13.5px; font-weight:700; color:var(--ink)}
  .as-brk-bar{flex:1; height:14px; background:var(--surface); border-radius:8px; overflow:hidden}
  .as-brk-fill{height:100%; border-radius:8px; min-width:6px; transition:width .3s;
    -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .as-brk-n{flex:0 0 auto; font-size:12.5px; color:var(--gray); white-space:nowrap}
  .as-brk-n b{font-size:15px; color:var(--ink)}
  .as-brk-note{font-size:11.5px; color:var(--gray2); margin-top:10px}
  .cal-c{cursor:pointer}
  .cal-c rect{transition:stroke .12s}
  .cal-c:hover rect{stroke:var(--ink); stroke-width:2}
  .cal-h{font-size:12.5px; font-weight:700; color:var(--gray); margin-bottom:5px}
  .lg i.lg-0{background:var(--canvas); box-shadow:inset 0 0 0 1px var(--line)}
  .legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:14px}
  .lg{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--gray); font-weight:600}
  .lg i{width:10px; height:10px; border-radius:3px; display:inline-block}

  .bar-row{margin-bottom:11px}
  .bar-meta{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; gap:10px}
  .bar-meta .nm{font-weight:600; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .bar-meta .ct{font-weight:700; color:var(--ink); white-space:nowrap}
  .bar-track{height:10px; background:var(--surface); border-radius:6px; overflow:hidden}
  .bar-fill{height:100%; border-radius:6px; background:var(--blue)}

  table{width:100%; border-collapse:collapse; font-size:14px}
  th{text-align:left; font-size:12px; font-weight:700; color:var(--gray); letter-spacing:.02em;
    padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--canvas)}
  th.num,td.num{text-align:right}
  td{padding:9px 12px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:var(--surface)}
  .tbl-wrap{overflow-x:auto}
  .tbl-wrap table{min-width:620px}
  .tbl-scroll{max-height:66vh; overflow:auto; border:1px solid var(--line-soft); border-radius:12px}
  .tbl-scroll table{min-width:620px}
  .tbl-scroll thead th{position:sticky; top:0; z-index:3; box-shadow:inset 0 -1px 0 var(--line)}
  .tbl-scroll tfoot td{position:sticky; bottom:0; z-index:3}
  tfoot td{font-weight:800; font-size:15px; color:var(--blue-deep); border-top:2px solid var(--blue);
    background:var(--blue-soft); padding:11px 12px}
  tfoot td:first-child{color:var(--ink-soft); background:var(--surface)}
  .zero{color:var(--muted)}
  .totcell{font-weight:800; color:var(--blue-deep); background:var(--blue-soft)}
  .cat-chip{display:inline-block; font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:20px; white-space:nowrap}
  .cat-dot{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:7px; vertical-align:middle}
  .req-cell{max-width:330px; font-size:13px; color:var(--ink-soft); line-height:1.4}
  /* 세부내역 팝업: 긴 스레드 원문이 행을 끝없이 늘리지 않게 3줄로 자른다 (마우스를 올리면 전문) */
  .clamp3{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; word-break:break-all}
  /* 장비 조회 */
  .eq-item{display:inline-block; font-size:12px; font-weight:700; padding:2px 9px; margin:2px 4px 2px 0; border-radius:20px;
    background:var(--surface); border:1px solid var(--line-soft); color:var(--ink-soft); white-space:nowrap}
  .eq-item small{font-weight:600; color:var(--gray2)}
  .eq-item.off{text-decoration:line-through; color:var(--gray2)}
  tr.eq-row{cursor:pointer}
  tr.eq-row:hover td{background:var(--surface)}
  tr.eq-row.on td{background:var(--blue-soft)}
  .eq-ed{font-size:10.5px; font-weight:800; padding:1px 6px; border-radius:20px; background:#efe7fd; color:#6e3fe5; vertical-align:middle}
  .eq-form{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; padding:4px 2px 2px}
  .eq-f{display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:700; color:var(--gray)}
  .eq-f input,.eq-f select{font:inherit; font-size:14px; font-weight:500; color:var(--ink); padding:9px 11px;
    border:1px solid var(--line); border-radius:10px; background:var(--canvas)}
  .eq-f input[readonly]{background:var(--surface); color:var(--gray)}
  .eq-hint{grid-column:1/-1; font-size:12.5px; color:var(--gray); background:var(--surface); border-radius:10px; padding:9px 12px}
  .eq-actions{grid-column:1/-1; display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-top:4px}
  .eq-err{margin-right:auto; color:var(--red); font-size:13px; font-weight:700}
  .eq-toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:10000; display:none;
    background:#1d1d1f; color:#fff; padding:11px 18px; border-radius:12px; font-size:14px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .eq-toast.bad{background:#b91c1c}
  /* 읽기 전용(고객사 공유본) — 수정 버튼을 전부 숨긴다 */
  .eq-ro [data-eqadd],.eq-ro [data-eqov],.eq-ro [data-eqedit],.eq-ro [data-eqdel]{display:none !important}
  @media (max-width:680px){ .eq-form{grid-template-columns:1fr} }
  .empty{text-align:center; color:var(--gray2); font-size:14px; padding:44px 12px; line-height:1.8}
  .delta{font-size:12.5px; font-weight:700}
  .delta.up{color:var(--red)} .delta.down{color:var(--green)} .delta.flat{color:var(--gray2)}
  .st-chip{display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:20px; white-space:nowrap}

  .rep{background:var(--canvas); border-radius:var(--radius); box-shadow:var(--shadow); padding:34px 38px; margin-bottom:22px}
  .rep-head{border-bottom:2px solid var(--ink); padding-bottom:18px; margin-bottom:26px}
  .rep-head .rh-client{font-size:13px; font-weight:700; color:var(--blue); letter-spacing:.04em}
  .rep-head h2{font-size:27px; font-weight:800; letter-spacing:-.03em; margin-top:7px; line-height:1.25}
  .rep-head .rh-meta{display:flex; flex-wrap:wrap; gap:18px; margin-top:14px; font-size:13px; color:var(--gray)}
  .rep-head .rh-meta b{color:var(--ink); font-weight:700}
  .rep-sec{margin-bottom:30px; break-inside:avoid; page-break-inside:avoid}
  .rep-sec > h3{font-size:16px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:9px}
  .rep-sec > h3 .no{background:var(--ink); color:var(--canvas); width:22px; height:22px; border-radius:6px;
    display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex:0 0 auto}
  .rep-note{font-size:12.5px; color:var(--gray); margin-top:10px; line-height:1.6}
  .rep-kpi{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:26px}
  .rk{border:1px solid var(--line); border-radius:12px; padding:14px 16px}
  .rk.rk-btn{cursor:pointer; transition:border-color .15s,background .15s}
  .rk.rk-btn:hover,.rk.rk-btn.on{border-color:var(--blue); background:var(--blue-soft)}
  .rk-caret{float:right; font-size:10px; color:var(--gray2); display:inline-block; transition:transform .15s}
  .rk-caret.on{transform:rotate(180deg)}
  .rk-panel{border:1px solid var(--line); border-left:3px solid var(--blue); border-radius:12px;
    padding:12px 14px; margin:-14px 0 26px; background:var(--surface2);
    max-height:260px; overflow:auto}
  .rk-ph{font-size:12px; font-weight:700; color:var(--gray); margin-bottom:9px}
  .rk-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:4px 16px}
  .rk-item{display:flex; align-items:center; gap:8px; font-size:13.5px; padding:5px 6px; border-radius:8px}
  .rk-item .rk-in{flex:1; font-weight:600; color:var(--ink-soft);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rk-item b{font-weight:800}
  .rk-item .rk-pc{color:var(--gray2); font-size:12px; min-width:46px; text-align:right}
  .rk-item.rk-click{cursor:pointer}
  .rk-item.rk-click:hover{background:var(--blue-soft)}
  .rk .rl{font-size:12.5px; font-weight:700; color:var(--gray)}
  .rk .rv{font-size:29px; font-weight:800; letter-spacing:-.03em; margin-top:5px; line-height:1}
  .rk .rv small{font-size:13px; font-weight:600; color:var(--gray2); margin-left:3px}

<script>
/* =====================================================================
   프랜차이즈 고객사별 대시보드  ·  client.html?b=<브랜드명>
   ---------------------------------------------------------------------
   두 가지 데이터 모드를 하나의 페이지로 처리한다.

   contract  clients.js 에 등록 + dataFile 있음 (예: 컴포즈커피)
             → 전용 원장(data/*.js)을 읽고 8종 카테고리 · 월간 보고서 · 엑셀
             dataFile 없이 ledger:'slack' 로 등록된 계약 고객사
             → 원장 파일 대신 slack-data.js 를 브랜드명으로 걸러 원장으로 쓴다
   slack     미등록 브랜드 (예: 드롭탑)
             → ../slack-data.js 의 기존 원격 집계를 브랜드명으로 걸러 보여줌
               (기존 파이프라인에 없는 방문AS·단순문의·세금계산서는 표시 불가)

   무거운 데이터 파일은 필요한 모드에서만 동적으로 로드한다.
   (slack-data.js 는 약 4MB → contract 모드에서 받으면 낭비)
   ===================================================================== */

const CLIENTS  = window.FRANCHISE_CLIENTS  || [];
const TAX      = window.FRANCHISE_TAXONOMY || {contract:[], slack:[]};
const INTAKES  = window.FRANCHISE_INTAKES  || [];
const STATUSES = window.FRANCHISE_STATUSES || [];

const QS    = new URLSearchParams(location.search);
const BRAND = (QS.get('b') || QS.get('brand') || '').trim();
const REG   = window.findClient ? window.findClient(BRAND) : null;
const MODE  = (REG && (REG.dataFile || REG.ledger === 'slack')) ? 'contract' : 'slack';
/* 원장 파일 없는 계약 고객사 — 계약 모드지만 원장은 slack-data.js 에서 만든다 */
const SLACK_LEDGER = MODE === 'contract' && !REG.dataFile;

/* 슬랙 원장 고객사는 계약 8종에 없는 배달·외주를 뒤에 덧붙인다 (건을 버리지 않도록) */
const CATS = (REG && REG.cats) ? REG.cats
           : SLACK_LEDGER      ? TAX.contract.concat(TAX.slack.filter(s=>!TAX.contract.some(c=>c.key===s.key)))
           : (MODE === 'contract' ? TAX.contract : TAX.slack);
const CLIENT = {
  name       : REG ? REG.brand : BRAND,
  icon       : REG ? (REG.icon || '🏢') : '🏢',
  startDate  : REG ? (REG.startDate || '') : '',
  provider   : REG ? (REG.provider || 'iShopCare 원격파트') : 'iShopCare 원격파트',
  reportTitle: REG ? (REG.reportTitle || '원격 지원 월간 리포트') : '원격 지원 월간 리포트',
};

const CAT_MAP    = Object.fromEntries(CATS.map(c=>[c.key,c]));
const INTAKE_MAP = Object.fromEntries(INTAKES.map(c=>[c.key,c]));
const STATUS_MAP = Object.fromEntries(STATUSES.map(c=>[c.key,c]));
const catName  = k => CAT_MAP[k]    ? CAT_MAP[k].name    : (k || '미분류');
const catColor = k => CAT_MAP[k]    ? CAT_MAP[k].color   : '#aeaeb4';
const intName  = k => INTAKE_MAP[k] ? INTAKE_MAP[k].name : '미기재';
const stName   = k => STATUS_MAP[k] ? STATUS_MAP[k].name : '처리완료';
const stColor  = k => STATUS_MAP[k] ? STATUS_MAP[k].color: '#34c759';
const ONSITE   = CATS.filter(c=>c.onsite).map(c=>c.key);

const num = n => (n||0).toLocaleString('ko-KR');
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const jsq = s => String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
/* 문서 생성일 — 고객사에 제출하는 보고서에 찍히므로 열어보는 날짜가 그대로 들어가야 한다.
   (고정값으로 두면 매일 틀린 날짜가 인쇄된다) */
const TODAY = (function(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
})();

/* ── 상태 (데이터 로드 후 채워짐) ───────────────────────────── */
let REC = [], IS_SAMPLE = false, DATA_UPDATED = '', LOAD_ERR = '';
let MONTHS = [], month = '', scope = 'today';
let rangeFrom = '', rangeTo = '';        /* 기간선택 */
let view = 'overview', recQ = '', recCat = '';
let storeQ = '';                         /* 지점 검색어 */
let repKpi = '';          /* 월간 보고서 상단 KPI 펼침 상태: '' | 'cat' | 'store' */

/* ── 월 유틸 ────────────────────────────────────────────────── */
const ymOf = d => String(d).slice(0,7);
function nowYM(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function prevYM(ym){ const y=+ym.slice(0,4), m=+ym.slice(5,7); return m===1 ? (y-1)+'-12' : y+'-'+String(m-1).padStart(2,'0'); }
function nextYM(ym){ const y=+ym.slice(0,4), m=+ym.slice(5,7); return m===12 ? (y+1)+'-01' : y+'-'+String(m+1).padStart(2,'0'); }
function ymLabel(ym){ return ym.slice(0,4)+'년 '+(+ym.slice(5,7))+'월'; }
function daysInYM(ym){
  const y=+ym.slice(0,4), m=+ym.slice(5,7), n=new Date(Date.UTC(y,m,0)).getUTCDate(), out=[];
  for(let i=1;i<=n;i++) out.push(ym+'-'+String(i).padStart(2,'0'));
  return out;
}
const START_YM = CLIENT.startDate ? ymOf(CLIENT.startDate) : '';

/* ── 데이터 로더 ────────────────────────────────────────────── */
function loadScript(src){
  return new Promise((res,rej)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = res;
    s.onerror = ()=>rej(new Error(src + ' 를 불러올 수 없습니다'));
    document.head.appendChild(s);
  });
}

/* contract 모드: data/<slug>.js → window.CLIENT_DATA[slug] */
function buildFromClientData(){
  const D = (window.CLIENT_DATA || {})[REG.slug];
  if(!D){ LOAD_ERR = REG.dataFile + ' 이 window.CLIENT_DATA[\''+REG.slug+'\'] 를 채우지 않았습니다.'; return; }
  IS_SAMPLE = !!D.sample; DATA_UPDATED = D.updatedAt || '';
  REC = (D.records||[]).filter(r=>r && r.date && r.cat).map(r=>({
    date  : String(r.date).slice(0,10),
    time  : r.time || '',
    store : r.store || '',
    branch: r.branch ? String(r.branch).trim() : deriveBranch(r.store),
    biz   : String(r.biz||'').replace(/\D/g,''),
    cat   : r.cat,
    emp   : r.emp || '미지정',
    intake: INTAKE_MAP[r.intake] ? r.intake : 'unknown',
    status: STATUS_MAP[r.status] ? r.status : 'done',
    req   : r.req || '', note: r.note || '',
  }));
}
function deriveBranch(store){
  let s = String(store||'').trim();
  if(CLIENT.name) s = s.split(CLIENT.name).join(' ');
  s = s.replace(/\s+/g,' ').trim().replace(/^\((.+)\)$/,'$1');
  return s || '본점';
}

/* slack 모드: ../slack-data.js 를 브랜드명으로 필터 */
function buildFromSlack(){
  const SD = window.SLACK_DATA;
  if(!SD || !SD.days){ LOAD_ERR = '../slack-data.js 를 불러오지 못했습니다.'; return; }
  const idx = BrandMatch.buildIndex(window.FRANCHISE_BRANDS);
  const ex  = BrandMatch.buildExclude(window.FRANCHISE_EXCLUDE);
  const out = [];
  Object.keys(SD.days).sort().forEach(date=>{
    const day = SD.days[date] || {};
    (day.done||[]).forEach(r=>{
      if(ex.test(r.store, r.biz)) return;
      const m = BrandMatch.matchBrand(idx, r.store||'');
      if(!m || m.brand.name !== BRAND) return;
      out.push({
        date:date, time:r.time||'', store:r.store||'',
        branch: BrandMatch.branchOf(r.store||'', m.hit),
        biz:String(r.biz||'').replace(/\D/g,''), cat:r.cat||'',
        emp:r.emp||'미지정',
        intake: INTAKE_MAP[r.intake] ? r.intake : 'unknown',
        status:'done', req:r.req||'', note:r.note||'',
      });
    });
    (day.pending||[]).forEach(r=>{
      if(ex.test(r.store, r.biz)) return;
      const m = BrandMatch.matchBrand(idx, r.store||'');
      if(!m || m.brand.name !== BRAND) return;
      out.push({
        date:date, time:r.time||'', store:r.store||'',
        branch: BrandMatch.branchOf(r.store||'', m.hit),
        biz:String(r.biz||'').replace(/\D/g,''), cat:r.cat||'',
        emp:r.handler||'미지정',
        intake: INTAKE_MAP[r.intake] ? r.intake : 'unknown',
        status:'pending', req:(r.reasons||[]).join(', '), note:'',
      });
    });
  });
  REC = out;
  IS_SAMPLE = false;
}

function finishInit(){
  REC.sort((a,b)=> a.date<b.date?1 : a.date>b.date?-1 : (a.time<b.time?1:-1));
  const all = REC.map(r=>ymOf(r.date)).concat(START_YM?[START_YM]:[], [nowYM()]).filter(Boolean);
  if(!all.length) MONTHS = [nowYM()];
  else {
    const from = all.reduce((a,b)=>a<b?a:b), to = all.reduce((a,b)=>a>b?a:b);
    MONTHS = [];
    for(let c=from; c<=to && MONTHS.length<240; c=nextYM(c)) MONTHS.push(c);
    MONTHS.reverse();
  }
  month = REC.length ? ymOf(REC[0].date) : MONTHS[0];
}

/* ── 집계 헬퍼 ─────────────────────────────────────────────── */
/* ── 기간 선택 ──────────────────────────────────────────────
   scope: today | yesterday | week | month | custom
     · month  은 monthSel 로 고른 달
     · custom 은 rangeFrom ~ rangeTo
   월간 보고서는 언제나 '한 달' 문서라 이 선택과 무관하게 month 를 쓴다. */
const SCOPES = [
  { key:'yesterday', name:'어제' },
  { key:'today',     name:'오늘' },
  { key:'week',      name:'주간' },
  { key:'month',     name:'월별' },
  { key:'custom',    name:'기간선택' },
];

/* 날짜 더하기는 UTC 로 한다 — 로컬 시간으로 계산하면 시차·서머타임에서 하루가 밀린다 */
const dnum = s => Date.UTC(+String(s).slice(0,4), +String(s).slice(5,7) - 1, +String(s).slice(8,10));
const dstr = t => { const d = new Date(t);
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0')
       + '-' + String(d.getUTCDate()).padStart(2,'0'); };
const addD = (s, n) => dstr(dnum(s) + n * 86400000);

function scopeRange(){
  if(scope === 'yesterday'){ const d = addD(TODAY, -1); return { from:d, to:d }; }
  if(scope === 'today')      return { from:TODAY, to:TODAY };
  if(scope === 'week'){
    /* 월요일 시작. 일요일(0)이면 6일 전이 그 주 월요일이다 */
    const mon = addD(TODAY, -((dowOf(TODAY) + 6) % 7));
    return { from:mon, to:addD(mon, 6) };
  }
  if(scope === 'custom'){
    const a = rangeFrom || TODAY, b = rangeTo || TODAY;
    return a <= b ? { from:a, to:b } : { from:b, to:a };   /* 거꾸로 골라도 동작 */
  }
  const days = daysInYM(month);                             /* month */
  return { from:days[0], to:days[days.length-1] };
}

function scopedRecs(){
  const r = scopeRange();
  return REC.filter(x => x.date >= r.from && x.date <= r.to);
}

function scopeLabel(){
  if(scope === 'month') return ymLabel(month);
  const r = scopeRange();
  if(r.from === r.to) return r.from + ' (' + DOW_KO[dowOf(r.from)] + ')';
  return r.from + ' ~ ' + r.to;
}

function byCat(rows){ const o={}; CATS.forEach(c=>o[c.key]=0); rows.forEach(r=>{ o[r.cat]=(o[r.cat]||0)+1; }); return o; }
function storeAgg(rows){
  const m = new Map();
  rows.forEach(r=>{
    const k = r.branch;
    if(!m.has(k)) m.set(k,{branch:k, store:r.store, total:0, cats:{}, last:'', onsite:0});
    const o = m.get(k);
    o.total++; o.cats[r.cat]=(o.cats[r.cat]||0)+1;
    if(ONSITE.indexOf(r.cat)>=0) o.onsite++;
    if(r.date>o.last) o.last = r.date;
  });
  return [...m.values()].sort((a,b)=>b.total-a.total || a.branch.localeCompare(b.branch,'ko'));
}

/* ── 차트 ──────────────────────────────────────────────────── */

/* Y축 눈금 간격.
   예전엔 Math.round(max*i/4) 로 4등분했는데, 일 최대가 2건이면
   눈금이 0,1,1,2,2 로 나와 같은 숫자가 두 번 찍혔다(그래프가 깨져 보인 주원인).
   → 1·2·5·10 계열의 '보기 좋은 정수 간격'을 골라 눈금이 겹치지 않게 한다. */
function niceStep(max, target){
  const raw = Math.max(max / (target || 4), 1);
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const cands = [1, 2, 2.5, 5, 10].map(x=>x*pow);
  let step = cands.find(c=>c >= raw);
  if(step === undefined) step = cands[cands.length-1];
  return Math.max(1, Math.round(step));
}
const DOW_KO = ['일','월','화','수','목','금','토'];
const dowOf = d => new Date(d + 'T00:00:00Z').getUTCDay();

/* opt.report = true → 월간 보고서용.
   주말 음영 · 요일 표기 · 일 평균선을 넣고 막대 폭을 좁혀 31일이 한눈에 들어오게 한다. */
/* ── 일별 인입 캘린더 ────────────────────────────────────────
   예전에는 한 달치를 8종 누적 막대로 그렸는데, 하루 1~2건짜리 데이터에서는
   막대 한 칸이 몇 px밖에 안 돼 색을 구분할 수 없었다. 게다가 절반 넘는 날이
   0건이라 그림의 대부분이 빈 공간이었다.
   원인은 한 그림에 '언제'와 '무엇'을 같이 욱여넣은 것 — 그래서 나눈다.
     · 언제(날짜별 많고 적음) → 이 달력. 한 가지 색조의 진하기로만 표현
     · 무엇(카테고리)         → 카테고리 분포 도넛 / 「카테고리별 처리 건수」 표
   칸마다 숫자를 직접 적으므로 색을 못 읽어도 값은 항상 읽힌다.
   (색 단계는 dataviz 검증 스크립트로 인접 단계 식별 가능 여부를 확인했다) */

const SEQ_BG  = ['', 'var(--seq1)',     'var(--seq2)',     'var(--seq3)',     'var(--seq4)'];
const SEQ_INK = ['', 'var(--seq1-ink)', 'var(--seq2-ink)', 'var(--seq3-ink)', 'var(--seq4-ink)'];

function calDaily(rows, opt){
  opt = opt || {};
  const byDate = new Map();
  rows.forEach(function(r){
    if(!byDate.has(r.date)) byDate.set(r.date, {t:0, c:{}});
    const o = byDate.get(r.date);
    o.t++; o.c[r.cat] = (o.c[r.cat] || 0) + 1;
  });

  /* 그릴 달: 지정이 있으면 그것, 없으면 데이터가 있는 모든 달 */
  const yms = (opt.months && opt.months.length)
    ? opt.months
    : [...new Set([...byDate.keys()].map(ymOf))].sort();
  if(!yms.length) return '<div class="empty">표시할 기간이 없습니다.</div>';

  const maxV = Math.max(1, ...[...byDate.values()].map(o => o.t));
  /* 건수가 적을 땐 값 자체가 곧 단계다. 억지로 4분위로 나누면 1건과 2건이 같은 색이 된다 */
  const level = v => !v ? 0 : (maxV <= 4 ? Math.min(4, v) : Math.min(4, Math.ceil(v / maxV * 4)));

  const multi = yms.length > 1;
  return '<div class="cal-wrap">'
    + yms.map(ym => calGrid(ym, byDate, level, !!opt.report, multi)).join('')
    + '</div>'
    + calLegend(maxV, level);
}

function calGrid(ym, byDate, level, rep, showTitle){
  const days  = daysInYM(ym);
  const lead  = dowOf(days[0]);                 /* 1일이 무슨 요일인지 */
  const weeks = Math.ceil((lead + days.length) / 7);

  const CW = rep ? 46 : 56, CH = rep ? 44 : 52, GAP = 4, padT = 21;
  const W = CW * 7, H = padT + CH * weeks;

  let s = '';

  /* 주말 열에 옅은 음영 — 요일 패턴이 눈에 먼저 들어오게 */
  [0, 6].forEach(function(i){
    s += '<rect x="' + (i * CW) + '" y="' + (padT - 3) + '" width="' + CW
       + '" height="' + (CH * weeks + 3) + '" rx="7" fill="var(--surface)" opacity=".6"/>';
  });

  /* 요일 머리글 */
  for(let i = 0; i < 7; i++){
    s += '<text x="' + (i * CW + CW / 2) + '" y="12" text-anchor="middle" font-size="10.5"'
       + ' font-weight="700" fill="var(--gray2)">' + DOW_KO[i] + '</text>';
  }

  days.forEach(function(d, n){
    const idx = lead + n;
    const cx  = (idx % 7) * CW, cy = padT + Math.floor(idx / 7) * CH;
    const x = cx + GAP / 2, y = cy + GAP / 2, w = CW - GAP, hh = CH - GAP;
    const o = byDate.get(d), v = o ? o.t : 0, lv = level(v);
    const ink = lv ? SEQ_INK[lv] : 'var(--gray2)';

    const detail = v
      ? ' · 총 ' + v + '건 · ' + CATS.filter(c => o.c[c.key]).map(c => c.name + ' ' + o.c[c.key]).join(', ')
      : ' · 인입 없음';

    s += '<g' + (v ? ' class="cal-c" data-date="' + d + '"' : '') + '>'
       + '<title>' + esc(d + ' (' + DOW_KO[dowOf(d)] + ')' + detail + (v ? ' · 누르면 상세' : '')) + '</title>'
       + '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + hh + '" rx="9"'
       + ' fill="' + (lv ? SEQ_BG[lv] : 'var(--canvas)') + '"'
       + ' stroke="var(--line-soft)" stroke-width="' + (lv ? 0 : 1) + '"/>'
       /* 날짜는 늘, 건수는 있을 때만 — 0건 칸을 숫자로 채우면 다시 시끄러워진다 */
       + '<text x="' + (x + 8) + '" y="' + (y + 15) + '" font-size="10.5" font-weight="600"'
       + ' fill="' + ink + '" opacity="' + (lv ? '.75' : '1') + '">' + (+d.slice(8)) + '</text>'
       + (v ? '<text x="' + (x + w - 8) + '" y="' + (y + hh - 9) + '" text-anchor="end"'
            + ' font-size="' + (rep ? 17 : 19) + '" font-weight="800" fill="' + ink + '">' + v + '</text>' : '')
       + '</g>';
  });

  return '<div class="cal">'
    + (showTitle ? '<div class="cal-h">' + esc(ymLabel(ym)) + '</div>' : '')
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' + s + '</svg>'
    + '</div>';
}

/* 범례 — 단계마다 실제 건수 구간을 같이 적어, 색만 보고 값을 추측하지 않게 한다 */
function calLegend(maxV, level){
  const out = [];
  for(let lv = 1; lv <= 4; lv++){
    const vs = [];
    for(let v = 1; v <= maxV; v++) if(level(v) === lv) vs.push(v);
    if(!vs.length) continue;
    out.push('<span class="lg"><i style="background:' + SEQ_BG[lv] + '"></i>'
      + (vs.length === 1 ? vs[0] + '건' : vs[0] + '~' + vs[vs.length - 1] + '건') + '</span>');
  }
  return '<div class="legend" style="justify-content:center">'
    + '<span class="lg"><i class="lg-0"></i>인입 없음</span>' + out.join('') + '</div>';
}

function svgDonut(entries, total){
  if(!total) return '<div class="empty">데이터 없음</div>';
  const sw=26, rm=78-sw/2, C=2*Math.PI*rm, cx=96, cy=96;
  let acc=0, segs='';
  entries.forEach(e=>{
    const len = e.v/total*C;
    segs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+rm+'" fill="none" stroke="'+e.c+'" stroke-width="'+sw+'"'
      + ' stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'"'
      + ' transform="rotate(-90 '+cx+' '+cy+')"><title>'+esc(e.n)+' '+e.v+'건</title></circle>';
    acc += len;
  });
  return '<svg viewBox="0 0 192 192" width="192" height="192">'+segs
    + '<text x="'+cx+'" y="'+(cy-3)+'" text-anchor="middle" font-size="30" font-weight="800" fill="var(--ink)">'+total+'</text>'
    + '<text x="'+cx+'" y="'+(cy+19)+'" text-anchor="middle" font-size="12" fill="var(--gray2)">건</text></svg>';
}

/* ── 뷰: 전체현황 ──────────────────────────────────────────── */
function viewOverview(){
  const rows = scopedRecs(), cb = byCat(rows);
  const stores = new Set(rows.map(r=>r.branch)).size;
  const open   = rows.filter(r=>r.status!=='done').length;
  let h = sampleBanner() + modeBanner() + preStartBanner();

  /* 상단 타일 — 전 브랜드 동일하게 6종.
     총 인입 · 원격지원 · 현장방문 · 메뉴등록 · 명의변경 · 처리중
     브랜드를 옮겨 다닐 때 읽는 법이 바뀌지 않도록 모드로 갈라두지 않는다.
     그 브랜드 체계에 없는 분류(slack 모드의 방문AS)는 '집계 대상 아님' 으로 표시된다. */
  const pct = v => rows.length ? '전체의 '+(v/rows.length*100).toFixed(1)+'%' : '—';
  /* 이 브랜드의 카테고리 체계에 없는 분류는 '0건'이 아니라 집계 대상이 아니라고 적는다.
     (slack 모드에는 방문AS 분류 자체가 없다 — 0건으로 두면 '없었다'로 읽힌다) */
  const catTile = (key, ic, label) => {
    const c = CAT_MAP[key];
    if(!c) return tile('', ic, label, 0, '건', '집계 대상 아님', '#aeaeb4');
    const n = cb[key] || 0;   /* 건이 있으면 눌러서 세부내역 */
    return tile(n?'tile-btn':'', ic, label, n, '건', pct(n), c.color, n?'cat:'+key:'');
  };
  const grandTile = tile('grand'+(rows.length?' tile-btn':''),'📥','총 인입', rows.length,'건',
                         esc(scopeLabel())+' · 지점 '+stores+'곳' + deltaBadge(rows.length),
                         '', rows.length?'all':'');
  /* 처리중은 눌러서 목록을 볼 수 있게 한다 — 본사가 가장 급한 항목이다 */
  const openTile  = tile(open?'tile-btn':'','⏳','처리중', open,'건',
                         open?'눌러서 목록 보기':'전건 처리완료', open?'#ff9500':'#34c759',
                         open?'open':'');
  const tiles = [ grandTile,
                  catTile('as','🖥','원격지원'),
                  catTile('visit','🚗','현장방문'),
                  catTile('menu','📝','메뉴등록'),
                  catTile('transfer','🔄','명의변경'),
                  openTile ];
  h += '<div class="ov-tiles" style="--n:'+tiles.length+'">' + tiles.join('') + '</div>';

  if(!rows.length){
    h += '<div class="card"><div class="empty">'
      + '<b style="font-size:17px;color:var(--ink)">'+esc(scopeLabel())+' 인입 내역이 없습니다.</b><br>'
      + (START_YM && ymOf(scopeRange().to) < START_YM
          ? '관리 개시는 '+esc(CLIENT.startDate)+'입니다.'
          : '위 기간 버튼으로 다른 기간을 보시거나, 아래 달력에서 인입이 있던 날을 눌러보세요.')
      + '</div></div>';
  }

  h += '<div class="card"><div class="card-head"><h3>일별 인입 현황</h3>'
    + '<span class="hint">전체 기간 · 칸이 진할수록 많음 · 날짜를 누르면 그날 인입 상세</span></div>'
    + calDaily(REC, {})+'</div>';

  /* 아래 카드들은 고른 기간의 숫자라 0건이면 낼 것이 없다 */
  if(!rows.length) return h;

  h += '<div class="card"><div class="card-head"><h3>🔧 AS 유형별</h3>'
    + '<span class="hint">'+esc(asKeyLabel())+' 기준 · 요청내역+처리내역으로 분류 · 유형을 누르면 목록</span></div>'
    + asIssueBreakdown(rows)+'</div>';

  /* 각각 전체 폭 — 반쪽에서는 막대가 너무 짧다 */
  h += visitKindBreakdown(rows) + visitByBreakdown(rows) + leadTimeCard(rows);

  /* 지점 검색 — 본사가 특정 가맹점 이력을 바로 찾을 수 있게 */
  const q = storeQ.trim().toLowerCase();
  const aggAll = storeAgg(rows);
  const agg = q ? aggAll.filter(o => (o.branch + ' ' + o.store).toLowerCase().includes(q)) : aggAll;
  const mx = agg.length ? agg[0].total : 1;
  const shown = q ? agg : agg.slice(0, 10);
  h += '<div class="grid2">'
    + '<div class="card"><div class="card-head"><h3>지점' + (q ? '' : ' TOP 10') + '</h3>'
    + '<input type="search" id="storeQ" placeholder="지점 검색" value="' + esc(storeQ) + '"'
    + ' style="min-width:130px;max-width:170px"></div>'
    + (shown.length
        ? shown.map(o => '<div class="bar-row" style="cursor:pointer" data-branch="' + esc(o.branch) + '">'
            + '<div class="bar-meta"><span class="nm">' + esc(o.branch) + '</span><span class="ct">' + o.total + '건'
            + (o.onsite ? ' <span style="color:var(--red);font-size:11.5px">방문' + o.onsite + '</span>' : '') + '</span></div>'
            + '<div class="bar-track"><div class="bar-fill" style="width:' + (o.total / mx * 100).toFixed(1) + '%"></div></div></div>').join('')
        : '<div class="empty">맞는 지점이 없습니다.</div>')
    + (q ? '<div style="font-size:11.5px;color:var(--gray2);margin-top:8px">검색 결과 ' + agg.length + '곳</div>' : '')
    + '</div>'
    + '<div class="card"><div class="card-head"><h3>카테고리 분포</h3></div>'
    + '<div style="display:flex;justify-content:center">'
    + svgDonut(CATS.filter(c=>cb[c.key]).map(c=>({n:c.name,c:c.color,v:cb[c.key]})), rows.length)+'</div>'
    + '<div class="legend" style="justify-content:center">'
    + CATS.filter(c=>cb[c.key]).map(c=>'<span class="lg"><i style="background:'+c.color+'"></i>'+c.name+' '+cb[c.key]+'</span>').join('')
    + '</div></div></div>';

  h += repeatStoresCard(rows);            /* 지점명 + 카테고리 구성이라 폭이 필요하다 */

  const usedInt = INTAKES.filter(t=>rows.some(r=>r.intake===t.key));
  h += '<div class="grid2 even">'
    + '<div class="card"><div class="card-head"><h3>인입 경로</h3></div>'
    + (usedInt.length ? usedInt.map(function(t){
        const v = rows.filter(r=>r.intake===t.key).length, p = v/rows.length*100;
        return '<div class="bar-row"><div class="bar-meta"><span class="nm">'+t.name+'</span>'
          + '<span class="ct">'+v+'건 <span style="color:var(--gray2);font-weight:600">'+p.toFixed(0)+'%</span></span></div>'
          + '<div class="bar-track"><div class="bar-fill" style="width:'+p.toFixed(1)+'%;background:'+t.color+'"></div></div></div>';
      }).join('') : '<div class="empty">데이터 없음</div>')
    + '</div>'
    + '<div class="card"><div class="card-head"><h3>시간대별 인입</h3>'
    + '<span class="hint">인입 시각 기준</span></div>'
    + hourBands(rows)
    + '</div></div>';
  return h;
}
/* ── 시간대별 인입 ──────────────────────────────────────────
   가맹점이 주로 언제 도움을 필요로 하는지. 담당자 처리량을 대신한다 —
   고객사가 보는 화면에 사내 직원별 실적을 둘 이유가 없다.
   시(hour) 단위로 24칸을 그리면 절반이 빈 칸이라, 운영상 의미가 있는
   구간으로 묶는다. 한 종류 계열이므로 색은 한 가지만 쓰고 범례를 두지 않는다. */
const HOUR_BANDS = [
  { label: '09시 이전', desc: '개점 준비',      test: h => h < 9 },
  { label: '09–12시',  desc: '오전',           test: h => h >= 9  && h < 12 },
  { label: '12–15시',  desc: '점심 피크 전후',  test: h => h >= 12 && h < 15 },
  { label: '15–18시',  desc: '오후',           test: h => h >= 15 && h < 18 },
  { label: '18시 이후', desc: '저녁·마감',      test: h => h >= 18 },
];

function hourBands(rows){
  const timed = rows.filter(r => /^\d{1,2}:/.test(String(r.time || '')));
  if(!timed.length) return '<div class="empty">인입 시각이 기록된 건이 없습니다.</div>';

  const counts = HOUR_BANDS.map(b => timed.filter(r => b.test(+String(r.time).split(':')[0])).length);
  const mx = Math.max.apply(null, counts), tot = timed.length;
  const noTime = rows.length - timed.length;

  let h = HOUR_BANDS.map(function(b, i){
    const v = counts[i];
    const peak = v > 0 && v === mx;
    return '<div class="bar-row" title="' + esc(b.label + ' (' + b.desc + ') · ' + v + '건') + '">'
      + '<div class="bar-meta"><span class="nm">' + esc(b.label)
      + (peak ? ' <span style="font-size:11px;color:var(--blue);font-weight:700">최다</span>' : '')
      + '</span><span class="ct">' + v + '건 '
      + '<span style="color:var(--gray2);font-weight:600">' + (v / tot * 100).toFixed(0) + '%</span>'
      + '</span></div>'
      + '<div class="bar-track"><div class="bar-fill" style="width:'
      + (mx ? (v / mx * 100).toFixed(1) : '0') + '%"></div></div></div>';
  }).join('');

  /* 시각이 없는 건을 조용히 빼면 합이 안 맞아 보인다 */
  if(noTime)

       + '시각 미기재 ' + noTime + '건은 제외했습니다.</div>';
  return h;
}

    rows = rows.filter(r=>(r.branch+' '+r.store+' '+r.emp+' '+r.req+' '+r.note).toLowerCase().indexOf(q)>=0); }

/* 월간 보고서 상단 KPI 카드. key 가 있으면 눌러서 내역을 펼친다(핸들러는 bindEvents 에서 위임) */
function repKpiCard(key, label, val, unit){
  const on = !!key && repKpi === key;
  return '<div class="rk'+(key?' rk-btn':'')+(on?' on':'')+'"'
    + (key?' data-kpi="'+key+'"':'')+'>'
    + '<div class="rl">'+esc(label)+(key?'<span class="rk-caret'+(on?' on':'')+'">▼</span>':'')+'</div>'
    + '<div class="rv">'+val+'<small>'+unit+'</small></div></div>';
}

/* 펼침 패널 — 화면에서 바로 확인하기 위한 것.
   같은 내용이 아래 「카테고리별 처리 건수」·「지점별 처리 현황」 섹션에 그대로 있으므로
   고객사에 나가는 인쇄본에는 넣지 않는다(no-print). */
function repKpiPanel(rows, cb, agg){
  if(!repKpi) return '';
  let head, items;
  if(repKpi === 'cat'){
    const used = CATS.filter(c=>(cb[c.key]||0) > 0);
    head  = '카테고리별 내역 · ' + used.length + '종';
    items = used.map(c=>'<div class="rk-item">'
      + '<span class="cat-dot" style="background:'+c.color+'"></span>'
      + '<span class="rk-in">'+esc(c.name)+'</span>'
      + '<b>'+num(cb[c.key])+'</b>'
      + '<span class="rk-pc">'+(cb[c.key]/rows.length*100).toFixed(1)+'%</span></div>').join('');
  }else{
    head  = '인입 지점 · ' + agg.length + '곳 (지점을 누르면 처리 내역)';
    items = agg.map(o=>'<div class="rk-item rk-click" data-branch="'+esc(o.branch)+'">'
      + '<span class="rk-in">'+esc(o.branch)+'</span>'
      + '<b>'+num(o.total)+'</b>'
      + '<span class="rk-pc">'+(o.total/rows.length*100).toFixed(1)+'%</span></div>').join('');
  }
  return '<div class="rk-panel no-print"><div class="rk-ph">'+esc(head)+'</div>'
    + '<div class="rk-grid">'+items+'</div></div>';
}

/* ── 뷰: 월간 보고서 ───────────────────────────────────────── */
function viewReport(){
  const rows  = REC.filter(r=>ymOf(r.date)===month);
  const pv    = prevYM(month);
  const prevR = REC.filter(r=>ymOf(r.date)===pv);
  const cb = byCat(rows), pb = byCat(prevR), agg = storeAgg(rows);
  const onsite = rows.filter(r=>ONSITE.indexOf(r.cat)>=0);
  const hasPrev = prevR.length > 0;
  let h = sampleBanner() + modeBanner();

  h += '<div class="rep"><div class="rep-head">'
    + '<div class="rh-client">'+esc(CLIENT.name)+'</div>'
    + '<h2>'+esc(ymLabel(month))+' '+esc(CLIENT.reportTitle)+'</h2>'
    + '<div class="rh-meta">'
    + '<span>보고 기간 <b>'+esc(ymLabel(month))+'</b></span>'
    + (CLIENT.startDate ? '<span>관리 개시 <b>'+esc(CLIENT.startDate)+'</b></span>' : '')
    + '<span>총 처리 <b>'+num(rows.length)+'건</b></span>'
    + (IS_SAMPLE ? '<span style="color:var(--red);font-weight:800">※ 샘플 데이터</span>' : '')
    + '</div></div>';

  if(!rows.length){
    h += '<div class="empty"><b style="font-size:17px;color:var(--ink)">'+esc(ymLabel(month))+' 처리 내역이 없습니다.</b><br>'
      + (START_YM && month<START_YM ? '관리 개시('+esc(CLIENT.startDate)+') 이전 월입니다.' : '보고할 데이터가 없습니다.')
      + '</div></div>';
    return h;
  }

  /* 상단 KPI. 방문AS 는 별도 칸을 두지 않고 「총 처리 건수」를 눌러 펼치는
     카테고리 내역 안에서 보여준다. 인입 지점도 눌러 지점 목록을 펼친다. */
  h += '<div class="rep-kpi">'
    + repKpiCard('cat',   '총 처리 건수', num(rows.length), '건')
    + repKpiCard('store', '인입 지점',    num(agg.length),  '곳')
    + repKpiCard('',      '지점당 평균',  (rows.length/agg.length).toFixed(1), '건')
    + '</div>'
    + repKpiPanel(rows, cb, agg);

  h += '<div class="rep-sec"><h3><span class="no">1</span>카테고리별 처리 건수</h3>'
    + '<table class="rep-tbl"><thead><tr><th>구분</th><th class="num">건수</th><th class="num">비중</th>'
    + (hasPrev?'<th class="num">'+esc(ymLabel(pv))+'</th><th class="num">증감</th>':'')+'</tr></thead><tbody>'
    + CATS.map(function(c){
        const v=cb[c.key]||0, p=hasPrev?(pb[c.key]||0):0, d=v-p;
        const dl = !hasPrev ? '' : (d>0?'<span class="delta up">▲ '+d+'</span>'
                  : d<0?'<span class="delta down">▼ '+Math.abs(d)+'</span>':'<span class="delta flat">–</span>');
        return '<tr><td><span class="cat-dot" style="background:'+c.color+'"></span>'+c.name
          + (c.onsite?' <span style="font-size:11px;color:var(--red);font-weight:700">현장</span>':'')+'</td>'
          + '<td class="num" style="font-weight:800'+(v?'':';color:var(--muted)')+'">'+(v||'·')+'</td>'
          + '<td class="num" style="color:var(--gray)">'+(v?(v/rows.length*100).toFixed(1)+'%':'·')+'</td>'
          + (hasPrev?'<td class="num" style="color:var(--gray)">'+(p||'·')+'</td><td class="num">'+dl+'</td>':'')+'</tr>';
      }).join('')
    + '</tbody><tfoot><tr><td>합계</td><td class="num">'+rows.length+'</td><td class="num">100%</td>'
    + (hasPrev?'<td class="num">'+prevR.length+'</td><td class="num">'+(rows.length-prevR.length>0?'▲ ':'')+(rows.length-prevR.length)+'</td>':'')
    + '</tr></tfoot></table>'
    + (hasPrev?'':'<div class="rep-note">전월('+esc(ymLabel(pv))+') 데이터가 없어 증감 비교는 생략했습니다.</div>')
    + '</div>';

  /* ② AS 유형별 — 어떤 기기에서 문제가 났는지. 분류 규칙은 원격파트 대시보드와 동일 */
  h += '<div class="rep-sec"><h3><span class="no">2</span>AS 유형별</h3>'
    + asIssueBreakdown(rows)
    + '<div class="rep-note">'+esc(asKeyLabel())+' <b>'+asIssueRows(rows).length+'건</b>이 분류 대상입니다 · '
    + '요청내역과 처리내역의 기기 키워드로 자동 분류합니다.</div>'
    + '</div>';

  h += '<div class="rep-sec"><h3><span class="no">3</span>지점별 처리 현황 '
    + '<span style="font-size:12.5px;font-weight:600;color:var(--gray)">상위 '+Math.min(15,agg.length)+'개</span></h3>'
    + '<table class="rep-tbl"><thead><tr><th>지점</th><th class="num">합계</th>'
    + CATS.map(c=>'<th class="num">'+c.name+'</th>').join('')+'</tr></thead><tbody>'
    + agg.slice(0,15).map(o=>'<tr><td style="font-weight:600">'+esc(o.branch)+'</td>'
        + '<td class="num" style="font-weight:800">'+o.total+'</td>'
        + CATS.map(c=>'<td class="num'+(o.cats[c.key]?'':' zero')+'">'+(o.cats[c.key]||'·')+'</td>').join('')+'</tr>').join('')
    + '</tbody></table>'
    + (agg.length>15?'<div class="rep-note">전체 '+agg.length+'개 지점 중 상위 15개입니다. 전건은 엑셀의 「지점별」 시트를 확인하세요.</div>':'')
    + '</div>';

  let n = 4;
  if(ONSITE.length){
    h += '<div class="rep-sec"><h3><span class="no">'+(n++)+'</span>'+esc(CATS.filter(c=>c.onsite)[0].name)+' 상세</h3>';
    if(onsite.length){
      h += '<table class="rep-tbl"><thead><tr><th>일자</th><th>지점</th><th>상태</th><th>사유</th></tr></thead><tbody>'
        + onsite.slice().sort((a,b)=>a.date<b.date?-1:1).map(r=>'<tr><td style="white-space:nowrap">'+r.date+'</td>'
            + '<td style="font-weight:600">'+esc(r.branch)+'</td>'
            + '<td><span class="st-chip" style="background:'+stColor(r.status)+'22;color:'+stColor(r.status)+'">'+stName(r.status)+'</span></td>'
            + '<td class="req-cell">'+esc(r.req||'—')+(r.note?' <span style="color:var(--gray2)">('+esc(r.note)+')</span>':'')+'</td></tr>').join('')
        + '</tbody></table>';
    } else h += '<div class="rep-note">해당 월 발생 없음.</div>';
    h += '</div>';
  }

  const rep2 = agg.filter(o=>o.total>=2);
  h += '<div class="rep-sec"><h3><span class="no">'+(n++)+'</span>반복 인입 지점 '
    + '<span style="font-size:12.5px;font-weight:600;color:var(--gray)">2건 이상</span></h3>';
  if(rep2.length){
    h += '<table class="rep-tbl"><thead><tr><th>지점</th><th class="num">인입</th>'
      + (ONSITE.length?'<th class="num">방문AS</th>':'')+'<th>구성</th></tr></thead><tbody>'
      + rep2.map(o=>'<tr><td style="font-weight:600">'+esc(o.branch)+'</td><td class="num" style="font-weight:800">'+o.total+'</td>'
          + (ONSITE.length?'<td class="num'+(o.onsite?'" style="color:var(--red);font-weight:800':' zero')+'">'+(o.onsite||'·')+'</td>':'')
          + '<td style="font-size:13px;color:var(--gray)">'+Object.keys(o.cats).map(k=>catName(k)+' '+o.cats[k]).join(' · ')+'</td></tr>').join('')
      + '</tbody></table><div class="rep-note">반복 인입은 장비 노후·사용 교육 부족 신호일 수 있어 별도 확인을 권장합니다.</div>';
  } else h += '<div class="rep-note">동일 지점 2건 이상 인입 없음.</div>';
  h += '</div>';

  const usedInt = INTAKES.filter(t=>rows.some(r=>r.intake===t.key));
  h += '<div class="rep-sec"><h3><span class="no">'+(n++)+'</span>인입 경로</h3>'
    + '<table class="rep-tbl"><thead><tr><th>경로</th><th class="num">건수</th><th class="num">비중</th><th>설명</th></tr></thead><tbody>'
    + usedInt.map(function(t){
        const v = rows.filter(r=>r.intake===t.key).length;
        return '<tr><td><span class="cat-dot" style="background:'+t.color+'"></span>'+t.name+'</td>'
          + '<td class="num" style="font-weight:800">'+v+'</td>'
          + '<td class="num" style="color:var(--gray)">'+(v/rows.length*100).toFixed(1)+'%</td>'
          + '<td style="font-size:13px;color:var(--gray)">'+esc(t.desc||'')+'</td></tr>';
      }).join('')
    + '</tbody></table></div>';

  h += '<div class="rep-foot">'
    + '집계 기준: '+esc(CLIENT.name)+' 가맹점 원격 지원 인입 건 · 카테고리 '+CATS.length+'종'
    + (MODE==='slack'||SLACK_LEDGER?' · 출처 slack-data.js(기존 원격 집계)':'')+'<br>'
    + '작성: '+esc(CLIENT.provider)+' · 문서 생성 '+TODAY
    + (IS_SAMPLE?'<br><b style="color:var(--red)">※ 본 문서는 샘플 데이터로 생성된 예시입니다. 대외 제출용이 아닙니다.</b>':'')
    + '</div></div>';
  return h;
}

/* ── 엑셀 ──────────────────────────────────────────────────── */
function downloadXlsx(){
  const rows = REC.filter(r=>ymOf(r.date)===month);   /* 보고서는 항상 한 달 */
  if(!rows.length){ alert(scopeLabel()+' 데이터가 없어 내려받을 내용이 없습니다.'); return; }
  const cb = byCat(rows), agg = storeAgg(rows);
  const pv = prevYM(month), prevR = REC.filter(r=>ymOf(r.date)===pv);
  const pb = byCat(prevR);
  const onsite = rows.filter(r=>ONSITE.indexOf(r.cat)>=0);
  const sheets = [];

  const s1 = [['항목','내용']];
  s1.push(['고객사', CLIENT.name]);
  s1.push(['보고 기간', scopeLabel()]);
  s1.push(['작성', CLIENT.provider]);
  if(CLIENT.startDate) s1.push(['관리 개시일', CLIENT.startDate]);
  s1.push(['데이터 출처', SLACK_LEDGER ? 'slack-data.js (원격 집계 기반 원장)'
                        : MODE==='contract' ? (REG.dataFile+' (전용 원장)') : 'slack-data.js (기존 원격 집계 필터)']);
  s1.push(['문서 생성일', TODAY]);
  if(IS_SAMPLE) s1.push(['⚠ 주의','샘플 데이터로 생성된 예시 — 대외 제출용 아님']);
  s1.push([]);
  s1.push(['총 처리 건수', rows.length]);
  if(ONSITE.length) s1.push([CATS.filter(c=>c.onsite)[0].name+' 건수', onsite.length]);
  s1.push(['인입 지점 수', agg.length]);
  s1.push(['지점당 평균 건수', +(rows.length/agg.length).toFixed(2)]);
  s1.push([]);
  s1.push(['구분','건수','비중(%)'].concat(prevR.length?[ymLabel(pv)+' 건수','증감']:[]));
  CATS.forEach(function(c){
    const v = cb[c.key]||0, r = [c.name, v, +(v/rows.length*100).toFixed(1)];
    if(prevR.length){ const p = pb[c.key]||0; r.push(p, v-p); }
    s1.push(r);
  });
  s1.push(['합계', rows.length, 100].concat(prevR.length?[prevR.length, rows.length-prevR.length]:[]));
  sheets.push({name:'월간요약', rows:s1, widths:[24,44,12,16,10]});

  const s2 = [['지점','매장명','합계'].concat(CATS.map(c=>c.name), ONSITE.length?['방문AS']:[], ['최근 인입일'])];
  agg.forEach(o=>s2.push([o.branch,o.store,o.total].concat(CATS.map(c=>o.cats[c.key]||0), ONSITE.length?[o.onsite]:[], [o.last])));
  s2.push(['합계','',rows.length].concat(CATS.map(c=>cb[c.key]||0), ONSITE.length?[onsite.length]:[], ['']));
  sheets.push({name:'지점별', rows:s2, widths:[20,26,9].concat(CATS.map(()=>11),[10,14])});

  if(ONSITE.length){
    const s4 = [['일자','시각','지점','매장명','상태','담당자','요청내용','처리내용']];
    onsite.slice().sort((a,b)=>a.date<b.date?-1:1)
      .forEach(r=>s4.push([r.date,r.time,r.branch,r.store,stName(r.status),r.emp,r.req,r.note]));
    if(!onsite.length) s4.push(['해당 기간 발생 없음']);
    sheets.push({name:CATS.filter(c=>c.onsite)[0].name, rows:s4, widths:[12,8,18,26,10,10,44,40]});
  }

  const s5 = [['일자','시각','지점','매장명','사업자번호','구분','담당자','상태','요청내용','처리내용']];
  rows.slice().sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : (a.time<b.time?-1:1))
    .forEach(r=>s5.push([r.date,r.time,r.branch,r.store,r.biz,catName(r.cat),r.emp,stName(r.status),r.req,r.note]));
  sheets.push({name:'전건상세', rows:s5, widths:[12,8,18,26,14,14,10,10,46,40]});

  const r0 = scopeRange();
  const tag = scope==='month' ? month.replace('-','')
            : (r0.from === r0.to ? r0.from : r0.from + '_' + r0.to).replace(/-/g,'');
  XLSX.download((IS_SAMPLE?'[샘플]':'')+CLIENT.name+'_원격지원_'+tag+'.xlsx', sheets);
}

/* ── 이전 기간 대비 ─────────────────────────────────────────
   "지난달보다 늘었나 줄었나" 가 전체현황에서 안 보였다.
   고른 기간 '바로 직전' 의 같은 길이 구간과 비교한다(월별이면 전월). */
function prevRange(){
  if(scope === 'month'){
    const d = daysInYM(prevYM(month));
    return { from:d[0], to:d[d.length-1], label:'전월 대비' };
  }
  const r = scopeRange();
  const days = Math.round((dnum(r.to) - dnum(r.from)) / 86400000) + 1;
  return { from: addD(r.from, -days), to: addD(r.from, -1), label:'이전 기간 대비' };
}
function deltaBadge(cur){
  const p = prevRange();
  const prev = REC.filter(x => x.date >= p.from && x.date <= p.to).length;
  if(!prev && !cur) return '';
  const d = cur - prev;
  const tip = p.from + ' ~ ' + p.to + ' : ' + prev + '건 → ' + cur + '건';
  if(!prev) return '<span class="dlt new" title="' + esc(tip) + '">신규 · ' + esc(p.label) + '</span>';
  const arrow = d > 0 ? '▲' : d < 0 ? '▼' : '–';
  const cls   = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
  return '<span class="dlt ' + cls + '" title="' + esc(tip) + '">'
    + arrow + ' ' + Math.abs(d) + '건 · ' + esc(p.label) + '</span>';
}

/* ── 전체현황 타일 → 세부내역 ────────────────────────────────
   key: 'all'(총 인입) · 'cat:<카테고리>' · 'open'(처리중)
   숫자만 있고 눌러볼 수 없으면 본사가 '어떤 건이었나' 를 확인할 길이 없다. */
function drillTile(key){
  let list = scopedRecs(), title;
  if(key === 'all')                    title = '📥 총 인입';
  else if(key === 'open'){             list = list.filter(r => r.status !== 'done'); title = '⏳ 처리중'; }
  else if(key.indexOf('cat:') === 0){  const k = key.slice(4); list = list.filter(r => r.cat === k); title = esc(catName(k)); }
  else return;
  /* 처리중은 오래된 것부터(급한 순), 나머지는 최신순 */
  list = list.slice().sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
  if(key !== 'open') list.reverse();
  const cb = byCat(list);
  const chips = '<span class="c">기간 <b>' + esc(scopeLabel()) + '</b></span>'
    + '<span class="c">' + (key === 'open' ? '미완료' : '인입') + ' <b>' + list.length + '</b>건</span>'
    + '<span class="c">지점 <b>' + new Set(list.map(r => r.branch)).size + '</b>곳</span>'
    + (key === 'all' ? CATS.filter(c => cb[c.key]).map(c => '<span class="c">' + esc(c.name) + ' <b>' + cb[c.key] + '</b></span>').join('') : '');
  const body = list.length
    ? '<table><thead><tr><th>접수</th><th>지점</th><th>구분</th><th>상태</th><th>담당</th><th>요청내역</th><th>처리내역</th></tr></thead><tbody>'
      + list.map(r => '<tr>'
          + '<td style="white-space:nowrap;color:var(--gray)">' + r.date
          + (r.time ? '<br><span style="color:var(--gray2)">' + esc(r.time) + '</span>' : '') + '</td>'
          + '<td style="white-space:nowrap"><span style="color:var(--blue);cursor:pointer;font-weight:600"'
          + ' data-branch="' + esc(r.branch) + '">' + esc(r.branch) + '</span></td>'
          + '<td>' + catChip(r.cat) + '</td>'
          + '<td>' + stChip(r.status) + '</td>'
          + '<td style="white-space:nowrap">' + esc(r.emp) + '</td>'
          + '<td class="req-cell"><div class="clamp3" title="' + esc(r.req || '') + '">' + esc(r.req || '—') + '</div></td>'
          + '<td class="req-cell">' + (r.note ? '<div class="clamp3" title="' + esc(r.note) + '">' + esc(r.note) + '</div>' : '<span style="color:var(--muted)">—</span>') + '</td></tr>').join('')
      + '</tbody></table>'
    : '<div class="empty">해당 건이 없습니다.</div>';
  openDrill(title + ' · ' + esc(scopeLabel()), chips, body, true);
}

/* ── 반복 인입 지점 ─────────────────────────────────────────
   본사가 실제로 조치하고 싶은 건 '어느 가맹점이 계속 문제냐' 다.
   월간 보고서에만 있어 평소에는 볼 수 없었다. */
function repeatStoresCard(rows){
  const rep = storeAgg(rows).filter(o => o.total >= 2);
  const head = '<div class="card"><div class="card-head"><h3>⚠ 반복 인입 지점</h3>'
    + '<span class="hint">' + esc(scopeLabel()) + ' 2건 이상 · 클릭하면 상세</span></div>';
  if(!rep.length)
    return head + '<div class="empty">같은 지점에서 2건 이상 인입된 곳이 없습니다.</div></div>';
  const mx = rep[0].total;
  return head + rep.slice(0, 10).map(o =>
      '<div class="rep-row" data-branch="' + esc(o.branch) + '">'
    + '<div class="rep-nm">' + esc(o.branch) + '</div>'
    + '<div class="rep-bar"><div class="rep-fill" style="width:' + (o.total / mx * 100).toFixed(1) + '%"></div></div>'
    + '<div class="rep-n"><b>' + o.total + '</b>건'
    + (o.onsite ? ' <span style="color:var(--red)">방문' + o.onsite + '</span>' : '') + '</div>'
    + '<div class="rep-cats">'
    + Object.keys(o.cats).map(k => '<span class="cat-chip" style="background:' + catColor(k) + '22;color:'
        + catColor(k) + '">' + esc(catName(k)) + ' ' + o.cats[k] + '</span>').join('')
    + '</div></div>').join('')
    + (rep.length > 10 ? '<div style="font-size:11.5px;color:var(--gray2);margin-top:8px">외 '
        + (rep.length - 10) + '곳 — 지점별 탭에서 전체 확인</div>' : '')
    + '</div>';
}

/* ── 대응 소요 ──────────────────────────────────────────────
   '얼마나 빨리 처리해주나' 는 수탁 대시보드의 핵심인데 지표가 없었다.
   다만 slack-data.js 에 완료 시각이 없어 원격 건은 산출할 수 없다.
   방문 건만 요청일→방문일로 계산하고, 원격 건은 그렇다고 밝힌다. */
const LEAD_BANDS = [
  { name:'당일',      test:d => d <= 0, color:'#34c759' },
  { name:'1일',       test:d => d === 1, color:'#0071e3' },
  { name:'2~3일',     test:d => d >= 2 && d <= 3, color:'#ff9500' },
  { name:'4일 이상',  test:d => d >= 4, color:'#ff3b30' },
];
function leadTimeCard(rows){
  const vs = rows.filter(r => r.cat === 'visit' && r.visit && r.visit.visitDate && r.date);
  const head = '<div class="card"><div class="card-head"><h3>⏱ 방문 대응 소요</h3>'
    + '<span class="hint">요청일 → 방문일</span></div>';
  if(!vs.length)
    return head + '<div class="empty">' + visitElsewhereNote() + '</div></div>';

  const ds = vs.map(r => Math.round((dnum(r.visit.visitDate) - dnum(r.date)) / 86400000))
               .filter(n => n >= 0 && n < 400).sort((a, b) => a - b);
  if(!ds.length) return head + '<div class="empty">계산할 수 있는 건이 없습니다.</div></div>';
  const avg = ds.reduce((a, b) => a + b, 0) / ds.length;
  const med = ds[Math.floor(ds.length / 2)];
  const counts = LEAD_BANDS.map(b => ds.filter(b.test).length);
  const mx = Math.max.apply(null, counts);

  return head
    + '<div class="lead-sum">'
    + [['평균', avg.toFixed(1)], ['중앙값', med], ['최장', ds[ds.length - 1]]]
        .map(x => '<div class="ls"><div class="ls-v"><b>' + x[1] + '</b><small>일</small></div>'
                + '<span>' + x[0] + '</span></div>').join('')
    + '</div>'
    + LEAD_BANDS.map(function(b, i){
        const n = counts[i];
        return '<div class="bar-row"><div class="bar-meta"><span class="nm">' + b.name + '</span>'
          + '<span class="ct">' + n + '건 <span style="color:var(--gray2);font-weight:600">'
          + Math.round(n / ds.length * 100) + '%</span></span></div>'
          + '<div class="bar-track"><div class="bar-fill" style="width:'
          + (mx ? (n / mx * 100).toFixed(1) : 0) + '%;background:' + b.color + '"></div></div></div>';
      }).join('')
    + '<div style="font-size:11.5px;color:var(--gray2);margin-top:10px">'
    + '원격 건은 완료 시각이 수집되지 않아 이 지표에서 제외됩니다.</div></div>';
}

/* ── 현장방문 (visit-data.js) ───────────────────────────────
   #ishopcare_new_방문설치 채널의 워크플로우 글을 상호명으로 브랜드를 갈라
   각 브랜드의 '현장방문' 으로 합친다. 계약 고객사·슬랙 브랜드 모두 같다.
   slack-data.js 에는 방문 분류가 없어서 이 파일이 유일한 출처다.
   파일이 아직 없어도(수집 전) 대시보드는 그대로 동작해야 한다. */
function mergeVisits(){
  const VD = window.VISIT_DATA;
  if(!VD || !Array.isArray(VD.records) || !VD.records.length) return 0;
  if(!window.BrandMatch || !window.FRANCHISE_BRANDS) return 0;

  const idx = BrandMatch.buildIndex(window.FRANCHISE_BRANDS);
  const ex  = BrandMatch.buildExclude(window.FRANCHISE_EXCLUDE);
  let n = 0;

  VD.records.forEach(function(v){
    if(ex.test(v.store, v.biz)) return;
    const m = BrandMatch.matchBrand(idx, v.store || '');
    if(!m || m.brand.name !== BRAND) return;
    /* 관리 개시일 이전 건은 계약 대상이 아니다 (계약 고객사에만 해당) */
    if(MODE === 'contract' && CLIENT.startDate && String(v.date).slice(0,10) < CLIENT.startDate) return;   /* 날짜 단위 — tally-compose.js 와 같게 */
    REC.push({
      date  : String(v.date).slice(0, 10),
      time  : v.time || '',
      store : v.store || '',
      branch: BrandMatch.branchOf(v.store || '', m.hit),
      biz   : String(v.biz || '').replace(/\D/g, ''),
      cat   : 'visit',
      emp   : v.assignee || '미지정',   /* 요청자로 대체하지 않는다 — 접수자 ≠ 방문 담당 */
      intake: 'unknown',
      status: v.status || 'done',
      req   : visitReqText(v),
      note  : '',
      visit : v,                       /* 워크플로우 원문 — 상세에서 펼쳐 보여준다 */
    });
    n++;
  });
  return n;
}

/* 목록/표에 한 줄로 뜨는 요약. 상세는 visitDetail() 이 따로 그린다 */
function visitReqText(v){
  const bits = ['[' + (v.kind || '기타') + ']'];
  if(v.visitDate)  bits.push('방문 ' + v.visitDate);
  if(v.rounds > 0) bits.push(v.rounds + '회차');
  if(v.equip)      bits.push(v.equip);
  return bits.join(' · ');
}

/* 워크플로우 내용을 읽기 좋은 표로. 값이 없는 항목은 빼서 여백을 만들지 않는다 */
function visitDetail(v){
  const rows = [
    ['설치구분',  v.kind],
    ['방문일자',  v.visitDate],
    ['방문 회차', v.rounds > 1 ? v.rounds + '회차 (' + (v.roundDates || []).join(', ') + ')' : ''],
    ['담당자',    v.assignee ? v.assignee + (window.visitBy ? ' (' + window.visitBy(v.assignee) + ')' : '') : ''],
    ['요청자',    v.requester],
    ['지역',      v.region],
    ['주소지',    v.addr],
    ['판매경로',  v.route],
    ['VAN',       v.van],
    ['설치장비',  v.equip],
    ['택배발송일', v.ship],
    ['배달4사',   v.delivery],
    ['사업자번호', v.biz],
    ['요청 ID',   v.id],
  ].filter(r => r[1] !== undefined && r[1] !== null && String(r[1]).trim() !== '');
  return '<table class="vd-tbl"><tbody>'
    + rows.map(r => '<tr><th>' + esc(r[0]) + '</th><td>' + esc(String(r[1])) + '</td></tr>').join('')
    + '</tbody></table>';
}

/* 설치구분(설치·AS·기타) 분포 — 현장방문이 어떤 성격인지 한눈에 */
const VISIT_KINDS = [
  { key:'설치', color:'#5e5ce6', desc:'신규 오픈·장비 설치' },
  { key:'AS',   color:'#ff3b30', desc:'장애 대응 방문' },
  { key:'기타', color:'#8e8e93', desc:'그 외' },
];
/* 고른 기간엔 없지만 다른 기간엔 있을 때, 어디를 보면 되는지 알려준다 */
function visitElsewhereNote(){
  const all = REC.filter(r => r.cat === 'visit');
  if(!all.length) return '이 브랜드는 방문설치 채널에 접수된 건이 없습니다.';
  const ms = [...new Set(all.map(r => ymOf(r.date)))].sort().map(ymLabel);
  return '고른 기간에는 없습니다. 전체 기간 기준 <b>' + all.length + '건</b>이 있습니다 ('
    + esc(ms.join(' · ')) + '). 위 기간 버튼을 바꿔 보세요.';
}

function visitKindBreakdown(rows){
  const vs = rows.filter(r => r.cat === 'visit' && r.visit);
  if(!vs.length)
    return '<div class="card"><div class="card-head"><h3>🚗 현장방문 구분</h3>'
      + '<span class="hint">방문설치 채널</span></div>'
      + '<div class="empty">' + visitElsewhereNote() + '</div></div>';
  const total = vs.length;
  const counts = VISIT_KINDS.map(k => vs.filter(r => (r.visit.kind || '기타') === k.key).length);
  const mx = Math.max.apply(null, counts);
  const body = VISIT_KINDS.map(function(k, i){
    const n = counts[i];
    return '<div class="as-brk-row" data-visitkind="' + esc(k.key) + '" title="누르면 목록">'
      + '<div class="as-brk-lab">' + esc(k.key) + '</div>'
      + '<div class="as-brk-bar"><div class="as-brk-fill" style="width:'
      + (mx ? Math.max(5, Math.round(n / mx * 100)) : 0) + '%;background:' + k.color + '"></div></div>'
      + '<div class="as-brk-n"><b>' + n + '</b>건 · ' + Math.round(n / total * 100) + '%</div></div>';
  }).join('');
  return '<div class="card"><div class="card-head"><h3>🚗 현장방문 구분</h3>'
    + '<span class="hint">방문설치 채널 · 구분을 누르면 상세</span></div>'
    + '<div class="as-brk">' + body + '</div></div>';
}

/* 방문을 누가 수행했는지 — 자사 직원인지 외주 업체인지.
   명단은 clients.js 의 FRANCHISE_INHOUSE 에 있다. */
const VISIT_BY = [
  { key:'자사직원', color:'#0071e3' },
  { key:'외주',     color:'#af52de' },
  { key:'미지정',   color:'#8e8e93' },
];
function visitByOf(r){ return window.visitBy ? window.visitBy(r.visit && r.visit.assignee) : '미지정'; }

function visitByBreakdown(rows){
  const vs = rows.filter(r => r.cat === 'visit' && r.visit);
  const head = '<div class="card"><div class="card-head"><h3>🧰 방문 수행 주체</h3>'
    + '<span class="hint">설치 담당 기준 · 누르면 목록</span></div>';
  if(!vs.length) return head + '<div class="empty">' + visitElsewhereNote() + '</div></div>';

  const total = vs.length;
  const counts = VISIT_BY.map(k => vs.filter(r => visitByOf(r) === k.key).length);
  const mx = Math.max.apply(null, counts);
  /* 외주는 어느 업체가 많은지가 실제로 궁금한 부분이다 */
  const vendors = {};
  vs.filter(r => visitByOf(r) === '외주')
    .forEach(r => vendors[r.visit.assignee] = (vendors[r.visit.assignee] || 0) + 1);
  const top = Object.entries(vendors).sort((a, b) => b[1] - a[1]).slice(0, 6);

  return head + '<div class="as-brk">'
    + VISIT_BY.map(function(k, i){
        const n = counts[i];
        if(!n && k.key === '미지정') return '';
        return '<div class="as-brk-row" data-visitby="' + esc(k.key) + '" title="누르면 목록">'
          + '<div class="as-brk-lab">' + esc(k.key) + '</div>'
          + '<div class="as-brk-bar"><div class="as-brk-fill" style="width:'
          + (mx ? Math.max(5, Math.round(n / mx * 100)) : 0) + '%;background:' + k.color + '"></div></div>'
          + '<div class="as-brk-n"><b>' + n + '</b>건 · ' + Math.round(n / total * 100) + '%</div></div>';
      }).join('')
    + '</div>'
    + (top.length ? '<div class="vendors"><span class="vh">외주 업체</span>'
        + top.map(x => '<span class="lg"><i style="background:#af52de"></i>' + esc(x[0]) + ' <b>' + x[1] + '</b></span>').join('')
        + (Object.keys(vendors).length > 6 ? '<span class="lg" style="color:var(--gray2)">외 '
            + (Object.keys(vendors).length - 6) + '곳</span>' : '')
        + '</div>' : '')
    + '</div>';
}

function drillVisitBy(by){
  const list = scopedRecs().filter(r => r.cat === 'visit' && r.visit && visitByOf(r) === by)
    .sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
  const chips = '<span class="c">기간 <b>' + esc(scopeLabel()) + '</b></span>'
    + '<span class="c">' + esc(by) + ' <b>' + list.length + '</b>건</span>'
    + '<span class="c">지점 <b>' + new Set(list.map(r => r.branch)).size + '</b>곳</span>';
  const body = list.length
    ? list.map(r => '<div class="vd-card">'
        + '<div class="vd-head"><b>' + esc(r.branch) + '</b>'
        + '<span class="vd-meta">요청 ' + esc(r.date) + (r.time ? ' ' + esc(r.time) : '') + '</span>'
        + stChip(r.status) + '</div>' + visitDetail(r.visit) + '</div>').join('')
    : '<div class="empty">해당 건이 없습니다.</div>';
  openDrill('🧰 현장방문 · ' + esc(by), chips, body);
}

/* 구분을 누르면 그 성격의 방문 건 목록 — 워크플로우 내용을 펼쳐 보여준다 */
function drillVisitKind(kind){
  const list = scopedRecs().filter(r => r.cat === 'visit' && r.visit && (r.visit.kind || '기타') === kind)
    .sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
  const chips = '<span class="c">기간 <b>' + esc(scopeLabel()) + '</b></span>'
    + '<span class="c">' + esc(kind) + ' <b>' + list.length + '</b>건</span>'
    + '<span class="c">지점 <b>' + new Set(list.map(r => r.branch)).size + '</b>곳</span>';
  const body = list.length
    ? list.map(r => '<div class="vd-card">'
        + '<div class="vd-head"><b>' + esc(r.branch) + '</b>'
        + '<span class="vd-meta">요청 ' + esc(r.date) + (r.time ? ' ' + esc(r.time) : '') + '</span>'
        + stChip(r.status) + '</div>'
        + visitDetail(r.visit) + '</div>').join('')
    : '<div class="empty">해당 건이 없습니다.</div>';
  openDrill('🚗 현장방문 · ' + esc(kind), chips, body);
}

/* ── AS 유형별 ───────────────────────────────────────────────
   어떤 기기에서 문제가 났는지를 요청내역+처리내역의 키워드로 분류한다.
   원격파트 대시보드(index.html)의 규칙에서 출발했지만 프랜차이즈용으로 3종 + 기타로 줄였다.
     · 프론트/터미널 → '포스/키오스크' 에 합침 (포스 본체·터프·포프 모두 포스 계열 장비)
     · 프린터 + CAT/무선단말기 → '프린터/단말기' 로 합침
   ※ 그래서 index.html(5종+기타)과 유형 구성이 다르다. 일부러 다른 것이니 되돌리지 말 것.
   규칙 순서가 곧 우선순위다 — 위에 있는 규칙이 먼저 이긴다. */
const AS_ISSUE_RULES = [
  {label:'포스/키오스크',   color:'#34c759', kw:['프론트','터미널','terminal','front','본체','터프','포프','포터프',
                                              '포스','pos','키오스크','kiosk','키오','태블릿','테이블오더','테이블 오더']},
  {label:'프린터/단말기',   color:'#5e5ce6', kw:['프린터','프린트','유선프린터','무선프린터','유프','무프','영수증','출력','용지','인쇄','라벨',
                                              'cat','캣프','프캣','무선단말기','무선단말','무선기','단말기','카드','결제','승인','정산','환불','매출전표','van','밴','조회기','카드기']},
  {label:'네트워크/연동',   color:'#00c7be', kw:['네트워크','랜','lan','인터넷','와이파이','wifi','연동','배달','통신','공유기','ap']},
];
/* 기기 키워드가 하나도 안 걸린 건이 담기는 바구니 — 나머지이므로 회색을 쓴다 */
const AS_ISSUE_ETC   = '기타';
const AS_ISSUE_COLOR = {'포스/키오스크':'#34c759','프린터/단말기':'#5e5ce6',
                        '네트워크/연동':'#00c7be','기타':'#8e8e93'};
/* 프린터 모델명(ts100·cpp-3000·8385 등)은 다른 기기 단어보다 우선 */
const PRINTER_MODEL_RE = /\bts-?\s?\d{3,4}\b|\bcpp-?\s?\d{3,4}\b|(?:^|[^0-9])8385(?:[^0-9]|$)/i;

function classifyAsIssue(text){
  const t = (text || '').toLowerCase();
  /* 프린터 모델명(ts100·cpp-3000 등)은 다른 기기 단어보다 먼저 걸러야 한다 */
  if(PRINTER_MODEL_RE.test(t)) return '프린터/단말기';
  for(const r of AS_ISSUE_RULES){ if(r.kw.some(k => t.includes(k.toLowerCase()))) return r.label; }
  return AS_ISSUE_ETC;
}

/* 대상 카테고리 — 계약 고객사는 원격AS+방문AS, slack 모드는 AS 하나뿐이다 */
function asKeys(){ return ['as','visit'].filter(k => CAT_MAP[k]); }
function asKeyLabel(){ return asKeys().map(k => catName(k)).join('·'); }

function asIssueRows(rows){
  const keys = asKeys();
  return rows.filter(r => keys.indexOf(r.cat) >= 0)
             .map(r => Object.assign({}, r, {issue: classifyAsIssue((r.req || '') + ' ' + (r.note || ''))}));
}

function asIssueBreakdown(rows){
  const list = asIssueRows(rows), total = list.length;
  if(!total) return '<div class="empty">이 기간 ' + esc(asKeyLabel()) + ' 처리 건이 없습니다.</div>';
  const counts = {};
  list.forEach(r => counts[r.issue] = (counts[r.issue] || 0) + 1);
  const order   = AS_ISSUE_RULES.map(r => r.label).concat([AS_ISSUE_ETC]);
  const entries = order.map(l => [l, counts[l] || 0]).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]);
  const mx      = Math.max(1, ...entries.map(e => e[1]));
  const etcN    = counts[AS_ISSUE_ETC] || 0;
  /* '기타'가 왜 생기는지 밝혀두지 않으면 분류가 틀린 것으로 읽힌다 */
  const note = etcN > 0
    ? '<div class="as-brk-note">※ ‘' + AS_ISSUE_ETC + '’ ' + etcN + '건은 요청내역·처리내역에 기기 키워드가 없어'
      + ' 이쪽으로 분류된 건입니다 — 처리내역이 쌓일수록 정확해집니다.</div>'
    : '';
  return '<div class="as-brk">'
    + entries.map(function(e){
        const l = e[0], n = e[1];
        return '<div class="as-brk-row" data-issue="' + esc(l) + '" title="누르면 매장 목록">'
          + '<div class="as-brk-lab">' + esc(l) + '</div>'
          + '<div class="as-brk-bar"><div class="as-brk-fill" style="width:' + Math.max(5, Math.round(n / mx * 100)) + '%'
          + ';background:' + (AS_ISSUE_COLOR[l] || '#8e8e93') + '"></div></div>'
          + '<div class="as-brk-n"><b>' + n + '</b>건 · ' + Math.round(n / total * 100) + '%</div></div>';
      }).join('')
    + '</div>' + note;
}

/* 유형을 누르면 그 유형의 건 목록 (매장 → 지점 상세로 이어짐) */
function drillAsIssue(label){

      + list.map(r => '<tr>'

          + '<br><span style="color:var(--gray2)">' + esc(r.time || '') + '</span></td>'

        + '</tr>').join('')
      + '</tbody></table>'
    : '<div class="empty">해당 건이 없습니다.</div>';
  openDrill('🔧 AS · ' + esc(label), chips, body);
}

/* ── 상세 모달 ─────────────────────────────────────────────
   지점 상세와 날짜 상세가 같은 껍데기를 쓴다. 인쇄본에는 나가지 않는다
   (모달을 띄운 채 인쇄하면 보고서 위에 겹쳐 찍힌다). */
function openDrill(title, chips, body, wide){
  closeDrill();
  const wrap = document.createElement('div');
  wrap.innerHTML = '<div class="ov no-print" id="drillOv"><div class="box' + (wide ? ' wide' : '') + '">'
    + '<div class="box-head"><h3>' + title + '</h3>'
    + '<button class="box-x" type="button" data-close="1">✕</button></div>'
    + '<div class="box-sum">' + chips + '</div>'
    + '<div class="box-scroll">' + body + '</div>'
    + '</div></div>';
  const ov = wrap.firstChild;
  document.body.appendChild(ov);
  ov.addEventListener('click', function(e){
    if(e.target.closest('[data-close]')) { closeDrill(); return; }
    const b = e.target.closest('[data-branch]');
    if(b){ drillStore(b.dataset.branch); return; }   /* 날짜 상세 → 지점 상세로 이어가기 */
    if(e.target === ov) closeDrill();
  });
}
function closeDrill(){ const e = document.getElementById('drillOv'); if(e) e.remove(); }

function drillStore(branch){
  const rows = scopedRecs().filter(r => r.branch === branch);
  const cb = byCat(rows);
  const chips = '<span class="c">기간 <b>' + esc(scopeLabel()) + '</b></span>'
    + '<span class="c">인입 <b>' + rows.length + '</b>건</span>'
    + CATS.filter(c => cb[c.key]).map(c => '<span class="c">' + c.name + ' <b>' + cb[c.key] + '</b></span>').join('');
  const body = rows.length
    ? '<table><thead><tr><th>일시</th><th>구분</th><th>담당</th><th>상태</th><th>내용</th></tr></thead><tbody>'
      + rows.map(r => '<tr><td style="white-space:nowrap;color:var(--gray)">' + r.date + ' ' + esc(r.time) + '</td>'
          + '<td>' + catChip(r.cat) + '</td>'
          + '<td style="white-space:nowrap">' + esc(r.emp) + '</td>'
          + '<td>' + stChip(r.status) + '</td>'
          + '<td class="req-cell">' + esc(r.req || '—') + '</td></tr>').join('')
      + '</tbody></table>'
    : '<div class="empty">기간에 인입이 없습니다.</div>';
  openDrill('🏪 ' + esc(branch), chips, body);
}

/* 달력에서 하루를 눌렀을 때 — 그날 들어온 건을 시각순으로 펼친다 */
